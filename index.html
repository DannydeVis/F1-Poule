function knoopInlog() {
  const open = app.querySelector('#inlogopen');
  if (open) open.onclick = () => { S.inlog = { open: true, fout: '', gestuurd: '' }; toonStart(); };

  const google = app.querySelector('#googleinlog');
  if (google) google.onclick = async () => {
    google.disabled = true;
    const uit = await inloggenMetGoogle();
    // Bij succes is de browser al onderweg naar Google. Alleen een fout komt
    // hier terug, en die moet te lezen zijn.
    if (uit.fout) { google.disabled = false; S.inlog = { ...S.inlog, fout: uit.fout }; toonStart(); }
  };

  const knop = app.querySelector('#inlogstuur');
  if (!knop) return;
  knop.onclick = async () => {
    const mail = (app.querySelector('#inlogveld')?.value ?? '').trim();
    const fout = (t) => { const p = app.querySelector('#inlogfout'); if (p) p.textContent = t; };
    if (!mail) { fout(T('Vul je mailadres in')); return; }
    knop.disabled = true;
    const uit = await stuurInlogLink(mail);
    knop.disabled = false;
    S.inlog = { open: !!uit.fout, fout: uit.fout, gestuurd: uit.fout ? '' : mail };
    toonStart();
  };
}

function toonStart() {
  // Je poules van dit toestel bovenaan: wie er al bij hoort hoeft de code niet
  // opnieuw in te tikken, en wie in meer dan één poule zit kiest hier welke.
  const bekend = mijnPoules();
  app.innerHTML = `
    <div class="toegang"><div class="kaart"><div class="baan"></div>
      <div class="kaart-in">
        <div class="merk">
          <span class="blok"></span>
          <span class="naam">RacePicks</span>
          <span class="code">${seizoen()}</span>
          ${taalKnop()}
        </div>
        <div>
          <h1 class="groot">${bekend.length
            ? T('Naar je<br>poule') : T('Doe mee<br>met je poule')}</h1>
          <p class="zacht" style="margin:12px 0 0">${bekend.length
            ? T('Kies er een, of tik de code van een andere poule in.')
            : T('Je hebt alleen de code van je poule nodig. Geen wachtwoord.')}</p>
        </div>
        ${bekend.length ? `<div class="veldblok">
          <span class="label">${T('jouw poules')}</span>
          ${bekend.map(pouleKnop).join('')}
        </div>
        <div class="scheiding"></div>` : ''}
        <div class="veldblok">
          <label class="label" for="code">${T('poulecode')}</label>
          <input class="veld code" id="code" maxlength="6" placeholder="ABC123"
            value="${esc(S.linkCode)}"
            autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button class="knop primair" id="mee" style="min-height:64px;font-size:24px">${
            T('Naar de poule')}</button>
        </div>
        ${inlogBlok()}
        <div class="scheiding"></div>
        <div class="veldblok">
          <p class="zacht" style="margin:0">${T('Nog geen poule? Begin er zelf een.')}</p>
          <button class="knop spook" id="nieuw">${T('Nieuwe poule maken')}</button>
        </div>
        ${openbarePoulesBlok()}
        ${watIsDitBlok()}
        ${installBlok()}
        <p class="err" id="f">${esc(S.linkFout)}</p>
      </div>
    </div></div>`;

  S.linkCode = ''; S.linkFout = '';
  const fout = (t) => { app.querySelector('#f').textContent = t; };
  if (S.melding) { fout(S.melding); S.melding = ''; }

  app.querySelectorAll('[data-naar-poule]').forEach(b => b.onclick = () => {
    b.disabled = true;
    naarPoule(b.dataset.naarPoule);
  });

  app.querySelector('#nieuw').onclick = () => startAanmaken();
  knoopInlog();
  knoopTaal();

  const installeer = app.querySelector('#installeer');
  if (installeer) installeer.onclick = async () => {
    installeer.disabled = true;
    const vraag = installPrompt;
    // Een prompt gaat maar één keer op. Ook als de speler hem wegklikt is hij
    // op, dus hem meteen loslaten in plaats van een knop laten staan die het
    // een tweede keer niet meer doet.
    installPrompt = null;
    try { await vraag.prompt(); } catch { /* de browser beslist, wij niet */ }
    toonStart();
  };

  const installweg = app.querySelector('#installweg');
  if (installweg) installweg.onclick = () => { schrijf(INSTALLWEG, '1'); toonStart(); };

  const openbareOpen = app.querySelector('#openbareOpen');
  if (openbareOpen) openbareOpen.onclick = async () => {
    S.openbaar = { ...S.openbaar, open: true, laden: true, fout: '' };
    toonStart();
    const { data, error } = await db.from('pools')
      .select('id,name,beschrijving,join_code').eq('is_public', true);
    S.openbaar = { open: true, laden: false, lijst: error ? [] : (data ?? []),
                   fout: error ? uitleg(error) : '' };
    toonStart();
  };

  app.querySelector('#mee').onclick = async () => {
    const code = app.querySelector('#code').value.trim().toUpperCase();
    const { data, error } = await pouleBij({ p_code: code });
    if (error || !data) { fout(T('Die poulecode bestaat niet')); return; }
    S.poule = data;
    onthoudPoule(S.poule.id); onthoudInLijst(S.poule);
    try { await laad(); }
    catch (e) { fout(e.message); return; }
    S.weergave = 'races'; S.race = null;
    await herkenMij();
    render();
  };

}

// ============================================================
//  Start
// ============================================================

// Eerst de foutmelding uit de adresbalk, vóór alles hieronder: dit moet
// gebeurd zijn voordat er een render is, anders komt de speler eerst een
// glimp van iets anders tegen. En de adresbalk opschonen kan niet wachten
// tot toonStart() dat toch al doet — DEMO slaat toonStart() soms over, en
// een herlaadactie zou anders dezelfde oude fout opnieuw laten zien.
if (OAUTH_FOUT_UIT_LINK) {
  S.melding = uitlegAuth(OAUTH_FOUT_UIT_LINK);
  vergeetLinkCode();
}

if (DEMO) {
  await laad();
  await herkenMij();
  if (!herstelScherm()) render();
} else if (laadfout) {
  // De bibliotheek kwam niet binnen. Alles hieronder heeft dan geen zin: er
  // is geen db om iets aan te vragen. Nadrukkelijk als eigen tak en niet met
  // een `return` erboven -- dit staat op het hoogste niveau van de module, en
  // daar mag geen return staan. (Precies die fout heeft deze regel al een
  // keer gekost: "Illegal return statement", en dan blijft het scherm leeg.)
  geenVerbinding();
} else {
  // De sessie van dit toestel eerst: hervat() moet weten wie ik ben voordat
  // hij een speler probeert te herkennen. Deze regel is bovendien wat een
  // inloglink laat werken — getSession() wacht tot supabase-js de sleutel uit
  // de adresbalk heeft omgezet, en pas daarna haalt hervat() diezelfde
  // adresbalk leeg.
  await bestaandeSessie();
  // Kom je net binnen via een inloglink, dan is dit toestel leeg: geen poules,
  // geen speler. Wat je account weet is dan het enige wat je bij je poule
  // brengt, en zonder dit stond je alsnog voor het codescherm.
  if (VAN_INLOGLINK) {
    const poules = await poulesVanAccount();
    for (const p of [...poules].reverse()) onthoudInLijst(p);
    if (!laatstePoule() && poules.length === 1) onthoudPoule(poules[0].id);
  }
  await hervat();
}

// Terug naar de poule die je het laatst gebruikte, zodat de poulecode niet
// elke keer opnieuw ingetypt hoeft te worden.
async function hervat() {
  // Een gedeelde profiellink gaat overal voor: wie die aanklikt wil één
  // pagina zien en niet in iemands poule belanden. Hij logt je ook nergens
  // op in en raakt je eigen poule niet aan -- herlaad zonder de parameter en
  // je bent gewoon weer waar je was.
  const profielCode = profielUitLink();
  if (profielCode) { await toonProfiel(profielCode); return; }

  // Een link met een code gaat voor op de poule die je het laatst gebruikte:
  // wie zo'n link aanklikt wil naar díé poule, niet naar zijn vorige.
  const uitLink = codeUitLink();
  if (uitLink) {
    const spelerLink = spelerUitLink();
    vergeetLinkCode();
    const { data } = await pouleBij({ p_code: uitLink });
    if (data) {
      S.poule = data;
      onthoudPoule(data.id); onthoudInLijst(data);
      try { await laad(); }
      catch (e) { toonFout(e.message); return; }
      // Wie je eigen link opent is jou, ook op een toestel dat dat nog niet
      // wist. Staat die speler niet (meer) in deze poule, dan gaat het gewoon
      // door naar het keuzescherm: doen alsof er niets stond is beter dan een
      // foutmelding over een id dat niemand herkent.
      const uitLid = spelerLink && S.leden.find(l => zelfde(l.member_id, spelerLink));
      if (uitLid) onthoud(S.poule.id, uitLid.member_id);
      // Wie uit de link komt gaat vóór wat dit toestel al wist. Niet alleen
      // omdat de link recenter is, maar ook omdat onthoud() hierboven niets
      // doet in een browser die niets mag opslaan; dan is dit het enige wat
      // je nog als jezelf binnenlaat.
      if (uitLid) {
        S.ik = { id: uitLid.member_id, naam: uitLid.display_name };
        if (!uitLid.user_id) await claimSpeler(uitLid.member_id);
      } else {
        await herkenMij();
      }
      if (!herstelScherm()) render();
      return;
    }
    // Klopt de code niet, dan is stilzwijgend doorgaan naar je eigen poule
    // verwarrend: je zou nooit merken dat de uitnodiging kapot was.
    // Alleen voorvullen wat in het veld past: een poulecode is zes tekens,
    // en maxlength knipt een waarde uit het attribuut niet af.
    S.linkCode = uitLink.length <= 6 ? uitLink : '';
    S.linkFout = T('De code {code} uit die link bestaat niet. '
      + 'Herlaad de pagina om terug te gaan naar je eigen poule.', { code: uitLink });
    toonStart();
    return;
  }

  const id = laatstePoule();
  if (!id) { toonStart(); return; }

  const { data, error } = await pouleBij({ p_id: id });
  if (error || !data) { vergeetPoule(); toonStart(); return; }

  S.poule = data;
  try { await laad(); }
  catch (e) { toonFout(e.message); return; }

  await herkenMij();
  if (!herstelScherm()) render();
}
</script>
