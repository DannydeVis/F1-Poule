const TAALSLEUTEL = 'poule:taal';

// Wat de browser zegt telt alleen als niemand zelf iets gekozen heeft. Een
// telefoon die op Nederlands staat krijgt Nederlands; al het andere krijgt
// Engels, want dat is de tweede taal die iedereen hier kan lezen.
function beginTaal() {
  const gekozen = lees(TAALSLEUTEL);
  if (gekozen === 'nl' || gekozen === 'en') return gekozen;
  try {
    const van = navigator.languages?.[0] ?? navigator.language ?? 'nl';
    return String(van).toLowerCase().startsWith('nl') ? 'nl' : 'en';
  } catch { return 'nl'; }
}

let TAAL = beginTaal();

// Het lang-attribuut op <html> hoort mee te veranderen. Het staat in de
// broncode op "nl" omdat een pagina die nog niets weet ergens mee moet
// beginnen, maar zodra de app zijn taal gekozen heeft klopt dat niet meer.
// Dit is geen detail: een schermlezer kiest hierop zijn stem en zijn
// uitspraakregels, en leest anders Engelse zinnen met een Nederlandse tong.
function zetPaginaTaal() {
  try { document.documentElement.lang = TAAL; } catch { /* niets */ }
}
zetPaginaTaal();

/**
 * Vertaal één zin. `vars` vult {plaatshouders} in, zodat een getal midden in
 * een zin geen drie losse stukjes tekst hoeft te worden — in het Engels staat
 * het getal soms ergens anders.
 *
 *   T('nog {n} te kiezen', { n: 3 })
 */
function T(nl, vars) {
  const uit = (TAAL === 'en' && ENGELS[nl]) || nl;
  return vars
    ? uit.replace(/\{(\w+)\}/g, (heel, naam) => naam in vars ? String(vars[naam]) : heel)
    : uit;
}

function zetTaal(taal) {
  if (taal !== 'nl' && taal !== 'en') return;
  TAAL = taal;
  schrijf(TAALSLEUTEL, taal);
  zetPaginaTaal();
  // Een melding komt niet uit deze browser maar uit scripts/sync.mjs, dus de
  // taal moet in de database staan. Bewust zonder await en zonder foutmelding:
  // de taal wisselen mag nooit blijven hangen op een netwerkverzoek, en het
  // ergste wat er misgaat is één herinnering in de vorige taal.
  pushTaalBijwerken();
  // Het hele scherm opnieuw, want er is geen stukje dat geen tekst bevat.
  if (S.poule && S.ik) render(); else toonStart();
}

// De knop om te wisselen. Klein en rechtsboven: wie hem nodig heeft zoekt hem,
// en wie hem niet nodig heeft moet er geen last van hebben.
const taalKnop = () => `
  <button class="taalknop" id="taalknop" lang="${TAAL === 'nl' ? 'en' : 'nl'}"
    aria-label="${TAAL === 'nl' ? 'Switch to English' : 'Schakel over naar Nederlands'}"
    >${TAAL === 'nl' ? 'EN' : 'NL'}</button>`;

function knoopTaal() {
  const knop = app.querySelector('#taalknop');
  if (knop) knop.onclick = () => zetTaal(TAAL === 'nl' ? 'en' : 'nl');
}

const sleutel = (poolId) => `poule:${poolId}:mijn_id`;
const mijnId  = (poolId) => lees(sleutel(poolId));
const onthoud = (poolId, memberId) => schrijf(sleutel(poolId), memberId);

// Welke poule je het laatst gebruikte. Zonder dit begint de app elke keer
// weer op het codescherm.
const LAATSTE       = 'poule:laatste';
const laatstePoule  = ()       => lees(LAATSTE);
const onthoudPoule  = (poolId) => schrijf(LAATSTE, poolId);
const vergeetPoule  = ()       => wis(LAATSTE);

// Alle poules waar je op dit toestel bij hoort. Eerder onthield de app er
// maar één, en moest je de code opnieuw intypen om te wisselen — terwijl je
// met werk en vrienden zomaar in twee of drie poules zit.
//
// Let op: dit staat in localStorage, dus het is per toestel. Wie op zijn
// telefoon én op zijn laptop speelt ziet twee verschillende lijstjes. Voor
// één lijst over al je toestellen is een login nodig; zie OVERDRACHT.md.
const POULES = 'poule:poules';
function mijnPoules() {
  try {
    const uit = JSON.parse(lees(POULES) ?? '[]');
    return Array.isArray(uit) ? uit.filter(p => p && p.id) : [];
  } catch { return []; }
}
function onthoudInLijst(poule) {
  if (!poule?.id) return;
  const lijst = mijnPoules().filter(p => !zelfde(p.id, poule.id));
  lijst.unshift({ id: poule.id, name: poule.name,
                  join_code: poule.join_code, beschrijving: poule.beschrijving ?? null });
  // Twaalf is ruim; zonder grens groeit dit lijstje eindeloos door.
  schrijf(POULES, JSON.stringify(lijst.slice(0, 12)));
}
const vergeetUitLijst = (poolId) =>
  schrijf(POULES, JSON.stringify(mijnPoules().filter(p => !zelfde(p.id, poolId))));

// Welk scherm je open had staan, per speler in deze poule. Zonder dit gooide
// een refresh je terug naar het racesoverzicht, ook als je net een paar
// tikken diep in een racescherm zat — "elke keer weer het beginscherm".
const schermSleutel = (poolId, memberId) => `poule:${poolId}:${memberId}:scherm`;

function onthoudScherm() {
  if (!S.poule || !S.ik) return;
  schrijf(schermSleutel(S.poule.id, S.ik.id),
    JSON.stringify({ weergave: S.weergave, raceId: S.race?.id ?? null, tab: S.tab }));
}

// Geeft true als dit al gerenderd heeft (via openRace), zodat de aanroeper
// geen tweede keer hoeft te renderen.
function herstelScherm() {
  if (!S.poule || !S.ik) return false;
  let scherm;
  try { scherm = JSON.parse(lees(schermSleutel(S.poule.id, S.ik.id)) ?? 'null'); }
  catch { scherm = null; }
  if (!scherm) return false;
  // Een race die er niet meer is — bijvoorbeeld eentje die inmiddels is
  // doorgestreept — mag niet alsnog geopend worden.
  if (scherm.raceId && S.races.some(r => zelfde(r.id, scherm.raceId))) {
    openRace(scherm.raceId, scherm.tab);
    return true;
  }
  if (['races', 'stand', 'poule'].includes(scherm.weergave)) S.weergave = scherm.weergave;
  return false;
}

// Ben ik al bekend in de poule die nu openstaat? Dit stond eerder op vier
// plekken bijna hetzelfde uitgeschreven; die liepen bij elke aanpassing uit
// de pas.
//
// De volgorde is bewust. Normaal wint wat dit toestel onthouden heeft — dat
// is de snelste en klopt bijna altijd. Wie zojuist op een inloglink heeft
// geklikt bedoelt precies het omgekeerde: dan wint het account. Anders zou je
// na het inloggen alsnog de speler zijn die op dit toestel toevallig het
// laatst gekozen was.
//
// Geeft true als S.ik gezet is.
async function herkenMij({ accountEerst = VAN_INLOGLINK } = {}) {
  const vanToestel = () => {
    const bekend = mijnId(S.poule.id);
    return bekend ? S.leden.find(l => zelfde(l.member_id, bekend)) : null;
  };
  const lid = accountEerst
    ? (lidVanAccount() || vanToestel())
    : (vanToestel() || lidVanAccount());
  if (!lid) return false;
  S.ik = { id: lid.member_id, naam: lid.display_name };
  onthoud(S.poule.id, lid.member_id);
  // Een speler van vóór de login hangt nog aan niemand. Wie hem nu gebruikt
  // krijgt hem, zodat de database straks kan controleren dat hij van jou is.
  if (!lid.user_id) await claimSpeler(lid.member_id);
  return true;
}

// ============================================================
//  Scoren
// ============================================================

// Tussen deze twee merktekens knipt scripts/controle-stand.mjs de rekenkern
// letterlijk uit dit bestand, om hem tegen een verse kopie van de echte
// database te draaien. Zo controleert die controle de productiecode en niet
// een kopie die uit de pas kan lopen.
//
// Het stond eerder op regelnummers, en die schoven mee met elke bewerking
// erboven — één keer zo ver dat het geknipte blok midden in een functie
// begon. Namen schuiven niet mee.
// <knip primitieven>

export function scoreLijst(voorspeld = [], werkelijk = []) {
  let totaal = 0;
  const regels = voorspeld.map((nr, i) => {
    const echt = werkelijk.indexOf(nr);
    const punten = echt === -1 ? 0 : Math.max(0, 5 - 2 * Math.abs(i - echt));
    totaal += punten;
    return { nr, voorspeld: i + 1, werkelijk: echt === -1 ? null : echt + 1, punten };
  });
  return { totaal, regels };
}

// Hoe dichtbij was je? Uit dezelfde regels als scoreLijst, maar dan de vraag
// die na afloop in de groepsapp gesteld wordt: waar zat het 'm in.
//
// Alleen de coureurs die je nog punten opleverden tellen mee. Wie je drie of
// meer plekken misgokte was niet bijna goed, die was gewoon fout, en dat als
// "zo dichtbij" presenteren zou een grap zijn. Een DNF valt er ook buiten:
// daar viel niets aan te doen.
//
// `scheelde` per regel is wat een exacte voorspelling extra had opgeleverd, en
// het totaal telt alleen die bijna-treffers op. Bewust niet "wat een perfecte
// top 10 waard was geweest": dat getal staat feitelijk al in het scoreblok
// erboven, en het is bovendien vooral deprimerend. Dit gaat over de plekken
// waar je er net naast zat.
export function bijnaGoed(regels = []) {
  const dichtst = regels
    .filter(x => x.werkelijk !== null && x.punten > 0 && x.punten < 5)
    .map(x => ({ ...x, afstand: Math.abs(x.werkelijk - x.voorspeld), scheelde: 5 - x.punten }))
    // Het dichtstbij eerst; scheelde het even veel plekken, dan de hoogste
    // plek in jouw lijst — daar zit de meeste spijt.
    .sort((a, b) => a.afstand - b.afstand || a.voorspeld - b.voorspeld);
  return { scheelde: dichtst.reduce((n, x) => n + x.scheelde, 0), dichtst };
}

// Je blinde vlek: welke coureur zet je structureel te hoog of te laag?
//
// Dit inzicht bestaat alleen omdat élke voorspelling bewaard blijft. Geen
// enkele poule-app heeft het, en het is niet meer dan een gemiddelde over
// rijen die er al staan.
//
// Twee drempels, en die zijn er om te voorkomen dat de app met gezag onzin
// verkoopt. Onder `minSessies` ingeleverde lijsten zegt hij niets: na twee
// weekenden is elk patroon toeval. En een coureur telt pas mee vanaf
// `minKeer` voorspellingen mét uitslag — anders is één uitschieter genoeg
// voor een "patroon".
//
// `afwijking` is jouw plek min zijn echte plek. Negatief betekent dat je hem
// te hóóg zet: je had hem op P2 en hij werd P5.
export function blindeVlek(sessies = [], { minSessies = 6, minKeer = 4, drempel = 1 } = {}) {
  if (sessies.length < minSessies) return [];
  const per = new Map();
  for (const { voorspeld = [], werkelijk = [] } of sessies) {
    voorspeld.forEach((nr, i) => {
      const echt = werkelijk.indexOf(nr);
      // Niet in de uitslag: uitgevallen, of buiten de plekken die je invulde.
      // Daar valt geen afwijking uit af te leiden.
      if (echt === -1) return;
      const rij = per.get(nr) ?? { som: 0, keer: 0 };
      rij.som += (i + 1) - (echt + 1);
      rij.keer++;
      per.set(nr, rij);
    });
  }
  return [...per.entries()]
    .filter(([, r]) => r.keer >= minKeer)
    .map(([nr, r]) => ({ nr, keer: r.keer, afwijking: r.som / r.keer }))
    .filter(x => Math.abs(x.afwijking) >= drempel)
    .sort((a, b) => Math.abs(b.afwijking) - Math.abs(a.afwijking));
}

// En de vrolijke kant: waar ben je juist scherp? Gemiddeld aantal punten per
// plek, per stuk van de lijst. De kop van de uitslag is makkelijker dan de
// staart, dus het gaat om waar jij het relatief goed doet, niet om wie de
// hoogste score haalt.
export const PLEKBANDEN = [
  { naam: 'P1 tot P3',  van: 1, tot: 3 },
  { naam: 'P4 tot P6',  van: 4, tot: 6 },
  { naam: 'P7 tot P10', van: 7, tot: 10 },
];

export function sterkstePlekken(sessies = [], { minSessies = 6 } = {}) {
  if (sessies.length < minSessies) return [];
  const som = PLEKBANDEN.map(() => ({ punten: 0, plekken: 0 }));
  for (const { voorspeld = [], werkelijk = [] } of sessies) {
    voorspeld.forEach((nr, i) => {
      const band = PLEKBANDEN.findIndex(b => i + 1 >= b.van && i + 1 <= b.tot);
      if (band === -1) return;
      const echt = werkelijk.indexOf(nr);
      som[band].punten += echt === -1 ? 0 : Math.max(0, 5 - 2 * Math.abs(i - echt));
      som[band].plekken++;
    });
  }
  return PLEKBANDEN
    .map((b, i) => ({ ...b, ...som[i], gemiddelde: som[i].plekken ? som[i].punten / som[i].plekken : 0 }))
    .filter(b => b.plekken > 0)
    .sort((a, b) => b.gemiddelde - a.gemiddelde);
}

// Welk weekend was het lastigst? Het poulegemiddelde per race, van laag naar
// hoog. Leuk voor de terugblik, en het verklaart een weekend waarin iedereen
// tegenviel: dan lag het niet aan jou.
//
// Een race telt pas mee vanaf `minSpelers` inzendingen; het gemiddelde van
// één speler is geen poulegemiddelde.
export function raceGemiddelden(rijen = [], { minSpelers = 2 } = {}) {
  return rijen
    .filter(r => (r.punten ?? []).length >= minSpelers)
    .map(r => ({ ...r, gemiddelde: r.punten.reduce((a, b) => a + b, 0) / r.punten.length }))
    .sort((a, b) => a.gemiddelde - b.gemiddelde);
}

// Onderling duel: per raceweekend wie van twee spelers de meeste punten
// pakte, opgeteld over het seizoen. Een weekend waarin geen van beiden iets
// heeft ingeleverd telt niet mee; dat is geen gelijkspel maar een weekend
// dat er voor dit duel niet was.
/**
 * De stand als je slechtste weekenden niet meetelden.
 *
 * Waarom dit er is: een poule valt uit elkaar zodra de helft niet meer kan
 * winnen. Eén gemiste race — vakantie, bruiloft, gewoon vergeten — kost je
 * vijftig tot honderd punten, en dat haal je in een seizoen niet meer terug.
 * Daarna kijkt die persoon niet meer.
 *
 * De regel groeit mee met het seizoen, en dat is met opzet. Zou je meteen
 * vanaf race één je slechtste twee wegstrepen, dan telt er na drie races nog
 * één race mee en is de stand onzin. Nu valt er per twaalf gescoorde races
 * één weekend af: bij een seizoen van vierentwintig zijn dat er twee, precies
 * zoals het bedoeld was.
 *
 * Let op wat dit níét doet: het rekent niet de officiële stand om. Het staat
 * ernaast, als antwoord op "hoe ver sta ik echt achter". Iemands punten
 * midden in een lopend seizoen afpakken is geen verbetering, ook niet als de
 * uitkomst eerlijker is.
 */
export function zonderSlechtste(weekenden = [], { perAantal = 12, maxWeg = 2 } = {}) {
  const lijst = (weekenden ?? [])
    .filter((w) => w && Number.isFinite(Number(w.punten)))
    .map((w) => ({ naam: String(w.naam ?? ''), punten: Number(w.punten) }));
  const volledig = lijst.reduce((s, w) => s + w.punten, 0);

  const aantalWeg = Math.min(maxWeg, Math.floor(lijst.length / perAantal));
  if (aantalWeg < 1) return { totaal: volledig, volledig, weg: [], telt: lijst.length };

  // Bij gelijke punten op naam sorteren, anders wijst hij bij elke keer
  // verversen een ander weekend aan terwijl er niets veranderd is.
  const oplopend = [...lijst].sort((a, b) => a.punten - b.punten
    || a.naam.localeCompare(b.naam));
  const weg = oplopend.slice(0, aantalWeg);
  const totaal = volledig - weg.reduce((s, w) => s + w.punten, 0);
  return { totaal, volledig, weg, telt: lijst.length - aantalWeg };
}

export function duelStand(regels = []) {
  let ik = 0, ander = 0, gelijk = 0;
  for (const r of regels) {
    if (!r.meegedaan) continue;
    if (r.ik > r.ander) ik++;
    else if (r.ander > r.ik) ander++;
    else gelijk++;
  }
  return { ik, ander, gelijk, gespeeld: ik + ander + gelijk };
}

// Eén coureur aanwijzen, en die moet bovenaan de lijst staan die erbij
// hoort. Dat is de winnaar van de race, de pole van de kwalificatie, en ook
// de snelste ronde en de snelste pitstop — daar is de lijst één naam lang.
// Alleen het aantal punten verschilt, en dat komt uit de vragenlijst in de
// database, zodat hier geen tweede waarheid ontstaat.
export function scoreEerste(gekozen, uitslag = [], punten = 0) {
  if (!gekozen || !uitslag?.length) return 0;
  return String(uitslag[0]) === String(gekozen) ? punten : 0;
}

// Teamgenoot-duels: per team wie van de twee als eerste eindigt. Je kiest er
// zoveel als je wilt; alleen de duels waar je een keuze in hebt gemaakt
// tellen mee voor je score, en de punten gaan naar rato van het aantal duels
// dat je hebt aangedurfd. Zo levert vier van de vier goed evenveel op als
// tien van de tien, en kost een gokje op een elfde duel je niets als de rest
// klopt.
//
// paren is wat teamParen() hieronder teruggeeft: per team de twee coureurs.
// uitslag is de volledige finishvolgorde. Wie daar niet in staat is niet
// gefinisht en verliest zijn duel van een teamgenoot die dat wel deed.
export function scoreDuels(gekozen = [], uitslag = [], paren = [], punten = 15) {
  if (!gekozen?.length || !uitslag?.length || !paren.length) return 0;
  const plek = (nr) => {
    const i = uitslag.findIndex((x) => String(x) === String(nr));
    return i === -1 ? Infinity : i;
  };
  let goed = 0, geteld = 0;
  for (const { a, b } of paren) {
    const keuze = gekozen.find((g) => String(g) === String(a.nr) || String(g) === String(b.nr));
    if (!keuze) continue;                      // dit duel heb je overgeslagen
    const pa = plek(a.nr), pb = plek(b.nr);
    if (pa === Infinity && pb === Infinity) continue;   // geen van beiden gefinisht
    geteld++;
    if (String(keuze) === String(pa < pb ? a.nr : b.nr)) goed++;
  }
  return geteld ? Math.round(punten * goed / geteld) : 0;
}

// Een getal raden, zoals het aantal safety cars. Eén ernaast zitten is niet
// hetzelfde als een verkeerd antwoord, dus de punten lopen af met de afstand
// in plaats van in één keer naar nul — dezelfde gedachte als bij de top 10.
// Exact is vol, één ernaast de helft, twee ernaast niets meer.
export function scoreGetal(gekozen, werkelijk, punten = 0) {
  if (gekozen === null || gekozen === undefined) return 0;
  if (werkelijk === null || werkelijk === undefined) return 0;
  const afstand = Math.abs(Number(gekozen) - Number(werkelijk));
  if (!Number.isFinite(afstand)) return 0;
  return Math.max(0, Math.round(punten * (1 - afstand / 2)));
}

// Ja of nee. Hier bestaat geen "bijna", dus alles of niets.
export function scoreJaNee(gekozen, werkelijk, punten = 0) {
  if (typeof gekozen !== 'boolean' || typeof werkelijk !== 'boolean') return 0;
  return gekozen === werkelijk ? punten : 0;
}

// De teams uit een deelnemerslijst, als paren. Alleen teams met precies twee
// coureurs: bij een invaller staan er drie in de lijst en is "de teamgenoot"
// niet meer één iemand.
export function teamParen(drivers = []) {
  const per = new Map();
  for (const d of drivers ?? []) {
    if (!per.has(d.team)) per.set(d.team, []);
    per.get(d.team).push(d);
  }
  return [...per.entries()]
    .filter(([, ds]) => ds.length === 2)
    .map(([team, ds]) => ({ team, a: ds[0], b: ds[1] }));
}

// </knip primitieven>
// <knip vragen>

// De vragen waarbij je één coureur aanwijst. Ze delen hetzelfde raster, de
// puntentelling en de uitslagregel; alleen de tekst, de sessie waaraan ze
// hangen en de plek waar het antwoord staat verschillen. S.keuze heeft per
// vraag een veld met dezelfde naam.
//
// `uitslag` geeft de lijst waarvan de bovenste moet kloppen. Bij de winnaar
// en de pole is dat de hele finishvolgorde; bij de andere twee staat er één
// naam in een eigen kolom, want die zijn niet uit een volgorde af te leiden.
const COUREURVRAAG = {
  pole: {
    sessie:'quali', kop:'wie pakt de pole?', label:'pole', letter:'P',
    mijn:'jouw pole', goed:'pakte de pole', mis:'geen pole gekozen',
    uitslag: (r) => r.quali_result ?? [],
  },
  winnaar: {
    sessie:'race', kop:'wie wint de race?', label:'winnaar', letter:'W',
    mijn:'jouw winnaar', goed:'won de race', mis:'geen winnaar gekozen',
    uitslag: (r) => r.race_result ?? [],
  },
  snelste_ronde: {
    sessie:'race', kop:'wie rijdt de snelste ronde?', label:'snelste ronde', letter:'SR',
    mijn:'jouw snelste ronde', goed:'reed de snelste ronde',
    mis:'geen snelste ronde gekozen',
    kolom:'fastest_lap', vlag:'fastest_lap_handmatig',
    uitslag: (r) => r.fastest_lap ? [r.fastest_lap] : [],
  },
  snelste_pitstop: {
    sessie:'race', kop:'wie heeft de snelste pitstop?', label:'snelste pitstop', letter:'SP',
    mijn:'jouw snelste pitstop', goed:'had de snelste pitstop',
    mis:'geen snelste pitstop gekozen',
    kolom:'fastest_pitstop', vlag:'fastest_pitstop_handmatig',
    uitslag: (r) => r.fastest_pitstop ? [r.fastest_pitstop] : [],
  },
};

// De twee vragen die niet over een coureur gaan. Ze delen de opbouw met de
// vragen hierboven, maar hun antwoord is een getal of een ja/nee en hun
// uitslag staat in een eigen kolom. `leeg` is null en niet '' of false: nul
// safety cars en "nee" zijn echte antwoorden.
const EXTRAVRAAG = {
  safety_cars: {
    sessie:'race', soort:'getal', kop:'hoeveel safety cars komen er?',
    // De regel moet erbij staan. De uitslag komt uit de berichten van de
    // wedstrijdleiding, en die telt een virtual safety car mee — zonder dat
    // erbij zou de helft van de poule iets anders voorspellen dan er geteld
    // wordt, en dat is geen eerlijke vraag. Zie scripts/uitslagen.mjs voor
    // waarom de virtual meetelt.
    uitleg:'Een virtual safety car telt ook mee.',
    label:'safety cars', letter:'SC', mis:'geen aantal gekozen',
    kolom:'safety_cars', vlag:'safety_cars_handmatig',
    toon: (w) => `${w}${w === 1 ? ' safety car' : ' safety cars'}`,
    score: (g, w, p) => scoreGetal(g, w, p),
  },
  rode_vlag: {
    sessie:'race', soort:'janee', kop:'komt er een rode vlag?',
    uitleg:'Alleen als de race echt stilgelegd wordt.',
    label:'rode vlag', letter:'RV', mis:'niets ingevuld',
    kolom:'rode_vlag', vlag:'rode_vlag_handmatig',
    toon: (w) => w ? T('ja, rode vlag') : T('nee, geen rode vlag'),
    score: (g, w, p) => scoreJaNee(g, w, p),
  },
};

// ---- de seizoenslaag ----------------------------------------
// Vier vragen die je vóór de eerste race invult en die pas aan het eind van
// het jaar gescoord worden. Samen 150 punten, ongeveer zes races aan gewicht.
//
// Ze hangen niet aan een weekend maar aan het seizoen, en dat is de reden dat
// ze een eigen tabel hebben in plaats van een regel in COUREURVRAAG: er is
// geen sessie om ze onder te hangen, geen tab om ze op te zetten, en hun
// uitslag komt niet uit één race maar uit alle races samen.
//
// Zonder `score` is het alles of niets: je noemt de goede naam of je noemt
// hem niet. Alleen bij een getal bestaat "bijna".
const SEIZOENVRAAG = {
  kampioen: {
    soort:'coureur', kop:'wie wordt wereldkampioen?', label:'wereldkampioen',
    mis:'geen coureur gekozen',
  },
  constructeur: {
    soort:'team', kop:'welk team wint de constructeurstitel?',
    label:'constructeurstitel', mis:'geen team gekozen',
  },
  winnaars: {
    soort:'getal', kop:'hoeveel verschillende coureurs winnen er een race?',
    label:'verschillende winnaars', mis:'geen aantal ingevuld',
    uitleg:'Tel alleen races, geen sprints.',
    toon: (w) => `${w} verschillende winnaar${w === 1 ? '' : 's'}`,
    score: (g, w, p) => scoreGetal(g, w, p),
  },
  vierde_team: {
    soort:'team', kop:'welk team wordt vierde bij de constructeurs?',
    label:'vierde team', mis:'geen team gekozen',
  },
};

// Het sprintpuntenschema van het WK. Staat naast WK_PUNTEN omdat een sprint
// acht plekken beloont en een race tien -- en een kampioenschap dat de sprint
// niet meetelt zou op een sprintseizoen gewoon het verkeerde antwoord geven.
const WK_SPRINTPUNTEN = [8, 7, 6, 5, 4, 3, 2, 1];

// De WK-stand over een lijst races: per coureur en per team. Dit is het
// échte kampioenschap, niet de poulestand -- het is het antwoord op de
// seizoensvragen en heeft niets te maken met wat iemand hier scoort.
function wkStand(races) {
  const perCoureur = new Map(), perTeam = new Map(), teamVan = new Map();
  for (const r of races) {
    for (const d of r.drivers ?? []) teamVan.set(String(d.nr), d.team);
    const tel = (lijst, schema) => (lijst ?? []).forEach((nr, i) => {
      if (!schema[i]) return;
      perCoureur.set(String(nr), (perCoureur.get(String(nr)) ?? 0) + schema[i]);
    });
    tel(r.race_result, WK_PUNTEN);
    tel(r.sprint_result, WK_SPRINTPUNTEN);
  }
  for (const [nr, punten] of perCoureur) {
    const team = teamVan.get(nr);
    if (team) perTeam.set(team, (perTeam.get(team) ?? 0) + punten);
  }
  return { perCoureur, perTeam };
}

// Welke van die vragen op deze tab horen, en meedoen in deze poule.
const coureurVragen = (welk) =>
  Object.keys(COUREURVRAAG).filter(id => COUREURVRAAG[id].sessie === welk && vraagActief(id));
const extraVragen = (welk) =>
  Object.keys(EXTRAVRAAG).filter(id => EXTRAVRAAG[id].sessie === welk && vraagActief(id));
const seizoenVragen = () => Object.keys(SEIZOENVRAAG).filter(vraagActief);

// Een antwoord dat er niet is. Voor deze twee vragen is dat null en niet ''
// of false, want 0 en "nee" zijn wél antwoorden.
const leegAntwoord = (w) => w === null || w === undefined || w === '';

// De top 10 is ook gewoon een vraag die een poule kan uitzetten.
// ---- de sessies van een raceweekend -------------------------
// De app was rond een tweedeling gebouwd: overal stond
// `welk === 'quali' ? r.quali_result : r.race_result` en varianten daarvan,
// veertien keer. Dat werkt prima zolang er precies twee sessies zijn, en het
// blokkeert elke derde — je moet dan veertien ternaries tegelijk goed
// omzetten, in code die de punten uitrekent.
//
// Dus staat het nu één keer hier. Een sessie erbij is een regel in deze
// tabel plus de kolommen in schema.sql; de rest van het bestand hoeft er
// niets van te weten.
const SESSIES = {
  quali: { naam:'kwalificatie', wat:'de kwalificatie', tablabel:'Kwalificatie',
           letter:'Q', vraag:'quali_top10',
           uitslag:'quali_result', deadline:'deadline_quali', hand:'quali_handmatig' },
  race:  { naam:'race',         wat:'de race',         tablabel:'Race',
           letter:'R', vraag:'race_top10',
           uitslag:'race_result',  deadline:'deadline_race',  hand:'race_handmatig' },
  // Zes keer per seizoen. `weging` is wat een sprint anders maakt dan de
  // andere twee: dezelfde top 10, dezelfde 5/3/1 per plek, maar halve punten.
  // Een sprint is een derde van een race lang en hoort niet net zo zwaar te
  // wegen als het weekend zelf.
  sprint:{ naam:'sprint',       wat:'de sprint',       tablabel:'Sprint',
           letter:'S', vraag:'sprint_top10',
           uitslag:'sprint_result', deadline:'deadline_sprint',
           hand:'sprint_handmatig', weging:0.5 },
};

// De volgorde waarin ze op een weekend langskomen. Apart van SESSIES, want
// een object heeft geen betekenisvolle volgorde en deze wél.
//
// De sprint staat vooraan en niet in het midden. Op een sprintweekend ligt de
// sprintkwalificatie op vrijdag en de sprint zaterdagochtend; de gewone
// kwalificatie is daarná, zaterdagmiddag. Dus: sprint, kwalificatie, race.
// Een gewoon weekend heeft geen sprint en houdt gewoon kwalificatie, race.
const SESSIEVOLGORDE = ['sprint', 'quali', 'race'];

// Doet deze sessie mee op dit weekend? Een sprint heeft niet elk weekend een
// deadline, dus "de sessie bestaat" en "de sessie telt hier mee" zijn twee
// verschillende vragen.
const sessieOpWeekend = (r, welk) => !!r?.[SESSIES[welk].deadline];
const weekendSessies = (r) => SESSIEVOLGORDE.filter(w => sessieOpWeekend(r, w));

// Wanneer het weekend begint: de vroegste deadline die het heeft. Niet
// deadline_quali, want op een sprintweekend gaat de sprint voor.
const weekendStart = (r) => {
  const tijden = weekendSessies(r)
    .map(w => Date.parse(r[SESSIES[w].deadline])).filter(t => !isNaN(t));
  return tijden.length ? Math.min(...tijden) : null;
};

// Welke sessies van dit weekend zijn al begonnen? Drie keer in dit bestand
// stond dit als een handgeschreven `{ quali: ..., race: ... }`, en zo'n
// object zegt `undefined` over een sessie die het niet kent. `undefined` is
// niet dicht, dus een sprint zou na zijn eigen deadline nog invulbaar zijn.
// Een sessie die dit weekend niet bestaat staat hier op `false`: er valt niets
// te sluiten wat er niet is.
const dichteSessies = (r, nu = Date.now()) => Object.fromEntries(SESSIEVOLGORDE.map(w =>
  [w, sessieOpWeekend(r, w) && nu >= new Date(r[SESSIES[w].deadline]).getTime()]));

// Is er van dit weekend al iets gereden? Stond overal als
// `r.quali_result || r.race_result`, en dat sloeg de sprint over -- die valt
// op zaterdagmiddag, vóór de kwalificatie, dus een sprintweekend zou een paar
// uur lang "nog niets gereden" heten terwijl er al punten op stonden.
const heeftUitslag = (r) => SESSIEVOLGORDE.some(w => !!r?.[SESSIES[w].uitslag]);
const heeftUitslagLijst = (r) => SESSIEVOLGORDE.some(w => r?.[SESSIES[w].uitslag]?.length);

// Welke sessie laat je zien als er meerdere van hetzelfde weekend een uitslag
// hebben? De race zegt het meest over het weekend, daarna de kwalificatie, en
// de sprint als laatste. Dat is een andere volgorde dan SESSIEVOLGORDE, want
// die gaat over de klok en deze over gewicht.
const TOONVOLGORDE = ['race', 'quali', 'sprint'];
const getoondeSessie = (r) => TOONVOLGORDE.find(w => r?.[SESSIES[w].uitslag]) ?? null;

// Was een eigen lijstje naast SESSIES, met dezelfde twee namen erin. Nu een
// verwijzing, zodat er één plek is waar een sessie beschreven staat.
const TOP10VRAAG = Object.fromEntries(
  Object.entries(SESSIES).map(([k, v]) => [k, v.vraag]));
const top10Actief = (welk) => vraagActief(SESSIES[welk].vraag);

// Tien vaste plekken met gaten erin, in plaats van een lijst die je alleen
// achteraan kon aanvullen. Zo kun je P7 invullen zonder eerst P1 tot P6 te
// doen — je tikt de plek aan die je bedoelt.
// Let op de ?? [] en niet een standaardwaarde: een niet-ingevulde top 10 komt
// als null uit de database, en daar helpt `uit = []` niet tegen.
const naarPlekken = (uit) => Array.from({ length: 10 }, (_, i) => (uit ?? [])[i] ?? null);
const gevuld = (lijst) => lijst.filter(Boolean).length;
const compleet = (lijst) => gevuld(lijst) === 10;


// De winnaar heeft om historische redenen een andere veldnaam dan zijn vraag.
const antwoordVan = (p, id) => id === 'winnaar' ? p?.race_winnaar : p?.[id];

// Wat één speler op één tab scoort: de top 10 plus de losse vragen die aan
// dezelfde deadline hangen. Staat hier één keer, zodat "jouw punten", "de
// rest" en de stand nooit uit elkaar kunnen lopen.
const scoreTab = (p, race, welk) => {
  const S_ = SESSIES[welk];
  // De halve punten van een sprint gelden voor de top 10, want dat is wat er
  // korter is. De losse vragen eronder hangen aan hun eigen puntenaantal uit
  // de vragenlijst en worden niet nog eens geschaald.
  const lijst = Math.round(
    scoreLijst(p?.[S_.vraag] ?? [], race[S_.uitslag] ?? []).totaal * (S_.weging ?? 1));
  // De teamgenoot-duels hangen aan de race-uitslag en horen dus alleen bij de
  // race, niet bij de kwalificatie en niet bij de sprint.
  const duels = welk !== 'race' ? 0
    : scoreDuels(p?.teamgenoot_duels ?? [], race.race_result ?? [],
                 teamParen(race.drivers), puntenVoor('teamgenoot_duels'));
  // De losse vragen gaan door de contrair-vermenigvuldiger, als die aanstaat.
  // De top 10 en de duels niet -- zie contrairVoor() voor waarom.
  const los = coureurVragen(welk).reduce((n, id) => {
    const antwoord = antwoordVan(p, id);
    return n + Math.round(
      scoreEerste(antwoord, COUREURVRAAG[id].uitslag(race), puntenVoor(id))
      * contrairVoor(race, id, antwoord));
  }, 0);
  const extra = extraVragen(welk).reduce((n, id) => {
    const v = EXTRAVRAAG[id];
    const antwoord = p?.[id] ?? null;
    return n + Math.round(
      v.score(antwoord, race[v.kolom] ?? null, puntenVoor(id))
      * contrairVoor(race, id, antwoord));
  }, 0);
  return lijst + duels + los + extra;
};

// ---- contrair: zeldzaam goed antwoorden telt zwaarder --------
//
// Het probleem waar dit voor bestaat: als iedereen "Verstappen" invult bij
// "wie wint", maakt die vraag nul verschil in de stand. Iedereen krijgt
// hetzelfde, of iedereen krijgt niets. De vraag kost ruimte op het scherm en
// levert geen spanning op.
//
// De formule komt uit ROUTEKAART.md: min(1 + (1 - aandeel), 2.0). Vulde
// iedereen hetzelfde in, dan is het aandeel 1 en blijft de vermenigvuldiger
// 1,0. Was jij de enige van de vijf, dan is het aandeel 0,2 en wordt het 1,8.
//
// Alleen de losse vragen, en dat is een keuze. Bij een top 10 zou je per plek
// een zeldzaamheid moeten uitrekenen, en dan is niet meer uit te leggen waar
// een getal vandaan komt -- terwijl juist een puntentelling die je niet kunt
// navertellen het vertrouwen sloopt. De duels vallen er om dezelfde reden
// buiten.
const contrairAan = () => !!S.poule?.contrair_vanaf;
function contrairVoor(race, id, antwoord) {
  if (!contrairAan() || leegAntwoord(antwoord)) return 1;
  // Niet met terugwerkende kracht, zelfde streep als bij de jokers.
  const start = weekendStart(race);
  if (start === null || start < Date.parse(S.poule.contrair_vanaf)) return 1;
  const gegeven = S.leden
    .map(l => {
      const pred = vindPred(race.id, l.member_id);
      return COUREURVRAAG[id] ? antwoordVan(pred, id) : pred?.[id] ?? null;
    })
    .filter(a => !leegAntwoord(a));
  // In je eentje is niets zeldzaam, en met één inzending is het aandeel per
  // definitie 1. Allebei geven ze 1,0 -- maar expliciet is duidelijker dan
  // erop vertrouwen dat de deling dat toevallig ook doet.
  if (gegeven.length < 2) return 1;
  const zelfdeAntwoord = gegeven.filter(a => zelfde(a, antwoord)).length;
  // Afgerond op één decimaal, en dat is geen slordigheid maar de kern: het
  // scherm toont "×1,8" en dan hoort er ook met 1,8 gerekend te zijn. Met de
  // kale breuk stond er ×1,8 naast een getal dat uit 1,75 kwam, en dan klopt
  // je eigen puntentelling niet meer als je hem naretelt.
  return Math.round(Math.min(1 + (1 - zelfdeAntwoord / gegeven.length), 2) * 10) / 10;
}

// Hoe je dat op het scherm uitlegt. Zonder deze regel is een vraag die
// ineens 18 punten oplevert in plaats van 10 gewoon een fout.
function contrairNoot(race, id, antwoord) {
  const keer = contrairVoor(race, id, antwoord);
  if (keer === 1) return '';
  const gegeven = S.leden
    .map(l => {
      const pred = vindPred(race.id, l.member_id);
      return COUREURVRAAG[id] ? antwoordVan(pred, id) : pred?.[id] ?? null;
    })
    .filter(a => !leegAntwoord(a));
  const zelfdeAntwoord = gegeven.filter(a => zelfde(a, antwoord)).length;
  const hoeveel = zelfdeAntwoord === 1
    ? T('je was de enige')
    : T('{zelfde} van de {totaal} zeiden dit',
        { zelfde: zelfdeAntwoord, totaal: gegeven.length });
  return ` · ×${komma(keer)} (${hoeveel})`;
}

// De race waar de seizoensantwoorden aan hangen: ronde 1 van dit seizoen. Dat
// is geen truc om ze ergens kwijt te kunnen -- het is precies de deadline die
// ze nodig hebben. Je vult ze in voordat er iets gereden is, en de trigger in
// schema.sql rekent daar ook op.
const seizoenRace = () => S.races.reduce((a, r) => !a || r.round < a.round ? r : a, null);
const seizoenOpen = () => {
  const r = seizoenRace();
  const start = r ? weekendStart(r) : null;
  return start !== null && Date.now() < start;
};

// Mag ik déze vraag nog invullen?
//
// Eerst gold één streep voor alle vier: vóór de eerste race wel, daarna niet.
// Dat sluit iedereen buiten die halverwege het seizoen instapt, en dat is
// precies het soort speler dat je erbij wilt hebben -- die heeft de eerste
// veertien races al gemist, en dan ook nog eens honderdvijftig punten die hij
// onmogelijk kon halen is een tweede straf voor hetzelfde.
//
// Dus is de streep per vraag gaan gelden in plaats van per seizoen:
//
//   * vóór de eerste race mag alles, net als eerst -- invullen, veranderen,
//     weghalen. Wie op tijd is kan zich nog bedenken.
//   * daarna mag je invullen wat je nog niet had, maar niet meer veranderen
//     wat er al staat. Eén schot, wanneer je ook binnenkomt.
//   * en zodra het seizoen erop zit mag er niets meer bij, want dan is het
//     antwoord bekend.
//
// Wat dit niet oplost: wie in ronde 20 de kampioen aanwijst weet meer dan wie
// dat in ronde 1 deed. Dat is een echte scheefheid en geen bijwerking. Voor
// een vriendenpoule weegt "mag ik wel meedoen" zwaarder -- zie BEDIENING.md
// §6d als je dat anders wilt.
const seizoenVraagOpen = (id) => {
  if (seizoenOpen()) return true;
  if (seizoenKlaar()) return false;
  const race = seizoenRace();
  if (!race || !S.ik) return false;
  return leegAntwoord(vindAntwoord(race.id, S.ik.id, id)?.waarde);
};
// Het hele seizoen gereden? Een afgelaste race telt als geweest: daar komt
// nooit meer een uitslag van.
const seizoenKlaar = () =>
  S.races.length > 0 && S.races.every(r => heeftUitslag(r) || r.afgelast);

// Welke races houden het seizoen tegen?
//
// seizoenKlaar() eist van élke race een uitslag of een streep. Blijft er één
// hangen -- de kalender zegt dat hij gereden is, er kwam niets binnen, en hij
// staat niet op afgelast -- dan worden de seizoensvragen nooit gescoord en
// blijft "Begin aan het volgende seizoen" grijs. Voor altijd, zonder dat er
// iets misgaat waar je het aan ziet.
//
// De sync ruimt zoiets normaal zelf op, een week na de deadline. Maar alleen
// als OpenF1 een harde 404 geeft; een sessierecord dat wél bestaat en geen
// uitslag heeft -- precies wat een testrecord is -- glipt daar langs. Dan is
// dit het enige wat het nog vertelt.
//
// Zeven dagen, dezelfde grens als lijktAfgelast() in scripts/uitslagen.mjs en
// als de controleregel in schema.sql. Eerder klagen zou betekenen dat je elke
// zondagavond een waarschuwing krijgt over een race waar de uitslag gewoon nog
// van onderweg is.
const VAST_NA_DAGEN = 7;
const vastgelopenRaces = () => S.races.filter(r =>
  !r.afgelast && !heeftUitslag(r) && r.deadline_race
  && Date.now() - new Date(r.deadline_race).getTime() > VAST_NA_DAGEN * 864e5);

// De vier antwoorden, uit de races zelf. Pas als het seizoen erop zit, want
// een halve WK-stand is geen kampioen.
function seizoenUitslag() {
  if (!seizoenKlaar()) return null;
  const { perCoureur, perTeam } = wkStand(S.races);
  const teams = [...perTeam.entries()].sort((a, b) => b[1] - a[1]).map(([t]) => t);
  const coureurs = [...perCoureur.entries()].sort((a, b) => b[1] - a[1]);
  return {
    kampioen:     coureurs[0]?.[0] ?? null,
    constructeur: teams[0] ?? null,
    vierde_team:  teams[3] ?? null,
    winnaars: new Set(S.races.map(r => r.race_result?.[0]).filter(Boolean)).size,
  };
}

// Wat één speler aan de seizoenslaag verdient. Nul zolang het seizoen loopt:
// er valt nog niets te scoren, en een tussenstand zou suggereren dat het al
// vastligt.
function scoreSeizoen(memberId) {
  const uit = seizoenUitslag();
  const race = seizoenRace();
  if (!uit || !race) return 0;
  return seizoenVragen().reduce((n, id) => {
    const gegeven = vindAntwoord(race.id, memberId, id)?.waarde;
    const werkelijk = uit[id];
    if (leegAntwoord(gegeven) || leegAntwoord(werkelijk)) return n;
    const v = SEIZOENVRAAG[id], punten = puntenVoor(id);
    return n + (v.score ? v.score(gegeven, werkelijk, punten)
                        : (zelfde(gegeven, werkelijk) ? punten : 0));
  }, 0);
}

// ---- jokers -------------------------------------------------
// Eén tot vijf per seizoen, en het weekend waarop je er een legt telt dubbel.
//
// Het getal stond hier als vaste 5, met de redenering dat het een spelregel is
// zoals 5/3/1 dat is en dus niet in de database hoort. Dat klopte tot iemand
// vroeg of het per poule kon -- en dan is het geen regel van de app meer maar
// een keuze van de poule. Vijf blijft de standaard, ook voor een poule van
// vóór deze kolom.
//
// Nul zit er niet bij: nul jokers is de regel uitzetten, en dat doet
// `jokers_vanaf` al.
const JOKERS_STANDAARD = 5;
const JOKERKEUZES = [1, 2, 3, 4, 5];
const jokersPerSeizoen = () => S.poule?.jokers_aantal ?? JOKERS_STANDAARD;
const jokersAan = () => !!S.poule?.jokers_vanaf;
const heeftJoker = (raceId, memberId) => jokersAan()
  && S.jokers.some(j => zelfde(j.race_id, raceId) && zelfde(j.member_id, memberId));
// Hoeveel er nog liggen. Alleen dit seizoen, want de teller loopt per
// seizoen -- net als in de trigger die hem in de database bewaakt.
const jokersOver = (memberId) => jokersPerSeizoen() - S.jokers.filter(j =>
  zelfde(j.member_id, memberId) && S.races.some(r => zelfde(r.id, j.race_id))).length;

// Alleen de sessies die dít weekend bestaan. Een gewoon weekend heeft geen
// deadline_sprint, dus die sessie telt daar niet mee -- en levert dus ook
// geen nul op die je in de stand terugziet.
//
// En dan de joker eroverheen. Bewust hier en niet in scoreTab: een joker
// hangt aan het weekend, dus hij verdubbelt alles wat je dat weekend deed en
// niet één sessie ervan. Zo komt hij vanzelf terecht in de stand, in de
// weekendwinst en in de grafiek, zonder dat die drie hem apart hoeven te
// kennen.
const scoreWeekend = (p, race) => {
  const som = weekendSessies(race).reduce((n, w) => n + scoreTab(p, race, w), 0);
  return p && heeftJoker(race.id, p.member_id) ? som * 2 : som;
};

// ============================================================
//  Aftellen naar de eerstvolgende deadline
//  Het ontwerp zet de resterende tijd groot op het overzicht, dus die

// ============================================================

function resterend(iso) {
  const ms = new Date(iso).getTime() - Date.now();
  if (!Number.isFinite(ms) || ms <= 0) return null;
  const minuten = Math.floor(ms / 60000);
  return { ms, dagen: Math.floor(minuten / 1440), uren: Math.floor(minuten / 60) % 24,
           totaalUren: Math.floor(minuten / 60), minuten: minuten % 60 };
}

function klokTekst(iso, kort) {
  const r = resterend(iso);
  if (!r) return T('gesloten');
  const eenheid = (getal, teken) => kort ? `${getal}${teken}` : `${getal}<i>${teken}</i>`;
  // De letters zijn afkortingen van woorden, dus ze veranderen mee: een uur is
  // een hour. d en m vallen toevallig samen.
  const u = T('u');
  // Boven de twee dagen zijn losse uren onleesbaar; daaronder juist wel.
  return r.totaalUren >= 48
    ? `${eenheid(r.dagen, T('d'))} ${eenheid(r.uren, u)}`
    : `${eenheid(r.totaalUren, u)} ${eenheid(r.minuten, T('m'))}`;
}

// Startlichten: hoe dichter de deadline, hoe meer lampjes branden.
function lampjes(iso) {
  const r = resterend(iso);
  if (!r) return 5;
  if (r.totaalUren > 168) return 1;
  if (r.totaalUren > 72)  return 2;
  if (r.totaalUren > 24)  return 3;
  if (r.totaalUren > 6)   return 4;
  return 5;
}

let tikker = null;
function tikkenBij() {
  document.querySelectorAll('[data-tot]').forEach(el => {
    el.innerHTML = klokTekst(el.dataset.tot, el.dataset.kort === '1');
  });
}
function tikken() {
  clearInterval(tikker);
  tikker = setInterval(tikkenBij, 30000);
}

// De datumnotatie hoort bij de taal, niet bij de code: "za 14:00" in een
// Engels scherm is net zo raar als "Sat 14:00" in een Nederlands scherm.
// en-GB en niet en-US, want dit is een Europese sport op een 24-uursklok --
// "2:00 pm" bij een kwalificatie zou niemand hier helpen.
const streek = () => TAAL === 'en' ? 'en-GB' : 'nl-NL';

const sluitTekst = (iso) => new Date(iso)
  .toLocaleString(streek(), { weekday:'short', hour:'2-digit', minute:'2-digit' });

// Een datum zonder tijd, voor regels waar het om de dag gaat en niet om het
// uur ("sinds 19 september").
const datumKort = (iso) => new Date(iso)
  .toLocaleDateString(streek(), { day:'numeric', month:'long' });

// ============================================================
//  Foutmeldingen
//  De poule draait op een werk-pc zonder devtools. Een fout uit Postgres
//  moet daarom op het scherm zelf uitleggen wat er te doen staat.
// ============================================================

function uitleg(error) {
  const code = error?.code ?? '';
  const bekend = {
    '42P10': T('De tabel answers mist de unieke sleutel op '
           + '(pool_id, race_id, member_id, question_id). '
           + 'Draai schema.sql opnieuw in de Supabase SQL editor.'),
    // 23505 kan ook over de spelerssleutel gaan; die krijgt onder dit
    // lijstje een eigen antwoord.
    '23505': T('Er staan dubbele voorspellingen in de database. '
           + 'Draai schema.sql opnieuw, die ruimt ze op en zet de unieke sleutel goed.'),
    '23503': T('Deze race of speler bestaat niet (meer) in de database.'),
    // 42501 wordt hieronder overschreven als de oorzaak te herleiden is tot
    // een speler die bij een ander account hoort; zie onder dit lijstje.
    '42501': T('De database weigert het schrijven (RLS-policy). Draai schema.sql opnieuw.'),
    '42P01': T('Een tabel ontbreekt in de database. Draai schema.sql in de Supabase SQL editor.'),
    '42703': T('Een kolom ontbreekt in de database. Draai schema.sql in de Supabase SQL editor.'),
    // PostgREST valideert kolommen tegen zijn eigen, gecachte schema, dus dit
    // is dezelfde ontbrekende-kolom-situatie als 42703 — alleen ontdekt vóórdat
    // de vraag ooit bij Postgres komt.
    'PGRST204': T('Een kolom ontbreekt in de database. Draai schema.sql in de Supabase SQL '
              + 'editor; staat hij er al, dan moet PostgREST zijn schema nog verversen '
              + '(Settings → API → Reload schema, of even een minuutje wachten).'),
  };
  // De database weigert het schrijven, en sinds spelers aan een account hangen
  // is daar meestal een concrete, uitlegbare reden voor.
  if (code === '42501' && nietVanMij()) {
    return T('{wie} hoort bij een ander toestel, dus hier kun je niets voor hem '
         + 'opslaan. Log in met je mailadres om hier ook {wie} te zijn, of vraag de '
         + 'poulebaas om {wie} los te maken.', { wie: S.ik.naam });
  }
  // Dezelfde code, een andere sleutel, een heel ander verhaal.
  if (alBezetDoorAccount(error)) {
    return T('Dit toestel speelt in deze poule al mee als een andere speler. '
         + 'Eén account kan niet twee keer in dezelfde stand staan.');
  }
  if (bekend[code]) return bekend[code];
  const bericht = error?.message ?? T('Onbekende fout');
  return code ? `${bericht} (${code})` : bericht;
}
