<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poule</title>
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Niet-blokkerend: zonder netwerk valt de app terug op de systeemletters. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* ==========================================================
     Ontwerp: startgrid. Barlow Condensed voor koppen en namen,
     Space Mono voor alles wat een tijd of een plek is, Barlow
     voor de lopende tekst. Licht en donker volgen het toestel.
     ========================================================== */
  :root{
    --bg:#f2f1ee; --paneel:#ffffff; --paneel2:#e9e8e4; --gedempt:#e0dedb;
    --lijn:#dcdad5; --stippel:#cfccc7;
    --ink:#14151a; --ink2:#61656d; --ink3:#8d9299;
    --accent:#d93d24; --accent-ink:#ffffff;
    --groen:#1f8a4c; --groen-vlak:rgba(31,138,76,.12); --groen-rand:rgba(31,138,76,.45);
    --amber:#b07b16; --amber-vlak:rgba(176,123,22,.10); --amber-rand:rgba(176,123,22,.40);
    --omkeer:#14151a; --omkeer-ink:#f2f1ee;
    --vlag-a:#14151a;
    --sans:Barlow,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",var(--sans);
    --mono:"Space Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --soepel:cubic-bezier(.2,.7,.2,1);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0b0c; --paneel:#15161a; --paneel2:#1d1f24; --gedempt:#2b2e35;
      --lijn:#2b2e35; --stippel:#2b2e35;
      --ink:#f2f3f5; --ink2:#9aa0a8; --ink3:#656b74;
      --accent:#ee4d33; --accent-ink:#0b0b0c;
      --groen:#34b264; --groen-vlak:rgba(52,178,100,.16); --groen-rand:rgba(52,178,100,.50);
      --amber:#e0a53a; --amber-vlak:rgba(224,165,58,.08); --amber-rand:rgba(224,165,58,.40);
      --omkeer:#f2f3f5; --omkeer-ink:#0b0b0c;
      --vlag-a:#f2f3f5;
    }
  }

  @keyframes pols{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
  @keyframes inrij{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
  @keyframes lampjes{0%,100%{opacity:.18}50%{opacity:1}}
  @keyframes schuif{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.45;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- kleine bouwstenen ---------------------------------- */
  .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink3)}
  .mono{font-family:var(--mono);font-size:11px}
  .cond{font-family:var(--cond);font-weight:700;text-transform:uppercase}
  .groen{color:var(--groen)} .amber{color:var(--amber)} .accentkleur{color:var(--accent)}
  .zacht{color:var(--ink2);font-size:15px}
  .hide{display:none!important}

  .knop{
    display:flex;align-items:center;justify-content:center;
    min-height:60px;padding:0 18px;border-radius:10px;width:100%;
    font-family:var(--cond);font-size:22px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;
    transition:transform .18s var(--soepel),filter .18s,border-color .18s,background .18s;
  }
  .knop.primair{background:var(--accent);color:var(--accent-ink)}
  .knop.primair:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
  .knop.spook{background:transparent;border:1px solid var(--lijn);color:var(--ink);
    font-size:20px;font-weight:600;min-height:56px}
  .knop.spook:hover{border-color:var(--accent);background:var(--paneel)}
  .knop.wit{background:var(--omkeer);color:var(--omkeer-ink);min-height:56px;font-size:20px}
  .knop.wit:hover{transform:translateY(-2px)}
  .knop:disabled{background:var(--gedempt);color:var(--ink3);cursor:default;transform:none;filter:none}
  .knop.klein{min-height:52px;font-family:var(--sans);font-size:15px;font-weight:600;
    text-transform:none;letter-spacing:0;color:var(--ink2);border:1px solid var(--lijn)}
  .knop.klein:hover{border-color:var(--ink3);color:var(--ink)}

  .veld{
    width:100%;min-height:60px;padding:0 16px;border-radius:10px;
    border:1px solid var(--lijn);background:var(--paneel);color:var(--ink);
    font:inherit;font-size:17px;
  }
  .veld::placeholder{color:var(--ink3)}
  .veld.code{
    height:68px;text-align:center;font-family:var(--mono);font-size:30px;
    font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  }
  .scheiding{height:1px;background:var(--lijn)}

  /* ---- meldingen ------------------------------------------ */
  .meldingbalk{padding:16px 16px 0}
  .meldingbalk .melding{margin-bottom:0}
  .melding{
    display:flex;align-items:center;gap:12px;background:var(--groen-vlak);
    border:1px solid var(--groen-rand);border-radius:12px;padding:14px 16px;
    color:var(--groen);font-size:15px;font-weight:600;margin-bottom:14px;
  }
  .melding::before{content:"";width:10px;height:10px;border-radius:50%;
    background:var(--groen);flex:none}
  .waarschuwing{
    display:flex;flex-direction:column;gap:8px;background:var(--amber-vlak);
    border:1px solid var(--amber-rand);border-radius:12px;padding:16px;
    color:var(--amber);font-size:15px;margin-bottom:14px;
  }
  .waarschuwing .label{color:var(--amber)}
  .err{color:var(--accent);font-size:14px;margin:8px 0 0;min-height:0}
  .leeg{
    display:flex;flex-direction:column;gap:12px;align-items:flex-start;
    border:1px dashed var(--stippel);border-radius:14px;padding:20px;
  }

  /* ---- toegangsschermen (poulecode, wie ben jij) ---------- */
  .toegang{min-height:100%;display:flex;justify-content:center;padding:20px 14px 60px}
  .kaart{
    width:100%;max-width:420px;background:var(--paneel);border:1px solid var(--lijn);
    border-radius:22px;overflow:hidden;align-self:flex-start;
  }
  .baan{height:3px;background:var(--accent)}
  .kaart-in{padding:24px 22px 30px;display:flex;flex-direction:column;gap:24px}
  .merk{display:flex;align-items:center;gap:10px}
  .merk .blok{width:26px;height:26px;border-radius:4px;background:var(--accent);flex:none}
  .merk .naam{font-family:var(--cond);font-size:24px;font-weight:700;
    text-transform:uppercase;letter-spacing:.02em;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .merk .code{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    color:var(--ink3);margin-left:auto;flex:none}
  .groot{font-family:var(--cond);font-size:44px;font-weight:700;line-height:.98;
    text-transform:uppercase;margin:0}
  .middel{font-family:var(--cond);font-size:34px;font-weight:700;line-height:1;
    text-transform:uppercase;margin:0}
  .veldblok{display:flex;flex-direction:column;gap:12px}

  /* ---- spelerkeuze ---------------------------------------- */
  .speler{
    display:flex;align-items:center;gap:14px;width:100%;min-height:68px;
    padding:0 18px;background:var(--paneel2);border:1px solid var(--lijn);
    border-left:4px solid var(--lijn);border-radius:10px;text-align:left;
    transition:transform .18s var(--soepel),background .18s;animation:schuif .4s both;
  }
  .speler:hover{transform:translateX(4px);background:var(--gedempt)}
  .speler.zelf{border-left-color:var(--accent)}
  .speler .nr{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink3)}
  .speler .nm{font-family:var(--cond);font-size:26px;font-weight:600;
    text-transform:uppercase;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .speler .ptn{font-family:var(--mono);font-size:11px;color:var(--ink2)}

  /* ---- de app: zijbalk + inhoud --------------------------- */
  .shell{display:flex;flex-direction:column;min-height:100%}
  .zijbalk{
    position:sticky;top:0;z-index:20;background:var(--paneel);
    border-bottom:1px solid var(--lijn);padding:12px 14px;
    display:flex;flex-direction:column;gap:12px;
  }
  .zijbalk .merknaam{display:none}
  /* Vast onderin: daar zit je duim. De balk staat in de DOM nog in de
     zijbalk, want op een breed scherm hoort hij daar wel gewoon in mee te
     lopen; position:fixed haalt hem hier alleen even uit de stroom. */
  .nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;gap:6px;background:var(--paneel);
    border-top:1px solid var(--lijn);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .navknop{
    flex:1;min-height:48px;border-radius:10px;font-family:var(--cond);
    font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink2);transition:background .18s,color .18s;
  }
  .navknop:hover{background:var(--paneel2);color:var(--ink)}
  .navknop[aria-current="true"]{background:var(--omkeer);color:var(--omkeer-ink)}
  /* In een race weg: daar staat de Opslaan-balk al vastgeplakt onderaan, en
     twee vaste balken onder elkaar eten een telefoonscherm op. De pijl
     linksboven is daar de weg terug. */
  .shell.detail .nav{display:none}
  .zijvoet{display:none}

  .hoofd{flex:1;display:flex;flex-direction:column;min-width:0}
  .kop{display:none}
  .kolommen{flex:1;display:block;min-height:0}
  /* Ruimte onderaan voor de vaste tabbalk, zodat die niets afdekt. */
  .kol{padding:20px 16px calc(96px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:18px;min-width:0}
  .shell.detail .kol{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .kol.rechts{display:none}
  .shell.detail .kol.links{display:none}
  .shell.detail .kol.rechts{display:flex}

  /* ---- hero: eerstvolgende deadline ----------------------- */
  .hero{background:var(--paneel);border:1px solid var(--lijn);border-radius:14px;
    padding:18px;display:flex;flex-direction:column;gap:14px}
  .hero-kop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .klok{font-family:var(--cond);font-size:54px;font-weight:700;line-height:.9}
  .klok i{font-style:normal;font-size:22px;color:var(--ink2)}
  .lampjes{display:flex;gap:6px}
  .lampjes span{flex:1;height:6px;border-radius:3px;background:var(--gedempt)}
  .lampjes span.aan{background:var(--accent);animation:lampjes 1.6s infinite}
  .wachtop{font-size:11px;letter-spacing:.06em}

  /* ---- kalender ------------------------------------------- */
  .race{
    display:flex;align-items:center;gap:14px;width:100%;min-height:76px;
    padding:10px 16px;background:var(--paneel);border:1px solid var(--lijn);
    border-left:4px solid transparent;border-radius:12px;text-align:left;
    transition:transform .18s var(--soepel),border-color .18s;
  }
  .race:hover{transform:translateX(4px);border-color:var(--ink3)}
  .race.open{border-left-color:var(--groen)}
  .race.open:hover{border-left-color:var(--groen)}
  .race.komt{background:transparent;border:1px dashed var(--stippel);color:var(--ink3)}
  .race .rnd{font-family:var(--cond);font-size:34px;font-weight:700;
    color:var(--ink3);min-width:44px;line-height:1}
  .race.open .rnd{color:var(--ink)}
  .rinfo{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
  .rinfo .nm{font-family:var(--cond);font-size:24px;font-weight:600;
    text-transform:uppercase;line-height:1;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .st{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  .st.klaar{color:var(--amber)} .st.open{color:var(--groen)}
  .st.wacht,.st.komt{color:var(--ink3)}
  .mk{display:flex;gap:4px;font-family:var(--mono);font-size:10px;font-weight:700;flex:none}
  .mk i{font-style:normal;width:22px;height:22px;border-radius:4px;display:grid;
    place-items:center;border:1px solid var(--lijn);color:var(--ink3)}
  .mk i.aan{background:var(--groen-vlak);border-color:var(--groen-rand);color:var(--groen)}
  .vlag{width:22px;height:22px;border-radius:3px;flex:none;
    background-image:
      linear-gradient(45deg,var(--vlag-a) 25%,transparent 25%,transparent 75%,var(--vlag-a) 75%),
      linear-gradient(45deg,var(--vlag-a) 25%,var(--paneel) 25%,var(--paneel) 75%,var(--vlag-a) 75%);
    background-size:11px 11px;background-position:0 0,5.5px 5.5px}
  .stip{width:10px;height:10px;border-radius:50%;background:var(--groen);flex:none}
  .stip.klopt{animation:pols 1.4s infinite}

  /* ---- racedetail ----------------------------------------- */
  .detailkop{display:flex;align-items:center;gap:12px}
  .terug{width:44px;height:44px;border:1px solid var(--lijn);border-radius:10px;
    font-size:20px;flex:none;transition:border-color .18s}
  .terug:hover{border-color:var(--accent)}
  .dtitel{font-family:var(--cond);font-size:28px;font-weight:700;text-transform:uppercase;
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs{display:flex;gap:6px;background:var(--paneel);border:1px solid var(--lijn);
    border-radius:12px;padding:6px}
  .tabs button{flex:1;min-height:52px;border-radius:8px;font-family:var(--cond);
    font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink2);transition:background .18s,color .18s}
  .tabs button:hover{background:var(--paneel2);color:var(--ink)}
  .tabs button[aria-selected="true"]{background:var(--omkeer);color:var(--omkeer-ink)}

  /* ---- startgrid ------------------------------------------ */
  .grid10{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .slotrij{display:flex}
  .slotrij.rechts{justify-content:flex-end}
  .slot{
    width:86%;display:flex;align-items:center;gap:12px;min-height:56px;
    padding:0 14px;border-radius:10px;border:1px solid var(--lijn);
    border-left:5px solid var(--lijn);background:var(--paneel2);
  }
  .slot.vol{animation:inrij .4s both}
  .slot.leegplek{background:transparent;border:1px dashed var(--stippel)}
  .slot .pos{font-family:var(--mono);font-size:13px;font-weight:700;
    color:var(--ink3);min-width:32px;flex:none}
  .slot .who{flex:1;display:flex;align-items:baseline;gap:10px;min-width:0;
    color:var(--ink3);font-size:14px}
  .slot .who .code{font-family:var(--cond);font-size:24px;font-weight:700;
    letter-spacing:.04em;color:var(--ink);flex:none}
  .slot .who small{flex:1;font-size:13px;color:var(--ink2);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .x{width:34px;height:34px;border-radius:8px;background:var(--gedempt);
    color:var(--ink2);font-size:17px;line-height:1;flex:none;
    transition:background .18s,color .18s}
  .x:hover{background:var(--accent);color:var(--accent-ink)}

  .winnaarblok{display:flex;flex-direction:column;gap:10px;background:var(--paneel);
    border:1px solid var(--lijn);border-radius:14px;padding:16px}
  .winnaarkop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .coureurs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .wknop.gekozen{background:var(--accent);color:var(--accent-ink);
    border-color:var(--accent);border-left-color:var(--accent-ink)}
  .wknop.gekozen:hover{background:var(--accent)}
  .wknop.gekozen .tm{color:var(--accent-ink);opacity:.8}
  .drv,.wknop{
    display:flex;align-items:center;gap:10px;min-height:60px;padding:0 12px;
    background:var(--paneel);border:1px solid var(--lijn);border-left:4px solid var(--lijn);
    border-radius:10px;text-align:left;transition:transform .18s var(--soepel),background .18s;
  }
  .drv:hover:not(:disabled),.wknop:hover{transform:translateY(-2px);background:var(--paneel2)}
  .drv:disabled{opacity:.3;cursor:default}
  .drv .code,.wknop .code{font-family:var(--cond);font-size:22px;font-weight:700}
  .drv .tm,.wknop .tm{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-left:auto}

  /* Teamgenoot-duels: per team een regel met de twee coureurs naast elkaar.
     De teamnaam staat links vast, zodat de knoppen op één lijn blijven. */
  .duels{display:flex;flex-direction:column;gap:8px}
  .duel{display:grid;grid-template-columns:64px 1fr 1fr;align-items:center;gap:8px;
    border-left:4px solid var(--lijn);padding-left:10px}
  .duel .tm{font-family:var(--mono);font-size:10px;color:var(--ink2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .duelknop{min-height:52px;justify-content:center}

  /* Poule aanmaken: de vier stappen, de drie voorstellen en de losse vragen. */
  .stappen{display:flex;gap:6px}
  .stap{flex:1;height:4px;border-radius:2px;background:var(--lijn);transition:background .3s}
  .stap.aan{background:var(--accent)}
  .presets{display:flex;flex-direction:column;gap:8px}
  .preset{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;
    padding:14px 16px;background:var(--paneel);border:1px solid var(--lijn);
    border-left:4px solid var(--lijn);border-radius:12px;
    transition:transform .18s var(--soepel),background .18s}
  .preset:hover{transform:translateY(-2px);background:var(--paneel2)}
  .preset.aan{border-color:var(--accent);border-left-color:var(--accent);background:var(--paneel2)}
  .preset .nm{font-family:var(--cond);font-size:22px;font-weight:700;letter-spacing:.02em}
  .preset .zacht{grid-column:1;font-size:13px}
  .preset .ptn{grid-row:1/3;align-self:center;font-family:var(--mono);font-size:20px;
    color:var(--ink2)}
  .preset.aan .ptn{color:var(--accent)}
  .vragenlijst{display:flex;flex-direction:column;gap:6px}
  .vraagregel{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;
    text-align:left;padding:12px 14px;background:var(--paneel);border:1px solid var(--lijn);
    border-radius:10px;transition:background .18s}
  .vraagregel:hover:not(:disabled){background:var(--paneel2)}
  .vraagregel:disabled{opacity:.55;cursor:default}
  .vraagregel .vink{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;
    border:1px solid var(--lijn);font-size:14px;color:var(--accent-ink)}
  .vraagregel.aan .vink{background:var(--accent);border-color:var(--accent)}
  .vraagregel .nm{font-family:var(--cond);font-size:18px}
  .vraagregel .ptn{font-family:var(--mono);font-size:14px;color:var(--ink2)}
  .binnenkort{font-family:var(--mono);font-size:9px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink3);border:1px solid var(--lijn);
    border-radius:4px;padding:1px 5px;vertical-align:2px}
  .somregel{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding-top:4px}
  .somregel .getal{font-family:var(--mono);font-size:28px}

  .opslaanbalk{position:sticky;bottom:0;display:flex;flex-direction:column;gap:8px;
    padding-top:10px;background:linear-gradient(transparent,var(--bg) 40%)}
  .opslaanbalk .knop{min-height:64px}
  #paneel{display:flex;flex-direction:column;gap:14px;min-width:0}
  .kalender{display:flex;flex-direction:column;gap:8px}

  /* ---- uitslag -------------------------------------------- */
  .score{background:var(--paneel);border:1px solid var(--lijn);border-radius:14px;
    padding:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
  .score .getal{font-family:var(--cond);font-size:64px;font-weight:700;
    line-height:.85;color:var(--groen)}
  .strip{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .sr{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;
    background:var(--paneel);border-left:4px solid var(--lijn);border-radius:8px}

export function scoreLijst(voorspeld = [], werkelijk = []) {
  let totaal = 0;
  const regels = voorspeld.map((nr, i) => {
    const echt = werkelijk.indexOf(nr);
    const punten = echt === -1 ? 0 : Math.max(0, 5 - 2 * Math.abs(i - echt));
    totaal += punten;
    return { nr, voorspeld: i + 1, werkelijk: echt === -1 ? null : echt + 1, punten };
  });
  return { totaal, regels };
}

// Onderling duel: per raceweekend wie van twee spelers de meeste punten
// pakte, opgeteld over het seizoen. Een weekend waarin geen van beiden iets
// heeft ingeleverd telt niet mee; dat is geen gelijkspel maar een weekend
// dat er voor dit duel niet was.
export function duelStand(regels = []) {
  let ik = 0, ander = 0, gelijk = 0;
  for (const r of regels) {
    if (!r.meegedaan) continue;
    if (r.ik > r.ander) ik++;
    else if (r.ander > r.ik) ander++;
    else gelijk++;
  }
  return { ik, ander, gelijk, gespeeld: ik + ander + gelijk };
}

// Eén coureur aanwijzen, en die moet bovenaan de lijst staan die erbij
// hoort. Dat is de winnaar van de race, de pole van de kwalificatie, en ook
// de snelste ronde en de snelste pitstop — daar is de lijst één naam lang.
// Alleen het aantal punten verschilt, en dat komt uit de vragenlijst in de
// database, zodat hier geen tweede waarheid ontstaat.
export function scoreEerste(gekozen, uitslag = [], punten = 0) {
  if (!gekozen || !uitslag?.length) return 0;
  return String(uitslag[0]) === String(gekozen) ? punten : 0;
}

// Teamgenoot-duels: per team wie van de twee als eerste eindigt. Je kiest er
// zoveel als je wilt; alleen de duels waar je een keuze in hebt gemaakt
// tellen mee voor je score, en de punten gaan naar rato van het aantal duels
// dat je hebt aangedurfd. Zo levert vier van de vier goed evenveel op als
// tien van de tien, en kost een gokje op een elfde duel je niets als de rest
// klopt.
//
// paren is wat teamParen() hieronder teruggeeft: per team de twee coureurs.
// uitslag is de volledige finishvolgorde. Wie daar niet in staat is niet
// gefinisht en verliest zijn duel van een teamgenoot die dat wel deed.
export function scoreDuels(gekozen = [], uitslag = [], paren = [], punten = 15) {
  if (!gekozen?.length || !uitslag?.length || !paren.length) return 0;
  const plek = (nr) => {
    const i = uitslag.findIndex((x) => String(x) === String(nr));
    return i === -1 ? Infinity : i;
  };
  let goed = 0, geteld = 0;
  for (const { a, b } of paren) {
    const keuze = gekozen.find((g) => String(g) === String(a.nr) || String(g) === String(b.nr));
    if (!keuze) continue;                      // dit duel heb je overgeslagen
    const pa = plek(a.nr), pb = plek(b.nr);
    if (pa === Infinity && pb === Infinity) continue;   // geen van beiden gefinisht
    geteld++;
    if (String(keuze) === String(pa < pb ? a.nr : b.nr)) goed++;
  }
  return geteld ? Math.round(punten * goed / geteld) : 0;
}

// De teams uit een deelnemerslijst, als paren. Alleen teams met precies twee
// coureurs: bij een invaller staan er drie in de lijst en is "de teamgenoot"
// niet meer één iemand.
export function teamParen(drivers = []) {
  const per = new Map();
  for (const d of drivers ?? []) {
    if (!per.has(d.team)) per.set(d.team, []);
    per.get(d.team).push(d);
  }
  return [...per.entries()]
    .filter(([, ds]) => ds.length === 2)
    .map(([team, ds]) => ({ team, a: ds[0], b: ds[1] }));
}

};

// Het ontwerp zet de stalafkorting naast de coureurcode. De database kent

const STALLEN = {
  'red bull':'RBR', 'racing bulls':'RB', 'rb':'RB', 'alphatauri':'AT',
  'mercedes':'MER', 'ferrari':'FER', 'mclaren':'MCL', 'alpine':'ALP',
  'aston':'AST', 'aston martin':'AST', 'williams':'WIL', 'haas':'HAA',
  'sauber':'SAU', 'kick sauber':'SAU', 'audi':'AUD', 'cadillac':'CAD',
};
const stal = (naam) => {

  return STALLEN[sleutel] ?? sleutel.replace(/[^a-z]/g, '').slice(0, 3).toUpperCase();

// ============================================================
//  Aftellen naar de eerstvolgende deadline
//  Het ontwerp zet de resterende tijd groot op het overzicht, dus die
//  moet ook blijven lopen zonder de pagina te herladen.
// ============================================================

function resterend(iso) {
  const ms = new Date(iso).getTime() - Date.now();
  if (!Number.isFinite(ms) || ms <= 0) return null;
  const minuten = Math.floor(ms / 60000);
  return { ms, dagen: Math.floor(minuten / 1440), uren: Math.floor(minuten / 60) % 24,
           totaalUren: Math.floor(minuten / 60), minuten: minuten % 60 };
}

function klokTekst(iso, kort) {
  const r = resterend(iso);
  if (!r) return kort ? 'gesloten' : `gesloten`;
  const eenheid = (getal, teken) => kort ? `${getal}${teken}` : `${getal}<i>${teken}</i>`;
  // Boven de twee dagen zijn losse uren onleesbaar; daaronder juist wel.
  return r.totaalUren >= 48
    ? `${eenheid(r.dagen, 'd')} ${eenheid(r.uren, 'u')}`
    : `${eenheid(r.totaalUren, 'u')} ${eenheid(r.minuten, 'm')}`;
}

// Startlichten: hoe dichter de deadline, hoe meer lampjes branden.
function lampjes(iso) {
  const r = resterend(iso);
  if (!r) return 5;
  if (r.totaalUren > 168) return 1;
  if (r.totaalUren > 72)  return 2;
  if (r.totaalUren > 24)  return 3;
  if (r.totaalUren > 6)   return 4;
  return 5;
}

  });
}
function tikken() {

function uitleg(error) {
  const code = error?.code ?? '';
  const bekend = {
    '42P10': 'De tabel answers mist de unieke sleutel op '
           + '(pool_id, race_id, member_id, question_id). '
           + 'Draai schema.sql opnieuw in de Supabase SQL editor.',
    '23505': 'Er staan dubbele voorspellingen in de database. '
           + 'Draai schema.sql opnieuw, die ruimt ze op en zet de unieke sleutel goed.',
    '23503': 'Deze race of speler bestaat niet (meer) in de database.',
    '42501': 'De database weigert het schrijven (RLS-policy). Draai schema.sql opnieuw.',
    '42P01': 'Een tabel ontbreekt in de database. Draai schema.sql in de Supabase SQL editor.',
    '42703': 'Een kolom ontbreekt in de database. Draai schema.sql in de Supabase SQL editor.',
  };
  if (bekend[code]) return bekend[code];
  const bericht = error?.message ?? 'Onbekende fout';
  return code ? `${bericht} (${code})` : bericht;
}

// De database bewaart sinds de migratie één rij per vraag in answers. De
// schermen werken met één object per speler per race, met een veld per
// vraag — dat leest een stuk prettiger dan overal door een lijst zoeken.
// Deze twee stukjes vertalen daartussen; verder verandert er niets aan de
// schermen.
// De drie oudste vragen hebben een eigen veldnaam die overal in de schermen
// staat; de rest komt onder zijn eigen question_id te staan.
const VRAAG_VELD = { quali_top10:'quali_top10', race_top10:'race_top10', winnaar:'race_winnaar' };

// Welke vragen dit scherm kan stellen en scoren. De database kent er meer;
// die worden overgeslagen tot ze hier ook gebouwd zijn. Zo kan de vragenlijst
// vooruitlopen op de app zonder dat er halve schermen ontstaan.
const GEBOUWD = ['quali_top10', 'race_top10', 'winnaar', 'pole', 'teamgenoot_duels',
                 'snelste_ronde', 'snelste_pitstop'];

function bouwPreds() {
  const per = new Map();
  for (const a of S.antwoorden) {
    if (!GEBOUWD.includes(a.question_id)) continue;
    const sleutel = `${a.race_id}|${a.member_id}`;
    if (!per.has(sleutel)) {
      per.set(sleutel, { pool_id:a.pool_id, race_id:a.race_id, member_id:a.member_id,
                         quali_top10:null, race_top10:null, race_winnaar:null,
                         pole:null, teamgenoot_duels:null,
                         snelste_ronde:null, snelste_pitstop:null });
    }
    per.get(sleutel)[VRAAG_VELD[a.question_id] ?? a.question_id] = a.waarde;
  }
  S.preds = [...per.values()];
}

// Welke vragen doen mee in deze poule? Nog geen keuze gemaakt (of een poule
// van vóór de vragenlijst) betekent: alles wat dit scherm kan tonen.
const vraagActief = (id) =>
  GEBOUWD.includes(id) && (!S.poulevragen.length || S.poulevragen.includes(id));

// Wat een vraag oplevert, volgens de vragenlijst uit de database. De
// getallen hieronder zijn het vangnet voor de demomodus en voor een poule
// die de lijst nog niet heeft geladen.
const VRAAG_PUNTEN = { quali_top10:50, race_top10:50, winnaar:25, pole:10,
                       teamgenoot_duels:15, snelste_ronde:10, snelste_pitstop:10 };
const puntenVoor = (id) =>
  S.vragen.find(v => v.id === id)?.punten ?? VRAAG_PUNTEN[id] ?? 0;

async function laad() {
  if (DEMO) {
    S.races = demoRaces; S.leden = demoLeden;
    S.vragen = demoVragen; S.poulevragen = demoVragen.map(v => v.id);
    S.antwoorden = demoAntwoorden();
    bouwPreds();
    return;
  }
  const [races, leden, antwoorden, vragen, poulevragen] = await Promise.all([
    db.from('races').select('*').eq('season', SEIZOEN).order('round'),
    db.from('pool_members').select('member_id,display_name').eq('pool_id', S.poule.id),
    db.from('answers').select('*').eq('pool_id', S.poule.id),
    db.from('questions').select('*').order('volgorde'),
    db.from('pool_questions').select('question_id').eq('pool_id', S.poule.id),
  ]);
  // Een mislukte lees-actie stil laten passeren geeft een lege lijst zonder
  // uitleg; dat is precies hoe de bewaar-bug zo lang onzichtbaar bleef.
  const stuk = [races, leden, antwoorden, vragen, poulevragen].find(r => r.error);
  if (stuk) throw new Error(uitleg(stuk.error));
  S.races = races.data ?? []; S.leden = leden.data ?? [];
  S.antwoorden = antwoorden.data ?? [];
  S.vragen = vragen.data ?? [];
  S.poulevragen = (poulevragen.data ?? []).map(r => r.question_id);
  bouwPreds();
}

async function bewaar() {
  const nu = Date.now();
  const dicht = { quali: nu >= new Date(S.race.deadline_quali).getTime(),
                  race:  nu >= new Date(S.race.deadline_race).getTime() };

  // De deadline kan verstreken zijn terwijl het formulier openstond. Zonder
  // deze controle zou hieronder een lege kolom worden weggeschreven en zou de
  // speler alsnog "opgeslagen" te zien krijgen.
  if (dicht[S.tab]) throw new Error(S.tab === 'quali'
    ? 'De kwalificatie is inmiddels begonnen, je kunt hem niet meer invullen.'
    : 'De race is inmiddels begonnen, je kunt hem niet meer invullen.');

  const sleutel = { pool_id: S.poule.id, race_id: S.race.id, member_id: S.ik.id };

  // Alleen de vragen meesturen waarvan de deadline nog openstaat. Een
  // ongewijzigd antwoord toch meesturen laat een deadline-trigger afgaan die
  // op "aanwezig" test in plaats van op "gewijzigd" — dan kun je je
  // race-top-10 niet meer opslaan zodra de kwalificatie is begonnen.
  const wil = [];
  if (!dicht.quali) {
    wil.push(['quali_top10', S.keuze.quali.length ? S.keuze.quali : null]);
  }
  if (!dicht.race) {
    wil.push(['race_top10', S.keuze.race.length ? S.keuze.race : null]);
    wil.push(['teamgenoot_duels', S.keuze.duels.length ? S.keuze.duels : null]);
  }
  // De vragen waarbij je één coureur aanwijst gaan allemaal hetzelfde: ze
  // hangen aan de deadline van hun eigen sessie.
  for (const [id, v] of Object.entries(COUREURVRAAG)) {
    if (!dicht[v.sessie]) wil.push([id, S.keuze[id] || null]);
  }
  const opslaan = wil.filter(([id, w]) => vraagActief(id) && w !== null);
  // Een leeggemaakt antwoord is een rij die weg moet: waarde mag niet null
  // zijn in de database, en een lege lijst zou als "alles fout" scoren.
  const wissen  = wil.filter(([id, w]) => vraagActief(id) && w === null)
                     .filter(([id]) => vindAntwoord(S.race.id, S.ik.id, id));

  if (DEMO) {
    for (const [id, waarde] of opslaan) zetAntwoord(sleutel, id, waarde);
    for (const [id] of wissen) wisAntwoord(sleutel, id);
    bouwPreds();
    return;
  }

  if (opslaan.length) {
    // onConflict expliciet: zonder deze regel mikt PostgREST op de primaire
    // sleutel en wordt elke "wijziging" een nieuwe rij, waardoor bewaren
    // willekeurig wel en niet lijkt te werken.
    const { data, error } = await db
      .from('answers')
      .upsert(opslaan.map(([id, waarde]) => ({ ...sleutel, question_id: id, waarde })),
              { onConflict: 'pool_id,race_id,member_id,question_id' })
      .select();

    if (error) throw new Error(uitleg(error));
    if (!data?.length) throw new Error(
      'De database nam de voorspelling aan maar gaf geen rij terug. '
      + 'Waarschijnlijk blokkeert een RLS-policy het schrijven of het teruglezen. '
      + 'Draai schema.sql opnieuw in de Supabase SQL editor.');
  }

  for (const [id] of wissen) {
    const { error } = await db.from('answers').delete()
      .eq('pool_id', sleutel.pool_id).eq('race_id', sleutel.race_id)
      .eq('member_id', sleutel.member_id).eq('question_id', id);
    if (error) throw new Error(uitleg(error));
  }
}

// Welke lijst van deze race staat nog open? De kwalificatie sluit eerst.
function openLijst(r, nu = Date.now()) {
  if (nu < new Date(r.deadline_quali).getTime()) return 'quali';
  if (nu < new Date(r.deadline_race).getTime())  return 'race';
  return null;
}

// De eerstvolgende race waar nog iets in te vullen valt. Een race zonder
// deelnemerslijst is een doodlopende knop, dus daar wordt overheen gekeken
// zolang er verderop een race staat die wél te kiezen is.
function eerstvolgende(nu = Date.now()) {
  const open = [];
  for (const r of S.races) {
    const welk = openLijst(r, nu);
    if (!welk) continue;
    open.push({ race:r, welk, iso: welk === 'quali' ? r.deadline_quali : r.deadline_race });
  }
  return open.find(o => (o.race.drivers ?? []).length) ?? open[0] ?? null;
}

function raceStand(r, nu = Date.now()) {
  const mijn = vindPred(r.id, S.ik.id);
  if (r.quali_result || r.race_result) {
    return { soort:'klaar', tekst:`uitslag · ${scoreWeekend(mijn, r)} ptn` };
  }
  const welk = openLijst(r, nu);
  if (!welk) return { soort:'wacht', tekst:'wacht op uitslag' };
  if (!(r.drivers ?? []).length) return { soort:'komt', tekst:'deelnemers volgen' };
  const nog = 10 - (mijn?.[welk === 'quali' ? 'quali_top10' : 'race_top10']?.length ?? 0);
  return { soort:'open', tekst: nog > 0 ? `open · nog ${nog} te kiezen` : 'open · ingevuld' };
}

function standRijen() {
  return S.leden.map(l => {
    let punten = 0;
    for (const r of S.races) {
      if (!r.race_result && !r.quali_result) continue;
      punten += scoreWeekend(vindPred(r.id, l.member_id), r);
    }
    return { id:l.member_id, naam:l.display_name, punten, mij:zelfde(l.member_id, S.ik.id) };
  }).sort((a,b) => b.punten - a.punten || String(a.naam).localeCompare(String(b.naam)));
}

const gereden = () => S.races.filter(r => r.quali_result || r.race_result).length;

// ---- weekenden ----------------------------------------------
// Een poule valt uit elkaar zodra de helft niet meer kan winnen. Wie 300
// punten achterstaat kan nog steeds één weekend pakken, dus dat weekend
// krijgt een eigen uitslag en een eigen ranglijst over het seizoen.

// Iedereen met zijn punten over dit hele weekend (kwalificatie plus race),
// of null zolang er nog niets te scoren valt.
function weekendUitslag(race) {
  if (!race.quali_result && !race.race_result) return null;
  return S.leden.map(l => ({
    id: l.member_id,
    naam: l.display_name,
    punten: scoreWeekend(vindPred(race.id, l.member_id), race),
    mij: zelfde(l.member_id, S.ik.id),
  })).sort((a,b) => b.punten - a.punten || String(a.naam).localeCompare(String(b.naam)));
}

// Bij een gelijke stand delen ze de overwinning; allebei een streepje erbij
// is eerlijker dan er willekeurig één aanwijzen.
function weekendWinnaars(race) {
  const rijen = weekendUitslag(race);
  if (!rijen?.length) return [];
  const hoogste = rijen[0].punten;
  return hoogste > 0 ? rijen.filter(r => r.punten === hoogste) : [];
}

// Heeft deze speler dit weekend iets ingeleverd? Elk antwoord telt, ook als
// het alleen de pole of een paar duels was — anders zou een weekend waarin
// iemand wél meedeed niet meetellen voor het onderlinge duel.
const heeftVoorspeld = (r, id) => {
  const p = vindPred(r.id, id);
  return !!(p?.quali_top10?.length || p?.race_top10?.length
         || p?.race_winnaar || p?.pole || p?.teamgenoot_duels?.length);
};

function duels() {
  const gescoord = S.races.filter(r => r.quali_result || r.race_result);
  return S.leden
    .filter(l => !zelfde(l.member_id, S.ik.id))
    .map(l => ({
      naam: l.display_name,
      ...duelStand(gescoord.map(r => ({
        ik:    scoreWeekend(vindPred(r.id, S.ik.id), r),
        ander: scoreWeekend(vindPred(r.id, l.member_id), r),
        meegedaan: heeftVoorspeld(r, S.ik.id) || heeftVoorspeld(r, l.member_id),
      }))),
    }))
    .filter(d => d.gespeeld > 0)
    .sort((a,b) => (b.ik - b.ander) - (a.ik - a.ander)
                || String(a.naam).localeCompare(String(b.naam)));
}

function weekendOverwinningen() {
  const telling = new Map(S.leden.map(l =>
    [String(l.member_id), { naam:l.display_name, aantal:0, mij:zelfde(l.member_id, S.ik.id) }]));
  for (const r of S.races) {
    for (const w of weekendWinnaars(r)) {
      const rij = telling.get(String(w.id));
      if (rij) rij.aantal++;
    }
  }
  return [...telling.values()].filter(x => x.aantal > 0)
    .sort((a,b) => b.aantal - a.aantal || String(a.naam).localeCompare(String(b.naam)));
}

// Wie heeft er voor de nog openstaande lijst nog niks ingeleverd? Jezelf
// laten we weg: daarvoor staat de knop "Top 10 invullen" er al.
function nogNietIngevuld(race, welk) {
  const kolom = welk === 'quali' ? 'quali_top10' : 'race_top10';
  return S.leden.filter(l => !zelfde(l.member_id, S.ik.id))
                .filter(l => !(vindPred(race.id, l.member_id)?.[kolom]?.length));
}

// ---- uitnodigingslink ---------------------------------------
// ?code=RTM026 slaat het codescherm over. Scheelt je vrienden een stap en
// een typefout, en is de enige manier om een poule te delen zonder dat
// iemand zes tekens moet overtikken uit een groepsapp.

function codeUitLink() {
  try {
    const code = new URLSearchParams(location.search).get('code');
    return code ? code.trim().toUpperCase() : '';
  } catch { return ''; }
}

// De code weer uit de adresbalk halen zodra hij gebruikt is. Anders trekt
// een herlaadactie je terug naar die poule, ook nadat je met "Andere poule"
// bewust bent overgestapt — en werkt herladen juist wél als vluchtweg
// wanneer de link een verkeerde code bevatte.
function vergeetLinkCode() {
  try { history.replaceState(null, '', location.pathname); } catch { /* niets te doen */ }
}

function uitnodigingsTekst() {
  const basis = location.origin && location.origin !== 'null'
    ? location.origin + location.pathname
    : String(location.href).split('?')[0];
  return `Doe mee met ${S.poule.name}:\n${basis}?code=${S.poule.join_code}`;
}

// Dezelfde knop staat op de poulepagina en op de laatste stap van het
// aanmaken. Lukt het klembord niet, dan komt de tekst in beeld om zelf te
// selecteren — zie naarKlembord() hieronder.
function knoopUitnodiging(waar) {
  const knop = waar.querySelector('#uitnodiging');
  if (!knop) return;
  const oorspronkelijk = knop.textContent;
  knop.onclick = async () => {
    const tekst = uitnodigingsTekst();
    const veld = waar.querySelector('#uitnodigingveld');
    if (await naarKlembord(tekst)) {
      knop.textContent = 'Gekopieerd';
      setTimeout(() => { knop.textContent = oorspronkelijk; }, 2400);
    } else {
      knop.textContent = 'Kopiëren lukt niet, selecteer hem zelf';
      veld.value = tekst;
      veld.classList.remove('hide');
      veld.select();
    }
  };
}

// ---- de vragenset -------------------------------------------
// De drie voorstellen uit BEDIENING.md §3. Hier staat alleen wélke vragen
// meedoen; wat ze waard zijn staat in de database, zodat een wijziging daar
// niet stilzwijgend langs dit bestand loopt.

const PRESETS = {
  simpel:    { naam:'Simpel',    uitleg:'alleen de twee top-tienen',
               vragen:['quali_top10', 'race_top10'] },
  klassiek:  { naam:'Klassiek',  uitleg:'de top-tienen plus drie losse vragen',
               vragen:['quali_top10', 'race_top10', 'winnaar', 'pole', 'snelste_ronde'] },
  gevorderd: { naam:'Gevorderd', uitleg:'alles wat er is',
               vragen:['quali_top10', 'race_top10', 'winnaar', 'pole', 'snelste_ronde',
                       'snelste_pitstop', 'teamgenoot_duels', 'safety_cars', 'rode_vlag'] },
};

const puntenSom = (ids) => ids.reduce((n, id) => n + puntenVoor(id), 0);
const isGok = (id) => !!S.vragen.find(v => v.id === id)?.gok;
const welkPreset = (ids) => Object.keys(PRESETS).find(k =>
  PRESETS[k].vragen.length === ids.length && PRESETS[k].vragen.every(v => ids.includes(v)));

// De vragenlijst staat los van een poule, dus die kan al opgehaald worden
// voordat er een poule bestaat. Zonder deze lijst zijn de punten in het
// aanmaakscherm niet te tonen.
async function laadVragen() {
  if (S.vragen.length) return;
  if (DEMO) { S.vragen = demoVragen; return; }
  const { data, error } = await db.from('questions').select('*').order('volgorde');
  if (error) throw new Error(uitleg(error));
  S.vragen = data ?? [];
}

// De lijst met vinkjes, gedeeld door het aanmaakscherm en straks het
// beheergedeelte. `uit` maakt hem alleen-lezen; dat is wat er gebeurt zodra
// de vragenset op slot gaat.
function vragenLijst(gekozen, { uit = false } = {}) {
  return S.vragen.map(v => {
    const aan = gekozen.includes(v.id);
    const komt = !GEBOUWD.includes(v.id);
    return `
      <button class="vraagregel ${aan ? 'aan' : ''}" data-vraag-aan="${esc(v.id)}"
        aria-pressed="${aan}" ${uit ? 'disabled' : ''}>
        <span class="vink">${aan ? '✓' : ''}</span>
        <span class="nm">${esc(v.naam)}${komt
          ? ` <span class="binnenkort">binnenkort</span>` : ''}</span>
        <span class="ptn">${v.punten}</span>
      </button>`;
  }).join('');
}

// Onder de lijst: wat het bij elkaar waard is, en de twee dingen waar je op
// moet letten. De gokwaarschuwing komt uit BEDIENING.md §8 — blokkeren doen
// we niet, het is hun poule.
function vragenVoet(gekozen) {
  const totaal = puntenSom(gekozen);
  const gok = puntenSom(gekozen.filter(isGok));
  const nu = puntenSom(gekozen.filter(id => GEBOUWD.includes(id)));
  return `
    <div class="somregel">
      <span class="label">maximaal per weekend</span>
      <b class="getal">${totaal}</b>
    </div>
    ${nu < totaal ? `<p class="zacht" style="margin:0">Daarvan wordt nu ${nu} punten
      al gevraagd. De rest staat klaar en gaat vanzelf meetellen zodra hij er is.</p>` : ''}
    ${!gekozen.length ? `<p class="mono amber" style="margin:0">Kies er minstens één.</p>` : ''}
    ${totaal && gok / totaal > 0.3 ? `<div class="waarschuwing">
      <span class="label">gele vlag</span>
      Meer dan een derde van de punten hangt nu van geluk af (${gok} van de ${totaal}).
      Overweeg er een paar uit te zetten, anders wint de gelukkigste in plaats van
      wie de sport volgt.</div>` : ''}`;
}

// ---- handmatige uitslag -------------------------------------
// OpenF1 heeft niet elke sessie. De sync vult alleen een lege uitslag, dus
// wat hier met de hand in gaat blijft voorgoed staan — vandaar de vlag.

const UITSLAGKOLOM = { quali: 'quali_result',    race: 'race_result' };
const HANDVLAG     = { quali: 'quali_handmatig', race: 'race_handmatig' };

// Alleen een lege uitslag mag ingevuld worden. Nooit overschrijven: races
// zijn gedeeld met elke poule in de database, dus een verkeerde correctie
// raakt iedereen.
const magInvullen = (r, welk) => !r[UITSLAGKOLOM[welk]] && (r.drivers ?? []).length > 0;

async function bewaarUitslag() {
  const r = S.race, welk = S.uitslag.welk;
  const kolom = UITSLAGKOLOM[welk], vlag = HANDVLAG[welk];
  const alle = r.drivers ?? [];

  if (S.uitslag.lijst.length !== alle.length) {
    throw new Error('Zet eerst alle coureurs op een plek.');
  }
  if (r[kolom]) {
    throw new Error('Er staat inmiddels al een uitslag voor deze sessie.');
  }

  if (DEMO) { r[kolom] = [...S.uitslag.lijst]; r[vlag] = true; return; }

  // is(kolom, null) hoort bij de update zelf: heeft iemand anders hem in de
  // tussentijd ingevuld, dan raakt deze schrijfactie niets en komt er niets
  // terug. Dat is beter dan een controle vooraf, die die race verliest.
  const { data, error } = await db.from('races')
    .update({ [kolom]: S.uitslag.lijst, [vlag]: true })
    .eq('id', r.id).is(kolom, null).select();

  if (error) throw new Error(uitleg(error));
  if (!data?.length) throw new Error(
    'Er staat inmiddels al een uitslag voor deze sessie, dus die van jou is niet '
    + 'weggeschreven. Ga terug en bekijk hem.');
}

// ---- klembord -----------------------------------------------
// De poule leeft in de groepsapp, niet in de app. Zonder een knop die de
// uitslag als tekst klaarzet moet iemand actief de site openen om te zien
// hoe het ging, en dat doet niemand na race vier nog uit zichzelf.

function groepsappTekst(race) {
  const rijen = weekendUitslag(race);
  if (!rijen?.length) return '';
  const breed = Math.max(...rijen.map(r => String(r.naam).length));
  const seizoen = standRijen();
  return `🏁 ${race.name}, uitslag poule\n\n`
    + rijen.map((r, i) => `${i + 1}. ${String(r.naam).padEnd(breed + 2)}${r.punten}`).join('\n')
    + `\n\nSeizoen: ${seizoen.map(r => `${r.naam} ${r.punten}`).join(', ')}`;
}

async function naarKlembord(tekst) {
  try {
    await navigator.clipboard.writeText(tekst);
    return true;
  } catch {
    // Oudere browsers, en elke pagina die niet over https loopt, kennen de
    // clipboard-API niet. Dan maar via de omweg van een tijdelijk veld.
    try {
      const veld = document.createElement('textarea');
      veld.value = tekst;
      veld.setAttribute('readonly', '');
      veld.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(veld);
      veld.select();
      const gelukt = document.execCommand('copy');
      veld.remove();
      return gelukt;
    } catch { return false; }
  }
}
const laatsteMetUitslag = () =>
  [...S.races].reverse().find(r => r.quali_result || r.race_result) ?? null;

  if (S.maak)   { maakPagina(); return; }
  if (!S.poule) { toonStart(); return; }
  if (!S.ik)    { kiesSpeler(); return; }
  toonApp();
}

        </nav>

            <span class="label">poulecode</span>
            <span class="waarde">${esc(S.poule.join_code ?? '—')}</span>

        </div>
      </aside>

      <main class="hoofd">
        <div class="baan"></div>
        <div class="kop">
          <span class="ptitel">${esc(S.poule.name)}</span>
          <span class="meta">seizoen ${SEIZOEN} · ${S.leden.length} ${S.leden.length === 1 ? 'speler' : 'spelers'}</span>
          ${volgend ? `<span class="pil"><span class="stip klopt"></span>
            <span class="mono">${esc(volgend.race.name.toLowerCase())} sluit in
              <span data-tot="${esc(volgend.iso)}" data-kort="1">${klokTekst(volgend.iso, true)}</span></span></span>` : ''}
          ${volgend && !detail ? `<button class="knop primair" data-naar-race="${esc(volgend.race.id)}">Top 10 invullen</button>` : ''}
        </div>

        ${S.melding ? `<div class="meldingbalk"><div class="melding">${esc(S.melding)}</div></div>` : ''}

        <div class="kolommen${enkel ? ' enkel' : ''}">
          <section class="kol links">${
            S.weergave === 'stand' ? standPagina(rijen)
            : S.weergave === 'poule' ? poulePagina(rijen)

      </main>
    </div>`;

  S.melding = '';
  if (detail) vulPaneel();

  app.querySelectorAll('[data-weergave]').forEach(b => b.onclick = () => {
    S.weergave = b.dataset.weergave; S.race = null;
    S.beheer = null; S.beheerFout = '';
    render();
  });
  app.querySelectorAll('[data-race]').forEach(b => b.onclick = () => openRace(b.dataset.race));
  app.querySelectorAll('[data-naar-race]').forEach(b => b.onclick = () => openRace(b.dataset.naarRace));
  const terug = app.querySelector('#terug');
  if (terug) terug.onclick = () => { S.race = null; render(); };

    S.race = null; S.weergave = 'races';

function hero(volgend) {
  const r = volgend.race;
  const aan = lampjes(volgend.iso);
  const wacht = nogNietIngevuld(r, volgend.welk);
  return `
    <div class="hero">
      <div class="hero-kop">
        <span class="label">nu open · ${esc(r.name)}</span>
        <span class="mono groen">sluit ${esc(sluitTekst(volgend.iso))}</span>
      </div>
      <div class="klok" data-tot="${esc(volgend.iso)}">${klokTekst(volgend.iso)}</div>
      <div class="lampjes">${Array.from({length:5}, (_,i) =>
        `<span class="${i < aan ? 'aan' : ''}" style="animation-delay:${(i * .12).toFixed(2)}s"></span>`).join('')}</div>
      ${S.leden.length > 1 ? `<div class="wachtop mono ${wacht.length ? 'amber' : 'groen'}">${
        wacht.length
          ? `nog niks ingevuld: ${wacht.map(l => esc(l.display_name)).join(', ')}`
          : 'iedereen heeft ingevuld'}</div>` : ''}
      <button class="knop primair" data-naar-race="${esc(r.id)}">Top 10 invullen</button>

}

function kalenderRij(r) {
  const st = raceStand(r);
  const mijn = vindPred(r.id, S.ik.id);
  const vink = (lijst) => lijst?.length ? 'aan' : '';
  const merk = st.soort === 'klaar' ? `<span class="vlag"></span>`
    : st.soort === 'open' ? `<span class="stip klopt"></span>` : '';
  return `<button class="race ${st.soort}" data-race="${esc(r.id)}">
    <span class="rnd">${String(r.round).padStart(2,'0')}</span>
    <span class="rinfo">
      <span class="nm">${esc(r.name)}</span>
      <span class="st ${st.soort}">${esc(st.tekst)}</span>
    </span>
    <span class="mk" title="Q = kwalificatie ingevuld, R = race ingevuld">
      <i class="${vink(mijn?.quali_top10)}">Q</i><i class="${vink(mijn?.race_top10)}">R</i></span>
    ${merk}
  </button>`;
}

// ---- rechterkolom zonder race: stand en laatste uitslag -----

function nevenPaneel(rijen) {
  const laatste = laatsteMetUitslag();
  return `
    <span class="label">stand</span>
    ${rijen.length ? rijen.slice(0, 5).map((r, i) => standRij(r, i, rijen)).join('')
      : `<p class="zacht" style="margin:0">Nog niemand meegedaan.</p>`}
    ${laatste ? `<span class="label" style="margin-top:12px">laatste uitslag · ${esc(laatste.name)}</span>
      ${korteUitslag(laatste)}` : ''}`;
}

function korteUitslag(r) {
  const werkelijk = r.race_result ?? r.quali_result;
  const mijn = vindPred(r.id, S.ik.id);
  const lijst = r.race_result ? mijn?.race_top10 : mijn?.quali_top10;
  if (!lijst?.length) return `<p class="zacht" style="margin:0">Je hebt hier niks ingevuld.</p>`;
  const { regels } = scoreLijst(lijst, werkelijk);
  return `<ul class="strip">${regels.map(x => {
    const d = drv(r, x.nr);
    return `<li class="sr" style="border-left-color:${esc(d.kleur)}">
      <span class="pos">P${x.voorspeld}</span>
      <span class="code">${esc(d.code)}</span>
      <span class="werd">${x.werkelijk ? 'werd P' + x.werkelijk : 'DNF'}</span>
      <span class="pts ${puntKlasse(x.punten)}">${x.punten}</span>
    </li>`;
  }).join('')}</ul>`;
}

const puntKlasse = (p) => p === 5 ? 'v5' : p === 3 ? 'v3' : p === 1 ? 'v1' : 'v0';

// ---- stand --------------------------------------------------

function standRij(r, i, alle) {
  const volgende = alle[i + 1];
  const voor = volgende ? `+${r.punten - volgende.punten}` : '—';
  return `<div class="strij ${r.mij ? 'zelf' : ''}">
    <span class="p">${i + 1}</span>
    <span class="nm">${esc(r.naam)}${r.mij ? ` <span class="jij">jij</span>` : ''}</span>
    <span class="voor">${voor}</span>
    <span class="t">${r.punten}</span>
  </div>`;
}

function standPagina(rijen) {
  const top = rijen.slice(0, 3);
  const hoogste = top[0]?.punten ?? 0;
  const balk = (p) => Math.round(48 + (hoogste ? p / hoogste : 0) * 76);
  const volgorde = top.length === 3 ? [top[1], top[0], top[2]] : [];
  return `
    <div style="display:flex;align-items:center;gap:12px">
      <h1 class="middel">Stand</h1>
      <span class="mono" style="color:var(--ink3);margin-left:auto">na ${gereden()} van ${S.races.length}</span>
    </div>
    ${volgorde.length && hoogste ? `<div class="podium">${volgorde.map((r, i) => `
      <div class="trede ${i === 1 ? 'eerste' : ''}">
        <span class="nm">${esc(r.naam)}</span>
        <span class="balk" style="height:${balk(r.punten)}px">${r.punten}</span>
      </div>`).join('')}</div>
      <div class="scheiding"></div>` : ''}
    ${rijen.length ? rijen.map((r, i) => standRij(r, i, rijen)).join('')
      : `<p class="zacht" style="margin:0">Nog niemand meegedaan.</p>`}
    ${weekendRanglijst()}
    ${duelLijst()}
    <div class="uitleg">Punten per plek: <b>5</b> exact, <b>3</b> één plek ernaast,
      <b>1</b> twee plekken ernaast. Wie een weekend de meeste punten pakt wint dat
      weekend, ook al sta je in het seizoen achter.</div>`;
}

// De tweede ranglijst: los van het seizoen valt er elk weekend iets te winnen.
function weekendRanglijst() {
  if (S.leden.length < 2) return '';
  const winsten = weekendOverwinningen();
  if (!winsten.length) return '';
  return `<span class="label">weekendoverwinningen</span>
    ${winsten.map(w => `<div class="rest ${w.mij ? 'winnaar' : ''}">
      <span class="nm">${esc(w.naam)}${w.mij ? ` <span class="jij">jij</span>` : ''}</span>
      <span class="t">${w.aantal}×</span>
    </div>`).join('')}`;
}

// Waar mensen elkaar in de groepsapp op aanspreken, veel meer dan op de
// totaalstand: het gaat om jou tegen hem, niet om plek 4 van de 6.
function duelLijst() {
  if (S.leden.length < 2) return '';
  const rijen = duels();
  if (!rijen.length) return '';
  return `<span class="label">onderlinge duels · jij tegen</span>
    ${rijen.map(d => {
      const stand = d.ik > d.ander ? 'voor' : d.ik < d.ander ? 'achter' : 'gelijkop';
      return `<div class="rest duel ${stand}">
        <span class="nm">${esc(d.naam)}</span>
        ${d.gelijk ? `<span class="gelijkop-tel">${d.gelijk}× gelijk</span>` : ''}
        <span class="duelscore"><b class="mijn">${d.ik}</b><i class="streep">–</i><b class="hun">${d.ander}</b></span>
      </div>`;
    }).join('')}`;
}
