// ============================================================
//  Vangnet: als het tekenen zelf klapt
// ============================================================

// toonFout() hierboven gaat over het laden: er was iets mis met de gegevens en
// de app weet dat. Dit gaat over het geval daaronder, dat tot nu toe helemaal
// niet opgevangen werd: een fout tijdens het opbouwen van een scherm. Dan
// gebeurde er letterlijk niets -- app.innerHTML bleef staan zoals hij stond,
// of hij stond er wel maar zonder werkende knoppen. Op een telefoon is dat
// niet te onderscheiden van "de app is stuk", en er was geen weg terug:
// herladen tekent precies hetzelfde scherm, dus precies dezelfde fout.
//
// Twee uitwegen, op volgorde van wat ze kosten. De eerste gooit alleen weg
// welk scherm je open had staan. Dat is de waarschijnlijkste oorzaak (een
// onthouden race die niet meer bestaat, een tabblad dat weg is) en het kost je
// niets. De tweede vergeet dit toestel helemaal, en zegt er eerlijk bij wat
// dat betekent: je naam in de poule kies je daarna opnieuw.

const SCHERMSTAART = ':scherm';

// De sleutels opsommen kan op zichzelf al klappen -- privémodus, geblokkeerde
// opslag -- en juist hier mag niets meer klappen.
function pouleSleutels(staart) {
  const uit = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith('poule:')) continue;
      if (staart && !k.endsWith(staart)) continue;
      uit.push(k);
    }
  } catch { /* niets te doen */ }
  return uit;
}

const vergeetSchermen = () => pouleSleutels(SCHERMSTAART).forEach(wis);

// Alles behalve de taalkeuze. Die is geen onderdeel van het probleem en wel
// van het ongemak: iemand die de app op Engels heeft gezet wil na een storing
// niet ineens Nederlands terugkrijgen. Veilig om te laten staan ook, want die
// sleutel wordt nergens anders voor gebruikt dan als opzoekwaarde in het
// woordenboek, en wat er niet in staat valt gewoon terug op het Nederlands.
const vergeetToestel = () =>
  pouleSleutels().filter(k => k !== TAALSLEUTEL).forEach(wis);

// Staat het vangnet eenmaal op het scherm, dan blijft het daar staan. Een
// achtergebleven handler die alsnog render() aanroept mag het niet wegpoetsen
// en de gebruiker terugzetten in dezelfde klap.
let kapot = false;

function toonKapot(fout) {
  kapot = true;
  const bericht = (fout && fout.message) ? fout.message : String(fout ?? '');
  app.innerHTML = `
    <div class="toegang"><div class="kaart"><div class="baan"></div>
      <div class="kaart-in">
        <div class="rodevlag">
          <span class="label">${T('vastgelopen')}</span>
          <h1 class="middel">${T('Dit scherm liep vast')}</h1>
          <p class="zacht" style="margin:0">${T('Er ging iets mis bij het tekenen '
            + 'van dit scherm. Wat je hebt ingevuld staat veilig in de database '
            + '-- dit gaat alleen over wat je hier ziet.')}</p>
          ${bericht ? `<p class="foutregel" id="kapotreden">${esc(bericht)}</p>` : ''}
          <button class="knop wit" id="opnieuw">${T('Opnieuw proberen')}</button>
          <p class="zacht" style="margin:0;font-size:13px">
            ${T('Blijft het misgaan?')}
            <button class="knoptekst" id="kapotwis" type="button">${
              T('Begin op dit toestel opnieuw')}</button>
          </p>
        </div>
      </div>
    </div></div>`;

  // Opnieuw proberen gooit het onthouden scherm weg voordat het herlaadt.
  // Anders is "opnieuw proberen" een knop die gegarandeerd hetzelfde doet.
  app.querySelector('#opnieuw').onclick = () => {
    vergeetSchermen();
    location.reload();
  };

  // Hetzelfde tweetikpatroon als bij "alles wissen": de eerste tik vraagt,
  // de tweede doet. Geen browserdialoog, want dat is niet te vertalen en op
  // een telefoon niet te onderscheiden van een storing.
  const knop = app.querySelector('#kapotwis');
  let gevraagd = false;
  knop.onclick = () => {
    if (!gevraagd) {
      gevraagd = true;
      knop.textContent = T('Zeker weten? Tik nog een keer. '
        + 'Je kiest daarna je naam opnieuw in de poule.');
      return;
    }
    vergeetToestel();
    location.reload();
  };
}

// ============================================================
//  De omroep: wat er te melden valt, ook voor wie het niet ziet
// ============================================================

// De app zegt van alles op het scherm -- "Opgeslagen", "Iedereen heeft nu 3
// jokers dit seizoen", een foutregel onder een veld -- en daarvan kwam niets
// aan bij wie met een schermlezer werkt. Niet omdat de tekst er niet stond,
// maar omdat er bij elke tik een compleet nieuwe app.innerHTML verschijnt, en
// een schermlezer een DOM die onder hem vandaan vervangen wordt niet voorleest.
//
// Eén vak buiten #app lost het voorlezen op. De vraag is dan nog wannéér er
// iets in gezet wordt. De eerste opzet hing dat aan het einde van render(),
// en dat was te weinig: de foutregel na een mislukte opslag wordt getekend
// door invulWeergave(), rechtstreeks, zonder render(). Er zijn meer van die
// paden, en er komen er bij.
//
// Vandaar dat de omroep aan de DOM zelf hangt en niet aan de tekenroutines.
// Wat er ook tekent, langs welke weg ook, nu of later: als er een melding of
// een foutregel op het scherm belandt, wordt hij geroepen. Aan een plek die
// niemand hoeft te onthouden valt ook niets te vergeten.

const omroepvak = document.getElementById('omroep');

function omroep(tekst) {
  if (!omroepvak) return;
  const schoon = (tekst ?? '').replace(/\s+/g, ' ').trim();
  // Eerst leegmaken, dan zetten. Twee keer dezelfde tekst is voor een live
  // region geen verandering en dus stilte, terwijl twee keer dezelfde fout
  // juist wél twee keer iets is om te weten.
  omroepvak.textContent = '';
  if (schoon) setTimeout(() => { omroepvak.textContent = schoon; }, 60);
}

// De eerste regel met inhoud. Lege foutregels staan er op veel schermen vast
// klaar te wachten, en die hebben niets te zeggen.
const eersteMet = (kies) =>
  [...app.querySelectorAll(kies)].find(e => (e.textContent ?? '').trim());

function boodschapOpScherm() {
  const melding = eersteMet('.meldingbalk .melding');
  const fout    = eersteMet('.err, .foutregel');
  return { melding, fout,
    tekst: [melding, fout].map(e => e && e.textContent.trim()).filter(Boolean).join('. ') };
}

// ============================================================
//  De focus overleeft een hertekening
// ============================================================

// Elke tik vervangt app.innerHTML in zijn geheel, dus het element dat de
// focus had bestaat daarna niet meer en de focus valt terug op de body.
// Nagemeten: tab naar Stand, druk Enter -- focus kwijt. Zet een tabblad om in
// het racescherm -- focus kwijt. Wie met een toetsenbord werkt moet dus na
// elke handeling opnieuw vanaf het begin van de pagina tabben, en dat maakt
// de app in de praktijk onbruikbaar zonder muis.
//
// Het nieuwe element is meestal gewoon terug te vinden: knoppen dragen een id
// of een data-attribuut dat zegt wát ze zijn (data-weergave, data-tab,
// data-race). Vandaar een handvat in plaats van een verwijzing naar het oude
// element -- dat is namelijk weg.

let focusHandvat = null;

// Het eerste dat dit element herkenbaar maakt. Geen samengestelde selector:
// aanhalingstekens in een waarde zouden dan ontsnapt moeten worden, en daar
// gaat zoiets altijd een keer mis.
function handvatVan(el) {
  if (!el || !el.attributes || el === app) return null;
  if (el.id) return { soort: 'id', waarde: el.id };
  for (const at of el.attributes) {
    if (at.name.startsWith('data-') && at.value) {
      return { soort: at.name, waarde: at.value };
    }
  }
  return null;
}

function zoekTerug(h) {
  if (!h) return null;
  if (h.soort === 'id') {
    return [...app.querySelectorAll('[id]')].find(e => e.id === h.waarde) ?? null;
  }
  return [...app.querySelectorAll(`[${h.soort}]`)]
    .find(e => e.getAttribute(h.soort) === h.waarde) ?? null;
}

app.addEventListener('focusin', (e) => {
  const h = handvatVan(e.target);
  if (h) focusHandvat = h;
});

function herstelFocus() {
  // Staat de focus nog ergens in de app, dan is er niets kwijtgeraakt en valt
  // er niets te herstellen. Alleen ingrijpen als hij écht weggevallen is,
  // anders sleept dit iemand weg uit het veld waar hij in staat te typen.
  const nu = document.activeElement;
  if (nu && nu !== document.body && app.contains(nu)) return;
  if (!focusHandvat) return;

  const terug = zoekTerug(focusHandvat);
  if (terug) { terug.focus(); return; }

  // Niet terug te vinden: dan is dit geen hertekening van hetzelfde scherm
  // maar een wissel naar een ander. De focus hoort dan naar de nieuwe inhoud,
  // zodat de volgende Tab daar begint en een schermlezer hem oppakt.
  const hoofd = app.querySelector('.hoofd');
  if (hoofd) { hoofd.focus(); focusHandvat = null; }
}

let vorigeBoodschap = { melding: null, fout: null, tekst: '' };

function kijkOfErIetsTeMeldenIs() {
  const nu = boodschapOpScherm();
  // Dezelfde tekst uit dezelfde elementen is hetzelfde bericht dat er nog
  // staat -- dat hoeft niet bij elke hertekening opnieuw. Dezelfde tekst uit
  // een nieuw element is een nieuw voorval: opnieuw op opslaan getikt, opnieuw
  // dezelfde fout. Dat hoort wél geroepen te worden, anders klinkt de tweede
  // poging als stilte en dus als gelukt.
  const zelfde = nu.tekst === vorigeBoodschap.tekst
    && nu.melding === vorigeBoodschap.melding
    && nu.fout === vorigeBoodschap.fout;
  vorigeBoodschap = nu;
  if (zelfde || !nu.tekst) return;
  omroep(nu.tekst);
}

// Eén waarnemer voor allebei: wat er ook tekent, langs welke weg ook, de
// melding wordt geroepen en de focus komt terug. Aan een plek die niemand
// hoeft te onthouden valt niets te vergeten.
new MutationObserver(() => { kijkOfErIetsTeMeldenIs(); herstelFocus(); })
  .observe(app, { childList: true, subtree: true, characterData: true });

// Een fout buiten het tekenen om -- een klik die stilletjes strandt, een
// belofte die niemand opvangt -- mag een werkend scherm niet wegvagen. Die
// krijgt een balkje: genoeg om te zien dat er iets niet klopte, niet genoeg
// om je uit de app te gooien.
function meldStilleFout() {
  if (kapot) return;
  if (document.querySelector('#stillefout')) return;
  const balk = document.createElement('div');
  balk.id = 'stillefout';
  balk.className = 'stillefout';
  balk.innerHTML = `<span>${T('Er ging iets mis op de achtergrond. '
    + 'Het scherm klopt misschien niet meer.')}</span>
    <button type="button" id="stillefoutweg">${T('Sluiten')}</button>`;
  document.body.appendChild(balk);
  balk.querySelector('#stillefoutweg').onclick = () => balk.remove();
}

// Met opzet geen preventDefault(): de fout hoort gewoon in de console te
// blijven staan. Dit is een vangnet voor de gebruiker, geen doofpot voor de
// ontwikkelaar -- en de testen kijken naar diezelfde console.
window.addEventListener('error', meldStilleFout);
window.addEventListener('unhandledrejection', meldStilleFout);

// ============================================================
//  Data laden
// ============================================================

// De database bewaart sinds de migratie één rij per vraag in answers. De
// schermen werken met één object per speler per race, met een veld per
// vraag — dat leest een stuk prettiger dan overal door een lijst zoeken.
// Deze twee stukjes vertalen daartussen; verder verandert er niets aan de
// schermen.
// De drie oudste vragen hebben een eigen veldnaam die overal in de schermen
// staat; de rest komt onder zijn eigen question_id te staan.
// <knip optellen>
const VRAAG_VELD = { quali_top10:'quali_top10', race_top10:'race_top10', winnaar:'race_winnaar' };

// Welke vragen dit scherm kan stellen en scoren. De database kent er meer;
// die worden overgeslagen tot ze hier ook gebouwd zijn. Zo kan de vragenlijst
// vooruitlopen op de app zonder dat er halve schermen ontstaan.
const GEBOUWD = ['quali_top10', 'race_top10', 'sprint_top10', 'winnaar', 'pole',
                 'teamgenoot_duels', 'snelste_ronde', 'snelste_pitstop',
                 'safety_cars', 'rode_vlag',
                 ...Object.keys(SEIZOENVRAAG)];

// ---- automatisch invullen bij vergeten ----------------------
// Van de drie dingen die een vriendenpoule slopen was "mensen vergeten in te
// vullen" de laatste die nog niet aangepakt was. Wie een weekend mist staat
// op nul, en twee gemiste weekenden is meestal het einde van je seizoen.
//
// Daarom: wie niets inlevert krijgt de WK-stand van dat moment als top 10.
// Dat is de saaiste voorspelling die er is en levert ongeveer de helft op van
// wat een goede lijst doet — genoeg om aangehaakt te blijven, te weinig om
// niet invullen lonend te maken.
//
// Drie dingen die bewust zo zijn:
//
//   Het staat uit, tenzij de poulebaas het aanzet. Dit verandert de spelregels
//   van een poule, en dat is niet aan de app.
//
//   Het is een moment en geen vinkje. `autofill_vanaf` bewaart wanneer het
//   aanging, en alleen deadlines daarna tellen mee. Anders zou aanzetten
//   iedereen punten geven over races die al gereden zijn, en dat is precies
//   het soort verrassing waar een poule ruzie van krijgt.
//
//   Er wordt niets weggeschreven. De lijst bestaat alleen in het geheugen van
//   de app, opnieuw uitgerekend bij elke keer laden. Uitzetten haalt hem dus
//   ook echt weg, en niemands inzending raakt vervuild met iets wat hij niet
//   zelf gekozen heeft.

// Het WK-puntenschema, alleen om een standaardlijst mee te maken. Het heeft
// niets te maken met wat een speler in de poule scoort.
const WK_PUNTEN = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];

// Staat automatisch invullen aan voor deze lijst? De deadline moet voorbij
// zijn (anders valt er nog niets te vergeten) en erná liggen (anders zou het
// met terugwerkende kracht gelden).
function autoGeldt(race, welk) {
  const vanaf = S.poule?.autofill_vanaf;
  if (!vanaf || !top10Actief(welk)) return false;
  const deadline = race[SESSIES[welk].deadline];
  if (!deadline) return false;
  const t = Date.parse(deadline);
  return t < Date.now() && t > Date.parse(vanaf);
}

const isAuto = (pred, welk) => !!pred?.auto?.includes(TOP10VRAAG[welk]);

// Een automatische lijst moet overal waar hij te zien is zichzelf aanwijzen.
// Punten die eruit komen zijn echt, maar de keuze is van de app en niet van
// de speler, en dat verschil mag nergens wegvallen.
const autoNoot = (pred, welk, waarom) => isAuto(pred, welk)
  ? `<p class="label amber" style="margin:0">${
      T('automatisch ingevuld · {waarom}', { waarom })}</p>` : '';

/**
 * De standaardlijst voor één race: de WK-stand zoals hij vóór dit weekend
 * was, teruggebracht tot de coureurs die dit weekend meedoen.
 *
 * Nadrukkelijk de stand van tóén en niet die van nu, want anders zou de score
 * van een race in mei nog veranderen zodra er in september wordt gereden.
 *
 * Coureurs met evenveel punten (in de eerste weken zijn dat er veel, allemaal
 * op nul) staan op hun gemiddelde finishplek; wie nog nooit gefinisht is komt
 * achteraan. Zonder eerdere uitslag is er geen stand en dus ook geen lijst —
 * voor race 1 van een seizoen vult de app niets in.
 */
function autoLijst(race) {
  const meedoen = (race.drivers ?? []).map(d => String(d.nr));
  if (meedoen.length < 10) return null;
  const punten = new Map(), som = new Map(), tel = new Map();
  let eerdere = 0;
  for (const r of S.races) {
    if (!(r.round < race.round) || !r.race_result?.length) continue;
    eerdere++;
    r.race_result.forEach((nr, i) => {
      const k = String(nr);
      punten.set(k, (punten.get(k) ?? 0) + (WK_PUNTEN[i] ?? 0));
      som.set(k, (som.get(k) ?? 0) + i + 1);
      tel.set(k, (tel.get(k) ?? 0) + 1);
    });
  }
  if (!eerdere) return null;
  const gemiddeld = (k) => tel.get(k) ? som.get(k) / tel.get(k) : 99;
  return meedoen
    .sort((a, b) => (punten.get(b) ?? 0) - (punten.get(a) ?? 0)
                 || gemiddeld(a) - gemiddeld(b)
                 || Number(a) - Number(b))
    .slice(0, 10);
}

// Draait ná bouwPreds(): vult de gaten, en merkt aan welke lijst niet van de
// speler zelf komt. Een halve inzending telt per lijst — wie de kwalificatie
// wel invulde en de race vergat krijgt alleen die tweede aangevuld.
function vulAutoAan() {
  if (!S.poule?.autofill_vanaf) return;
  for (const r of S.races) {
    // Bewust niet de sprint. Automatisch invullen bestaat om een gemist
    // weekend niet je seizoen te laten kosten, en een sprint is een halve
    // bijvangst op zes weekenden. Er ongevraagd een lijst voor neerzetten
    // voegt punten toe zonder dat probleem op te lossen.
    const welken = ['quali', 'race'].filter(w => autoGeldt(r, w));
    if (!welken.length) continue;
    const lijst = autoLijst(r);
    if (!lijst) continue;
    for (const l of S.leden) {
      let p = vindPred(r.id, l.member_id);
      if (!p) {
        p = { pool_id:S.poule.id, race_id:r.id, member_id:l.member_id,
              quali_top10:null, race_top10:null, sprint_top10:null,
              race_winnaar:null, pole:null, teamgenoot_duels:null,
              snelste_ronde:null, snelste_pitstop:null,
              safety_cars:null, rode_vlag:null };
        S.preds.push(p);
      }
      for (const w of welken) {
        const kolom = TOP10VRAAG[w];
        if (p[kolom]?.length) continue;
        p[kolom] = lijst;
        p.auto = [...(p.auto ?? []), kolom];
      }
    }
  }
}

function bouwPreds() {
  const per = new Map();
  for (const a of S.antwoorden) {
    if (!GEBOUWD.includes(a.question_id)) continue;
    const sleutel = `${a.race_id}|${a.member_id}`;
    if (!per.has(sleutel)) {
      per.set(sleutel, { pool_id:a.pool_id, race_id:a.race_id, member_id:a.member_id,
                         quali_top10:null, race_top10:null, sprint_top10:null,
                         race_winnaar:null, pole:null, teamgenoot_duels:null,
                         snelste_ronde:null, snelste_pitstop:null,
                         safety_cars:null, rode_vlag:null });
    }
    per.get(sleutel)[VRAAG_VELD[a.question_id] ?? a.question_id] = a.waarde;
  }
  S.preds = [...per.values()];
  vulAutoAan();
}

// Welke vragen doen mee in deze poule? Nog geen keuze gemaakt (of een poule
// van vóór de vragenlijst) betekent: alles wat dit scherm kan tonen.
const vraagActief = (id) =>
  GEBOUWD.includes(id) && (!S.poulevragen.length || S.poulevragen.includes(id));

// Wat een vraag oplevert, volgens de vragenlijst uit de database. De
// getallen hieronder zijn het vangnet voor de demomodus en voor een poule
// die de lijst nog niet heeft geladen.
const VRAAG_PUNTEN = { quali_top10:50, race_top10:50, sprint_top10:25, winnaar:25, pole:10,
                       teamgenoot_duels:15, snelste_ronde:10, snelste_pitstop:10,
                       safety_cars:12, rode_vlag:20,
                       kampioen:50, constructeur:40, winnaars:30, vierde_team:30 };
const puntenVoor = (id) =>
  S.vragen.find(v => v.id === id)?.punten ?? VRAAG_PUNTEN[id] ?? 0;

async function laad() {
  if (DEMO) {
    S.alleRaces = demoRaces; S.races = demoRaces; S.leden = demoLeden;
    S.vragen = demoVragen; S.poulevragen = demoVragen.map(v => v.id);
    S.antwoorden = demoAntwoorden();
    S.jokers = demoJokers;
    bouwPreds();
    return;
  }
  // races en questions zijn gedeeld door alle poules en staan op alleen-lezen
  // voor iedereen; de inhoud van één poule komt in één keer uit
  // poule_ophalen(). Sinds de leespolicies dicht staan is dat niet alleen
  // veiliger maar ook minder werk: één ronde in plaats van drie.
  const [races, vragen, inhoud] = await Promise.all([
    // Niet alleen dit seizoen: alles tot en met dit seizoen, zodat terugkijken
    // geen tweede ronde naar de server kost. Dat groeit met 24 rijen per jaar.
    // Wordt dat ooit te veel, dan kan poule_ophalen() erbij zeggen in welke
    // seizoenen deze poule iets heeft staan en filtert deze regel daarop.
    db.from('races').select('*').lte('season', pouleSeizoen())
      .order('season').order('round'),
    db.from('questions').select('*').order('volgorde'),
    pouleOphalen({ p_id: S.poule.id }),
  ]);
  // Een mislukte lees-actie stil laten passeren geeft een lege lijst zonder
  // uitleg; dat is precies hoe de bewaar-bug zo lang onzichtbaar bleef.
  const stuk = [races, vragen, inhoud].find(r => r.error);
  if (stuk) throw new Error(uitleg(stuk.error));
  if (!inhoud.data) throw new Error(T('Deze poule bestaat niet meer.'));
  S.alleRaces = races.data ?? [];
  S.vragen = vragen.data ?? [];
  S.leden = inhoud.data.leden ?? [];
  S.antwoorden = inhoud.data.antwoorden ?? [];
  S.poulevragen = inhoud.data.poulevragen ?? [];
  S.jokers = inhoud.data.jokers ?? [];
  // De poule zelf komt mee, dus een omschrijving die iemand anders net
  // aanpaste staat er meteen goed bij.
  if (inhoud.data.poule) S.poule = inhoud.data.poule;
  kiesSeizoen(S.seizoen);
  bouwPreds();
}

// ---- terugbladeren naar een vorig seizoen -------------------------
//
// De gegevens stonden er al: elke race draagt zijn `season`, en antwoorden
// hangen aan een race. Het enige wat een vorig seizoen onzichtbaar maakte was
// de filter op het ophalen. Dus is dit geen archief met een eigen vorm maar
// een andere snede door wat er al is -- precies zoals ROUTEKAART.md vroeg:
// niet gokken hoe een archief eruit moet zien voordat er iets te archiveren
// valt.
// Raakt S.race met opzet niet aan: laad() roept dit aan en dat gebeurt ook
// direct na het opslaan van een voorspelling, terwijl je nog op het racescherm
// staat. Het scherm sluiten hoort bij het wisselen van seizoen, niet bij het
// opnieuw indelen -- dus dat doet de knop zelf.
function kiesSeizoen(jaar) {
  S.seizoen = jaar ?? pouleSeizoen();
  S.races = S.alleRaces.filter(r => zelfde(r.season, S.seizoen));
}

// In welke seizoenen heeft deze poule iets gedaan? Het huidige telt altijd
// mee, ook als er nog niets ingevuld is -- anders zou een verse poule geen
// enkel seizoen hebben. Nieuwste eerst.
function gespeeldeSeizoenen() {
  const jaren = new Set([pouleSeizoen()]);
  for (const a of S.antwoorden) {
    const r = S.alleRaces.find(x => zelfde(x.id, a.race_id));
    if (r) jaren.add(r.season);
  }
  return [...jaren].sort((a, b) => b - a);
}

// ---- de weg naar binnen -------------------------------------------
// Eén poule ophalen op zijn code of zijn id. Dit was een gewone select op
// pools, maar die tabel staat sinds fase 0 dicht voor wie er niet in zit --
// en je moet een poule nu eenmaal kunnen lezen vóórdat je lid bent. Zie de
// uitleg boven poule_ophalen() in schema.sql.
const pouleOphalen = (argumenten) => db.rpc('poule_ophalen', argumenten);

// Alleen de poule zelf, voor de schermen die verder niets nodig hebben.
async function pouleBij(argumenten) {
  const { data, error } = await pouleOphalen(argumenten);
  if (error) return { data: null, error };
  return { data: data?.poule ?? null, error: null };
}

async function bewaar() {
  const nu = Date.now();
  const dicht = dichteSessies(S.race, nu);

  // De deadline kan verstreken zijn terwijl het formulier openstond. Zonder
  // deze controle zou hieronder een lege kolom worden weggeschreven en zou de
  // speler alsnog "opgeslagen" te zien krijgen.
  if (dicht[S.tab]) throw new Error(
    `${hoofdletter(SESSIES[S.tab].wat)} is inmiddels begonnen, je kunt hem niet meer invullen.`);

  const sleutel = { pool_id: S.poule.id, race_id: S.race.id, member_id: S.ik.id };

  // Alleen de vragen meesturen waarvan de deadline nog openstaat. Een
  // ongewijzigd antwoord toch meesturen laat een deadline-trigger afgaan die
  // op "aanwezig" test in plaats van op "gewijzigd" — dan kun je je
  // race-top-10 niet meer opslaan zodra de kwalificatie is begonnen.
  const wil = [];
  // Een halve top 10 gaat er niet in: tien plekken of niets. Alleen de
  // sessies die dit weekend bestaan, anders zou een gewoon weekend elke keer
  // een lege sprintlijst proberen weg te schrijven.
  for (const w of weekendSessies(S.race)) {
    if (dicht[w]) continue;
    wil.push([SESSIES[w].vraag, compleet(S.keuze[w]) ? S.keuze[w] : null]);
  }
  // De duels hangen aan de race-uitslag en dus aan de deadline van de race.
  if (!dicht.race) {
    wil.push(['teamgenoot_duels', S.keuze.duels.length ? S.keuze.duels : null]);
  }
  // De vragen waarbij je één coureur aanwijst gaan allemaal hetzelfde: ze
  // hangen aan de deadline van hun eigen sessie.
  for (const [id, v] of Object.entries(COUREURVRAAG)) {
    if (!dicht[v.sessie]) wil.push([id, S.keuze[id] || null]);
  }
  // Hier bewust ?? en niet ||: nul safety cars en "nee, geen rode vlag" zijn
  // antwoorden, en die zouden met || als leeg wegvallen en hun rij wissen.
  for (const [id, v] of Object.entries(EXTRAVRAAG)) {
    if (!dicht[v.sessie]) wil.push([id, S.keuze[id] ?? null]);
  }
  const opslaan = wil.filter(([id, w]) => vraagActief(id) && w !== null);
  // Een leeggemaakt antwoord is een rij die weg moet: waarde mag niet null
  // zijn in de database, en een lege lijst zou als "alles fout" scoren.
  const wissen  = wil.filter(([id, w]) => vraagActief(id) && w === null)
                     .filter(([id]) => vindAntwoord(S.race.id, S.ik.id, id));

  if (DEMO) {
    for (const [id, waarde] of opslaan) zetAntwoord(sleutel, id, waarde);
    for (const [id] of wissen) wisAntwoord(sleutel, id);
    bouwPreds();
    return;
  }

  if (opslaan.length) {
    // onConflict expliciet: zonder deze regel mikt PostgREST op de primaire
    // sleutel en wordt elke "wijziging" een nieuwe rij, waardoor bewaren
    // willekeurig wel en niet lijkt te werken.
    const { data, error } = await db
      .from('answers')
      .upsert(opslaan.map(([id, waarde]) => ({ ...sleutel, question_id: id, waarde })),
              { onConflict: 'pool_id,race_id,member_id,question_id' })
      .select();

    if (error) throw new Error(uitleg(error));
    // Nul rijen terug is het antwoord van RLS op een schrijfactie die niet
    // mag — er komt geen foutmelding bij. Sinds spelers aan een account
    // hangen is daar één veel waarschijnlijkere oorzaak voor dan een kapotte
    // policy, en die verdient een antwoord waar je iets mee kunt.
    if (!data?.length) throw new Error(nietVanMij()
      ? T('{naam} hoort bij een ander toestel, dus hier kun je zijn '
        + 'voorspelling niet opslaan. Log in met je mailadres om hier ook '
        + '{naam} te zijn, of vraag de poulebaas om {naam} los te maken.',
        { naam: S.ik.naam })
      : T('De database nam de voorspelling aan maar gaf geen rij terug. '
        + 'Waarschijnlijk blokkeert een RLS-policy het schrijven of het teruglezen. '
        + 'Draai schema.sql opnieuw in de Supabase SQL editor.'));
  }

  for (const [id] of wissen) {
    const { error } = await db.from('answers').delete()
      .eq('pool_id', sleutel.pool_id).eq('race_id', sleutel.race_id)
      .eq('member_id', sleutel.member_id).eq('question_id', id);
    if (error) throw new Error(uitleg(error));
  }
}

// ============================================================
//  Afgeleide gegevens voor het overzicht
// ============================================================

// Welke lijst van deze race staat nog open? De kwalificatie sluit eerst.
function openLijst(r, nu = Date.now()) {
  // Aan een afgelaste race valt niets meer te verdienen, dus hij hoort ook
  // niet meer open te staan — en niet meer mee te tellen als "nog invullen".
  if (afgelastEnLeeg(r)) return null;
  // Op de klok en niet op SESSIEVOLGORDE: op een sprintweekend ligt de
  // sprintkwalificatie op vrijdag, dus de sprint sluit vóór de kwalificatie.
  // Voor een gewoon weekend komt er hetzelfde uit als de twee losse regels
  // die hier stonden, want quali sluit altijd eerder dan de race.
  return weekendSessies(r)
    .map(w => ({ w, t: new Date(r[SESSIES[w].deadline]).getTime() }))
    .filter(x => nu < x.t)
    .sort((a, b) => a.t - b.t)[0]?.w ?? null;
}

// De eerstvolgende race waar nog iets in te vullen valt. Een race zonder
// deelnemerslijst is een doodlopende knop, dus daar wordt overheen gekeken
// zolang er verderop een race staat die wél te kiezen is.
function eerstvolgende(nu = Date.now()) {
  const open = [];
  for (const r of S.races) {
    const welk = openLijst(r, nu);
    if (!welk) continue;
    open.push({ race:r, welk, iso: r[SESSIES[welk].deadline] });
  }
  return open.find(o => (o.race.drivers ?? []).length) ?? open[0] ?? null;
}

function raceStand(r, nu = Date.now()) {
  const mijn = vindPred(r.id, S.ik.id);
  // Geen "uitslag ·" ervoor: deze rij staat onder de kop "gereden", met een
  // finishvlag ernaast. Die twee zeggen het al, en de regel moet ruimte
  // houden voor wie het weekend won.
  if (heeftUitslag(r)) {
    return { soort:'klaar', tekst: T('{n} ptn', { n: scoreWeekend(mijn, r) }) };
  }
  // Een uitslag wint van de vlag: staat er toch een uitslag (met de hand
  // ingevuld, of OpenF1 die hem later alsnog kreeg), dan is hij niet afgelast.
  if (afgelastEnLeeg(r)) return { soort:'afgelast', tekst: T('niet doorgegaan') };
  const welk = openLijst(r, nu);
  if (!welk) return { soort:'wacht', tekst: T('wacht op uitslag') };
  if (!(r.drivers ?? []).length) return { soort:'komt', tekst: T('deelnemers volgen') };
  const nog = 10 - (mijn?.[SESSIES[welk].vraag]?.length ?? 0);
  return { soort:'open', tekst: nog > 0
    ? T('open · nog {n} te kiezen', { n: nog }) : T('open · ingevuld') };
}

// `tot` telt alleen de races vóór dat rondenummer mee. Zonder grens is dit de
// gewone stand; mét is het de stand zoals hij vóór een weekend was, en dat is
// alles wat je nodig hebt om te zeggen wie er geklommen of gezakt is.
function standRijen(tot = Infinity) {
  return S.leden.map(l => {
    let punten = 0;
    for (const r of S.races) {
      if (!heeftUitslag(r)) continue;
      if (r.round >= tot) continue;
      punten += scoreWeekend(vindPred(r.id, l.member_id), r);
    }
    // De seizoenslaag telt één keer mee, aan het eind van het jaar. Alleen in
    // de volledige stand: `tot` bestaat om de stand van vóór een weekend na te
    // rekenen, en daar hoort een eindstand niet in thuis -- dat zou de pijlen
    // van het laatste weekend laten slaan op punten die niets met dat weekend
    // te maken hebben.
    if (tot === Infinity) punten += scoreSeizoen(l.member_id);
    return { id:l.member_id, naam:l.display_name, punten,
             mij:zelfde(l.member_id, S.ik.id) };
  }).sort((a,b) => b.punten - a.punten || String(a.naam).localeCompare(String(b.naam)));
}

// ---- wie is er geklommen of gezakt? -------------------------
// De stand zegt wie er wint, niet wat er is gebeurd. Twee plekken stijgen in
// Monza is het soort ding waar mensen elkaar op aanspreken, en het kost niets:
// dezelfde telling, één weekend eerder afgekapt.
//
// Pas vanaf twee gereden races: vóór de tweede is iedereen "nieuw" en zou elke
// rij een pijltje krijgen dat nergens op slaat.
function positieWissels() {
  const gescoord = S.races.filter(heeftUitslag)
    .sort((a, b) => a.round - b.round);
  if (gescoord.length < 2) return new Map();
  const laatste = gescoord[gescoord.length - 1];
  const eerder = standRijen(laatste.round);
  const nu = standRijen();
  const plek = (rijen, id) => rijen.findIndex(r => zelfde(r.id, id)) + 1;
  return new Map(nu.map(r => {
    const van = plek(eerder, r.id), naar = plek(nu, r.id);
    return [String(r.id), van && naar ? van - naar : 0];
  }));
}

// ---- reeksen ------------------------------------------------
// "Zeven weekenden op rij ingeleverd." Telt terug vanaf de laatste race met
// een uitslag, en stopt bij het eerste weekend dat je oversloeg.
//
// heeftVoorspeld() slaat automatisch aangevulde lijsten over, dus een reeks
// die de app voor je invulde telt niet mee. Dat is dezelfde grens als bij de
// weekendwinst: het is iets wat je doet, niet iets wat je overkomt.
function reeksVan(memberId) {
  const gescoord = S.races.filter(heeftUitslag)
    .sort((a, b) => b.round - a.round);
  let n = 0;
  for (const r of gescoord) {
    if (!heeftVoorspeld(r, memberId)) break;
    n++;
  }
  return n;
}

const gereden = () => S.races.filter(heeftUitslag).length;

// ---- weekenden ----------------------------------------------
// Een poule valt uit elkaar zodra de helft niet meer kan winnen. Wie 300
// punten achterstaat kan nog steeds één weekend pakken, dus dat weekend
// krijgt een eigen uitslag en een eigen ranglijst over het seizoen.

// Iedereen met zijn punten over dit hele weekend (kwalificatie plus race),
// of null zolang er nog niets te scoren valt.
function weekendUitslag(race) {
  if (!heeftUitslag(race)) return null;
  return S.leden.map(l => ({
    id: l.member_id,
    naam: l.display_name,
    punten: scoreWeekend(vindPred(race.id, l.member_id), race),
    // Punten zonder inzending: automatisch ingevuld, of gewoon nul.
    zelfgedaan: heeftVoorspeld(race, l.member_id),
    mij: zelfde(l.member_id, S.ik.id),
  })).sort((a,b) => b.punten - a.punten || String(a.naam).localeCompare(String(b.naam)));
}

// Bij een gelijke stand delen ze de overwinning; allebei een streepje erbij
// is eerlijker dan er willekeurig één aanwijzen.
function weekendWinnaars(race) {
  // Wie niets inleverde doet niet mee om de weekendwinst, ook niet als de
  // automatische lijst toevallig goed uitpakte. De seizoensstand houdt je
  // aangehaakt; een weekend winnen is iets wat je doet, niet iets wat je
  // overkomt. De lijst is al gesorteerd, dus filteren houdt dat zo.
  const rijen = (weekendUitslag(race) ?? []).filter(r => r.zelfgedaan);
  if (!rijen.length) return [];
  const hoogste = rijen[0].punten;
  return hoogste > 0 ? rijen.filter(r => r.punten === hoogste) : [];
}

// Heeft deze speler dit weekend iets ingeleverd? Elk antwoord telt, ook als
// het alleen de pole of een paar duels was — anders zou een weekend waarin
// iemand wél meedeed niet meetellen voor het onderlinge duel.
const heeftVoorspeld = (r, id) => {
  const p = vindPred(r.id, id);
  return !!p && GEBOUWD.some(vraag => {
    const kolom = VRAAG_VELD[vraag] ?? vraag;
    // Een automatisch ingevulde lijst is geen inzending. Zonder deze regel
    // zou "heeft meegedaan" waar worden voor iemand die niets deed.
    if (p.auto?.includes(kolom)) return false;
    const w = p[kolom];
    return Array.isArray(w) ? w.length > 0 : !leegAntwoord(w);
  });
};

function duels() {
  const gescoord = S.races.filter(heeftUitslag);
  return S.leden
    .filter(l => !zelfde(l.member_id, S.ik.id))
    .map(l => ({
      naam: l.display_name,
      ...duelStand(gescoord.map(r => ({
        ik:    scoreWeekend(vindPred(r.id, S.ik.id), r),
        ander: scoreWeekend(vindPred(r.id, l.member_id), r),
        meegedaan: heeftVoorspeld(r, S.ik.id) || heeftVoorspeld(r, l.member_id),
      }))),
    }))
    .filter(d => d.gespeeld > 0)
    .sort((a,b) => (b.ik - b.ander) - (a.ik - a.ander)
                || String(a.naam).localeCompare(String(b.naam)));
}

// De stand met ieders slechtste weekenden eruit. Dezelfde punten, andere
// optelling — zie zonderSlechtste() voor waarom dit naast de stand staat en
// niet in plaats van.
function streepStand() {
  const gescoord = S.races.filter(heeftUitslag);
  return S.leden.map(l => ({
    id: l.member_id,
    naam: l.display_name,
    mij: zelfde(l.member_id, S.ik.id),
    ...zonderSlechtste(gescoord.map(r => ({
      naam: r.name,
      punten: scoreWeekend(vindPred(r.id, l.member_id), r),
    }))),
  })).sort((a, b) => b.totaal - a.totaal || String(a.naam).localeCompare(String(b.naam)));
}

function weekendOverwinningen() {
  const telling = new Map(S.leden.map(l =>
    [String(l.member_id), { naam:l.display_name, aantal:0, mij:zelfde(l.member_id, S.ik.id) }]));
  for (const r of S.races) {
    for (const w of weekendWinnaars(r)) {
      const rij = telling.get(String(w.id));
      if (rij) rij.aantal++;
    }
  }
  return [...telling.values()].filter(x => x.aantal > 0)
    .sort((a,b) => b.aantal - a.aantal || String(a.naam).localeCompare(String(b.naam)));
}
// </knip optellen>

// Wie heeft er voor de nog openstaande lijst nog niks ingeleverd? Jezelf
// laten we weg: daarvoor staat de knop "Top 10 invullen" er al.
function nogNietIngevuld(race, welk) {
  const kolom = SESSIES[welk].vraag;

// ---- uitnodigingslink ---------------------------------------
// ?code=RTM026 slaat het codescherm over. Scheelt je vrienden een stap en
// een typefout, en is de enige manier om een poule te delen zonder dat
// iemand zes tekens moet overtikken uit een groepsapp.

// Let op de lengtecontrole: `?code=` is ook de parameter waarmee Supabase je
// na een inloglink terugstuurt, en die sleutel is tientallen tekens lang. Zou
// die hier doorgelaten worden, dan kreeg je na het inloggen "die poulecode
// bestaat niet" te zien. Zie ZIET_ERUIT_ALS_POULECODE bovenaan.
function codeUitLink() {
  try {
    const code = new URLSearchParams(location.search).get('code');
    if (!code) return '';
    const schoon = code.trim().toUpperCase();
    return ZIET_ERUIT_ALS_POULECODE(schoon) ? schoon : '';
  } catch { return ''; }
}

// De code uit een gedeelde profiellink. Acht tekens uit een klein alfabet, en
// dat is meteen de controle: alles wat daar niet op lijkt is geen profielcode
// en hoort het gewone startscherm te geven.
function profielUitLink() {
  try {
    const code = (new URLSearchParams(location.search).get('profiel') ?? '').trim();
    return /^[a-z2-9]{6,16}$/.test(code) ? code : '';
  } catch { return ''; }
}

// Wie de link opent. Zonder dit maakt dezelfde persoon zichzelf op zijn
// laptop opnieuw aan en staat hij twee keer in de stand, met zijn punten
// verdeeld over de twee. Zie OVERDRACHT.md over waarom dit geen inlog is.
function spelerUitLink() {
  try { return (new URLSearchParams(location.search).get('speler') ?? '').trim(); }
  catch { return ''; }
}

// De code weer uit de adresbalk halen zodra hij gebruikt is. Anders trekt
// een herlaadactie je terug naar die poule, ook nadat je met "Andere poule"
// bewust bent overgestapt — en werkt herladen juist wél als vluchtweg
// wanneer de link een verkeerde code bevatte.
function vergeetLinkCode() {
  try { history.replaceState(null, '', location.pathname); } catch { /* niets te doen */ }
}

const linkBasis = () => location.origin && location.origin !== 'null'
  ? location.origin + location.pathname
  : String(location.href).split('?')[0];

function uitnodigingsTekst(poule = S.poule) {
  return `Doe mee met ${poule.name}:\n${linkBasis()}?code=${poule.join_code}`;
}

// Je eigen link, om jezelf mee te nemen naar een ander toestel. Bewust geen
// uitnodiging: wie hem heeft speelt onder jouw naam.
const eigenLinkTekst = () =>
  `${linkBasis()}?code=${S.poule.join_code}&speler=${encodeURIComponent(S.ik.id)}`;

// De agenda met alle deadlines. Die staat naast index.html op dezelfde
// plek, dus de bestandsnaam eraf en kalender.ics erachter — dat werkt zowel
// op dannydevis.github.io/F1-Poule/ als op een eigen domein.
const agendaLink = () => linkBasis().replace(/[^/]*$/, '') + 'kalender.ics';
// webcal:// laat een telefoon of laptop meteen de abonneer-vraag stellen in
// plaats van het bestand te downloaden. Het is dezelfde url, ander protocol.
const agendaAbonnee = () => agendaLink().replace(/^https?:/, 'webcal:');

// Dezelfde knop staat op de poulepagina en op de laatste stap van het
// aanmaken. Op de poulepagina gaat het om S.poule; tijdens het aanmaken
// bestaat die nog niet (die wordt pas gezet zodra je op "Naar de poule"
// klikt), dus geeft stap 4 de net aangemaakte poule expliciet mee.
// Lukt het klembord niet, dan komt de tekst in beeld om zelf te
// selecteren — zie naarKlembord() hieronder.
function knoopUitnodiging(waar, poule = S.poule) {
  kopieerknop(waar, '#uitnodiging', '#uitnodigingveld', () => uitnodigingsTekst(poule));
  if (S.poule && S.ik) kopieerknop(waar, '#eigenlink', '#eigenlinkveld', eigenLinkTekst);
  kopieerknop(waar, '#agendalink', '#agendalinkveld', agendaLink);
}

// Kopiëren naar het klembord mag niet overal — een oudere browser, of een
// pagina zonder https. Lukt het niet, dan komt de tekst in een veld te staan
// dat je zelf kunt selecteren; dat is altijd nog beter dan een knop die niets
// lijkt te doen.
function kopieerknop(waar, knopKies, veldKies, maakTekst) {
  const knop = waar.querySelector(knopKies);
  if (!knop) return;
  const oorspronkelijk = knop.textContent;
  knop.onclick = async () => {
    const tekst = maakTekst();
    const veld = waar.querySelector(veldKies);
    if (await naarKlembord(tekst)) {
      knop.textContent = T('Gekopieerd');
      setTimeout(() => { knop.textContent = oorspronkelijk; }, 2400);
    } else {
      knop.textContent = T('Kopiëren lukt niet, selecteer hem zelf');
      veld.value = tekst;
      veld.classList.remove('hide');
      veld.select();
    }
  };
}

// De drie voorstellen uit BEDIENING.md §3. Hier staat alleen wélke vragen
// meedoen; wat ze waard zijn staat in de database, zodat een wijziging daar
// niet stilzwijgend langs dit bestand loopt.

const PRESETS = {
  simpel:    { naam:'Simpel',    uitleg:'alleen de twee top-tienen',
               vragen:['quali_top10', 'race_top10'] },
  klassiek:  { naam:'Klassiek',  uitleg:'de top-tienen plus drie losse vragen',
               vragen:['quali_top10', 'race_top10', 'winnaar', 'pole', 'snelste_ronde'] },
  gevorderd: { naam:'Gevorderd', uitleg:'alles wat er is',
               vragen:['quali_top10', 'race_top10', 'sprint_top10', 'winnaar', 'pole',
                       'snelste_ronde', 'snelste_pitstop', 'teamgenoot_duels',
                       'safety_cars', 'rode_vlag',
                       'kampioen', 'constructeur', 'winnaars', 'vierde_team'] },
};

const puntenSom = (ids) => ids.reduce((n, id) => n + puntenVoor(id), 0);

// Wat een gewoon weekend maximaal oplevert. Drie bakjes, want niet alles komt
// even vaak langs: de sprint bestaat op zes van de vierentwintig weekenden en
// de seizoenslaag één keer per jaar. Allebei meetellen in "maximaal per
// weekend" zou dat getal achttien weekenden lang te hoog zetten, dus ze staan
// apart -- en ze wórden apart genoemd, want een preset die 350 punten belooft
// en er 202 geeft is erger dan een preset die het uitlegt.
const SPRINTVRAAG = 'sprint_top10';
const BUITEN_WEEKEND = ['sprint', 'seizoen'];
const sessieVan = (id) => S.vragen.find(v => v.id === id)?.sessie
  ?? (id === SPRINTVRAAG ? 'sprint' : SEIZOENVRAAG[id] ? 'seizoen' : 'race');
const weekendSom = (ids) => puntenSom(ids.filter(id => !BUITEN_WEEKEND.includes(sessieVan(id))));
const sprintSom  = (ids) => puntenSom(ids.filter(id => sessieVan(id) === 'sprint'));
const seizoenSom = (ids) => puntenSom(ids.filter(id => sessieVan(id) === 'seizoen'));
const isGok = (id) => !!S.vragen.find(v => v.id === id)?.gok;
const welkPreset = (ids) => Object.keys(PRESETS).find(k =>
  PRESETS[k].vragen.length === ids.length && PRESETS[k].vragen.every(v => ids.includes(v)));

// De vragenlijst staat los van een poule, dus die kan al opgehaald worden
// voordat er een poule bestaat. Zonder deze lijst zijn de punten in het
// aanmaakscherm niet te tonen.
async function laadVragen() {
  if (S.vragen.length) return;
  if (DEMO) { S.vragen = demoVragen; return; }
  const { data, error } = await db.from('questions').select('*').order('volgorde');
  if (error) throw new Error(uitleg(error));
  S.vragen = data ?? [];
}

// De lijst met vinkjes, gedeeld door het aanmaakscherm en straks het
// beheergedeelte. `uit` maakt hem alleen-lezen; dat is wat er gebeurt zodra
// de vragenset op slot gaat.
function vragenLijst(gekozen, { uit = false } = {}) {
  return S.vragen.map(v => {
    const aan = gekozen.includes(v.id);
    const komt = !GEBOUWD.includes(v.id);
    return `
      <button class="vraagregel ${aan ? 'aan' : ''}" data-vraag-aan="${esc(v.id)}"
        aria-pressed="${aan}" ${uit ? 'disabled' : ''}>
        <span class="vink">${aan ? '✓' : ''}</span>

          ? ` <span class="binnenkort">${T('binnenkort')}</span>` : ''}</span>
        <span class="ptn">${v.punten}</span>

  }).join('');
}

// Onder de lijst: wat het bij elkaar waard is, en de twee dingen waar je op
// moet letten. De gokwaarschuwing komt uit BEDIENING.md §8 — blokkeren doen
// we niet, het is hun poule.
function vragenVoet(gekozen) {
  const totaal = puntenSom(gekozen);
  const gok = puntenSom(gekozen.filter(isGok));
  const nu = puntenSom(gekozen.filter(id => GEBOUWD.includes(id)));
  const sprint = sprintSom(gekozen);
  const seizoensvragen = seizoenSom(gekozen);
  return `
    <div class="somregel">
      <span class="label">${T('maximaal per weekend')}</span>
      <b class="getal">${weekendSom(gekozen)}</b>
    </div>
    ${sprint ? `<p class="zacht" style="margin:0">${T('Op een sprintweekend komt daar '
      + '{n} bij, voor de top 10 van de sprint. Dat zijn er zes per seizoen.',
      { n: sprint })}</p>` : ''}
    ${seizoensvragen ? `<p class="zacht" style="margin:0">${T('En {n} punten aan '
      + 'seizoensvragen: die vul je één keer in, vóór de eerste race, en ze worden '
      + 'aan het eind van het jaar gescoord.', { n: seizoensvragen })}</p>` : ''}
    ${nu < totaal ? `<p class="zacht" style="margin:0">${T('Daarvan wordt nu {n} '
      + 'punten al gevraagd. De rest staat klaar en gaat vanzelf meetellen zodra hij '
      + 'er is.', { n: nu })}</p>` : ''}
    ${!gekozen.length ? `<p class="mono amber" style="margin:0">${
      T('Kies er minstens één.')}</p>` : ''}
    ${totaal && gok / totaal > 0.3 ? `<div class="waarschuwing">
      <span class="label">${T('gele vlag')}</span>
      ${T('Meer dan een derde van de punten hangt nu van geluk af ({gok} van de '
        + '{totaal}). Overweeg er een paar uit te zetten, anders wint de gelukkigste '
        + 'in plaats van wie de sport volgt.', { gok, totaal })}</div>` : ''}`;
}

// ---- klembord -----------------------------------------------
// De poule leeft in de groepsapp, niet in de app. Zonder een knop die de
// uitslag als tekst klaarzet moet iemand actief de site openen om te zien
// hoe het ging, en dat doet niemand na race vier nog uit zichzelf.

function groepsappTekst(race) {
  const rijen = weekendUitslag(race);
  if (!rijen?.length) return '';
  const breed = Math.max(...rijen.map(r => String(r.naam).length));
  const seizoen = standRijen();
  return `🏁 ${race.name}, uitslag poule\n\n`
    + rijen.map((r, i) => `${i + 1}. ${String(r.naam).padEnd(breed + 2)}${r.punten}`).join('\n')
    + `\n\nSeizoen: ${seizoen.map(r => `${r.naam} ${r.punten}`).join(', ')}`;
}

async function naarKlembord(tekst) {
  try {
    await navigator.clipboard.writeText(tekst);
    return true;
  } catch {
    // Oudere browsers, en elke pagina die niet over https loopt, kennen de
    // clipboard-API niet. Dan maar via de omweg van een tijdelijk veld.
    try {
      const veld = document.createElement('textarea');
      veld.value = tekst;
      veld.setAttribute('readonly', '');
      veld.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(veld);
      veld.select();
      const gelukt = document.execCommand('copy');
      veld.remove();
      return gelukt;
    } catch { return false; }
  }
}

function render() {
  // Eenmaal vastgelopen blijft het vangnet staan. Zonder dit zou de eerste de
  // beste achtergebleven handler het scherm overtekenen met precies dezelfde
  // fout, en is de uitweg onbereikbaar.
  if (kapot) return;
  try {
    if (S.maak)   { maakPagina(); return; }
    if (!S.poule) { toonStart(); return; }
    if (!S.ik)    { kiesSpeler(); return; }
    toonApp();
  } catch (fout) {
    // De fout blijft een fout. Hij hoort in de console en daarmee in de
    // testen, en niet stilletjes opgeslokt omdat er nu een net onder hangt --
    // een vangnet dat bugs onzichtbaar maakt is erger dan geen vangnet.
    // Buiten de catch opnieuw opgooien, zodat hij ongevangen naar boven komt
    // zonder deze aanroep alsnog af te breken.
    setTimeout(() => { throw fout; });
    toonKapot(fout);
  }
}

// De kalender liep strak chronologisch, en dus schoof het seizoen zichzelf
// naar beneden: in juni moest je langs acht gereden races scrollen voordat je
// de eerstvolgende zag. Nu staat bovenaan wat er nog komt, en krijgen de
// gereden races hun eigen lijst eronder — nieuwste eerst, en niet als dood
// archief maar met wie dat weekend in de poule won.
function racesPagina(volgend) {
  const metStand = S.races.map(r => ({ r, st: raceStand(r) }));
  const achterDeRug = (st) => st.soort === 'klaar' || st.soort === 'afgelast';
  const komend = metStand.filter(x => !achterDeRug(x.st));
  const gereden = metStand.filter(x => achterDeRug(x.st)).reverse();
  // Twee heel verschillende soorten leegte: een poule die nog op de kalender
  // wacht, en een seizoen dat erop zit. Hetzelfde zinnetje voor allebei zou in
  // december beweren dat de races nog opgehaald moeten worden.
  const leeg = S.races.length
    ? `<div class="leeg"><span class="label">${T('seizoen rond')}</span>
         <p class="zacht" style="margin:0">${T('Alle races zijn gereden. Hieronder '
           + 'staat hoe ze gegaan zijn.')}</p></div>`
    : `<div class="leeg"><span class="label">${T('nog geen races')}</span>
         <p class="zacht" style="margin:0">${
           T('De kalender wordt automatisch opgehaald.')}</p></div>`;
  return `
    ${DEMO ? `<div class="waarschuwing"><span class="label">${T('demo')}</span>
      ${T('Demomodus met verzonnen data.')}</div>` : ''}
    ${!opslagWerkt ? `<div class="waarschuwing"><span class="label">${T('gele vlag')}</span>
      ${T('Deze browser mag niets onthouden, dus je moet de poulecode elke keer '
        + 'opnieuw invullen. Sta opslag voor deze site toe, of gebruik geen '
        + 'privévenster.')}</div>` : ''}
    ${seizoenBalk()}
    ${volgend ? hero(volgend) : ''}
    <span class="label">${T('kalender')}</span>
    <div class="kalender">${komend.map(x => kalenderRij(x.r, x.st)).join('') || leeg}</div>
    ${gereden.length ? `<span class="label">${T('gereden')}</span>
      <div class="kalender">${gereden.map(x => kalenderRij(x.r, x.st)).join('')}</div>` : ''}`;
}

// ---- de weekendkaart ----------------------------------------
// Wie de app opent wil binnen één seconde drie dingen weten: welke race komt
// eraan, moet ik nog iets doen, en hoe sta ik ervoor. Die drie stonden door
// elkaar in de kalenderlijst — je moest zelf bij elkaar zoeken dat Suzuka de
// eerstvolgende was, dat je de race nog niet had ingevuld, en wat dat voor je
// stand betekende. Nu staan ze op die volgorde bovenaan.

// Heb ik voor deze sessie zelf iets ingeleverd? Nadrukkelijk zelf: een
// automatisch aangevulde lijst is geen inzending, en hier zeggen dat je klaar
// bent terwijl je niets deed is precies de verkeerde geruststelling.
function sessieStatus(r, welk) {
  const mijn = vindPred(r.id, S.ik.id);
  const naam = T(SESSIES[welk].naam);
  // Een automatisch aangevulde lijst is vol maar niet van jou. Hem "deels"
  // noemen zou suggereren dat je zelf begonnen was, en "klaar" dat je er iets
  // aan gedaan hebt. Dus krijgt hij zijn eigen woord.
  if (isAuto(mijn, welk)) return { staat: 'auto', teken: '~', naam };
  const aantal = gevuld(naarPlekken(mijn?.[TOP10VRAAG[welk]]));
  if (aantal === 10) return { staat: 'klaar', teken: '✓', naam };
  if (aantal > 0)    return { staat: 'deels', teken: '·', naam };
  return { staat: 'open', teken: '!', naam };
}

// Waar sta ik? De positie, de punten, en wat het laatste gereden weekend
// opleverde. Dat laatste is het getal waar mensen op terugkomen.
function mijnPositie() {
  const rijen = standRijen();
  if (rijen.length < 2) return null;
  const i = rijen.findIndex(x => x.mij);
  if (i === -1) return null;
  const laatste = [...S.races].reverse().find(heeftUitslag);
  return {
    plek: i + 1,
    totaal: rijen.length,
    punten: rijen[i].punten,
    weekend: laatste ? scoreWeekend(vindPred(laatste.id, S.ik.id), laatste) : null,
  };
}

// 1e, 2e, 3e — of 1st, 2nd, 3rd. Het Engels is onregelmatig op precies drie
// plekken en daarna weer niet, en 11 tot en met 13 zijn de uitzondering op die
// uitzondering. Vandaar de tabel en niet een `n + 'th'`.
// "1 punt" tegenover "3 punten". In het Engels valt dat onderscheid weg
// ("1 point" / "3 points" verschillen alleen in de s), maar het enkelvoud
// hoort net zo goed vertaald te worden als het meervoud -- vandaar twee
// sleutels en geen losse 'punt'/'punten' in de sjablonen.
const puntenTekst = (n) => n === 1 ? T('{n} punt', { n }) : T('{n} punten', { n });

const rang = (n) => {
  if (TAAL !== 'en') return `${n}e`;
  const laatste = n % 10, tientallen = n % 100;
  if (tientallen >= 11 && tientallen <= 13) return `${n}th`;
  return `${n}${({ 1: 'st', 2: 'nd', 3: 'rd' })[laatste] ?? 'th'}`;
};

function positieRegel() {
  const p = mijnPositie();
  if (!p) return '';
  return `
    <div class="kaartvoet">
      <span><b class="groot">${rang(p.plek)}</b><i>${
        T('van {n}', { n: p.totaal })}</i></span>
      <span><b class="groot">${p.punten}</b><i>${T('punten')}</i></span>
      ${p.weekend === null ? '' :
        `<span><b class="groot">+${p.weekend}</b><i>${T('vorig weekend')}</i></span>`}
    </div>`;
}

function hero(volgend) {
  const r = volgend.race;
  const aan = lampjes(volgend.iso);
  const wacht = nogNietIngevuld(r, volgend.welk);
  // Alle sessies van dit weekend, niet alleen de open: wie de kwalificatie al
  // gedaan heeft wil dat zien staan, en wie de race nog moet doen ook. Op een
  // sprintweekend staan er dus drie.
  const sessies = weekendSessies(r).filter(top10Actief).map(w => sessieStatus(r, w));
  // De knop wijst naar wat er nog te doen is, en niet naar de eerstvolgende
  // deadline. Wie de kwalificatie al af heeft terwijl de race nog open staat
  // kreeg anders "bekijken" te lezen terwijl er juist nog werk lag.
  const dicht = dichteSessies(r);
  const teDoen = weekendSessies(r)
    .filter(w => top10Actief(w) && !dicht[w])
    .map(w => sessieStatus(r, w))
    .find(x => x.staat !== 'klaar');
  return `
    <div class="hero">
      <div class="hero-kop">
        <span class="label">${T('nu open · ronde {n}', {
          n: String(r.round).padStart(2, '0') })}</span>
        <span class="mono groen">${T('sluit {wanneer}', {
          wanneer: esc(sluitTekst(volgend.iso)) })}</span>
      </div>
      <h1 class="heronaam">${esc(r.name)}</h1>
      <div class="klok" data-tot="${esc(volgend.iso)}">${klokTekst(volgend.iso)}</div>
      <div class="lampjes">${Array.from({length:5}, (_,i) =>
        `<span class="${i < aan ? 'aan' : ''}" style="animation-delay:${(i * .12).toFixed(2)}s"></span>`).join('')}</div>
      <div class="sessies">${sessies.map(x => `
        <span class="sessie ${x.staat}">
          <i>${x.teken}</i>${x.staat === 'auto'
            ? T('{sessie} · automatisch', { sessie: esc(x.naam) })
            : esc(x.naam)}</span>`).join('')}</div>
      ${S.leden.length > 1 ? `<div class="wachtop mono ${wacht.length ? 'amber' : 'groen'}">${
        wacht.length
          ? T('nog geen top 10: {wie}', {
              wie: wacht.map(l => esc(l.display_name)).join(', ') })
          : T('iedereen heeft zijn top 10')}</div>` : ''}
      <button class="knop primair" data-naar-race="${esc(r.id)}">${
        !teDoen ? T('Je inzending bekijken')
        : teDoen.staat === 'deels'
          ? T('Top 10 {sessie} afmaken', { sessie: esc(teDoen.naam) })
          : T('Top 10 {sessie} invullen', { sessie: esc(teDoen.naam) })}</button>
      ${positieRegel()}
    </div>`;
}

// Wie pakte dit weekend de meeste punten in de poule? Zonder dit is een
// gereden race alleen "uitslag · 78 ptn" — je eigen score, zonder te weten of
// dat goed of slecht was. Bij een gelijkstand delen ze hem; vanaf drie namen
// wordt het een opsomming die niemand meer leest.
function weekendWinstTekst(r) {
  const winnaars = weekendWinnaars(r);
  if (!winnaars.length) return '';
  if (winnaars.length === 1) {
    return winnaars[0].mij ? T('jij won') : T('{wie} won', { wie: winnaars[0].naam });
  }
  if (winnaars.length === 2) {
    return T('{een} en {twee} deelden', { een: winnaars[0].naam, twee: winnaars[1].naam });
  }
  return T('{n} spelers deelden', { n: winnaars.length });
}

function kalenderRij(r, st = raceStand(r)) {
  const mijn = vindPred(r.id, S.ik.id);
  // Het vinkje zegt "dit heb jij ingevuld". Een automatisch aangevulde lijst
  // is dat niet, dus die laat het vakje leeg — anders zou het scherm je
  // vertellen dat je iets gedaan hebt wat je niet gedaan hebt.
  const vink = (welk) => !isAuto(mijn, welk) && mijn?.[TOP10VRAAG[welk]]?.length ? 'aan' : '';
  const merk = st.soort === 'klaar' ? `<span class="vlag"></span>`
    : st.soort === 'open' ? `<span class="stip klopt"></span>` : '';
  const won = st.soort === 'klaar' ? weekendWinstTekst(r) : '';
  return `<button class="race ${st.soort}" data-race="${esc(r.id)}">
    <span class="rnd">${String(r.round).padStart(2,'0')}</span>
    <span class="rinfo">
      <span class="nm">${esc(r.name)}</span>
      <span class="st ${st.soort}">${esc(st.tekst)}${won ? ` · ${esc(won)}` : ''}</span>
    </span>
    ${heeftJoker(r.id, S.ik.id)
      ? `<span class="jokervlag" title="${
          T('Je joker ligt hier: dit weekend telt dubbel')}">2×</span>`
      : ''}
    <span class="mk" title="${esc(weekendSessies(r)
      .map(w => T('{letter} = {sessie} ingevuld',
                  { letter: SESSIES[w].letter, sessie: T(SESSIES[w].naam) })).join(', '))}">
      ${weekendSessies(r).map(w =>
        `<i class="${vink(w)}">${SESSIES[w].letter}</i>`).join('')}</span>
    ${merk}
  </button>`;
}

// ---- rechterkolom zonder race: stand en laatste uitslag -----

function nevenPaneel(rijen) {
  const laatste = laatsteMetUitslag();
  return `
    <span class="label">${T('stand')}</span>
    ${rijen.length ? rijen.slice(0, 5).map((r, i) => standRij(r, i, rijen)).join('')
      : `<p class="zacht" style="margin:0">${T('Nog niemand meegedaan.')}</p>`}
    ${laatste ? `<span class="label" style="margin-top:12px">${
      T('laatste uitslag · {race}', { race: esc(laatste.name) })}</span>
      ${korteUitslag(laatste)}` : ''}`;
}

function korteUitslag(r) {
  const welk = getoondeSessie(r);
  const werkelijk = welk ? r[SESSIES[welk].uitslag] : null;
  const mijn = vindPred(r.id, S.ik.id);
  const lijst = welk ? mijn?.[SESSIES[welk].vraag] : null;
  if (!lijst?.length) {
    return `<p class="zacht" style="margin:0">${T('Je hebt hier niks ingevuld.')}</p>`;
  }
  const { regels } = scoreLijst(lijst, werkelijk);
  return `<ul class="strip">${regels.map(x => {
    const d = drv(r, x.nr);
    return `<li class="sr" style="border-left-color:${esc(d.kleur)}">
      <span class="pos">P${x.voorspeld}</span>
      <span class="code">${esc(d.code)}</span>
      <span class="werd">${x.werkelijk
        ? T('werd P{n}', { n: x.werkelijk }) : 'DNF'}</span>
      <span class="pts ${puntKlasse(x.punten)}">${x.punten}</span>
    </li>`;
  }).join('')}</ul>`;
}

const puntKlasse = (p) => p === 5 ? 'v5' : p === 3 ? 'v3' : p === 1 ? 'v1' : 'v0';

// ---- stand --------------------------------------------------

function standRij(r, i, alle, wissels) {
  const volgende = alle[i + 1];
  const voor = volgende ? `+${r.punten - volgende.punten}` : '—';
  const wissel = wissels?.get(String(r.id)) ?? 0;
  // Een pijltje alleen als er iets te melden is. Nul plekken verschil met een
  // streepje erbij zetten maakt van "er is niets gebeurd" een mededeling.
  const pijl = !wissel ? ''
    : `<span class="wissel ${wissel > 0 ? 'omhoog' : 'omlaag'}"
         title="${wissel > 0 ? T('gestegen sinds vorige race') : T('gezakt sinds vorige race')}"
         >${wissel > 0 ? '↑' : '↓'}${Math.abs(wissel)}</span>`;
  const reeks = reeksVan(r.id);
  return `<div class="strij ${r.mij ? 'zelf' : ''}">
    <span class="p">${i + 1}</span>
    <span class="nm">${esc(r.naam)}${r.mij ? ` <span class="jij">${T('jij')}</span>` : ''}
      ${reeks >= 3 ? `<span class="reeks" title="${
        T('{n} weekenden op rij ingeleverd', { n: reeks })}"
        >${reeks}×</span>` : ''}</span>
    ${pijl}
    <span class="voor">${voor}</span>
    <span class="t">${r.punten}</span>
  </div>`;
}

function standPagina(rijen) {
  const top = rijen.slice(0, 3);
  const hoogste = top[0]?.punten ?? 0;
  const balk = (p) => Math.round(48 + (hoogste ? p / hoogste : 0) * 76);
  const volgorde = top.length === 3 ? [top[1], top[0], top[2]] : [];
  return `
    ${seizoenBalk()}
    <div style="display:flex;align-items:center;gap:12px">
      <h1 class="middel">${T('Stand')}</h1>
      <span class="mono" style="color:var(--ink3);margin-left:auto">${
        T('na {n} van {totaal}', { n: gereden(), totaal: S.races.length })}</span>
    </div>
    ${volgorde.length && hoogste ? `<div class="podium">${volgorde.map((r, i) => `
      <div class="trede ${i === 1 ? 'eerste' : ''}">
        <span class="nm">${esc(r.naam)}</span>
        <span class="balk" style="height:${balk(r.punten)}px">${r.punten}</span>
      </div>`).join('')}</div>
      <div class="scheiding"></div>` : ''}
    ${rijen.length ? (() => { const w = positieWissels();
        return rijen.map((r, i) => standRij(r, i, rijen, w)).join(''); })()
      : `<p class="zacht" style="margin:0">${T('Nog niemand meegedaan.')}</p>`}
    ${seizoenslaagBlok()}
    ${weekendRanglijst()}
    ${streepBlok()}
    ${seizoensGrafiek()}
    ${terugblikBlok()}
    ${duelLijst()}
    <div class="uitleg">${T('Punten per plek: <b>5</b> exact, <b>3</b> één plek '
      + 'ernaast, <b>1</b> twee plekken ernaast. Wie een weekend de meeste punten '
      + 'pakt wint dat weekend, ook al sta je in het seizoen achter.')}</div>`;
}

// ---- terugblik: je blinde vlek en het zwaarste weekend --------
// Wat dit hier doet: de stand vertelt wie er wint, maar niet waarom jij staat
// waar je staat. Dit zijn twee gemiddelden over rijen die er al staan, en ze
// bestaan alleen omdat élke voorspelling bewaard blijft.
//
// Alles hieronder houdt zich in tot er genoeg gespeeld is. Een app die na twee
// weekenden beweert dat je "Verstappen structureel te laag zet" is niet slim,
// die verzint iets.

// Alle top 10-lijsten die ik heb ingeleverd en waar een uitslag bij hoort. De
// kwalificatie en de race tellen als aparte lijsten: het zijn twee
// voorspellingen, en je kunt in de ene scherper zijn dan in de andere.
function mijnSessies() {
  const uit = [];
  for (const r of S.races) {
    const p = vindPred(r.id, S.ik.id);
    if (!p) continue;
    for (const w of weekendSessies(r)) {
      const werkelijk = r[SESSIES[w].uitslag], voorspeld = p[SESSIES[w].vraag];
      if (werkelijk?.length && voorspeld?.length) uit.push({ voorspeld, werkelijk });
    }
  }
  return uit;
}

// Een coureur opzoeken zonder te weten in welke race hij stond: de blinde vlek
// gaat over het hele seizoen, dus er is geen enkele race die "de" race is.
function coureurOveral(nr) {
  for (const r of S.races) {
    const d = (r.drivers ?? []).find(x => x.nr === nr);
    if (d) return d;
  }
  return drv({}, nr);
}

// Eén cijfer achter de komma -- of achter de punt. "78,0" leest in het Engels
// als achtenzeventigduizend, dus het scheidingsteken hoort bij de taal en niet
// bij de code.
const komma = (n) => TAAL === 'en' ? n.toFixed(1) : n.toFixed(1).replace('.', ',');

// ---- je seizoen als lijn -------------------------------------
// De stand zegt waar je nu staat, de pijltjes waar je vandaan komt sinds de
// vorige race. Wat er nog miste is de vorm van je seizoen: klom je gestaag,
// of stortte je in juni in en ben je sindsdien aan het terugkomen?
//
// Met de hand getekende SVG en geen bibliotheek. Het is één lijn over
// maximaal 24 punten; daar een grafiekpakket voor inladen zou meer wegen dan
// de hele app.
//
// Drie races is de ondergrens. Twee punten zijn een streepje en geen verloop,
// en dan suggereert een grafiek een trend die er niet is.
function seizoensGrafiek() {
  if (!S.ik || S.leden.length < 2) return '';
  const gescoord = S.races.filter(heeftUitslag)
    .sort((a, b) => a.round - b.round);
  if (gescoord.length < 3) return '';

  const totaal = S.leden.length;
  const punten = gescoord.map(r => {
    const rijen = standRijen(r.round + 1);
    return { ronde: r.round, naam: r.name,
             plek: rijen.findIndex(x => zelfde(x.id, S.ik.id)) + 1 };
  }).filter(p => p.plek > 0);
  if (punten.length < 3) return '';

  const B = 300, H = 90, pad = 6;
  // Plek 1 hoort bovenaan, dus de y-as staat op zijn kop. Bij een poule van
  // twee zou (totaal - 1) anders door nul delen.
  const x = (i) => pad + (i / (punten.length - 1)) * (B - 2 * pad);
  const y = (plek) => totaal < 2 ? H / 2
    : pad + ((plek - 1) / (totaal - 1)) * (H - 2 * pad);
  const lijn = punten.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.plek).toFixed(1)}`).join(' ');
  const beste = Math.min(...punten.map(p => p.plek));
  const slechtste = Math.max(...punten.map(p => p.plek));
  const nu = punten[punten.length - 1].plek;

  return `
    <div class="scheiding"></div>
    <span class="label">${T('jouw seizoen')}</span>
    <div class="grafiek">
      <svg viewBox="0 0 ${B} ${H}" preserveAspectRatio="none" role="img"
        aria-label="${T('Je positie per race: van {eerste} bij {race} naar {nu} nu.',
          { eerste: rang(punten[0].plek), race: esc(punten[0].naam), nu: rang(nu) })}">
        <path d="${lijn}" fill="none" stroke="var(--accent)" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        ${punten.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.plek).toFixed(1)}"
          r="${i === punten.length - 1 ? 3.5 : 2}" fill="var(--accent)"/>`).join('')}
      </svg>
      <!-- De lijn alleen is een plaatje; de getallen eronder maken er
           informatie van, en ze zijn ook het enige wat overblijft voor wie de
           grafiek niet kan zien. -->
      <div class="grafiekvoet">
        <span><b>${rang(punten[0].plek)}</b><i>${T('bij {race}',
          { race: esc(punten[0].naam) })}</i></span>
        <span><b>${rang(beste)}</b><i>${T('beste')}</i></span>
        ${beste === slechtste ? '' : `<span><b>${rang(slechtste)}</b><i>${T('slechtste')}</i></span>`}
        <span><b>${rang(nu)}</b><i>${T('nu')}</i></span>
      </div>
    </div>`;
}

function terugblikBlok() {
  if (!S.ik) return '';
  const sessies = mijnSessies();
  const vlek = blindeVlek(sessies)[0];
  const sterk = sterkstePlekken(sessies)[0];

  const perRace = raceGemiddelden(S.races
    .filter(heeftUitslagLijst)
    .map(r => ({ naam: r.name,
                 punten: S.leden.filter(l => heeftVoorspeld(r, l.member_id))
                                .map(l => scoreWeekend(vindPred(r.id, l.member_id), r)) })));
  const zwaarst = perRace[0];
  const lichtst = perRace.length > 1 ? perRace[perRace.length - 1] : null;

  const regels = [];
  if (vlek) {
    const d = coureurOveral(vlek.nr);
    const hoog = vlek.afwijking < 0;
    const een = Math.abs(vlek.afwijking) < 1.05;
    regels.push(T(hoog
      ? 'Je zet <b>{code}</b> gemiddeld {hoeveel} {plek} te hoog, over {keer} voorspellingen.'
      : 'Je zet <b>{code}</b> gemiddeld {hoeveel} {plek} te laag, over {keer} voorspellingen.',
      { code: esc(d.code), hoeveel: komma(Math.abs(vlek.afwijking)),
        plek: een ? T('plek') : T('plekken'), keer: vlek.keer }));
  }
  if (sterk) {
    regels.push(T('Je bent het scherpst op <b>{band}</b>: gemiddeld {gem} van de 5 punten per plek.',
      { band: esc(T(sterk.naam)), gem: komma(sterk.gemiddelde) }));
  }
  if (zwaarst) {
    // Alleen een vergelijking maken als er iets te vergelijken valt. Zolang
    // elk weekend gelijk uitpakt -- wat aan het begin van een seizoen zo is,
    // en in een poule waar iedereen dezelfde lijst inlevert de hele tijd --
    // stond hier "gemiddeld 78,0 punten, tegen 78,0 in Miami". Twee dezelfde
    // getallen als tegenstelling presenteren is precies het soort gezag
    // waarmee een app onzin verkoopt.
    const verschilt = lichtst && komma(lichtst.gemiddelde) !== komma(zwaarst.gemiddelde);
    regels.push(T('<b>{race}</b> was het zwaarste weekend voor de poule: gemiddeld {gem} punten{rest}.',
      { race: esc(zwaarst.naam), gem: komma(zwaarst.gemiddelde),
        rest: verschilt ? T(', tegen {gem} in {race}',
          { gem: komma(lichtst.gemiddelde), race: esc(lichtst.naam) }) : '' }));
  }
  if (!regels.length) return '';

  return `<span class="label">${T('terugblik')}</span>
    <div class="bijna">
      <ul class="bijnalijst">${regels.map(r => `<li>${r}</li>`).join('')}</ul>
    </div>`;
}

// De tweede ranglijst: los van het seizoen valt er elk weekend iets te winnen.
function weekendRanglijst() {
  if (S.leden.length < 2) return '';
  const winsten = weekendOverwinningen();
  if (!winsten.length) return '';
  return `<span class="label">${T('weekendoverwinningen')}</span>
    ${winsten.map(w => `<div class="rest ${w.mij ? 'winnaar' : ''}">
      <span class="nm">${esc(w.naam)}${w.mij ? ` <span class="jij">${T('jij')}</span>` : ''}</span>
      <span class="t">${w.aantal}×</span>
    </div>`).join('')}`;
}

// "Hoe ver sta ik echt achter?" Eén gemiste race kost je vijftig tot honderd
// punten, en wie dat in april overkomt kijkt in juni niet meer. Dit blok laat
// de stand zien zonder ieders slechtste weekenden — dezelfde punten, andere
// optelling.
//
// Nadrukkelijk naast de stand en niet in plaats van. De officiële stand blijft
// wat hij is; iemands punten midden in een lopend seizoen afpakken is geen
// verbetering, ook niet als de uitkomst eerlijker is.
// ---- de seizoenslaag op het scherm --------------------------
// Eén blok met drie gedaanten: een formulier zolang het seizoen nog niet
// begonnen is, daarna wat je hebt ingevuld, en aan het eind wat het opleverde.
// Dezelfde plek in alle drie de gevallen, want het is dezelfde vraag.
function seizoenslaagBlok() {
  const vragen = seizoenVragen();
  if (!vragen.length || !S.ik) return '';
  const race = seizoenRace();
  if (!race) return '';
  const open = seizoenOpen();
  const uit = seizoenUitslag();
  const drivers = S.races.find(r => (r.drivers ?? []).length)?.drivers ?? [];
  const teams = [...new Set(drivers.map(d => d.team))].sort();
  const mijn = (id) => S.seizoenkeuze?.[id] ?? vindAntwoord(race.id, S.ik.id, id)?.waarde ?? '';

  const toon = (id, waarde) => {
    if (leegAntwoord(waarde)) return null;
    const v = SEIZOENVRAAG[id];
    if (v.toon) return v.toon(waarde);
    if (v.soort === 'coureur') return drv(race, waarde).naam;
    return String(waarde);
  };

  const regel = (id) => {
    const v = SEIZOENVRAAG[id], gekozen = mijn(id);
    if (seizoenVraagOpen(id)) {
      const keuzes = v.soort === 'coureur'
        ? drivers.map(d => `<option value="${esc(d.nr)}" ${zelfde(d.nr, gekozen) ? 'selected' : ''
            }>${esc(d.naam)}</option>`).join('')
        : v.soort === 'team'
          ? teams.map(t => `<option value="${esc(t)}" ${zelfde(t, gekozen) ? 'selected' : ''
              }>${esc(t)}</option>`).join('')
          : null;
      return `
        <label class="seizoenvraag">
          <span class="nm">${esc(T(v.kop))}${v.uitleg
            ? ` <span class="zacht">${esc(T(v.uitleg))}</span>` : ''}</span>
          ${keuzes !== null
            ? `<select data-seizoenvraag="${esc(id)}">
                 <option value="">${T('— kies —')}</option>${keuzes}</select>`
            : `<input type="number" min="1" max="24" inputmode="numeric"
                 data-seizoenvraag="${esc(id)}" value="${esc(gekozen)}">`}
          <span class="ptn">${puntenVoor(id)}</span>
        </label>`;
    }
    const mijnTekst = toon(id, gekozen) ?? T(v.mis);
    const echtTekst = uit ? toon(id, uit[id]) : null;
    const punten = uit ? (() => {
      if (leegAntwoord(gekozen) || leegAntwoord(uit[id])) return 0;
      return v.score ? v.score(gekozen, uit[id], puntenVoor(id))
                     : (zelfde(gekozen, uit[id]) ? puntenVoor(id) : 0);
    })() : null;
    return `
      <div class="seizoenvraag klaar">
        <span class="nm">${esc(T(v.label))}
          <span class="zacht">${esc(mijnTekst)}${echtTekst
            ? ` · het werd ${echtTekst}` : ''}</span></span>
        <span class="ptn ${punten ? 'groen' : ''}">${punten === null ? '—' : punten}</span>
      </div>`;
  };

  // Er staat nog iets open zolang minstens één vraag in te vullen is. Dat is
  // niet hetzelfde als `open`: na de eerste race kan de een alles ingevuld
  // hebben en de ander nog niets.
  const teVullen = vragen.filter(seizoenVraagOpen);
  // Alleen tijdens het seizoen. Vóór de eerste race is er nog niets gereden en
  // ná afloop is er niets meer tegen te houden.
  const vast = open || uit ? [] : vastgelopenRaces();

  const kop = open
    ? T('nog in te vullen · sluit {wanneer}',
        { wanneer: sluitTekst(new Date(weekendStart(race)).toISOString()) })
    : uit ? T('seizoen {jaar} · {punten} punten',
              { jaar: seizoen(), punten: scoreSeizoen(S.ik.id) })
    : teVullen.length ? T('nog {n} in te vullen · het seizoen loopt al',
                          { n: teVullen.length })
                      : T('ingevuld · wordt gescoord als het seizoen erop zit');

  return `
    <div class="scheiding"></div>
    <div class="seizoenslaag">
      <span class="label">${T('seizoensvragen')} · ${esc(kop)}</span>
      ${vragen.map(regel).join('')}
      ${vast.length ? `<p class="zacht" style="margin:0;color:var(--amber)">${
        T('{races} heeft geen uitslag en is niet afgelast. Zolang dat zo blijft '
          + 'kan het seizoen niet afgerond worden en blijven deze vragen ongescoord.',
          { races: esc(opsomming(vast.map(r => r.name))) })}</p>` : ''}
      ${teVullen.length ? `<p class="zacht" style="margin:0">${open
        ? T('Deze vier vul je één keer per seizoen in, vóór de eerste race. '
          + 'Daarna liggen ze vast tot het eind.')
        : T('Het seizoen loopt al, dus wat je nu invult ligt meteen vast. Wat '
          + 'je eerder koos blijft staan zoals het staat.')}</p>
        <button class="knop klein" id="seizoenOpslaan">${T('Opslaan')}</button>` : ''}
      ${S.seizoenFout ? `<p class="err">${esc(S.seizoenFout)}</p>` : ''}
    </div>`;
}

// Dezelfde vorm als bewaar(): alleen wat er staat, en een leeg antwoord haalt
// zijn rij weg in plaats van er een lege waarde in te zetten.
async function bewaarSeizoen() {
  const race = seizoenRace();
  if (!race) throw new Error(T('Er is nog geen kalender voor dit seizoen.'));
  // Alleen de vragen die voor mij nog openstaan. Een antwoord dat al vastligt
  // opnieuw meesturen zou de trigger in schema.sql terecht laten weigeren --
  // en het scherm laten zakken op een vraag waar niets aan veranderd is.
  const open = seizoenVragen().filter(seizoenVraagOpen);
  if (!open.length) throw new Error(T('Het seizoen is al begonnen, de seizoensvragen liggen vast.'));
  const sleutel = { pool_id: S.poule.id, race_id: race.id, member_id: S.ik.id };
  const wil = open.map(id => {
    const rauw = S.seizoenkeuze?.[id] ?? vindAntwoord(race.id, S.ik.id, id)?.waarde ?? '';
    if (leegAntwoord(rauw)) return [id, null];
    return [id, SEIZOENVRAAG[id].soort === 'getal' ? Number(rauw) : String(rauw)];
  });
  const opslaan = wil.filter(([, w]) => w !== null);
  const wissen  = wil.filter(([, w]) => w === null)
                     .filter(([id]) => vindAntwoord(race.id, S.ik.id, id));

  if (DEMO) {
    for (const [id, waarde] of opslaan) zetAntwoord(sleutel, id, waarde);
    for (const [id] of wissen) wisAntwoord(sleutel, id);
    return;
  }
  if (opslaan.length) {
    const { error } = await db.from('answers')
      .upsert(opslaan.map(([id, waarde]) => ({ ...sleutel, question_id: id, waarde })),
              { onConflict: 'pool_id,race_id,member_id,question_id' });
    if (error) throw new Error(uitleg(error));
  }
  for (const [id] of wissen) {
    const { error } = await db.from('answers').delete()
      .eq('pool_id', sleutel.pool_id).eq('race_id', sleutel.race_id)
      .eq('member_id', sleutel.member_id).eq('question_id', id);
    if (error) throw new Error(uitleg(error));
  }
  await laad();
}

  const ik = rijen.find(r => r.mij);
  const nu = standRijen();

  const plekDan = rijen.findIndex(r => r.mij) + 1;

  // Wie het hele seizoen nog niets gescoord heeft streept nullen weg, en daar
  // valt niets zinnigs over te zeggen. Maar één weekend van nul punten tussen
  // de rest is juist het geval waarvoor dit blok bestaat — dat weg filteren
  // omdat het toevallig nul is haalt de zin weg bij precies de persoon die

                  { dan: rang(plekDan), nu: rang(plekNu) })

  return `<span class="label">${aantalWeg === 1
      ? T('zonder je slechtste weekend')

    ${rijen.map(r => `<div class="rest ${r.mij ? 'winnaar' : ''}">

        + 'heel seizoen zijn dat er twee. De stand hierboven telt gewoon alles mee.')}</p>`;

// ---- herinneringen voor de deadline -------------------------
//
// Dit stond lang op de lijst met "bewust niet gebouwd", en de reden was de
// service worker: zodra die verzoeken onderschept kan hij een oude stand
// tonen alsof hij klopt. sw.js heeft daarom geen fetch-handler -- hij cachet
// niets en onderschept niets, hij toont alleen een melding. Daarmee vervalt
// dat bezwaar en blijft de rest staan: het agenda-abonnement doet hetzelfde
// zonder meldingsrecht, en wie dit uitzet mist niets wat er niet al was.
//
// Leeg gelaten VAPID_PUBLIEK betekent: niet ingericht, dus niet aanbieden.
const pushKan = () => !!VAPID_PUBLIEK && !DEMO
  && typeof navigator !== 'undefined' && 'serviceWorker' in navigator
  && typeof PushManager !== 'undefined' && typeof Notification !== 'undefined';

// base64url naar bytes, want applicationServerKey wil ruwe bytes en de sleutel
// staat als tekst in dit bestand.
function sleutelBytes(tekst) {
  const vul = '='.repeat((4 - tekst.length % 4) % 4);
  const rauw = atob((tekst + vul).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(rauw, c => c.charCodeAt(0));
}

async function pushInlezen() {
  if (!pushKan()) { S.push = 'kan niet'; return; }
  try {
    if (Notification.permission === 'denied') { S.push = 'geweigerd'; return; }
    const reg = await navigator.serviceWorker.getRegistration();
    const ab = reg ? await reg.pushManager.getSubscription() : null;
    S.push = ab ? 'aan' : 'uit';
  } catch { S.push = 'kan niet'; }
}

function meldingBlok() {
  if (!pushKan() || !S.poule) return '';
  const kop = `<div class="scheiding"></div><span class="label">${

  if (S.push === 'geweigerd') {
    return `${kop}
      <p class="zacht" style="margin:0">${T('Je browser heeft meldingen voor deze '
        + 'site geblokkeerd. Dat kan de app niet zelf terugdraaien — dat zit in de '
        + 'instellingen van je browser, bij deze site. Je agenda kan het trouwens '
        + 'ook: zie de knop onder Poule.')}</p>`;
  }
  if (S.push === 'aan') {
    return `${kop}
      <p class="zacht" style="margin:0">${T('Dit toestel krijgt een seintje als een '
        + 'deadline nadert en jij nog niets hebt ingevuld. Hooguit één per sessie, '
        + 'en alleen als er echt iets open staat.')}</p>
      <button class="knop klein" id="meldingUit">${T('Zet meldingen uit')}</button>
      ${S.pushFout ? `<p class="err">${esc(S.pushFout)}</p>` : ''}`;
  }
  return `${kop}
    <p class="zacht" style="margin:0">${T('Krijg een seintje op dit toestel als een '
      + 'deadline nadert en je nog niets hebt ingevuld. Op een iPhone werkt dat '
      + 'alleen als RacePicks op je beginscherm staat.')}</p>
    <button class="knop klein" id="meldingAan">${T('Zet meldingen aan')}</button>
    ${S.pushFout ? `<p class="err">${esc(S.pushFout)}</p>` : ''}`;
}

    catch (e) { S.pushFout = e.message; }
