<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RacePicks</title>
<meta name="color-scheme" content="dark light">
<meta name="description" content="Het F1-voorspelspel voor jou en je vrienden. Voorspel de grid, versla je maten en win het weekend. Gratis, zonder wachtwoord.">
<!-- "Zet op beginscherm" geeft hiermee een echte app-tegel in plaats van een
     browsersnelkoppeling. Een poule-app leeft op een telefoon, dus dat is
     geen franje. De pictogrammen zijn maskable: Android snijdt ze in de vorm
     van het toestel, en alles wat telt blijft binnen de veilige zone. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="pictogrammen/racepicks-192.png" sizes="192x192">
<!-- iOS snijdt geen eigen vorm uit het icoon, het legt er alleen ronde hoeken
     omheen. Het maskable pictogram hierboven komt daar dus klein uit met een
     brede rand; vandaar een eigen, vullende variant. -->
<link rel="apple-touch-icon" href="pictogrammen/racepicks-apple-180.png">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-title" content="RacePicks">
<!-- display:standalone uit het manifest is wat een iPhone sinds 16.4 leest;
     dit is de oude schakelaar, voor toestellen die daar nog onder zitten. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<style>

     ziet — en dat moest dus in de privacyverklaring staan. Het weghalen
     is een beter antwoord dan het opschrijven.

     staan in lettertypen/. Alleen latin en latin-ext: vietnamees zou een

     font-display:swap houdt de tekst leesbaar zolang ze onderweg zijn, en
     de unicode-range zorgt dat een browser alleen ophaalt wat hij nodig
     heeft — voor een Nederlandse poule is dat alleen het latin-deel.

  /* ==========================================================
     Ontwerp: startgrid. Barlow Condensed voor koppen en namen,
     Space Mono voor alles wat een tijd of een plek is, Barlow
     voor de lopende tekst. Licht en donker volgen het toestel.
     ========================================================== */
  :root{
    --bg:#f2f1ee; --paneel:#ffffff; --paneel2:#e9e8e4; --gedempt:#e0dedb;
    --lijn:#dcdad5; --stippel:#cfccc7;
    /* ink3 draagt de kleine labels (10-11px), en die hoorde op 4.5:1 te zitten.
       Hij stond op #8d9299 en haalde 2.77 tegen de achtergrond -- onder de
       grens voor gewone tekst én onder die voor grote. Dit is de lichtste
       waarde die het wél haalt (4.55 tegen bg, 5.14 tegen paneel), dus de
       rangorde blijft zo groot als hij kan zijn. */
    --ink:#14151a; --ink2:#61656d; --ink3:#696e75;
    --accent:#d93d24; --accent-ink:#ffffff;
    /* Ook deze twee dragen kleine tekst ("sluit zo 09:04", "nog geen top 10")
       en haalden 4.38 en 3.69 tegen de achtergrond. Nu 4.55 en 4.51. De
       vlakken en randen eronder zijn achtergronden en hoeven niets te halen;
       die blijven op de oorspronkelijke tint staan. */
    --groen:#117c3e; --groen-vlak:rgba(31,138,76,.12); --groen-rand:rgba(31,138,76,.45);
    /* De rand van het jokerpaneel. --groen-rand is 45% dekking en verdwijnt
       tegen het vlak eronder; deze is er om gezien te worden. --groen-ink is
       de tekst ín de groene schijf: groen is donker in het licht en licht in
       het donker, dus die keert mee om. Wit op #117c3e haalt 5,3:1 en bijna
       zwart op #34b264 haalt 7,2:1. */
    --groen-sterk:rgba(31,138,76,.85); --groen-ink:#ffffff;
    --amber:#986300; --amber-vlak:rgba(176,123,22,.10); --amber-rand:rgba(176,123,22,.40);
    /* De paars-groen-geel van een F1-timingscherm. Paars is de beste van de
       drie en hoort schaars te zijn — daarom alleen voor een exacte treffer. */
    --paars:#8b2fc9;
    --omkeer:#14151a; --omkeer-ink:#f2f1ee;
    --vlag-a:#14151a;
    --sans:Barlow,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",var(--sans);
    --mono:"Space Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --soepel:cubic-bezier(.2,.7,.2,1);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0b0c; --paneel:#15161a; --paneel2:#1d1f24; --gedempt:#2b2e35;
      --lijn:#2b2e35; --stippel:#2b2e35;
      /* Zelfde verhaal in het donker: #656b74 haalde 3.36. Nu 4.61/5.01. */
      --ink:#f2f3f5; --ink2:#9aa0a8; --ink3:#7b818a;
      --accent:#ee4d33; --accent-ink:#0b0b0c;
      --groen:#34b264; --groen-vlak:rgba(52,178,100,.16); --groen-rand:rgba(52,178,100,.50);
      --groen-sterk:rgba(52,178,100,.70); --groen-ink:#0b0b0c;
      --amber:#e0a53a; --amber-vlak:rgba(224,165,58,.08); --amber-rand:rgba(224,165,58,.40);
      --paars:#c084f5;
      --omkeer:#f2f3f5; --omkeer-ink:#0b0b0c;
      --vlag-a:#f2f3f5;
    }
  }

  @keyframes pols{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
  @keyframes inrij{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
  @keyframes lampjes{0%,100%{opacity:.18}50%{opacity:1}}
  @keyframes schuif{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.45;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- kleine bouwstenen ---------------------------------- */
  .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink3)}
  .mono{font-family:var(--mono);font-size:11px}
  .cond{font-family:var(--cond);font-weight:700;text-transform:uppercase}
  .groen{color:var(--groen)} .amber{color:var(--amber)} .accentkleur{color:var(--accent)}
  .zacht{color:var(--ink2);font-size:15px}
  .hide{display:none!important}

  .knop{
    display:flex;align-items:center;justify-content:center;
    min-height:60px;padding:0 18px;border-radius:10px;width:100%;
    font-family:var(--cond);font-size:22px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;
    transition:transform .18s var(--soepel),filter .18s,border-color .18s,background .18s;
  }
  /* Sommige knoppen zijn een link, want ze gaan ergens heen (webcal://). */
  a.knop{text-decoration:none;color:inherit}
  .knop.primair{background:var(--accent);color:var(--accent-ink)}
  .knop.primair:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
  .knop.spook{background:transparent;border:1px solid var(--lijn);color:var(--ink);
    font-size:20px;font-weight:600;min-height:56px}
  .knop.spook:hover{border-color:var(--accent);background:var(--paneel)}
  .knop.wit{background:var(--omkeer);color:var(--omkeer-ink);min-height:56px;font-size:20px}
  .knop.wit:hover{transform:translateY(-2px)}
  /* De enige knop die met opzet de huisstijl niet volgt. Zijn hele waarde zit
     in herkenbaarheid: het officiële logo, gewone schrijfwijze in plaats van
     kapitalen, en een vlak dat in beide thema's leest als de knop die overal
     elders ook op dezelfde plek staat. */
  .knop.google{background:var(--paneel);color:var(--ink);border:1px solid var(--lijn);
    gap:12px;min-height:56px;font-family:var(--sans);font-size:17px;font-weight:600;
    text-transform:none;letter-spacing:0}
  .knop.google:hover:not(:disabled){border-color:var(--ink3);background:var(--paneel2)}
  .knop.google svg{width:20px;height:20px;flex:none}
  .knop:disabled{background:var(--gedempt);color:var(--ink3);cursor:default;transform:none;filter:none}
  .knop.klein{min-height:52px;font-family:var(--sans);font-size:15px;font-weight:600;
    text-transform:none;letter-spacing:0;color:var(--ink2);border:1px solid var(--lijn)}
  .knop.klein:hover{border-color:var(--ink3);color:var(--ink)}

  /* Een poule om naartoe te gaan: naam groot, waar hij over gaat eronder, de
     code rechts. Drie regels naast elkaar zou op een telefoon niet passen. */
  .knop.poulekeuze{
    display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;
    justify-content:stretch;text-align:left;padding:12px 14px;min-height:0;
    margin-bottom:8px;border:1px solid var(--lijn);background:var(--paneel);
    font-family:var(--sans);text-transform:none;letter-spacing:0;
  }
  .knop.poulekeuze:hover:not(:disabled){border-color:var(--accent)}
  .knop.poulekeuze .nm{font-size:17px;font-weight:700;color:var(--ink)}
  .knop.poulekeuze .zacht{grid-column:1;font-size:13px}
  .knop.poulekeuze .mono{grid-row:1/span 2;grid-column:2;
    font-size:14px;letter-spacing:.08em;color:var(--ink3)}
  .knop.poulekeuze:has(.zacht) .nm{align-self:end}

  .veld{
    width:100%;min-height:60px;padding:0 16px;border-radius:10px;
    border:1px solid var(--lijn);background:var(--paneel);color:var(--ink);
    font:inherit;font-size:17px;
  }
  .veld::placeholder{color:var(--ink3)}
  .veld.code{
    height:68px;text-align:center;font-family:var(--mono);font-size:30px;
    font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  }
  .scheiding{height:1px;background:var(--lijn)}

  /* ---- meldingen ------------------------------------------ */
  .meldingbalk{padding:16px 16px 0}
  .meldingbalk .melding{margin-bottom:0}
  .melding{
    display:flex;align-items:center;gap:12px;background:var(--groen-vlak);
    border:1px solid var(--groen-rand);border-radius:12px;padding:14px 16px;
    color:var(--groen);font-size:15px;font-weight:600;margin-bottom:14px;
  }
  .melding::before{content:"";width:10px;height:10px;border-radius:50%;
    background:var(--groen);flex:none}
  .waarschuwing{
    display:flex;flex-direction:column;gap:8px;background:var(--amber-vlak);
    border:1px solid var(--amber-rand);border-radius:12px;padding:16px;
    color:var(--amber);font-size:15px;margin-bottom:14px;
  }
  .waarschuwing .label{color:var(--amber)}
  /* flex:none, geen min-height:0. De kolommen zijn flexkolommen die op een
     breed scherm zelf scrollen, en een flexitem met min-height:0 mag door de
     browser tot niets worden platgedrukt zodra de inhoud niet past. Dat
     gebeurde ook: de foutmelding stond er wel, met de juiste tekst, maar was
     nul pixels hoog. Een melding die je niet kunt lezen is geen melding. */
  .err{color:var(--accent);font-size:14px;margin:8px 0 0;flex:none}
  .leeg{
    display:flex;flex-direction:column;gap:12px;align-items:flex-start;
    border:1px dashed var(--stippel);border-radius:14px;padding:20px;
  }

  /* ---- toegangsschermen (poulecode, wie ben jij) ---------- */
  .toegang{min-height:100%;display:flex;justify-content:center;padding:20px 14px 60px}
  .kaart{
    width:100%;max-width:420px;background:var(--paneel);border:1px solid var(--lijn);
    border-radius:22px;overflow:hidden;align-self:flex-start;
  }
  .baan{height:3px;background:var(--accent)}
  .kaart-in{padding:24px 22px 30px;display:flex;flex-direction:column;gap:24px}
  .merk{display:flex;align-items:center;gap:10px}
  .merk .blok{width:26px;height:26px;border-radius:4px;background:var(--accent);flex:none}
  .merk .naam{font-family:var(--cond);font-size:24px;font-weight:700;
    text-transform:uppercase;letter-spacing:.02em;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .merk .code{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    color:var(--ink3);margin-left:auto;flex:none}
  /* Het vlak blijft klein -- dit is een knopje in een merkbalk en geen
     hoofdactie -- maar het aanraakgebied hoort 44 pixels te zijn. Dat is de
     maat die Apple en Google allebei aanhouden, en eronder mis je hem met je
     duim en tik je per ongeluk iets anders aan. Vandaar dat de knop zijn
     hoogte haalt en de rand met een binnenschaduw op de oude maat blijft. */
  .merk .wisselknop{margin-left:auto;flex:none;background:none;
    border:1px solid var(--lijn);border-radius:6px;padding:5px 9px;
    min-height:44px;display:flex;align-items:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    color:var(--ink3);cursor:pointer;transition:color .18s,border-color .18s}
  .merk .wisselknop:hover{color:var(--ink);border-color:var(--ink3)}
  .groot{font-family:var(--cond);font-size:44px;font-weight:700;line-height:.98;
    text-transform:uppercase;margin:0}
  .middel{font-family:var(--cond);font-size:34px;font-weight:700;line-height:1;
    text-transform:uppercase;margin:0}
  /* Een poulenaam is vaak één lang woord ("Vrijdagmiddagpoule") en past op een
     telefoon niet op één regel. Zonder dit valt het eind er stilletjes af. */
  .smalkop{overflow-wrap:anywhere}
  .veldblok{display:flex;flex-direction:column;gap:12px}
  /* De beheerkop krijgt een accentstreep aan de zijkant, en alles eronder
     hoort daar zichtbaar bij. Geen kadertje eromheen: dat zou een vijfde
     kader op een pagina maken die er al genoeg heeft. */
  .beheerkop{display:flex;flex-direction:column;gap:6px;
    border-left:3px solid var(--accent);padding-left:12px}

  /* Het deel-teken van iOS staat middenin een zin, dus het moet op de regel
     meelopen: even hoog als de letters en met de staart op de basislijn. */
  .deelicoon{width:1.05em;height:1.05em;vertical-align:-.18em;
    color:var(--ink2);flex:none}

  /* ---- spelerkeuze ---------------------------------------- */
  .speler{
    display:flex;align-items:center;gap:14px;width:100%;min-height:68px;
    padding:0 18px;background:var(--paneel2);border:1px solid var(--lijn);
    border-left:4px solid var(--lijn);border-radius:10px;text-align:left;
    transition:transform .18s var(--soepel),background .18s;animation:schuif .4s both;
  }
  .speler:hover{transform:translateX(4px);background:var(--gedempt)}
  .speler.zelf{border-left-color:var(--accent)}
  .speler .nr{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink3)}
  .speler .nm{font-family:var(--cond);font-size:26px;font-weight:600;
    text-transform:uppercase;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .speler .ptn{font-family:var(--mono);font-size:11px;color:var(--ink2)}
  /* Alleen zichtbaar voor de poulebaas, en alleen bij een speler die aan een
     ander account hangt. Klein en grijs: het is een uitweg, geen aanbod. */
  .speler .losmaak{
    flex:none;background:none;border:1px solid var(--lijn);border-radius:6px;
    padding:5px 9px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    color:var(--ink3);cursor:pointer;transition:color .18s,border-color .18s}
  .speler .losmaak:hover{color:var(--ink);border-color:var(--ink3)}
  .speler .losmaak[data-zeker="ja"]{color:var(--accent);border-color:var(--accent)}

  /* ---- de app: zijbalk + inhoud --------------------------- */
  .shell{display:flex;flex-direction:column;min-height:100%}
  .zijbalk{
    position:sticky;top:0;z-index:20;background:var(--paneel);
    border-bottom:1px solid var(--lijn);padding:12px 14px;
    display:flex;flex-direction:column;gap:12px;
  }
  .zijbalk .merknaam{display:none}
  /* Vast onderin: daar zit je duim. De balk staat in de DOM nog in de
     zijbalk, want op een breed scherm hoort hij daar wel gewoon in mee te
     lopen; position:fixed haalt hem hier alleen even uit de stroom. */
  .nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;gap:6px;background:var(--paneel);
    border-top:1px solid var(--lijn);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .navknop{
    flex:1;min-height:48px;border-radius:10px;font-family:var(--cond);
    font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink2);transition:background .18s,color .18s;
  }
  .navknop:hover{background:var(--paneel2);color:var(--ink)}
  .navknop[aria-current="true"]{background:var(--omkeer);color:var(--omkeer-ink)}
  /* In een race weg: daar staat de Opslaan-balk al vastgeplakt onderaan, en
     twee vaste balken onder elkaar eten een telefoonscherm op. De pijl
     linksboven is daar de weg terug. */
  .shell.detail .nav{display:none}
  .zijvoet{display:none}

  .hoofd{flex:1;display:flex;flex-direction:column;min-width:0}
  /* Dit is een opvangpunt voor de focus na een schermwissel, geen knop. Een
     rand van twee pixels om de hele middenkolom is lawaai; waar het hier om
     gaat is waar de volgende Tab begint en wat een schermlezer voorleest. */
  .hoofd:focus{outline:none}
  .kop{display:none}
  .kolommen{flex:1;display:block;min-height:0}
  /* Ruimte onderaan voor de vaste tabbalk, zodat die niets afdekt. */
  .kol{padding:20px 16px calc(96px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:18px;min-width:0}
  .shell.detail .kol{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .kol.rechts{display:none}
  .shell.detail .kol.links{display:none}
  .shell.detail .kol.rechts{display:flex}

  /* ---- hero: eerstvolgende deadline ----------------------- */
  .hero{background:var(--paneel);border:1px solid var(--lijn);border-radius:14px;
    padding:18px;display:flex;flex-direction:column;gap:14px}
  .hero-kop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .klok{font-family:var(--cond);font-size:54px;font-weight:700;line-height:.9}
  .klok i{font-style:normal;font-size:22px;color:var(--ink2)}
  .lampjes{display:flex;gap:6px}
  .lampjes span{flex:1;height:6px;border-radius:3px;background:var(--gedempt)}
  .lampjes span.aan{background:var(--accent);animation:lampjes 1.6s infinite}
  .wachtop{font-size:11px;letter-spacing:.06em}
  /* De circuitnaam hoort het grootste op de kaart te zijn na de klok: dat is
     het antwoord op "welke race komt eraan". Stond eerst als klein labeltje
     naast "nu open", waar je hem over het hoofd zag. */
  .heronaam{font-family:var(--cond);font-size:40px;font-weight:700;line-height:.95;
    text-transform:uppercase;margin:-6px 0 -4px;overflow-wrap:anywhere}
  /* Per sessie: heb ik ingeleverd? Een vinkje en een woord, geen kadertje --
     dit is statusinformatie en geen knop. */
  .sessies{display:flex;flex-wrap:wrap;gap:6px 18px}
  .sessie{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}
  .sessie i{font-style:normal;display:flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700;flex:none}
  .sessie.klaar i{background:var(--groen-vlak);color:var(--groen)}
  .sessie.klaar{color:var(--ink)}
  .sessie.deels i{background:var(--amber-vlak);color:var(--amber)}
  .sessie.auto  i{background:var(--amber-vlak);color:var(--amber)}
  /* De enige van de vier die om aandacht vraagt, dus de enige die de volle
     tekstkleur krijgt. Stond op --ink2 en haalde 4.36 op dit vlak -- net
     onder de grens, en uitgerekend bij het teken dat je moet zien. */
  .sessie.open  i{background:var(--gedempt);color:var(--ink)}
  /* "Hoe sta ik ervoor", onderaan dezelfde kaart. Grote cijfers met een klein
     woord eronder in plaats van drie losse kadertjes: het zijn drie getallen
     over hetzelfde, dus ze horen bij elkaar in één rij te staan. */
  .kaartvoet{display:flex;gap:22px;padding-top:14px;border-top:1px solid var(--lijn)}
  .kaartvoet span{display:flex;flex-direction:column;gap:1px}
  .kaartvoet .groot{font-family:var(--cond);font-size:30px;font-weight:700;line-height:1}
  .kaartvoet i{font-style:normal;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink3)}

  /* ---- kalender ------------------------------------------- */
  .race{
    display:flex;align-items:center;gap:14px;width:100%;min-height:76px;
    padding:10px 16px;background:var(--paneel);border:1px solid var(--lijn);
    border-left:4px solid transparent;border-radius:12px;text-align:left;
    transition:transform .18s var(--soepel),border-color .18s;
  }
  .race:hover{transform:translateX(4px);border-color:var(--ink3)}
  .race.open{border-left-color:var(--groen)}
  .race.open:hover{border-left-color:var(--groen)}
  .race.komt{background:transparent;border:1px dashed var(--stippel);color:var(--ink3)}
  /* Een afgelaste race blijft staan maar hoort niet meer om aandacht te
     vragen: doorgestreept nummer, gedempt, en geen groene rand. */
  .race.afgelast{opacity:.55}
  .race.afgelast .rnd{text-decoration:line-through}
  .st.afgelast{color:var(--ink3)}
  .race .rnd{font-family:var(--cond);font-size:34px;font-weight:700;
    color:var(--ink3);min-width:44px;line-height:1}
  .race.open .rnd{color:var(--ink)}
  .rinfo{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
  .rinfo .nm{font-family:var(--cond);font-size:24px;font-weight:600;
    text-transform:uppercase;line-height:1;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .st{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  .st.klaar{color:var(--amber)} .st.open{color:var(--groen)}
  .st.wacht,.st.komt{color:var(--ink3)}
  .mk{display:flex;gap:4px;font-family:var(--mono);font-size:10px;font-weight:700;flex:none}
  .mk i{font-style:normal;width:22px;height:22px;border-radius:4px;display:grid;
    place-items:center;border:1px solid var(--lijn);color:var(--ink3)}
  .mk i.aan{background:var(--groen-vlak);border-color:var(--groen-rand);color:var(--groen)}
  .vlag{width:22px;height:22px;border-radius:3px;flex:none;
    background-image:
      linear-gradient(45deg,var(--vlag-a) 25%,transparent 25%,transparent 75%,var(--vlag-a) 75%),
      linear-gradient(45deg,var(--vlag-a) 25%,var(--paneel) 25%,var(--paneel) 75%,var(--vlag-a) 75%);
    background-size:11px 11px;background-position:0 0,5.5px 5.5px}
  .stip{width:10px;height:10px;border-radius:50%;background:var(--groen);flex:none}
  .stip.klopt{animation:pols 1.4s infinite}

  /* ---- racedetail ----------------------------------------- */
  .detailkop{display:flex;align-items:center;gap:12px}
  .terug{width:44px;height:44px;border:1px solid var(--lijn);border-radius:10px;
    font-size:20px;flex:none;transition:border-color .18s}
  .terug:hover{border-color:var(--accent)}
  .dtitel{font-family:var(--cond);font-size:28px;font-weight:700;text-transform:uppercase;
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs{display:flex;gap:6px;background:var(--paneel);border:1px solid var(--lijn);
    border-radius:12px;padding:6px}
  .tabs button{flex:1;min-height:52px;border-radius:8px;font-family:var(--cond);
    font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink2);transition:background .18s,color .18s}
  .tabs button:hover{background:var(--paneel2);color:var(--ink)}
  .tabs button[aria-selected="true"]{background:var(--omkeer);color:var(--omkeer-ink)}

  /* De jokerregel staat boven de tabbladen, want een joker geldt voor het
     hele weekend en niet voor één sessie. Ligt hij er, dan mag hij opvallen:
     dit weekend telt dubbel en dat wil je zien voordat je gaat invullen. */
  /* Twee pixels en niet één, en een rand die je ook ziet. Hij stond op
     --amber-rand (40% dekking) over één pixel, en dan is het verschil tussen
     "er ligt een joker" en "er ligt er geen" een grijstint die je moet zoeken.
     Dit is het paneel dat het hardst om aandacht mag vragen: het verdubbelt
     je weekend. */
  .jokerregel{display:flex;align-items:center;gap:12px;
    border:2px dashed var(--stippel);border-radius:12px;padding:12px 14px}
  .jokerregel.aan{border-style:solid;border-color:var(--groen-sterk);
    background:var(--groen-vlak)}

  /* De schijf met de ster. Gevuld als de joker ligt, leeg als hij nog te
     vergeven is -- dat verschil zie je van een meter afstand, en de tekst
     ernaast hoef je dan pas te lezen als je het zeker wilt weten. */
  .jokerster{flex:none;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;line-height:1;background:var(--gedempt);color:var(--ink3)}
  .jokerregel.aan .jokerster{background:var(--groen);color:var(--groen-ink)}

  /* De tekst pakt wat er naast de schijf en de knop overblijft. Zonder
     min-width:0 zou een lange zin de rij breder maken dan het paneel in
     plaats van af te breken. */
  .jokertekst{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .jokerkop{font-family:var(--cond);font-size:18px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
  .jokerregel.aan .jokerkop{color:var(--groen)}
  .jokeruitleg{font-size:14px;color:var(--ink2)}
  .jokeruitleg b{color:var(--ink);font-weight:700}
  .jokerregel.aan .jokeruitleg b{color:var(--groen)}
  .jokerregel .mono{font-size:18px;color:var(--groen)}
  /* width:auto is hier het hele punt. .knop staat op width:100% omdat een knop
     in deze app normaal de volle breedte pakt; in een flexrij mét flex:none
     betekent dat "geef mij alles en krimp niet", en dan blijft er voor de
     tekst ernaast één woord per regel over. */
  .jokerregel .knop{flex:none;width:auto;min-height:40px;padding:0 14px}
  /* Het merkteken in de kalender. Klein, naast de Q en de R, zodat je in één
     blik ziet waar je jokers liggen. */
  /* Gevuld en niet omlijnd, en dat is geen smaak. Dit merkteken staat pal
     naast de Q/R/S-vinkjes van .mk i.aan, en die zijn al groen-op-groen-vlak
     met een groene rand: "deze sessie heb je ingevuld". Een groen 2× in
     dezelfde behandeling zou daarin verdwijnen. Gevuld groen leest als iets
     anders, en het is dezelfde taal als de gevulde schijf in het paneel:
     vol = hier ligt je joker. */
  .jokervlag{font-family:var(--mono);font-size:11px;font-weight:700;
    color:var(--groen-ink);border-radius:4px;padding:0 5px;
    background:var(--groen)}

  /* De seizoenskiezer. Alleen te zien zodra een poule meer dan één seizoen
     gespeeld heeft, want daarvoor valt er niets te kiezen. */
  .seizoenbalk{display:flex;align-items:center;gap:10px}
  /* De taalknop. Klein en in de merkregel: wie hem nodig heeft zoekt hem,
     en wie hem niet nodig heeft moet er geen last van hebben. */
  .taalknop{margin-left:auto;font-family:var(--mono);font-size:12px;
    letter-spacing:.12em;color:var(--ink2);border:1px solid var(--lijn);
    border-radius:6px;padding:0 8px;min-height:32px;min-width:44px;
    transition:border-color .18s,color .18s}
  .taalknop:hover{border-color:var(--accent);color:var(--ink)}

  .seizoenbalk select{font-family:var(--mono);font-size:14px;color:var(--ink);
    background:var(--paneel);border:1px solid var(--lijn);border-radius:8px;
    padding:8px 10px;min-height:44px}

  /* De drie getallen op een gedeelde profielpagina. */
  .pgetallen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pgetal{display:flex;flex-direction:column;gap:2px;padding:12px;
    border:1px solid var(--lijn);border-radius:10px}
  .pgetal b{font-family:var(--mono);font-size:26px;line-height:1}
  .pgetal .zacht{font-size:12px}

  /* De seizoenslaag: vier vragen die je één keer per jaar invult. Hier geen
     keuzeblad zoals bij de coureurs per race -- dit is een formulier dat je
     één keer ziet, en dan is een gewone keuzelijst duidelijker en korter. */
  .seizoenslaag{display:flex;flex-direction:column;gap:8px}
  .seizoenvraag{display:grid;grid-template-columns:1fr auto;align-items:center;
    gap:6px 12px;padding:12px;border:1px solid var(--lijn);border-radius:10px}
  .seizoenvraag .nm{font-size:16px;display:flex;flex-direction:column;gap:2px;min-width:0}
  .seizoenvraag .ptn{font-family:var(--mono);font-size:16px;color:var(--ink2);
    grid-row:1;grid-column:2}
  .seizoenvraag select,.seizoenvraag input{grid-column:1/-1;width:100%;
    font-family:var(--cond);font-size:18px;color:var(--ink);background:var(--paneel);
    border:1px solid var(--lijn);border-radius:8px;padding:10px;min-height:52px}
  .seizoenvraag.klaar{grid-template-columns:1fr auto}
  .seizoenvraag .ptn.groen{color:var(--groen)}

  /* Een vraag als één regel: naam, keuze, punten. Twaalf coureurknoppen per
     vraag maakte het scherm onbruikbaar lang op een telefoon. */
  .kiesregels{display:flex;flex-direction:column;gap:6px}
  .kiesregel{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;
    min-height:52px;padding:0 14px;text-align:left;background:var(--paneel2);
    border:1px solid var(--lijn);border-left:4px solid var(--lijn);border-radius:10px;
    transition:background .18s}
  .kiesregel:hover{background:var(--paneel)}
  .kiesregel .nm{font-family:var(--cond);font-size:17px;color:var(--ink2)}
  .kiesregel.vol .nm{color:var(--ink)}
  .kiesregel .code{font-family:var(--cond);font-size:21px;font-weight:700;letter-spacing:.03em}
  .kiesregel .nogleeg{font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--accent)}
  .kiesregel .ptn{font-family:var(--mono);font-size:12px;color:var(--ink3);min-width:22px;
    text-align:right}

  .topkop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

  /* Het keuzeblad. Het legt zich over het scherm zodat je na het kiezen weer
     precies terugkomt waar je was, in plaats van ergens in een lange lijst. */
  .kiesblad{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;
    justify-content:center;background:rgba(0,0,0,.55);animation:invagen .18s both}
  .kiesblad-in{width:100%;max-width:560px;max-height:82vh;overflow-y:auto;
    display:flex;flex-direction:column;gap:12px;background:var(--bg);
    border:1px solid var(--lijn);border-radius:16px 16px 0 0;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    animation:omhoog .22s var(--soepel) both}
  .kiesblad-kop{display:flex;align-items:center;justify-content:space-between;gap:12px}
  /* Drie op een rij: klein genoeg om alle coureurs in beeld te houden. */
  .kieslijst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kiesknop{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    gap:1px;min-height:50px;padding:0 9px;background:var(--paneel2);
    border:1px solid var(--lijn);border-left:4px solid var(--lijn);border-radius:10px;
    transition:background .15s}
  .kiesknop:hover:not(:disabled){background:var(--paneel)}
  .kiesknop:disabled{opacity:.3}
  .kiesknop .code{font-family:var(--cond);font-size:19px;font-weight:700;letter-spacing:.03em}
  .kiesknop .tm{font-family:var(--mono);font-size:9px;color:var(--ink2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .kiesknop.gekozen{background:var(--accent);color:var(--accent-ink);
    border-color:var(--accent);border-left-color:var(--accent-ink)}
  .kiesknop.gekozen .tm{color:var(--accent-ink);opacity:.8}
  @keyframes omhoog{from{transform:translateY(24px)}to{transform:translateY(0)}}
  @keyframes invagen{from{opacity:0}to{opacity:1}}
  @media (min-width:960px){ .kiesblad{align-items:center}
    .kiesblad-in{border-radius:16px;padding:20px} }

  /* ---- startgrid ------------------------------------------ */
  .grid10{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .slotrij{display:flex}
  .slotrij.rechts{justify-content:flex-end}
  .slot{
    width:86%;display:flex;align-items:center;gap:12px;min-height:48px;
    padding:0 12px;border-radius:10px;border:1px solid var(--lijn);
    border-left:5px solid var(--lijn);background:var(--paneel2);
    text-align:left;transition:background .15s;
  }
  .slot:hover{background:var(--paneel)}
  .slot.vol{animation:inrij .4s both}
  .slot.leegplek{background:transparent;border:1px dashed var(--stippel);
    border-left:5px dashed var(--stippel)}
  .slot.leegplek .who{font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink3)}
  .slot .who .code{font-size:21px}
  .slot .pos{font-family:var(--mono);font-size:13px;font-weight:700;
    color:var(--ink3);min-width:32px;flex:none}
  .slot .who{flex:1;display:flex;align-items:baseline;gap:10px;min-width:0;
    color:var(--ink3);font-size:14px}
  .slot .who .code{font-family:var(--cond);font-size:24px;font-weight:700;
    letter-spacing:.04em;color:var(--ink);flex:none}
  .slot .who small{flex:1;font-size:13px;color:var(--ink2);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .x{width:34px;height:34px;border-radius:8px;background:var(--gedempt);
    color:var(--ink2);font-size:17px;line-height:1;flex:none;
    transition:background .18s,color .18s}
  .x:hover{background:var(--accent);color:var(--accent-ink)}

  .winnaarblok{display:flex;flex-direction:column;gap:8px;background:var(--paneel);
    border:1px solid var(--lijn);border-radius:14px;padding:12px 14px}
  .winnaarkop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .coureurs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .wknop.gekozen{background:var(--accent);color:var(--accent-ink);
    border-color:var(--accent);border-left-color:var(--accent-ink)}
  .wknop.gekozen:hover{background:var(--accent)}
  .wknop.gekozen .tm{color:var(--accent-ink);opacity:.8}
  .drv,.wknop{
    display:flex;align-items:center;gap:10px;min-height:60px;padding:0 12px;
    background:var(--paneel);border:1px solid var(--lijn);border-left:4px solid var(--lijn);
    border-radius:10px;text-align:left;transition:transform .18s var(--soepel),background .18s;
  }
  .drv:hover:not(:disabled),.wknop:hover{transform:translateY(-2px);background:var(--paneel2)}
  .drv:disabled{opacity:.3;cursor:default}
  .drv .code,.wknop .code{font-family:var(--cond);font-size:22px;font-weight:700}
  .drv .tm,.wknop .tm{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-left:auto}

  /* Teamgenoot-duels: per team een regel met de twee coureurs naast elkaar.
     De teamnaam staat links vast, zodat de knoppen op één lijn blijven. */
  .duels{display:flex;flex-direction:column;gap:6px}
  .duel{display:grid;grid-template-columns:52px 1fr 1fr;align-items:center;gap:6px;
    border-left:4px solid var(--lijn);padding-left:8px}
  .duel .tm{font-family:var(--mono);font-size:10px;color:var(--ink2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .duelknop{min-height:42px;justify-content:center}
  .duelknop .code{font-size:18px}
  /* Een getal of een ja/nee kiezen: kleinere vakken, hetzelfde gedrag. */
  .getallen{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .extraknop{min-height:44px;justify-content:center}
  .extraknop .code{font-size:18px}

  /* Poule aanmaken: de vier stappen, de drie voorstellen en de losse vragen. */
  .stappen{display:flex;gap:6px}
  .stap{flex:1;height:4px;border-radius:2px;background:var(--lijn);transition:background .3s}
  .stap.aan{background:var(--accent)}
  .presets{display:flex;flex-direction:column;gap:8px}
  .preset{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;
    padding:14px 16px;background:var(--paneel);border:1px solid var(--lijn);
    border-left:4px solid var(--lijn);border-radius:12px;
    transition:transform .18s var(--soepel),background .18s}
  .preset:hover{transform:translateY(-2px);background:var(--paneel2)}
  .preset.aan{border-color:var(--accent);border-left-color:var(--accent);background:var(--paneel2)}
  .preset .nm{font-family:var(--cond);font-size:22px;font-weight:700;letter-spacing:.02em}
  .preset .zacht{grid-column:1;font-size:13px}
  .preset .ptn{grid-row:1/3;align-self:center;font-family:var(--mono);font-size:20px;
    color:var(--ink2)}
  .preset.aan .ptn{color:var(--accent)}
  .vragenlijst{display:flex;flex-direction:column;gap:6px}
  .vraagregel{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;
    text-align:left;padding:12px 14px;background:var(--paneel);border:1px solid var(--lijn);
    border-radius:10px;transition:background .18s}
  .vraagregel:hover:not(:disabled){background:var(--paneel2)}
  .vraagregel:disabled{opacity:.55;cursor:default}
  .vraagregel .vink{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;
    border:1px solid var(--lijn);font-size:14px;color:var(--accent-ink)}
  .vraagregel.aan .vink{background:var(--accent);border-color:var(--accent)}
  .vraagregel .nm{font-family:var(--cond);font-size:18px}
  .vraagregel .ptn{font-family:var(--mono);font-size:14px;color:var(--ink2)}
  .binnenkort{font-family:var(--mono);font-size:9px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink3);border:1px solid var(--lijn);
    border-radius:4px;padding:1px 5px;vertical-align:2px}
  .somregel{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding-top:4px}
  .somregel .getal{font-family:var(--mono);font-size:28px}

  .opslaanbalk{position:sticky;bottom:0;display:flex;flex-direction:column;gap:8px;
    padding-top:10px;background:linear-gradient(transparent,var(--bg) 40%)}
  .opslaanbalk .knop{min-height:64px}
  /* Wis alles hoort niet even zwaar te wegen als opslaan, tot hij vraagt of
     je het zeker weet — dan mag hij wel opvallen. */
  .opslaanbalk .wisknop{min-height:48px}
  .wisknop.zeker{color:var(--accent);border-color:var(--accent)}
  #paneel{display:flex;flex-direction:column;gap:14px;min-width:0}
  .kalender{display:flex;flex-direction:column;gap:8px}

  /* ---- uitslag -------------------------------------------- */
  .score{background:var(--paneel);border:1px solid var(--lijn);border-radius:14px;
    padding:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
  .score .getal{font-family:var(--cond);font-size:64px;font-weight:700;
    line-height:.85;color:var(--groen)}
  .strip{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .sr{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;
    background:var(--paneel);border-left:4px solid var(--lijn);border-radius:8px}
  /* "Zo dichtbij": waar de punten bleven, in gewone zinnen. Bewust geen
     tabel — dit is bedoeld om voor te lezen in de groepsapp. */
  .bijna{background:var(--paneel2);border:1px solid var(--lijn);border-radius:12px;
    padding:16px;display:flex;flex-direction:column;gap:10px;flex:none}
  .bijnalijst{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px}
  .bijnalijst li{font-size:14px;line-height:1.5;color:var(--ink2)}
  .bijnalijst b{font-family:var(--cond);font-size:17px;letter-spacing:.02em;color:var(--ink)}
  .sr .pos{font-family:var(--mono);font-size:12px;color:var(--ink3);min-width:32px;flex:none}
  .sr .code{font-family:var(--cond);font-size:22px;font-weight:700;min-width:52px;flex:none}
  .sr .werd{font-family:var(--mono);font-size:11px;color:var(--ink2);flex:1;min-width:0}
  .sr .delta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;flex:none}
  .pts{font-family:var(--cond);font-size:24px;font-weight:700;min-width:26px;
    text-align:right;flex:none}
  /* Paars-groen-geel, zoals op een timingscherm: paars is raak, groen is bijna,
     geel is net niet, grijs is mis. Eerder waren "één plek ernaast" en "twee
     plekken ernaast" allebei amber; nu zijn het drie echte treden. Het getal
     blijft ernaast staan — kleur alleen is voor wie groen en geel niet uit
     elkaar houdt geen informatie. */
  .v5{color:var(--paars)} .v3{color:var(--groen)} .v1{color:var(--amber)} .v0{color:var(--ink3)}
  .rest{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;
    background:var(--paneel);border-radius:8px}
  .rest .nm{font-family:var(--cond);font-size:20px;font-weight:600;
    text-transform:uppercase;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .rest .t{font-family:var(--cond);font-size:22px;font-weight:700;color:var(--ink2)}
  .rest.winnaar{border-left:4px solid var(--accent);padding-left:12px}
  /* Sinds je op een naam kunt tikken is dit een <button>, en die erft niets:
     geen breedte, geen letter, geen tekstkleur. */
  button.rest{width:100%;border:0;color:inherit;text-align:left;cursor:pointer;
    font:inherit;transition:background .12s}
  button.rest:hover{background:var(--gedempt)}
  .rest.inkijk .zacht{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink3);flex:none}
  .rest.inkijk .t{min-width:26px;text-align:right}
  /* De kop van het inkijkscherm: dezelfde vorm als een rest-regel, met de
     terugknop erin, zodat je meteen ziet dat je bij iemand anders kijkt. */
  .inkijkkop{display:flex;align-items:center;gap:12px}
  /* .knop is standaard width:100%; zonder deze override eist de terugknop
     de hele breedte van de rij op en verdwijnen naam en score uit beeld. */
  .inkijkkop .knop{flex:none;width:auto;min-height:44px;padding:0 14px}
  .inkijkkop .nm{font-family:var(--cond);font-size:22px;font-weight:700;
    text-transform:uppercase;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .inkijkkop .t{font-family:var(--cond);font-size:26px;font-weight:700;flex:none}
  .duel{padding-left:12px;border-left:4px solid var(--lijn)}
  .duel.voor{border-left-color:var(--groen)}
  .duel.gelijkop{border-left-color:var(--ink3)}
  .gelijkop-tel{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink3);flex:none}
  .duelscore{font-family:var(--cond);font-size:24px;font-weight:700;flex:none;
    display:flex;align-items:baseline;gap:5px}
  .duelscore .streep{font-style:normal;font-size:15px;color:var(--ink3)}
  .duel.voor .mijn{color:var(--groen)}
  .duel.voor .hun{color:var(--ink2)}
  .duel.achter .mijn{color:var(--ink2)}
  .rest.winnaar .t{color:var(--ink)}
  .tekstblok{min-height:0;padding:12px 14px;font-family:var(--mono);font-size:12px;
    line-height:1.5;resize:vertical;white-space:pre}

  /* ---- stand ---------------------------------------------- */
  .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
  .trede{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0}
  .trede .nm{font-family:var(--cond);font-size:24px;font-weight:700;
    text-transform:uppercase;max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .trede.eerste .nm{font-size:30px}
  .trede .balk{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:center;
    font-family:var(--cond);font-size:28px;font-weight:700;
    background:var(--paneel2);color:var(--ink2)}
  .trede.eerste .balk{background:var(--accent);color:var(--accent-ink);font-size:40px}
  .strij{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 16px;
    background:var(--paneel);border:1px solid var(--lijn);
    border-left:4px solid transparent;border-radius:10px}
  .strij.zelf{border-left-color:var(--accent)}
  .strij .p{font-family:var(--cond);font-size:30px;font-weight:700;
    color:var(--ink3);min-width:34px}
  .strij.zelf .p{color:var(--ink)}
  .strij .nm{font-family:var(--cond);font-size:24px;font-weight:600;
    text-transform:uppercase;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .jij{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:none;color:var(--accent)}
  .strij .voor{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  /* Gestegen of gezakt sinds de vorige race. Groen en rood zijn hier
     onvermijdelijk, maar de pijl draagt de betekenis net zo goed als de
     kleur -- ook wie het verschil niet ziet leest ↑2. */
  .wissel{font-family:var(--mono);font-size:11px;font-weight:700;flex:none}
  .wissel.omhoog{color:var(--groen)}
  .wissel.omlaag{color:var(--ink3)}
  /* De reeks: hoeveel weekenden op rij je hebt ingeleverd. Klein en naast de
     naam, want het is een schouderklopje en geen score. */
  .reeks{font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    text-transform:none;color:var(--amber);border:1px solid var(--amber-rand);
    border-radius:20px;padding:1px 6px;vertical-align:middle}
  .strij .t{font-family:var(--cond);font-size:28px;font-weight:700}
  /* De seizoenslijn. Vaste hoogte en een viewBox die meerekt: de lijn hoeft
     niet op de pixel te kloppen, hij moet de vórm laten zien. */
  .grafiek{display:flex;flex-direction:column;gap:12px}
  .grafiek svg{width:100%;height:96px;display:block;overflow:visible}
  .grafiekvoet{display:flex;gap:20px;flex-wrap:wrap}
  .grafiekvoet span{display:flex;flex-direction:column;gap:1px}
  .grafiekvoet b{font-family:var(--cond);font-size:22px;font-weight:700;line-height:1}
  .grafiekvoet i{font-style:normal;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink3)}
  .uitleg{background:var(--paneel);border:1px solid var(--lijn);border-radius:12px;
    padding:14px;color:var(--ink2);font-size:14px}
  .uitleg b{color:var(--ink)}

  /* ---- alleen voor schermlezers ---------------------------- */
  /* Niet display:none en niet visibility:hidden -- allebei halen het uit de
     voorleesvolgorde, en dan valt er niets meer om te roepen. */
  .alleenlezer{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;
    border:0}

  /* ---- rode vlag ------------------------------------------ */
  .rodevlag{display:flex;flex-direction:column;gap:14px;background:var(--paneel);
    border:1px solid var(--lijn);border-radius:14px;padding:20px}
  .rodevlag .label{color:var(--accent)}

  /* ---- vangnet onder het tekenen --------------------------- */
  /* De technische reden is er om door te geven, niet om te lezen: mono en
     gedempt, zodat hij duidelijk niet tot het advies erboven hoort. */
  .foutregel{margin:0;padding:10px 12px;border-radius:10px;background:var(--paneel2);
    border:1px solid var(--lijn);color:var(--ink2);font-family:var(--mono);
    font-size:12px;line-height:1.5;word-break:break-word}
  .knoptekst{background:none;border:0;padding:0;font:inherit;color:var(--accent);
    text-decoration:underline;cursor:pointer;text-align:left}
  .knoptekst:hover{color:var(--ink)}
  .stillefout{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;
    display:flex;gap:12px;align-items:center;justify-content:space-between;
    background:var(--paneel);border:1px solid var(--accent);border-radius:12px;
    padding:12px 14px;color:var(--ink2);font-size:13px;
    box-shadow:0 8px 28px rgba(0,0,0,.35)}
  .stillefout button{background:none;border:0;padding:0;font:inherit;flex:none;
    color:var(--accent);text-decoration:underline;cursor:pointer}
  @media (min-width:960px){
    .stillefout{left:auto;right:20px;bottom:20px;max-width:420px}
  }

  /* ---- iPad en desktop ------------------------------------ */
  @media (min-width:960px){
    .shell{flex-direction:row}
    .zijbalk{
      position:static;width:248px;flex:none;border-bottom:0;
      border-right:1px solid var(--lijn);padding:22px 16px;gap:26px;
      height:100vh;position:sticky;top:0;
    }
    .zijbalk .merknaam{display:block}
    .zijbalk .merkpoule{display:none}
    /* Breed genoeg voor een zijbalk: dan hoort de navigatie daar gewoon in
       mee te lopen, niet als vaste balk over de inhoud heen. */
    .nav{position:static;flex-direction:column;background:transparent;
      border:0;border-top:0;padding:0;gap:6px}
    .shell.detail .nav{display:flex}
    .navknop{min-height:56px;padding:0 14px;text-align:left;justify-content:flex-start;
      font-size:21px;font-weight:600;border-left:4px solid transparent;border-radius:10px}
    .navknop[aria-current="true"]{background:var(--paneel2);color:var(--ink);
      border-left-color:var(--accent)}
    .zijvoet{margin-top:auto;display:flex;flex-direction:column;gap:14px}
    .zijspeler{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px;
      background:var(--paneel2);border-radius:10px}
    .zijspeler .nm{font-family:var(--cond);font-size:20px;font-weight:600;
      text-transform:uppercase;flex:1;min-width:0;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
    .zijspeler .t{font-family:var(--mono);font-size:11px;color:var(--ink2)}
    .zijcode{display:flex;flex-direction:column;gap:6px}
    .zijcode .waarde{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.22em}

    .hoofd{height:100vh;overflow:hidden}
    .kop{display:flex;align-items:center;gap:18px;padding:20px 28px;
      border-bottom:1px solid var(--lijn);flex:none}
    .kop .ptitel{font-family:var(--cond);font-size:34px;font-weight:700;
      text-transform:uppercase;line-height:1;min-width:0;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
    .kop .meta{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
      color:var(--ink3);flex:none}
    .pil{margin-left:auto;display:flex;align-items:center;gap:10px;padding:10px 14px;
      background:var(--paneel);border:1px solid var(--lijn);border-radius:10px;flex:none}
    .pil .mono{color:var(--groen)}
    .kop .knop{width:auto;min-height:52px;font-size:19px;flex:none}
    .kop .meta{display:none}
    .meldingbalk{padding:18px 28px 0}
    .tabs button{font-size:17px;padding:0 8px;min-width:0}
    .kolommen{display:grid;grid-template-columns:1.1fr .9fr;overflow:hidden}
    .kolommen.enkel{grid-template-columns:1fr}
    .kol{padding:24px 28px 40px;overflow-y:auto}
    .kol.links{border-right:1px solid var(--lijn)}
    .kol.rechts{display:flex}
    .shell.detail .kol.links{display:flex}
    .kolommen.enkel .kol.rechts{display:none}
    .kolommen.enkel .kol.links{border-right:0;max-width:760px;width:100%;margin:0 auto}
    .terug,.smalkop{display:none}
    .coureurs{grid-template-columns:1fr 1fr 1fr}
    .drv .tm,.wknop .tm{display:none}
    .opslaanbalk{background:linear-gradient(transparent,var(--bg) 40%)}
  }
  @media (min-width:1280px){
    .zijbalk{width:264px;padding:24px 18px}
    .kop{padding:24px 32px}
    .kop .meta{display:block}
    .meldingbalk{padding:20px 32px 0}
    .kop .ptitel{font-size:38px}
    .tabs button{font-size:19px}
    .kol{padding:26px 32px 40px}
    .coureurs{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div id="app"></div>
<!-- De omroep voor schermlezers. Staat met opzet buiten #app: de app vervangt
     app.innerHTML bij elke tik in zijn geheel, en een live region die op
     hetzelfde moment ontstaat als zijn inhoud wordt niet voorgelezen -- hij
     moet er al staan en daarna pas veranderen. Vandaar hier, één keer, voor
     de hele looptijd van de pagina. -->
<div id="omroep" class="alleenlezer" aria-live="polite" aria-atomic="true"></div>

<script type="module">
// ============================================================
//  Instellingen
// ============================================================
const SUPABASE_URL = 'https://etifamdwqxjfaeaordlr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0aWZhbWR3cXhqZmFlYW9yZGxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzMzNTUsImV4cCI6MjEwMzE0OTM1NX0.dI0HMZsO0JcmhF9ibD81ivVl96UCYInoUz94r8cAqio';
// Het seizoen waar een verse poule in valt, en waar de demomodus op draait.
// Voor een bestáánde poule telt niet dit getal maar `pools.season`: die poule
// hoort bij het seizoen waarin hij is aangemaakt, en hoort dus ook in 2027 nog
// de races van 2026 te laten zien. Zie seizoen() hieronder.
//
// poule_aanmaken() in schema.sql leidt het seizoen zelf af uit de kalender
// (`max(races.season)`), dus een nieuwe poule pakt automatisch het juiste jaar
// zonder dat hier iets bijgewerkt hoeft te worden.
const SEIZOEN = 2026;

// Twee seizoenen, en ze zijn niet hetzelfde.
//
// pouleSeizoen() is het seizoen dat deze poule nu speelt. Dat staat in de
// database en de poulebaas schuift het door zodra het volgende begint.
// Stond hier hardgecodeerd op 2026, en dat had op 1 januari 2027 betekend dat
// iedereen een lege kalender zag tot iemand dit bestand aanpaste.
//
// seizoen() is het seizoen waar je nú naar kijkt. Meestal hetzelfde, maar wie
// terugbladert naar vorig jaar krijgt daar een andere kalender, een andere
// stand en een andere grafiek — zonder dat er iets aan de poule verandert.
const pouleSeizoen = () => S.poule?.season ?? SEIZOEN;
const seizoen = () => S.seizoen ?? pouleSeizoen();

// De publieke helft van het VAPID-sleutelpaar, voor de deadlineherinneringen.
// Leeg laten mag: dan biedt de app het gewoon niet aan en verandert er verder
// niets. De privé-helft hoort NOOIT hier maar als repository-secret in GitHub
// (VAPID_PRIVE), want daarmee kan iemand meldingen namens deze app sturen.
// Een paar maken: `node scripts/push-sleutels.mjs`. Zie BEDIENING.md §11c.
const VAPID_PUBLIEK = '';

// Waar iemand terecht kan met een vraag over zijn gegevens. Leeg laten mag —
// dan staat die regel er gewoon niet — maar een privacyverklaring zonder
// contactadres is niet af. Vul hier een adres in dat je publiek wilt hebben;
// deze pagina is voor iedereen te lezen. Zie BEDIENING.md §12.
const PRIVACY_CONTACT = '';

const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY;

// Kan dit een poulecode zijn? Dat is geen cosmetische vraag: Supabase stuurt je
// na een inloglink terug met `?code=<sleutel>` in de adresbalk, en dat is
// precies de parameter waar deze app zijn poulecode in zet. Zonder onderscheid
// zou de app na het inloggen roepen dat "die poulecode niet bestaat".
//
// De grens ligt ruim, want een verminkte uitnodigingslink hoort nog steeds een
// nette melding te krijgen ("de code BESTAATNIET bestaat niet") in plaats van
// stilzwijgend genegeerd te worden. Een sleutel van Supabase is een uuid: 36
// tekens mét streepjes, en valt dus aan beide kanten af.
//
// Dit is trouwens de tweede grendel. De eerste is de volgorde bij de start:
// supabase-js heeft zijn sleutel al uit de adresbalk gehaald voordat
// codeUitLink() ernaar kijkt. Twee grendels, omdat een mislukte inwisseling
// (een verlopen link) de eerste kan overslaan.
const ZIET_ERUIT_ALS_POULECODE = (code) => /^[A-Z0-9]{1,12}$/.test(String(code ?? ''));

// Komen we net terug van een inloglink uit de mail? Dat moet híér vastgesteld
// worden: supabase-js ruimt de adresbalk op zodra hij de sleutel gebruikt
// heeft, en dat gebeurt al tijdens de import hieronder.
//
// Waarom het uitmaakt: normaal wint wat dit toestel onthouden heeft van wat
// je account zegt. Maar wie zojuist bewust heeft ingelogd bedoelt het
// omgekeerde — zie herkenMij().
const VAN_INLOGLINK = (() => {
  try {
    const zoek = new URLSearchParams(location.search);
    const hash = new URLSearchParams(String(location.hash).replace(/^#/, ''));
    if (hash.has('access_token')) return true;
    const code = zoek.get('code');
    return !!code && !ZIET_ERUIT_ALS_POULECODE(code.trim().toUpperCase());
  } catch { return false; }
})();

// Komen we terug van Google of een maillink, maar dan mét een foutmelding in
// plaats van een geldige sleutel? Dat gebeurt bijvoorbeeld als dit
// Google-account al aan een andere speler hangt: Supabase stuurt dan geen
// `code` of `access_token` terug, maar `error`/`error_description` in de
// adresbalk (als query- of als hash-parameter, vandaar dat hier allebei
// gecontroleerd worden, net als bij VAN_INLOGLINK hierboven).
//
// Zonder deze controle merkt niemand daar iets van: VAN_INLOGLINK is dan
// gewoon false, en de app laat een leeg beginscherm zien alsof je nooit op
// de knop geklikt hebt. uitlegAuth() verderop in dit bestand kent dit soort
// fouten al goed genoeg om ze uit te leggen ("Dat Google-account hoort al
// bij een speler...") — hij werd tot nu toe alleen nooit aangeroepen voor een
// fout die pas ná de omweg via Google terugkomt, in plaats van in de
// foutmelding van de aanroep zelf.
const OAUTH_FOUT_UIT_LINK = (() => {
  try {
    const zoek = new URLSearchParams(location.search);
    const hash = new URLSearchParams(String(location.hash).replace(/^#/, ''));
    const code = hash.get('error_code') || zoek.get('error_code')
      || hash.get('error') || zoek.get('error');
    if (!code) return null;
    return { code, message: hash.get('error_description') || zoek.get('error_description') || '' };
  } catch { return null; }
})();

let db = null;
// Waarom hier een try omheen staat: dit is een `await import` op het hoogste
// niveau van de module. Mislukt hij, dan stopt het hele script — en dan blijft
// er letterlijk een leeg vlak staan, want alles wat een scherm tekent staat
// hieronder. Zonder verbinding ziet de app er dan uit alsof hij stuk is in
// plaats van alsof je geen bereik hebt. Dat is precies het verschil dat een
// mens wél maakt en een blanco pagina niet.
//
// Met de `catch` loopt de rest van het bestand gewoon door (functies zijn
// gehesen), zodat geenVerbinding() hieronder nog bestaat om te tekenen.
let laadfout = null;
if (!DEMO) {
  try {
    const { createClient } = await import(
      'https://esm.sh/@supabase/supabase-js@2'
    );
    db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    laadfout = e;
  }
}

// ============================================================
//  Een account, zonder inlogscherm
//
//  Elke speler krijgt een anoniem account bij Supabase. Je merkt er niets
//  van — geen wachtwoord, geen mail, geen scherm — maar de database krijgt
//  er iets mee om op te controleren: straks mag alleen jouw account bij
//  jouw voorspellingen. Zonder dat is de anon key uit deze broncode genoeg
//  om andermans inzending te overschrijven.
//
//  Twee keuzes die de moeite waard zijn om te weten:
//
//  1. Het account wordt pas aangemaakt op het moment dat er echt iets aan
//     jou gehangen moet worden. Wie alleen rondkijkt krijgt niets. Anders
//     stond er straks een account in de database voor elke bot die de
//     pagina opvraagt.
//  2. Alles hieronder is vergevingsgezind. Staat anoniem inloggen uit in
//     het Supabase-project, of gaat het even mis, dan blijft de app werken
//     zoals hij deed. Zolang de policies nog openstaan kost dat niets, en
//     een speler die niet meer kan opslaan omdat een aanmeldpoging faalde
//     zou veel erger zijn. Zie OVERDRACHT.md.
// ============================================================

// Het account dat nu aan de knoppen zit, of null zolang er geen is.
let mijnUid = null;
// En het account zelf, want daar hangt het mailadres aan.
let mijnAccount = null;

const zetAccount = (user) => {
  mijnAccount = user ?? null;
  mijnUid = user?.id ?? null;
  return mijnUid;
};

// De sessie die al op dit toestel stond. Kost geen netwerkverkeer:
// supabase-js bewaart hem zelf in localStorage.
async function bestaandeSessie() {
  if (DEMO || !db) return null;
  try {
    const { data } = await db.auth.getSession();
    return zetAccount(data?.session?.user);
  } catch { return zetAccount(null); }
}

// Nu is er wel een account nodig. Eén keer per toestel; daarna staat de
// sessie in localStorage en komt hij via bestaandeSessie() terug.
async function zorgVoorAccount() {
  if (DEMO || !db || mijnUid) return mijnUid;
  try {
    const { data, error } = await db.auth.signInAnonymously();
    if (error) return null;
    return zetAccount(data?.user);
  } catch { return null; }
}

// ---- een mailadres eraan hangen -----------------------------
// Dit is het enige stukje login dat de speler bewust doet, en het is
// nadrukkelijk optioneel. Zonder mailadres speel je gewoon door; je account
// blijft dan op dit ene toestel staan.
//
// Het mailadres staat pas in `email` als er op de bevestigingslink geklikt
// is. Tot dat moment houdt Supabase het in `new_email`, en dat verschil is
// precies wat het scherm moet laten zien: "gestuurd" is niet "gekoppeld".
const mijnMail        = () => mijnAccount?.email ?? null;
const mijnWachtendeMail = () => mijnAccount?.new_email ?? null;

// Hangt er een Google-account aan? Supabase zet elke gekoppelde manier van
// inloggen in `identities`; `anonymous` staat daar ook tussen en telt hier
// dus niet mee.
const mijnGoogle = () =>
  (mijnAccount?.identities ?? []).find(i => i.provider === 'google') ?? null;
const googleMail = () => mijnGoogle()?.identity_data?.email ?? mijnMail() ?? null;
// Is er hoe dan ook iets waarmee je terugkomt op een ander toestel?
const kanTerugkomen = () => !!(mijnGoogle() || mijnMail());

// Waar de link uit de mail op terugkomt. Bewust zonder poulecode erachter:
// Supabase plakt zijn eigen `?code=` aan deze url, en twee keer dezelfde
// parameter betekent dat de verkeerde gelezen wordt. De poule komt daarna uit
// dit toestel of uit poulesVanAccount().
const inlogTerugLink = () => linkBasis();

// ---- met Google ---------------------------------------------
// Waarom dit erbij is gekomen: een maillink werkt, maar "open je mail, zoek
// het bericht, klik de link" is drie handelingen waar er één had gekund. En
// het scheelt een eigen mailserver, wat voor een poule-app een scheve
// verhouding is.
//
// Wat het níét is: een inlogscherm bij de voordeur. Je komt nog steeds binnen
// met alleen een poulecode. Dit staat op precies dezelfde plek als de
// mailkoppeling — bij "je account meenemen" — en is even optioneel.
//
// `linkIdentity` hangt Google aan het anonieme account dat je al hebt, zodat
// je spelers en punten meegaan. Dat is iets anders dan `signInWithOAuth`,
// wat je op een leeg toestel gebruikt: daar is nog geen account om aan te
// hangen. Let op: linkIdentity vereist dat "Manual linking" aanstaat in het
// Supabase-dashboard.
async function koppelGoogle() {
  const uid = await zorgVoorAccount();
  if (!uid) return { fout: T('Er is nog geen account om Google aan te hangen.') };
  try {
    const { error } = await db.auth.linkIdentity({
      provider: 'google', options: { redirectTo: inlogTerugLink() } });
    return { fout: error ? uitlegAuth(error) : '' };
  } catch (e) { return { fout: uitlegAuth(e) }; }
}

// Op een toestel waar je account nog niet staat. De browser gaat naar Google
// en komt terug met `?code=`; dat handelt supabase-js zelf af, en de app
// herkent het aan VAN_INLOGLINK.
async function inloggenMetGoogle() {
  if (DEMO || !db) return { fout: T('Inloggen kan niet in demomodus.') };
  try {
    const { error } = await db.auth.signInWithOAuth({
      provider: 'google', options: { redirectTo: inlogTerugLink() } });
    return { fout: error ? uitlegAuth(error) : '' };
  } catch (e) { return { fout: uitlegAuth(e) }; }
}

async function koppelMail(mail) {
  const uid = await zorgVoorAccount();
  if (!uid) return { fout: T('Er is nog geen account om een mailadres aan te hangen.') };
  try {
    const { data, error } = await db.auth.updateUser(
      { email: mail }, { emailRedirectTo: inlogTerugLink() });
    if (error) return { fout: uitlegAuth(error) };
    if (data?.user) zetAccount(data.user);
    return { fout: '' };
  } catch (e) { return { fout: uitlegAuth(e) }; }
}

// Inloggen op een toestel waar je account nog niet staat.
//
// `shouldCreateUser: false` is hier belangrijk. Standaard maakt Supabase een
// nieuw account aan bij een onbekend adres, en dan levert één typfout je een
// leeg account op waarin al je voorspellingen verdwenen lijken. Beter een
// melding dat dat adres nog nergens bij hoort.
async function stuurInlogLink(mail) {
  if (DEMO || !db) return { fout: T('Inloggen kan niet in demomodus.') };
  try {
    const { error } = await db.auth.signInWithOtp({
      email: mail,
      options: { shouldCreateUser: false, emailRedirectTo: inlogTerugLink() },
    });
    return { fout: error ? uitlegAuth(error) : '' };
  } catch (e) { return { fout: uitlegAuth(e) }; }
}

// Welke poules horen bij dit account? Na het inloggen op een nieuw toestel is
// dit het enige wat je poules terugvindt — localStorage is daar leeg, en de
// poulecode opnieuw moeten opvragen is precies de drempel die we weghalen.
async function poulesVanAccount() {
  if (DEMO || !db || !mijnUid) return [];
  try {
    const { data } = await db.from('pool_members').select('pool_id').eq('user_id', mijnUid);
    const ids = [...new Set((data ?? []).map(r => r.pool_id))].filter(Boolean);
    if (!ids.length) return [];
    const { data: poules } = await db.from('pools').select('*').in('id', ids);
    return poules ?? [];
  } catch { return []; }
}

// De meldingen van Supabase zijn Engels en technisch. Deze drie komen in de
// praktijk voor en verdienen een antwoord waar iemand iets mee kan.
function uitlegAuth(error) {
  const code = String(error?.code ?? '');
  const bericht = String(error?.message ?? '');
  if (code === 'email_exists' || /already (been )?registered|already exists/i.test(bericht)) {
    return T('Dat mailadres hoort al bij een account. Kies op het beginscherm '
         + '"Inloggen met je mailadres" om dat account hier te openen.');
  }
  if (code === 'otp_disabled' || /signups not allowed/i.test(bericht)) {
    return T('Bij dat mailadres hoort nog geen account. Koppel het eerst onder '
         + 'Poule, op het toestel waar je al meespeelt.');
  }
  if (/rate.?limit|only request this after|too many/i.test(bericht) || /rate_limit/.test(code)) {
    return T('Er is net al een mail verstuurd. Wacht een minuutje en probeer het opnieuw.');
  }
  // Let op de volgorde: 'provider is not enabled' komt óók als
  // validation_failed binnen, dus die controle moet hiervóór staan.
  if (/provider is not enabled|manual linking is disabled/i.test(bericht)) {
    return T('Inloggen met Google is nog niet aangezet voor deze app. '
         + 'Gebruik je mailadres, of laat het de beheerder weten.');
  }
  if (code === 'validation_failed' || /invalid.*email|email.*invalid/i.test(bericht)) {
    return T('Dat lijkt geen geldig mailadres.');
  }
  // Deze Google-account hangt al aan iemand anders.
  if (code === 'identity_already_exists' || /identity is already linked/i.test(bericht)) {
    return T('Dat Google-account hoort al bij een speler. Kies op het beginscherm '
         + '"Inloggen met Google" om dat account hier te openen.');
  }
  return bericht || T('Er ging iets mis.');
}

// Deze speler hoort bij mijn account.
//
// `is('user_id', null)` is de kern: je kunt alleen een speler claimen die
// nog van niemand is, nooit iemand overnemen. Raakt de update niets, dan is
// dat geen fout maar een antwoord — de speler was al geclaimd, of dit
// account heeft in deze poule al een andere speler. Dat laatste mag niet:
// twee keer in dezelfde stand staan met je punten verdeeld is precies wat
// de unieke sleutel in schema.sql tegenhoudt.
async function claimSpeler(memberId) {
  if (DEMO || !db || !memberId) return false;
  const uid = await zorgVoorAccount();
  if (!uid) return false;
  try {
    // Via de functie en niet met een losse update: op het moment dat je
    // jezelf claimt ben je nog geen lid, dus de leespolicy verbergt precies
    // de rij die je wilt bijwerken en zou de update nul rijen raken -- zonder
    // foutmelding. Zie poule_claim_speler() in schema.sql.
    const { data, error } = await db.rpc('poule_claim_speler', { p_member: memberId });
    if (error || !data) return false;
    const lid = S.leden.find(l => zelfde(l.member_id, memberId));
    if (lid) lid.user_id = uid;
    return true;
  } catch { return false; }
}

// Herkent de botsing met de gedeeltelijke unieke sleutel uit schema.sql:
// (pool_id, user_id). Postgres geeft daar 23505 op, net als bij een dubbele
// voorspelling, dus de naam van de sleutel is het enige verschil.
const alBezetDoorAccount = (error) =>
  error?.code === '23505'
  && /pool_members_pool_user_uniek/.test(`${error.message ?? ''} ${error.details ?? ''}`);

// Een speler aanmaken, met dit account eraan als dat kan.
//
// Dat kan niet altijd. Op een gedeeld toestel — één telefoon die rondgaat
// bij het inschrijven — speelt dit account misschien al mee in deze poule,
// en twee spelers op één account in één poule houdt schema.sql tegen. Dan
// maken we de speler zonder account aan. Hij doet verder gewoon mee; hij
// hangt alleen nog aan niemand, tot degene van wie hij is hem op zijn eigen
// toestel opent. Dat is veel beter dan iemand niet laten meedoen omdat de
// telefoon van een ander was.
async function maakSpeler(poolId, naam) {
  await zorgVoorAccount();
  // Via de functie: een insert met `.select()` erachter kan niet meer, want
  // `returning` heeft leesrecht nodig en op dit moment ben je nog geen lid.
  // De botsing hierboven zit nu in poule_meedoen() zelf -- het is een regel
  // van de database, niet van het scherm.
  return db.rpc('poule_meedoen', { p_pool: poolId, p_naam: naam });
}

// Speel ik als iemand die aan een ánder account hangt? Dan neemt de database
// mijn wijzigingen niet meer aan. Dat kan legitiem zijn — dezelfde persoon op
// een tweede toestel dat nog niet ingelogd is — maar het moet wel uitgelegd
// worden, want RLS zwijgt erover.
function nietVanMij() {
  if (DEMO || !S.ik) return false;
  const lid = S.leden.find(l => zelfde(l.member_id, S.ik.id));
  return !!lid?.user_id && !zelfde(lid.user_id, mijnUid);
}

// Welke speler in deze poule hoort bij mijn account? Hiermee herkent de app
// je op een toestel dat nog nooit van je gehoord heeft — nu alleen nog als
// je die sessie zelf meeneemt, straks ook via een mailadres.
const lidVanAccount = () =>
  mijnUid ? S.leden.find(l => l.user_id && zelfde(l.user_id, mijnUid)) : null;

// ============================================================
//  Wie ben ik, en in welke poule?
//  Los van het account hierboven: de browser onthoudt welke poule je
//  gebruikte en wie je daarin bent. Dat is geen beveiliging, maar gemak —
//  kom je terug op hetzelfde toestel, dan hoef je de poulecode niet
//  opnieuw te typen. Het account is wat de database straks controleert;
//  dit is wat de app sneller maakt.
// ============================================================

// localStorage kan geblokkeerd zijn: privémodus, of een browser die opslag
// per site dichtzet. De app moet dan blijven werken, maar wel eerlijk zijn
// over wat er niet onthouden wordt.
const opslagWerkt = (() => {
  try {
    localStorage.setItem('poule:test', '1');
    localStorage.removeItem('poule:test');
    return true;
  } catch { return false; }
})();
const lees    = (k)    => { try { return localStorage.getItem(k); } catch { return null; } };
const schrijf = (k, v) => { try { localStorage.setItem(k, v); } catch { /* niets te doen */ } };
const wis     = (k)    => { try { localStorage.removeItem(k); } catch { /* niets te doen */ } };
