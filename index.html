// ---- beheer: welke vragen doen mee --------------------------
// BEDIENING.md §5 t/m §8. Zonder login kan de database niet controleren wie
// de poulebaas is; owner_member_id houdt deze knoppen weg bij wie ze niet
// nodig heeft, meer niet. Zie §7.

// Poules van vóór het aanmaakscherm hebben geen eigenaar. Die op slot doen
// zou niemand meer bij de vragenset laten; dan maar iedereen.
const magBeheren = () =>
  !S.poule.owner_member_id || zelfde(S.poule.owner_member_id, S.ik.id);

// Geen rijen in pool_questions betekent "doet aan alles mee". In het
// beheerscherm staan dan ook alle vinkjes aan: dat is wat er nu geldt.
const pouleVragen = () =>
  S.poulevragen.length ? [...S.poulevragen] : S.vragen.map(v => v.id);

// Sinds wanneer ligt de set vast? De eerste race met een uitslag, want dat
// is het moment waarop de sync hem op slot heeft gezet.
const eersteGescoord = () =>
  S.races.find(r => r.quali_result?.length || r.race_result?.length);

function beheerBlok() {
  if (!magBeheren() || !S.vragen.length) return '';
  const opSlot = !!S.poule.questions_locked;
  const gekozen = S.beheer ?? pouleVragen();
  const race = eersteGescoord();
  return `
    <div class="scheiding"></div>
    <span class="label">welke vragen doen mee</span>
    ${opSlot ? `<p class="zacht" style="margin:0">De vragenset ligt vast${
      race ? ` sinds ${esc(race.name)}` : ''}. Zo blijven alle races vergelijkbaar.</p>` : ''}
    ${!S.poule.owner_member_id ? `<p class="zacht" style="margin:0">Deze poule heeft geen
      poulebaas — hij is aangemaakt voordat dat bestond. Iedereen kan hem dus aanpassen.</p>` : ''}
    <div class="vragenlijst">${vragenLijst(gekozen, { uit: opSlot })}</div>
    ${opSlot ? '' : `${vragenVoet(gekozen)}
      <div style="display:flex;gap:8px">
        <button class="knop klein" id="vragenBewaren" ${gekozen.length ? '' : 'disabled'}>Opslaan</button>
        ${S.beheer ? `<button class="knop klein" id="vragenTerug">Ongedaan maken</button>` : ''}
      </div>`}
    <p class="err" id="vragenfout">${esc(S.beheerFout)}</p>`;
}

function knoopBeheer() {
  app.querySelectorAll('[data-vraag-aan]').forEach(b => b.onclick = () => {
    const id = b.dataset.vraagAan;
    const nu = S.beheer ?? pouleVragen();
    S.beheer = nu.includes(id) ? nu.filter(x => x !== id) : [...nu, id];
    S.beheerFout = '';
    render();
  });
  const terug = app.querySelector('#vragenTerug');
  if (terug) terug.onclick = () => { S.beheer = null; S.beheerFout = ''; render(); };

  const bewaren = app.querySelector('#vragenBewaren');
  if (bewaren) bewaren.onclick = async () => {
    if (!S.beheer) { S.melding = 'Er was niets veranderd.'; render(); return; }
    bewaren.disabled = true;
    bewaren.textContent = 'Bezig...';
    try {
      await vragenBewaren(S.beheer);
      S.beheer = null; S.beheerFout = '';
      S.melding = 'De vragenset is bijgewerkt.';
      await laad();
    } catch (e) { S.beheerFout = e.message; }
    render();
  };
}

// Alleen het verschil wegschrijven. Alles weggooien en opnieuw invoeren zou
// tussendoor een poule opleveren die even aan alles meedoet.
async function vragenBewaren(gekozen) {
  const nu = S.poulevragen;
  const erbij = gekozen.filter(id => !nu.includes(id));
  const eraf  = nu.filter(id => !gekozen.includes(id));
  if (DEMO) { S.poulevragen = [...gekozen]; return; }
  if (erbij.length) {
    const { error } = await db.from('pool_questions')
      .insert(erbij.map(id => ({ pool_id: S.poule.id, question_id: id })));
    if (error) throw new Error(uitleg(error));
  }
  for (const id of eraf) {
    const { error } = await db.from('pool_questions').delete()
      .eq('pool_id', S.poule.id).eq('question_id', id);
    if (error) throw new Error(uitleg(error));
  }
}

// ---- racedetail ---------------------------------------------

function openRace(id) {
  const r = S.races.find(x => zelfde(x.id, id));
  if (!r) { toonFout('Deze race staat niet meer in de lijst.'); return; }
  S.race = r;
  S.weergave = 'races';
  const mijn = vindPred(id, S.ik.id);
  S.keuze = { quali:[...(mijn?.quali_top10 ?? [])], race:[...(mijn?.race_top10 ?? [])],
              winnaar: mijn?.race_winnaar ?? '', pole: mijn?.pole ?? '',
              duels: [...(mijn?.teamgenoot_duels ?? [])],
              snelste_ronde: mijn?.snelste_ronde ?? '',
              snelste_pitstop: mijn?.snelste_pitstop ?? '' };
  S.tab = openLijst(r) === 'race' ? 'race' : 'quali';
  S.uitslag = { welk: null, lijst: [] };
  S.losse = { vraag: null, keuze: '', fout: '' };
  S.fout = '';
  render();
}

function raceDetailKop() {
  const r = S.race;
  // De teller hoort bij het tabblad dat je open hebt. Anders staat er een
  // groene tijd naast een kwalificatie die allang gereden is.
  const iso = S.tab === 'quali' ? r.deadline_quali : r.deadline_race;
  const nogOpen = Date.now() < new Date(iso).getTime();
  return `
    <div class="detailkop">
      <button class="terug" id="terug" aria-label="Terug naar het overzicht">←</button>
      <span class="dtitel">${esc(r.name)}</span>
      ${nogOpen
        ? `<span class="mono groen" data-tot="${esc(iso)}" data-kort="1">${klokTekst(iso, true)}</span>`
        : `<span class="vlag"></span>`}
    </div>
    <div class="tabs">
      <button data-tab="quali" aria-selected="${S.tab === 'quali'}">Kwalificatie</button>
      <button data-tab="race"  aria-selected="${S.tab === 'race'}">Race</button>
    </div>
    <div id="paneel"></div>`;
}

function vulPaneel() {
  const r = S.race, nu = Date.now();
  const dicht = { quali: nu >= new Date(r.deadline_quali).getTime(),
                  race:  nu >= new Date(r.deadline_race).getTime() };
  const paneel = app.querySelector('#paneel');
  if (!paneel) return;
  const lijstKlaar = S.tab === 'quali' ? r.quali_result : r.race_result;
  if (lijstKlaar) {
    paneel.innerHTML = uitslagWeergave(r, lijstKlaar);
    knoopKopieer(paneel);
    knoopLosse(paneel, r);
  }
  else if (dicht[S.tab]) geslotenWeergave(paneel, r);
  else invulWeergave(paneel, r, dicht);
}

function geslotenWeergave(paneel, r) {
  if (S.uitslag.welk === S.tab) { uitslagInvoer(paneel, r); return; }
  paneel.innerHTML = `
    <div class="leeg"><span class="label">gesloten</span>
      <p class="zacht" style="margin:0">Inzendingen zijn gesloten. De uitslag volgt zodra
        de sync hem bij OpenF1 heeft opgehaald; die draait elke drie uur.</p></div>
    ${magInvullen(r, S.tab)
      ? `<button class="knop spook" id="zelfinvullen">Uitslag zelf invullen</button>` : ''}
    ${andermans(r)}`;

  const knop = paneel.querySelector('#zelfinvullen');
  if (knop) knop.onclick = () => {
    S.uitslag = { welk: S.tab, lijst: [] };
    S.fout = '';
    uitslagInvoer(paneel, r);
  };
}

// Dezelfde handeling als het voorspellen: aantikken op volgorde. Slepen is
// op een telefoon veel onbetrouwbaarder, en dit kent iedereen al.
function uitslagInvoer(paneel, r) {
  const alle = r.drivers ?? [];
  const lijst = S.uitslag.lijst;
  const nog = alle.length - lijst.length;

  paneel.innerHTML = `
    <div class="waarschuwing">
      <span class="label">let op</span>
      Deze uitslag geldt voor iedereen die dit seizoen volgt, niet alleen voor jouw poule.
      En de sync haalt hem daarna niet meer op. Vul hem dus alleen in als je hem zeker weet.
    </div>
    <span class="label">volgorde van finish · ${S.tab === 'quali' ? 'kwalificatie' : 'race'}</span>
    <ol class="grid10">
      ${alle.map((_, i) => {
        const nr = lijst[i], d = nr ? drv(r, nr) : null;
        const kant = i % 2 === 0 ? 'links' : 'rechts';
        return d
          ? `<li class="slotrij ${kant}"><div class="slot vol" style="border-left-color:${esc(d.kleur)}">
              <span class="pos">P${i+1}</span>
              <span class="who"><b class="code">${esc(d.code)}</b><small>${esc(d.naam)}</small></span>
              <button class="x" data-uitweg="${i}" aria-label="Haal ${esc(d.code)} weg">×</button>
            </div></li>`
          : `<li class="slotrij ${kant}"><div class="slot leegplek">
              <span class="pos">P${i+1}</span>
              <span class="who">nog leeg</span>
            </div></li>`;
      }).join('')}
    </ol>
    <span class="label">nog te plaatsen</span>
    <div class="coureurs">
      ${alle.map(d => `
        <button class="drv" data-uitadd="${esc(d.nr)}" style="border-left-color:${esc(d.kleur)}"
          ${lijst.includes(d.nr) ? 'disabled' : ''}>
          <span class="code">${esc(d.code)}</span><span class="tm">${esc(stal(d.team))}</span>
        </button>`).join('')}
    </div>
    <div class="opslaanbalk">
      <button class="knop primair" id="uitslagOpslaan" ${nog ? 'disabled' : ''}>${
        nog ? `Nog ${nog} te plaatsen` : 'Uitslag opslaan'}</button>
      <button class="knop klein" id="uitslagStop">Annuleren</button>
      <p class="err">${esc(S.fout)}</p>
    </div>`;

  paneel.querySelectorAll('[data-uitadd]').forEach(b => b.onclick = () => {
    if (lijst.length < alle.length) { lijst.push(b.dataset.uitadd); uitslagInvoer(paneel, r); }
  });
  paneel.querySelectorAll('[data-uitweg]').forEach(b => b.onclick = () => {
    lijst.splice(Number(b.dataset.uitweg), 1); uitslagInvoer(paneel, r);
  });
  paneel.querySelector('#uitslagStop').onclick = () => {
    S.uitslag = { welk: null, lijst: [] }; S.fout = '';
    geslotenWeergave(paneel, r);
  };
  paneel.querySelector('#uitslagOpslaan').onclick = async (ev) => {
    const knop = ev.currentTarget;
    knop.disabled = true;
    knop.textContent = 'Bezig met opslaan...';
    S.fout = '';
    try {
      await bewaarUitslag();
      await laad();
      // laad() vervangt S.races, dus de race waar we naar kijken is een oud
      // object geworden; zonder dit toont het scherm de uitslag niet.
      S.race = S.races.find(x => zelfde(x.id, r.id)) ?? S.race;
      S.uitslag = { welk: null, lijst: [] };
      S.melding = `Uitslag voor ${r.name} opgeslagen.`;
      render();
    } catch (e) {
      S.fout = e.message;
      uitslagInvoer(paneel, r);
    }
  };
}

function invulWeergave(paneel, r, dicht) {
  // Zonder deelnemerslijst is er niets om aan te klikken en blijft de
  // opslaanknop hangen op "nog 10 te kiezen" zonder uit te leggen waarom.
  if (!(r.drivers ?? []).length) {
    paneel.innerHTML = `
      <div class="leeg">
        <span class="label">nog niets te kiezen</span>
        <h2 class="middel">Deelnemerslijst<br>volgt nog</h2>
        <p class="zacht" style="margin:0">De deelnemerslijst voor deze race staat nog niet
          in de database. Hij wordt automatisch opgehaald zodra OpenF1 hem publiceert;
          de sync draait elke drie uur.</p>
      </div>`;
    return;
  }
  const lijst = S.keuze[S.tab];
  const kanKopieren = S.tab === 'race' && !S.keuze.race.length && S.keuze.quali.length;
  // Een halve top 10 zegt niets, dus die gaat er niet in. Maar wie alleen de
  // pole of een paar duels invult heeft wel degelijk iets in te leveren.
  const losGekozen = coureurVragen(S.tab).some(id => !!S.keuze[id])
    || (S.tab === 'race' && vraagActief('teamgenoot_duels') && S.keuze.duels.length > 0);
  const magOpslaan = lijst.length === 10 || (lijst.length === 0 && losGekozen);
  const deadline = S.tab === 'quali' ? r.deadline_quali : r.deadline_race;

  paneel.innerHTML = `
    ${coureurVragen(S.tab).map(id => coureurKiezer(r, id)).join('')}
    ${S.tab === 'race' ? duelKiezer(r) : ''}
    ${kanKopieren ? `<button class="knop klein" id="kopieer">Neem de kwalificatie over</button>` : ''}
    <ol class="grid10">
      ${Array.from({length:10}, (_,i) => {
        const nr = lijst[i], d = nr ? drv(r, nr) : null;
        const kant = i % 2 === 0 ? 'links' : 'rechts';
        return d
          ? `<li class="slotrij ${kant}"><div class="slot vol"
               style="border-left-color:${esc(d.kleur)};animation-delay:${(i * .06).toFixed(2)}s">
              <span class="pos">P${i+1}</span>
              <span class="who"><b class="code">${esc(d.code)}</b><small>${esc(d.naam)}</small></span>
              <button class="x" data-weg="${i}" aria-label="Haal ${esc(d.code)} weg">×</button>
            </div></li>`
          : `<li class="slotrij ${kant}"><div class="slot leegplek">
              <span class="pos">P${i+1}</span>
              <span class="who">kies een coureur</span>
            </div></li>`;
      }).join('')}
    </ol>
    <span class="label">nog te kiezen</span>
    <div class="coureurs">
      ${(r.drivers ?? []).map(d => `
        <button class="drv" data-add="${esc(d.nr)}" style="border-left-color:${esc(d.kleur)}"
          ${lijst.includes(d.nr) ? 'disabled' : ''}>
          <span class="code">${esc(d.code)}</span><span class="tm">${esc(stal(d.team))}</span>
        </button>`).join('')}
    </div>
    <p class="label" style="margin:0">sluit ${esc(sluitTekst(deadline))}</p>
    <div class="opslaanbalk">
      <button class="knop primair" id="opslaan" ${magOpslaan ? '' : 'disabled'}>${
        magOpslaan ? 'Opslaan'
          : lijst.length ? `Nog ${10 - lijst.length} te kiezen`
          : 'Nog niets gekozen'}</button>
      <p class="err">${esc(S.fout)}</p>
    </div>`;

  paneel.querySelectorAll('[data-kies]').forEach(b => b.onclick = () => {
    // Nog een keer op dezelfde tikken haalt de keuze weg; zonder dat zit je
    // eraan vast zodra je een keer misklikt.
    const veld = b.dataset.vraag;
    S.keuze[veld] = zelfde(b.dataset.kies, S.keuze[veld]) ? '' : b.dataset.kies;
    invulWeergave(paneel, r, dicht);
  });
  paneel.querySelectorAll('[data-duel]').forEach(b => b.onclick = () => {
    const { duel, tegen } = b.dataset;
    const alGekozen = S.keuze.duels.some(g => zelfde(g, duel));
    // Binnen één team kan er maar één de teamgenoot verslaan, dus de ander
    // gaat er hoe dan ook uit.
    S.keuze.duels = S.keuze.duels.filter(g => !zelfde(g, duel) && !zelfde(g, tegen));
    if (!alGekozen) S.keuze.duels.push(duel);
    invulWeergave(paneel, r, dicht);
  });
  paneel.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    if (lijst.length < 10) { lijst.push(b.dataset.add); invulWeergave(paneel, r, dicht); }
  });
  paneel.querySelectorAll('[data-weg]').forEach(b => b.onclick = () => {
    lijst.splice(Number(b.dataset.weg), 1); invulWeergave(paneel, r, dicht);
  });
  const kop = paneel.querySelector('#kopieer');
  if (kop) kop.onclick = () => { S.keuze.race = [...S.keuze.quali]; invulWeergave(paneel, r, dicht); };
  paneel.querySelector('#opslaan').onclick = async (ev) => {
    const knop = ev.currentTarget;
    knop.disabled = true;                       // dubbeltikken op mobiel
    knop.textContent = 'Bezig met opslaan...';
    S.fout = '';
    try {
      await bewaar();
      // De eigenlijke fix voor "mijn voorspelling is weg": bewaar() schrijft
      // naar de database maar raakt S.preds niet aan. Zonder herladen toont
      // het scherm daarna nog de oude, lege stand.
      await laad();
      S.melding = `Voorspelling voor ${r.name} opgeslagen.`;
      S.race = null; S.weergave = 'races';
      render();
    } catch (e) {
      S.fout = e.message;
      invulWeergave(paneel, r, dicht);
    }
  };
}

// De grootste losse keuze van het weekend, dus die staat bovenaan en niet
// verstopt onder de top 10. Bewust niet verplicht: niemand hoort te blijven
// hangen op een knop die niet werkt.
function coureurKiezer(r, id) {
  if (!vraagActief(id)) return '';
  const v = COUREURVRAAG[id];
  const punten = puntenVoor(id);
  const gekozen = S.keuze[id];
  const d = gekozen ? drv(r, gekozen) : null;
  return `
    <div class="winnaarblok">
      <div class="winnaarkop">
        <span class="label">${v.kop}</span>
        <span class="mono" style="color:var(--ink3)">${punten} punten</span>
      </div>
      <div class="coureurs winnaars">
        ${(r.drivers ?? []).map(c => `
          <button class="wknop ${zelfde(c.nr, gekozen) ? 'gekozen' : ''}"
            data-kies="${esc(c.nr)}" data-vraag="${id}" style="border-left-color:${esc(c.kleur)}"
            aria-pressed="${zelfde(c.nr, gekozen)}">
            <span class="code">${esc(c.code)}</span><span class="tm">${esc(stal(c.team))}</span>
          </button>`).join('')}
      </div>
      ${d
        ? `<p class="mono groen" style="margin:0">${v.mijn}: ${esc(d.naam)}</p>`
        : `<p class="mono amber" style="margin:0">nog niemand gekozen · hier liggen ${punten} punten</p>`}
    </div>`;
}

// Teamgenoot-duels: per team wie van de twee voor de ander eindigt. Je hoeft
// ze niet allemaal in te vullen — alleen wat je kiest telt mee, en de punten
// gaan naar rato. Een duel waar je niets van weet laat je dus gewoon staan.
function duelKiezer(r) {
  if (!vraagActief('teamgenoot_duels')) return '';
  const paren = teamParen(r.drivers);
  if (!paren.length) return '';
  const punten = puntenVoor('teamgenoot_duels');
  const gekozen = S.keuze.duels;
  const isGekozen = (nr) => gekozen.some(g => zelfde(g, nr));
  const klaar = paren.filter(p => isGekozen(p.a.nr) || isGekozen(p.b.nr)).length;
  return `
    <div class="winnaarblok">
      <div class="winnaarkop">
        <span class="label">wie verslaat zijn teamgenoot?</span>
        <span class="mono" style="color:var(--ink3)">${punten} punten</span>
      </div>
      <div class="duels">
        ${paren.map(p => `
          <div class="duel" style="border-left-color:${esc(p.a.kleur)}">
            <span class="tm">${esc(stal(p.team))}</span>
            ${[[p.a, p.b], [p.b, p.a]].map(([c, tegen]) => `
              <button class="wknop duelknop ${isGekozen(c.nr) ? 'gekozen' : ''}"
                data-duel="${esc(c.nr)}" data-tegen="${esc(tegen.nr)}"
                aria-pressed="${isGekozen(c.nr)}">
                <span class="code">${esc(c.code)}</span>
              </button>`).join('')}
          </div>`).join('')}
      </div>
      <p class="duelteller mono ${klaar ? 'groen' : 'amber'}" style="margin:0">${klaar} van de
        ${paren.length} duels gekozen · alleen wat je kiest telt mee</p>
    </div>`;
}

function uitslagWeergave(r, werkelijk) {
  const mijn = vindPred(r.id, S.ik.id);
  const lijst = S.tab === 'quali' ? mijn?.quali_top10 : mijn?.race_top10;
  // Deze uitslag komt niet van OpenF1 en wordt door de sync ook niet meer
  // bijgewerkt, dus dat hoort er gewoon bij te staan.
  const noot = r[HANDVLAG[S.tab]]
    ? `<p class="label amber" style="margin:0">handmatig ingevuld · niet van openf1</p>` : '';
  // De losse vragen hangen aan dezelfde deadline als de top 10 van deze tab.
  const losse = coureurVragen(S.tab).map(id => coureurUitslag(r, mijn, id)).join('')
    + (S.tab === 'race' ? duelUitslag(r, mijn, werkelijk) : '');
  // Wie alleen de losse vragen invulde heeft wél iets ingeleverd; die mag
  // hier niet "je hebt hier niks ingevuld" te zien krijgen.
  const losIngevuld = coureurVragen(S.tab).some(id => !!antwoordVan(mijn, id))
    || (S.tab === 'race' && !!mijn?.teamgenoot_duels?.length);
  if (!lijst?.length && !losIngevuld) return `
    ${noot}
    <div class="leeg"><span class="label">niets ingevuld</span>
      <p class="zacht" style="margin:0">Je hebt hier niks ingevuld.</p></div>
    ${andermans(r)}${weekendVoet(r)}`;
  const { regels } = scoreLijst(lijst ?? [], werkelijk);
  const exact = regels.filter(x => x.punten === 5).length;
  return `
    ${noot}
    ${losse}
    <div class="score">
      <span style="display:flex;flex-direction:column;gap:4px">
        <span class="label">jouw punten</span>
        <span class="zacht">${regels.length
          ? `${exact} van ${regels.length} exact voorspeld`
          : 'geen top 10 ingevuld'}</span>
      </span>
      <b class="getal">${scoreTab(mijn, r, S.tab)}</b>
    </div>
    <ul class="strip">
      ${regels.map(x => {
        const d = drv(r, x.nr);
        const raak = x.werkelijk === x.voorspeld;
        const verschil = x.werkelijk === null ? 'dnf'
          : raak ? 'exact'
          : `${x.werkelijk > x.voorspeld ? '↓' : '↑'} ${Math.abs(x.werkelijk - x.voorspeld)}`;
        return `<li class="sr" style="border-left-color:${esc(d.kleur)}">
          <span class="pos">P${x.voorspeld}</span>
          <span class="code">${esc(d.code)}</span>
          <span class="werd">${x.werkelijk ? 'werd P' + x.werkelijk : 'DNF'}</span>
          <span class="delta ${puntKlasse(x.punten)}">${verschil}</span>
          <span class="pts ${puntKlasse(x.punten)}">${x.punten}</span>
        </li>`;
      }).join('')}
    </ul>
    ${andermans(r)}
    ${weekendVoet(r)}`;
}

// Onder de uitslag: wie pakte dit weekend de meeste punten, en een knop die
// het geheel als tekst klaarzet voor de groepsapp.
function weekendVoet(r) {
  const winnaars = S.leden.length > 1 ? weekendWinnaars(r) : [];
  const ik = winnaars.some(w => w.mij);
  return `
    ${winnaars.length ? `<span class="label">weekendwinnaar · kwalificatie + race</span>
      <div class="rest winnaar">
        <span class="nm">${winnaars.map(w => esc(w.naam)).join(' &amp; ')}${
          ik ? ` <span class="jij">jij</span>` : ''}</span>
        <span class="t">${winnaars[0].punten}</span>
      </div>` : ''}
    <button class="knop klein" data-kopieer="${esc(r.id)}">Kopieer voor de groepsapp</button>
    <textarea class="veld tekstblok hide" readonly rows="9"
      aria-label="Uitslag om zelf te kopiëren"></textarea>`;
}

// Lukt het klembord niet — een oude browser, of een pagina die niet over
// https loopt — dan komt de tekst gewoon in beeld om zelf te selecteren.
function knoopKopieer(paneel) {
  paneel.querySelectorAll('[data-kopieer]').forEach(knop => knop.onclick = async () => {
    const race = S.races.find(x => zelfde(x.id, knop.dataset.kopieer));
    const tekst = race ? groepsappTekst(race) : '';
    if (!tekst) return;
    const veld = paneel.querySelector('.tekstblok');
    const gelukt = await naarKlembord(tekst);
    if (gelukt) {
      knop.textContent = 'Gekopieerd';
      setTimeout(() => { knop.textContent = 'Kopieer voor de groepsapp'; }, 2400);
    } else {
      knop.textContent = 'Kopiëren lukt niet, selecteer hem zelf';
      veld.value = tekst;
      veld.classList.remove('hide');
      veld.select();
    }
  });
}

function coureurUitslag(r, mijn, id) {
  if (!vraagActief(id)) return '';
  const v = COUREURVRAAG[id];
  const punten = puntenVoor(id);
  const werkelijk = v.uitslag(r);
  const gekozen = antwoordVan(mijn, id);
  // Een losse uitslag die nog niet binnen is: dan valt er ook nog niets over
  // te zeggen, ook niet dat je hem hebt laten liggen.
  if (!werkelijk.length) return v.kolom ? losseInvoer(r, id) : '';
  if (!gekozen) {
    return `<p class="label amber" style="margin:0">${v.mis} · ${punten} punten laten liggen</p>`;
  }
  const d = drv(r, gekozen);
  const gescoord = scoreEerste(gekozen, werkelijk, punten);
  const plek = werkelijk.findIndex(x => zelfde(x, gekozen));
  // Bij een uitslag die maar één naam lang is zegt "werd P4" niets; dan is
  // het nuttiger om te zien wie het wél werd.
  const mis = v.kolom
    ? `het werd ${esc(drv(r, werkelijk[0]).code)}`
    : plek === -1 ? 'niet gefinisht' : 'werd P' + (plek + 1);
  return `
    <span class="label">${v.label} · ${punten} punten${
      r[v.vlag] ? ' · handmatig ingevuld' : ''}</span>
    <div class="sr" style="border-left-color:${esc(d.kleur)}">
      <span class="pos">${v.letter}</span>
      <span class="code">${esc(d.code)}</span>
      <span class="werd">${gescoord ? v.goed : mis}</span>
      <span class="pts ${gescoord ? 'v5' : 'v0'}">${gescoord}</span>
    </div>`;
}

// De snelste ronde en de snelste pitstop staan niet in de finishvolgorde, en
// OpenF1 heeft ze niet altijd. Net als bij een hele uitslag mag je ze daarom
// zelf invullen — en net als daar geldt: wat er staat blijft staan, want de
// sync vult alleen wat leeg is.
function losseInvoer(r, id) {
  const v = COUREURVRAAG[id];
  const bezig = S.losse.vraag === id;
  const gekozen = S.losse.keuze;
  return `
    <div class="winnaarblok">
      <div class="winnaarkop">
        <span class="label">${v.label}</span>
        <span class="mono" style="color:var(--ink3)">nog niet bekend</span>
      </div>
      ${bezig ? `
        <div class="waarschuwing">
          <span class="label">let op</span>
          Dit geldt voor iedereen die dit seizoen volgt, niet alleen voor jouw poule,
          en de sync haalt hem daarna niet meer op. Vul hem dus alleen in als je het
          zeker weet.
        </div>
        <div class="coureurs winnaars">
          ${(r.drivers ?? []).map(c => `
            <button class="wknop ${zelfde(c.nr, gekozen) ? 'gekozen' : ''}"
              data-losse="${esc(c.nr)}" style="border-left-color:${esc(c.kleur)}"
              aria-pressed="${zelfde(c.nr, gekozen)}">
              <span class="code">${esc(c.code)}</span><span class="tm">${esc(stal(c.team))}</span>
            </button>`).join('')}
        </div>
        <div style="display:flex;gap:8px">
          <button class="knop klein" id="losseOpslaan" ${gekozen ? '' : 'disabled'}>Opslaan</button>
          <button class="knop klein" id="losseStop">Annuleren</button>
        </div>
        <p class="err">${esc(S.losse.fout)}</p>`
      : `<p class="zacht" style="margin:0">Die staat nog niet in de database. Hij komt
          er vanzelf in zodra de sync hem bij OpenF1 heeft gevonden.</p>
         <button class="knop klein" data-losse-start="${id}">Zelf invullen</button>`}
    </div>`;
}

async function losseBewaren(r, id, nr) {
  const v = COUREURVRAAG[id];
  if (DEMO) { r[v.kolom] = nr; r[v.vlag] = true; return; }
  // Dezelfde race als bij een hele uitslag: is(kolom, null) hoort bij de
  // schrijfactie zelf, zodat een waarde die er inmiddels staat blijft staan.
  const { data, error } = await db.from('races')
    .update({ [v.kolom]: nr, [v.vlag]: true })
    .eq('id', r.id).is(v.kolom, null).select();
  if (error) throw new Error(uitleg(error));
  if (!data?.length) throw new Error(
    `Er staat inmiddels al een ${v.label} voor deze race, dus die van jou is niet `
    + 'weggeschreven. Ga terug en bekijk hem.');
}

function knoopLosse(paneel, r) {
  paneel.querySelectorAll('[data-losse-start]').forEach(b => b.onclick = () => {
    S.losse = { vraag: b.dataset.losseStart, keuze: '', fout: '' };
    render();
  });
  paneel.querySelectorAll('[data-losse]').forEach(b => b.onclick = () => {
    S.losse.keuze = zelfde(b.dataset.losse, S.losse.keuze) ? '' : b.dataset.losse;
    render();
  });
  const stop = paneel.querySelector('#losseStop');
  if (stop) stop.onclick = () => { S.losse = { vraag: null, keuze: '', fout: '' }; render(); };
  const opslaan = paneel.querySelector('#losseOpslaan');
  if (opslaan) opslaan.onclick = async () => {
    opslaan.disabled = true;
    opslaan.textContent = 'Bezig...';
    try {
      await losseBewaren(r, S.losse.vraag, S.losse.keuze);
      S.losse = { vraag: null, keuze: '', fout: '' };
      S.melding = 'Bedankt, hij staat erin.';
      await laad();
      S.race = S.races.find(x => zelfde(x.id, r.id)) ?? S.race;
    } catch (e) { S.losse.fout = e.message; }
    render();
  };
}

// De duels na afloop: per team wie het werd, en of jouw keuze klopte. Alleen
// de duels waar je een keuze in maakte staan erbij; de rest heb je niet
// gespeeld en telt ook niet mee.
function duelUitslag(r, mijn, werkelijk) {
  if (!vraagActief('teamgenoot_duels')) return '';
  const paren = teamParen(r.drivers);
  const gekozen = mijn?.teamgenoot_duels ?? [];
  const punten = puntenVoor('teamgenoot_duels');
  if (!paren.length || !werkelijk?.length) return '';
  if (!gekozen.length) {
    return `<p class="label amber" style="margin:0">geen duels gekozen · ${punten} punten laten liggen</p>`;
  }
  const plek = (nr) => {
    const i = werkelijk.findIndex(x => zelfde(x, nr));
    return i === -1 ? Infinity : i;
  };
  const gespeeld = paren
    .map(p => ({ p, keuze: gekozen.find(g => zelfde(g, p.a.nr) || zelfde(g, p.b.nr)) }))
    .filter(x => x.keuze && !(plek(x.p.a.nr) === Infinity && plek(x.p.b.nr) === Infinity));
  const totaal = scoreDuels(gekozen, werkelijk, paren, punten);
  return `
    <span class="label">teamgenoot-duels · ${totaal} van ${punten} punten</span>
    <ul class="strip">
      ${gespeeld.map(({ p, keuze }) => {
        const won = plek(p.a.nr) < plek(p.b.nr) ? p.a : p.b;
        const mijnD = drv(r, keuze);
        const raak = zelfde(keuze, won.nr);
        return `<li class="sr" style="border-left-color:${esc(p.a.kleur)}">
          <span class="pos">${esc(stal(p.team)).slice(0, 3)}</span>
          <span class="code">${esc(mijnD.code)}</span>
          <span class="werd">${raak ? 'won het duel' : `verloor van ${esc(won.code)}`}</span>
          <span class="pts ${raak ? 'v5' : 'v0'}">${raak ? '✓' : '✗'}</span>
        </li>`;
      }).join('')}
    </ul>`;
}

function andermans(r) {
  const anderen = S.leden.filter(l => !zelfde(l.member_id, S.ik.id));
  if (!anderen.length) return '';
  const werkelijk = S.tab === 'quali' ? r.quali_result : r.race_result;
  const rijen = anderen.map(l => {
    const p = vindPred(r.id, l.member_id);
    const v = S.tab === 'quali' ? p?.quali_top10 : p?.race_top10;
    return { naam:l.display_name,
             punten: werkelijk && v ? scoreTab(p, r, S.tab) : null };
  }).sort((a,b) => (b.punten ?? -1) - (a.punten ?? -1));
  return `<span class="label">de rest</span>
    ${rijen.map(x => `<div class="rest">
      <span class="nm">${esc(x.naam)}</span><span class="t">${x.punten ?? '—'}</span>
    </div>`).join('')}`;
}

// ============================================================
//  Wie ben je? — vervangt de login
// ============================================================

function puntenVan(memberId) {
  let punten = 0;
  for (const r of S.races) {
    if (!r.race_result && !r.quali_result) continue;
    punten += scoreWeekend(vindPred(r.id, memberId), r);
  }
  return punten;
}

function kiesSpeler() {
  app.innerHTML = `
    <div class="toegang"><div class="kaart"><div class="baan"></div>
      <div class="kaart-in">
        <div class="merk">
          <span class="blok"></span>
          <span class="naam">Poule</span>
          <span class="code">${esc(S.poule.join_code ?? S.poule.name)}</span>
        </div>
        <div>
          <h1 class="middel">Wie ben jij?</h1>
          <p class="zacht" style="margin:8px 0 0">Tik op je naam.
            De app onthoudt je op dit toestel.</p>
        </div>
        <div class="veldblok" id="lijst"></div>
        <div class="scheiding"></div>
        <div class="veldblok">
          <span class="label">nieuwe speler</span>
          <input class="veld" id="naam" placeholder="Jouw naam" autocomplete="name">
          <button class="knop spook" id="maak">Meedoen</button>
          <p class="err" id="f"></p>
        </div>
      </div>
    </div></div>`;

  const gesorteerd = [...S.leden]
    .map(l => ({ ...l, punten: puntenVan(l.member_id) }))
    .sort((a, b) => b.punten - a.punten || String(a.display_name).localeCompare(String(b.display_name)));

  app.querySelector('#lijst').innerHTML = gesorteerd.map((l, i) => `
    <button class="speler ${i === 0 ? 'zelf' : ''}" data-lid="${esc(l.member_id)}"
      style="animation-delay:${(i * .06).toFixed(2)}s">
      <span class="nr">${String(i + 1).padStart(2,'0')}</span>
      <span class="nm">${esc(l.display_name)}</span>
      <span class="ptn">${l.punten} ptn</span>
    </button>`).join('')
    || `<p class="zacht" style="margin:0">Nog geen spelers, maak de eerste aan.</p>`;

  app.querySelectorAll('[data-lid]').forEach(b => b.onclick = () => {
    S.ik = { id: b.dataset.lid,
             naam: S.leden.find(l => zelfde(l.member_id, b.dataset.lid)).display_name };
    onthoud(S.poule.id, S.ik.id);
    laad().then(render).catch(e => toonFout(e.message));
  });

  app.querySelector('#maak').onclick = async () => {
    const naam = app.querySelector('#naam').value.trim();
    if (!naam) { app.querySelector('#f').textContent = 'Vul een naam in'; return; }

    // Bestaat die naam al in deze poule, dan is dit dezelfde persoon op een
    // ander toestel. Een tweede speler aanmaken zou hem zijn voorspellingen
    // kosten: die hangen aan het oude member_id en horen dan bij niemand meer.
    const bestaand = S.leden.find(l =>
      (l.display_name ?? '').trim().toLowerCase() === naam.toLowerCase());
    if (bestaand) {
      S.ik = { id: bestaand.member_id, naam: bestaand.display_name };
      onthoud(S.poule.id, S.ik.id);
      S.melding = `Welkom terug, ${bestaand.display_name}.`;
      try { await laad(); render(); }
      catch (e) { app.querySelector('#f').textContent = e.message; }
      return;
    }

    if (DEMO) {
      const id = 'm' + (S.leden.length + 1);
      S.leden.push({ member_id:id, display_name:naam });
      S.ik = { id, naam }; onthoud(S.poule.id, id); render(); return;
    }
    const { data, error } = await db.from('pool_members')
      .insert({ pool_id: S.poule.id, display_name: naam })
      .select().single();
    if (error) { app.querySelector('#f').textContent = uitleg(error); return; }
    S.ik = { id: data.member_id, naam };
    onthoud(S.poule.id, data.member_id);
    try { await laad(); render(); }
    catch (e) { app.querySelector('#f').textContent = e.message; }
  };
}

// ============================================================
//  Poule aanmaken in vier stappen
//  Eén vraag per scherm. Werkt op een telefoon beter dan één lang
//  formulier, en de vragenset krijgt zo de aandacht die hij nodig heeft:
//  hij ligt vast zodra de eerste race gescoord is.
// ============================================================

const MAAKSTAPPEN = ['Hoe heet de poule?', 'Hoe heet jij?',
                     'Wat gaan jullie voorspellen?', 'Klaar'];

function startAanmaken() {
  S.maak = { stap: 1, naam: '', speler: '', vragen: [...PRESETS.klassiek.vragen],
             eigen: false, bezig: false, fout: '', poule: null, ik: null };
  laadVragen()
    .then(render)
    .catch(e => { S.maak.fout = e.message; render(); });
  render();
}

function maakPagina() {
  const m = S.maak;
  const preset = welkPreset(m.vragen);
  app.innerHTML = `
    <div class="toegang"><div class="kaart"><div class="baan"></div>
      <div class="kaart-in">
        <div class="merk">
          <span class="blok"></span>
          <span class="naam">Poule</span>
          <span class="code">stap ${m.stap} van 4</span>
        </div>
        <div class="stappen">
          ${MAAKSTAPPEN.map((_, i) => `<span class="stap ${i + 1 <= m.stap ? 'aan' : ''}"></span>`).join('')}
        </div>
        <h1 class="groot">${esc(MAAKSTAPPEN[m.stap - 1])}</h1>
        ${maakStap(m, preset)}
        <p class="err" id="f">${esc(m.fout)}</p>
      </div>
    </div></div>`;
  maakKnoppen(m);
}

function maakStap(m, preset) {
  if (m.stap === 1) return `
    <div class="veldblok">
      <input class="veld" id="pnaam" placeholder="Vrijdagmiddagpoule"
        value="${esc(m.naam)}" autocomplete="off">
      <p class="zacht" style="margin:0">Zo heet hij in de app en in de uitnodiging.</p>
      <button class="knop primair" id="verder">Volgende</button>
      <button class="knop spook" id="terugstap">Terug</button>
    </div>`;

  if (m.stap === 2) return `
    <div class="veldblok">
      <input class="veld" id="snaam" placeholder="Jouw naam"
        value="${esc(m.speler)}" autocomplete="name">
      <p class="zacht" style="margin:0">Je wordt meteen het eerste lid, en de
        poulebaas — die kan later de vragenset aanpassen.</p>
      <button class="knop primair" id="verder">Volgende</button>
      <button class="knop spook" id="terugstap">Terug</button>
    </div>`;

  if (m.stap === 3) return `
    <div class="veldblok">
      <div class="presets">
        ${Object.entries(PRESETS).map(([sleutel, p]) => `
          <button class="preset ${preset === sleutel ? 'aan' : ''}" data-preset="${sleutel}"
            aria-pressed="${preset === sleutel}">
            <span class="nm">${p.naam}</span>
            <span class="zacht">${p.uitleg}</span>
            <span class="ptn">${puntenSom(p.vragen)}</span>
          </button>`).join('')}
      </div>
      <button class="knop spook" id="eigen">${m.eigen
        ? 'Verberg de losse vragen' : 'Zelf samenstellen'}</button>
      <div class="vragenlijst ${m.eigen ? '' : 'hide'}">${vragenLijst(m.vragen)}</div>
      ${vragenVoet(m.vragen)}
      <button class="knop primair" id="verder" ${m.vragen.length && !m.bezig ? '' : 'disabled'}>${
        m.bezig ? 'Bezig met aanmaken...' : 'Poule aanmaken'}</button>
      <button class="knop spook" id="terugstap" ${m.bezig ? 'disabled' : ''}>Terug</button>
    </div>`;

  return `
    <div class="veldblok">
      <span class="label">poulecode</span>
      <div class="veld code" style="display:grid;place-items:center">${esc(m.poule.join_code)}</div>
      <p class="zacht" style="margin:0">Deel deze code, of stuur de link — dan hoeft
        niemand hem over te tikken.</p>
      <button class="knop spook" id="uitnodiging">Kopieer uitnodigingslink</button>
      <textarea class="veld tekstblok hide" id="uitnodigingveld" readonly rows="3"
        aria-label="Uitnodiging om zelf te kopiëren"></textarea>
      <button class="knop primair" id="klaar">Naar de poule</button>
    </div>`;
}

function maakKnoppen(m) {
  const fout = (t) => { S.maak.fout = t; app.querySelector('#f').textContent = t; };
  const terug = app.querySelector('#terugstap');
  if (terug) terug.onclick = () => {
    // Vanaf de eerste stap terug is: toch maar meedoen met een bestaande poule.
    if (m.stap === 1) { S.maak = null; render(); return; }
    m.stap -= 1; m.fout = ''; render();
  };

  const naamveld = app.querySelector('#pnaam') ?? app.querySelector('#snaam');
  if (naamveld) {
    naamveld.focus();
    naamveld.oninput = () => {
      if (m.stap === 1) m.naam = naamveld.value; else m.speler = naamveld.value;
    };
    naamveld.onkeydown = (ev) => { if (ev.key === 'Enter') app.querySelector('#verder').click(); };
  }

  app.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    m.vragen = [...PRESETS[b.dataset.preset].vragen]; m.fout = ''; render();
  });
  const eigen = app.querySelector('#eigen');
  if (eigen) eigen.onclick = () => { m.eigen = !m.eigen; render(); };
  app.querySelectorAll('[data-vraag-aan]').forEach(b => b.onclick = () => {
    const id = b.dataset.vraagAan;
    m.vragen = m.vragen.includes(id) ? m.vragen.filter(x => x !== id) : [...m.vragen, id];
    m.fout = ''; render();
  });

  const verder = app.querySelector('#verder');
  if (verder) verder.onclick = async () => {
    if (m.stap === 1) {
      if (!m.naam.trim()) { fout('Vul een naam voor de poule in'); return; }
      m.stap = 2; m.fout = ''; render(); return;
    }
    if (m.stap === 2) {
      if (!m.speler.trim()) { fout('Vul je eigen naam in'); return; }
      m.stap = 3; m.fout = ''; render(); return;
    }
    if (!m.vragen.length) { fout('Kies minstens één vraag'); return; }
    m.bezig = true; m.fout = ''; render();
    try { await pouleAanmaken(m); }
    catch (e) { m.bezig = false; fout(e.message); return; }
    m.bezig = false; m.stap = 4; render();
  };

  knoopUitnodiging(app);
  const klaar = app.querySelector('#klaar');
  if (klaar) klaar.onclick = async () => {
    S.poule = m.poule; S.ik = m.ik;
    onthoudPoule(S.poule.id); onthoud(S.poule.id, S.ik.id);
    S.maak = null; S.weergave = 'races'; S.race = null;
    try { await laad(); } catch (e) { toonFout(e.message); }
    render();
  };
}

// De vier schrijfacties achter stap 3. Wat al gelukt is blijft staan in m,
// zodat een tweede poging na een fout geen tweede poule aanmaakt.
async function pouleAanmaken(m) {
  if (DEMO) {
    m.poule = { id:'p-nieuw', name:m.naam.trim(), join_code:'DEMO01', season:SEIZOEN };
    m.ik = { id:'m-nieuw', naam:m.speler.trim() };
    return;
  }
  if (!m.poule) {
    const { data, error } = await db.from('pools')
      .insert({ name: m.naam.trim(), season: SEIZOEN }).select().single();
    if (error) throw new Error(uitleg(error));
    m.poule = data;
  }
  if (!m.ik) {
    const { data, error } = await db.from('pool_members')
      .insert({ pool_id: m.poule.id, display_name: m.speler.trim() }).select().single();
    if (error) throw new Error(uitleg(error));
    m.ik = { id: data.member_id, naam: m.speler.trim() };
    // Wie de poule aanmaakt is de poulebaas. Zonder login kan de database dat
    // niet afdwingen; het houdt de beheerknoppen weg bij wie ze niet nodig
    // heeft. Zie BEDIENING.md §7.
    await db.from('pools').update({ owner_member_id: m.ik.id }).eq('id', m.poule.id);
    m.poule.owner_member_id = m.ik.id;
  }
  const { error } = await db.from('pool_questions')
    .insert(m.vragen.map(id => ({ pool_id: m.poule.id, question_id: id })));
  if (error) throw new Error(uitleg(error));
}

function toonStart() {
  app.innerHTML = `
    <div class="toegang"><div class="kaart"><div class="baan"></div>
      <div class="kaart-in">
        <div class="merk">
          <span class="blok"></span>
          <span class="naam">Poule</span>
          <span class="code">${SEIZOEN}</span>
        </div>
        <div>
          <h1 class="groot">Doe mee<br>met je poule</h1>
          <p class="zacht" style="margin:12px 0 0">Je hebt alleen de code van je poule
            nodig. Geen wachtwoord.</p>
        </div>
        <div class="veldblok">
          <span class="label">poulecode</span>
          <input class="veld code" id="code" maxlength="6" placeholder="ABC123"
            value="${esc(S.linkCode)}"
            autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button class="knop primair" id="mee" style="min-height:64px;font-size:24px">Naar de poule</button>
        </div>
        <div class="scheiding"></div>
        <div class="veldblok">
          <p class="zacht" style="margin:0">Nog geen poule? Begin er zelf een.</p>
          <button class="knop spook" id="nieuw">Nieuwe poule maken</button>
        </div>
        <p class="err" id="f">${esc(S.linkFout)}</p>
      </div>
    </div></div>`;

  S.linkCode = ''; S.linkFout = '';
  const fout = (t) => { app.querySelector('#f').textContent = t; };

  app.querySelector('#nieuw').onclick = () => startAanmaken();

  app.querySelector('#mee').onclick = async () => {
    const code = app.querySelector('#code').value.trim().toUpperCase();
    const { data, error } = await db.from('pools').select('*').eq('join_code', code).single();
    if (error || !data) { fout('Die poulecode bestaat niet'); return; }
    S.poule = data;
    onthoudPoule(S.poule.id);
    const bekend = mijnId(S.poule.id);
    try { await laad(); }
    catch (e) { fout(e.message); return; }
    S.weergave = 'races'; S.race = null;
    if (bekend && S.leden.some(l => zelfde(l.member_id, bekend))) {
      S.ik = { id: bekend, naam: S.leden.find(l => zelfde(l.member_id, bekend)).display_name };
    }
    render();
  };

}

if (DEMO) {

// Terug naar de poule die je het laatst gebruikte, zodat de poulecode niet
// elke keer opnieuw ingetypt hoeft te worden.
async function hervat() {
  // Een link met een code gaat voor op de poule die je het laatst gebruikte:
  // wie zo'n link aanklikt wil naar díé poule, niet naar zijn vorige.
  const uitLink = codeUitLink();
  if (uitLink) {
    vergeetLinkCode();
    const { data } = await db.from('pools').select('*').eq('join_code', uitLink).single();
    if (data) {
      S.poule = data;
      onthoudPoule(data.id);
      try { await laad(); }
      catch (e) { toonFout(e.message); return; }
      const bekend = mijnId(S.poule.id);
      const lid = bekend && S.leden.find(l => zelfde(l.member_id, bekend));
      if (lid) S.ik = { id: lid.member_id, naam: lid.display_name };
      render();
      return;
    }
    // Klopt de code niet, dan is stilzwijgend doorgaan naar je eigen poule
    // verwarrend: je zou nooit merken dat de uitnodiging kapot was.
    // Alleen voorvullen wat in het veld past: een poulecode is zes tekens,
    // en maxlength knipt een waarde uit het attribuut niet af.
    S.linkCode = uitLink.length <= 6 ? uitLink : '';
    S.linkFout = `De code ${uitLink} uit die link bestaat niet. `
      + 'Herlaad de pagina om terug te gaan naar je eigen poule.';
    toonStart();
    return;
  }

  const id = laatstePoule();
  if (!id) { toonStart(); return; }

  const { data, error } = await db.from('pools').select('*').eq('id', id).single();
  if (error || !data) { vergeetPoule(); toonStart(); return; }

  S.poule = data;
  try { await laad(); }
  catch (e) { toonFout(e.message); return; }

  const bekend = mijnId(S.poule.id);
  const lid = bekend && S.leden.find(l => zelfde(l.member_id, bekend));
  if (lid) S.ik = { id: lid.member_id, naam: lid.display_name };
  render();
}
