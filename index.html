function knoopContrair() {
  const knop = app.querySelector('#contrairKnop');
  if (!knop) return;
  knop.onclick = async () => {
    knop.disabled = true;
    const nu = S.poule.contrair_vanaf ? null : new Date().toISOString();
    try {
      if (!DEMO) {
        const { error } = await db.from('pools')
          .update({ contrair_vanaf: nu }).eq('id', S.poule.id);
        if (error) throw new Error(uitleg(error));
      }
      S.poule.contrair_vanaf = nu;
      S.melding = nu
        ? T('Contrair voorspellen staat aan, vanaf nu.')
        : T('Contrair voorspellen staat weer uit.');
    } catch (e) { S.melding = e.message; }
    render();
  };
}

function knoopJokers() {
  // Het aantal. Mag ook terwijl de jokers al aanstaan -- omhoog is voor
  // iedereen hetzelfde, en omlaag houdt de trigger in schema.sql tegen zodra
  // er al iemand meer heeft liggen. De foutmelding daarvan komt hier op het
  // scherm, want anders verspringt de keuzelijst terug zonder uitleg.
  const aantal = app.querySelector('#jokeraantal');
  if (aantal) aantal.onchange = async () => {
    const wil = Number(aantal.value);
    const oud = jokersPerSeizoen();
    if (wil === oud) return;
    aantal.disabled = true; S.jokerFout = '';
    try {
      if (!DEMO) {
        const { error } = await db.from('pools')
          .update({ jokers_aantal: wil }).eq('id', S.poule.id);
        if (error) throw new Error(uitleg(error));
      }
      S.poule.jokers_aantal = wil;
      S.melding = T('Iedereen heeft nu {n} jokers dit seizoen.', { n: wil });
    } catch (e) { S.jokerFout = e.message; }
    render();
  };

  const knop = app.querySelector('#jokersKnop');
  if (!knop) return;
  knop.onclick = async () => {
    knop.disabled = true;
    const nu = S.poule.jokers_vanaf ? null : new Date().toISOString();
    try {
      if (!DEMO) {
        const { error } = await db.from('pools')
          .update({ jokers_vanaf: nu }).eq('id', S.poule.id);
        if (error) throw new Error(uitleg(error));
      }
      S.poule.jokers_vanaf = nu;
      // Uitzetten laat de gezette jokers staan in de database, maar ze tellen
      // niet meer mee -- heeftJoker() kijkt eerst of de regel aanstaat. Zo is
      // per ongeluk uitzetten en weer aanzetten geen verlies.
      S.melding = nu ? T('Jokers staan aan, vanaf nu.') : T('Jokers staan weer uit.');
    } catch (e) { S.melding = e.message; }
    S.jokerFout = '';
    render();
  };
}

function knoopAutofill() {
  const knop = app.querySelector('#autofillKnop');
  if (!knop) return;
  knop.onclick = async () => {
    knop.disabled = true;
    // Aanzetten bewaart het moment, uitzetten wist het. Opnieuw aanzetten
    // begint dus ook opnieuw, en vult niet alsnog de tussenliggende races in.
    const nu = S.poule.autofill_vanaf ? null : new Date().toISOString();
    try {
      if (!DEMO) {
        const { error } = await db.from('pools')
          .update({ autofill_vanaf: nu }).eq('id', S.poule.id);
        if (error) throw new Error(uitleg(error));
      }
      S.poule.autofill_vanaf = nu;
      bouwPreds();
      S.melding = nu
        ? T('Automatisch invullen staat aan, vanaf nu.')
        : T('Automatisch invullen staat weer uit.');
    } catch (e) { S.melding = e.message; }
    render();
  };
}

function knoopOpenbaar() {
  const knop = app.querySelector('#openbaarKnop');
  if (!knop) return;
  knop.onclick = async () => {
    knop.disabled = true;
    const nu = !S.poule.is_public;
    try {
      if (!DEMO) {
        const { error } = await db.from('pools').update({ is_public: nu }).eq('id', S.poule.id);
        if (error) throw new Error(uitleg(error));
      }
      S.poule.is_public = nu;
      S.melding = nu ? T('De poule is nu openbaar.') : T('De poule is weer privé.');
    } catch (e) { S.melding = e.message; }
    render();
  };
}

// ---- meer dan één poule -------------------------------------
// Met het werk in de ene en de vrienden in de andere zit je zo in twee of
// drie poules. Eerder onthield de app er maar één en moest je de code
// opnieuw intypen om te wisselen; nu staan ze hier gewoon naast elkaar.
function pouleLijstBlok() {
  const anderen = mijnPoules().filter(p => !zelfde(p.id, S.poule.id));
  if (!anderen.length) return '';
  return `
    <div class="scheiding"></div>
    <span class="label">${T('jouw andere poules')}</span>
    ${anderen.map(pouleKnop).join('')}
    <p class="zacht" style="margin:0">${T('Dit lijstje staat op dit toestel. Op je '
      + 'telefoon én je laptop zijn het dus twee lijstjes.')}</p>`;
}

const pouleKnop = (p) => `
  <button class="knop poulekeuze" data-naar-poule="${esc(p.id)}">
    <span class="nm">${esc(p.name)}</span>
    ${p.beschrijving ? `<span class="zacht">${esc(p.beschrijving)}</span>` : ''}
    <span class="mono">${esc(p.join_code ?? '')}</span>
  </button>`;

// Naar een andere poule waar je al bij hoort. Hij wordt opnieuw opgehaald in
// plaats van uit het lijstje gelezen: de naam kan veranderd zijn, en de poule
// kan weg zijn — dan moet hij ook uit het lijstje.
async function naarPoule(poolId) {
  const { data, error } = await pouleBij({ p_id: poolId });
  if (error || !data) {
    vergeetUitLijst(poolId);
    if (zelfde(laatstePoule(), poolId)) vergeetPoule();
    S.melding = T('Die poule bestaat niet meer.');
    if (S.poule) { render(); } else { toonStart(); }
    return;
  }
  S.poule = data;
  S.ik = null; S.race = null; S.weergave = 'races';
  S.beheer = null; S.beheerFout = '';
  S.omschrijving = null; S.omschrijvingFout = '';
  onthoudPoule(data.id); onthoudInLijst(data);
  try { await laad(); }
  catch (e) { toonFout(e.message); return; }
  await herkenMij();
  render();
}

// ---- beheer: welke vragen doen mee --------------------------
// BEDIENING.md §5 t/m §8. De database controleert nog niet wie de poulebaas
// is — de policies staan nog open — dus owner_member_id houdt deze knoppen
// alleen weg bij wie ze niet nodig heeft, meer niet. Zie §7.

// Poules van vóór het aanmaakscherm hebben geen eigenaar. Die op slot doen
// zou niemand meer bij de vragenset laten; dan maar iedereen.
const magBeheren = () =>
  !S.poule.owner_member_id || zelfde(S.poule.owner_member_id, S.ik.id);

// Geen rijen in pool_questions betekent "doet aan alles mee". In het
// beheerscherm staan dan ook alle vinkjes aan: dat is wat er nu geldt.
const pouleVragen = () =>
  S.poulevragen.length ? [...S.poulevragen] : S.vragen.map(v => v.id);

// Sinds wanneer ligt de set vast? De eerste race met een uitslag, want dat
// is het moment waarop de sync hem op slot heeft gezet.
const eersteGescoord = () =>
  S.races.find(heeftUitslagLijst);

function beheerBlok() {
  if (!magBeheren() || !S.vragen.length) return '';
  const opSlot = !!S.poule.questions_locked;
  const gekozen = S.beheer ?? pouleVragen();
  const race = eersteGescoord();
  return `
    <div class="scheiding"></div>
    <span class="label">${T('welke vragen doen mee')}</span>
    ${opSlot ? `<p class="zacht" style="margin:0">${T(race
      ? 'De vragenset ligt vast sinds {race}. Zo blijven alle races vergelijkbaar.'
      : 'De vragenset ligt vast. Zo blijven alle races vergelijkbaar.',
      { race: esc(race?.name ?? '') })}</p>` : ''}
    ${!S.poule.owner_member_id ? `<p class="zacht" style="margin:0">${T('Deze poule heeft geen '
      + 'poulebaas — hij is aangemaakt voordat dat bestond. Iedereen kan hem dus aanpassen.')}</p>
      <button class="knop klein" id="pouleClaimen">${T('Ik word poulebaas')}</button>` : ''}
    <div class="vragenlijst">${vragenLijst(gekozen, { uit: opSlot })}</div>
    ${opSlot ? '' : `${vragenVoet(gekozen)}
      <div style="display:flex;gap:8px">
        <button class="knop klein" id="vragenBewaren" ${gekozen.length ? '' : 'disabled'}>${
          T('Opslaan')}</button>
        ${S.beheer ? `<button class="knop klein" id="vragenTerug">${T('Ongedaan maken')}</button>` : ''}
      </div>`}
    <p class="err" id="vragenfout">${esc(S.beheerFout)}</p>`;
}

function knoopBeheer() {
  app.querySelectorAll('[data-vraag-aan]').forEach(b => b.onclick = () => {
    const id = b.dataset.vraagAan;
    const nu = S.beheer ?? pouleVragen();
    S.beheer = nu.includes(id) ? nu.filter(x => x !== id) : [...nu, id];
    S.beheerFout = '';
    render();
  });
  const terug = app.querySelector('#vragenTerug');
  if (terug) terug.onclick = () => { S.beheer = null; S.beheerFout = ''; render(); };

  const claim = app.querySelector('#pouleClaimen');
  if (claim) claim.onclick = async () => {
    claim.disabled = true;
    claim.textContent = T('Bezig...');
    // Alleen zetten als er nog geen poulebaas is: twee mensen die tegelijk op
    // deze knop drukken mogen niet allebei winnen. Zie ook §7 van
    // BEDIENING.md — de database dwingt dit nog niet zelf af.
    const { data, error } = await db.from('pools')
      .update({ owner_member_id: S.ik.id }).eq('id', S.poule.id)
      .is('owner_member_id', null).select();
    if (error || !data?.length) {
      S.melding = error ? uitleg(error)
        : T('Dat lukte niet. Misschien was je net te laat en heeft iemand anders hem al geclaimd.');
    } else {
      S.poule.owner_member_id = S.ik.id;
      S.melding = T('Je bent nu de poulebaas van deze poule.');
    }
    try { await laad(); } catch (e) { toonFout(e.message); return; }
    render();
  };

  const bewaren = app.querySelector('#vragenBewaren');
  if (bewaren) bewaren.onclick = async () => {
    if (!S.beheer) { S.melding = T('Er was niets veranderd.'); render(); return; }
    bewaren.disabled = true;
    bewaren.textContent = T('Bezig...');
    try {
      await vragenBewaren(S.beheer);
      S.beheer = null; S.beheerFout = '';
      S.melding = T('De vragenset is bijgewerkt.');
      await laad();
    } catch (e) { S.beheerFout = e.message; }
    render();
  };
}

// Alleen het verschil wegschrijven. Alles weggooien en opnieuw invoeren zou
// tussendoor een poule opleveren die even aan alles meedoet.
async function vragenBewaren(gekozen) {
  const nu = S.poulevragen;
  const erbij = gekozen.filter(id => !nu.includes(id));
  const eraf  = nu.filter(id => !gekozen.includes(id));
  if (DEMO) { S.poulevragen = [...gekozen]; return; }
  if (erbij.length) {
    const { error } = await db.from('pool_questions')
      .insert(erbij.map(id => ({ pool_id: S.poule.id, question_id: id })));
    if (error) throw new Error(uitleg(error));
  }
  for (const id of eraf) {
    const { error } = await db.from('pool_questions').delete()
      .eq('pool_id', S.poule.id).eq('question_id', id);
    if (error) throw new Error(uitleg(error));
  }
}

// ---- racedetail ---------------------------------------------

// startTab: alleen gebruikt om een onthouden tab terug te zetten (zie
// herstelScherm hierboven). Zonder opgave kiest hij zelf het tabblad dat nog
// openstaat, zoals altijd.
function openRace(id, startTab = null) {
  const r = S.races.find(x => zelfde(x.id, id));
  if (!r) { toonFout(T('Deze race staat niet meer in de lijst.')); return; }
  S.race = r;
  S.weergave = 'races';
  const mijn = vindPred(id, S.ik.id);
  // Een vak per sessie, gevuld vanuit de kolom die bij die sessie hoort.
  // Stond hier als twee losse regels voor quali en race; de sprint-tab kwam
  // dan uit op undefined en viel om zodra je hem opende.
  S.keuze = { ...Object.fromEntries(
                SESSIEVOLGORDE.map(w => [w, naarPlekken(mijn?.[SESSIES[w].vraag])])),
              winnaar: mijn?.race_winnaar ?? '', pole: mijn?.pole ?? '',
              duels: [...(mijn?.teamgenoot_duels ?? [])],
              snelste_ronde: mijn?.snelste_ronde ?? '',
              snelste_pitstop: mijn?.snelste_pitstop ?? '',
              safety_cars: mijn?.safety_cars ?? null,
              rode_vlag: mijn?.rode_vlag ?? null };
  // Een onthouden tab mag alleen terug als die sessie dit weekend bestaat --
  // anders kom je na een sprintweekend op een lege sprint-tab uit bij een
  // gewone race.
  const bestaat = weekendSessies(r);
  S.tab = bestaat.includes(startTab) ? startTab
    : (bestaat.includes(openLijst(r)) ? openLijst(r) : bestaat[0] ?? 'race');
  S.kiesplek = null;
  S.fout = '';
  render();
}

function raceDetailKop() {
  const r = S.race;
  // De teller hoort bij het tabblad dat je open hebt. Anders staat er een
  // groene tijd naast een kwalificatie die allang gereden is.
  const iso = r[SESSIES[S.tab].deadline];
  const nogOpen = Date.now() < new Date(iso).getTime();
  return `
    <div class="detailkop">
      <button class="terug" id="terug" aria-label="${T('Terug naar het overzicht')}">←</button>
      <span class="dtitel">${esc(r.name)}</span>
      ${nogOpen
        ? `<span class="mono groen" data-tot="${esc(iso)}" data-kort="1">${klokTekst(iso, true)}</span>`
        : `<span class="vlag"></span>`}
    </div>
    ${jokerRegel(r)}
    <!-- Alleen de sessies die dit weekend bestaan: een gewoon weekend krijgt
         geen sprint-tab, en op een sprintweekend staan er drie. -->
    <div class="tabs">
      ${weekendSessies(r).map(w => `<button data-tab="${w}"
        aria-selected="${S.tab === w}">${esc(T(SESSIES[w].tablabel ?? SESSIES[w].naam))}</button>`).join('')}
    </div>
    <div id="paneel"></div>`;
}

// Mag er op dit weekend nog een joker bij of af? Twee voorwaarden, en ze
// staan allebei ook in de trigger in schema.sql -- deze hier is er om de knop
// weg te laten, niet om de regel af te dwingen.
function jokerKan(r) {
  if (!jokersAan()) return false;
  const start = weekendStart(r);
  return start !== null && Date.now() < start
    && start > Date.parse(S.poule.jokers_vanaf);
}

// De jokerregel boven de tabbladen. Staat daar en niet in een tabblad, want
// een joker geldt voor het hele weekend en niet voor één sessie.
function jokerRegel(r) {
  if (!jokersAan()) return '';
  const ligt = heeftJoker(r.id, S.ik.id);
  const kan = jokerKan(r);
  // Een weekend waar niets meer te kiezen valt en waar geen joker ligt hoeft
  // ook niets te zeggen. Anders staat er op twintig weekenden een regel die
  // alleen maar meldt dat je iets niet meer kunt.
  if (!ligt && !kan) return '';
  const over = jokersOver(S.ik.id);
  // Een kop die zegt wát dit is, en eronder één zin die zegt wat het dóét.
  // Eerst stond het als één regel kleine hoofdletters ("je joker ligt hier ·
  // dit weekend telt dubbel"), en dan moet je hem helemaal lezen voordat je
  // weet of er iets ligt.
  //
  // De uitleg draagt <b> en gaat daarom niet door esc(). Dat kan hier omdat
  // alles in deze drie regels uit de woordenlijst komt; er zit geen naam of
  // iets anders in dat een speler zelf heeft ingetypt.
  const kop = ligt ? T('Joker: actief')
            : over > 0 ? T('Joker') : T('Joker: op');
  const uitleg = ligt
    ? T('Je punten voor dit weekend worden <b>verdubbeld</b>.')
    : over > 0 ? T('Nog <b>{over}</b> van je {totaal} te vergeven dit seizoen.',
                   { over, totaal: jokersPerSeizoen() })
               : T('Je hebt ze dit seizoen alle {totaal} gebruikt.',
                   { totaal: jokersPerSeizoen() });
  return `
    <div class="jokerregel ${ligt ? 'aan' : ''}">
      <span class="jokerster" aria-hidden="true">${ligt ? '★' : '☆'}</span>
      <span class="jokertekst">
        <b class="jokerkop">${esc(kop)}</b>
        <span class="jokeruitleg">${uitleg}</span>
      </span>
      ${kan && (ligt || over > 0)
        ? `<button class="knop klein" id="jokerknop">${ligt ? T('Haal weg') : T('Zet hier')}</button>`
        : `<span class="mono">2×</span>`}
    </div>`;
}

function knoopJokerZetten() {
  const knop = app.querySelector('#jokerknop');
  if (!knop) return;
  knop.onclick = async () => {
    knop.disabled = true;
    const r = S.race, ik = S.ik.id, ligt = heeftJoker(r.id, ik);
    const sleutel = { pool_id: S.poule.id, race_id: r.id, member_id: ik };
    try {
      if (!DEMO) {
        // Weghalen is de rij verwijderen: een joker is een feit, geen vinkje
        // dat op false kan staan. En de trigger in de database weigert
        // allebei de kanten zodra het weekend begonnen is, dus wat hier
        // langskomt is ook echt op tijd.
        const { error } = ligt
          ? await db.from('jokers').delete().eq('pool_id', sleutel.pool_id)
              .eq('race_id', sleutel.race_id).eq('member_id', sleutel.member_id)
          : await db.from('jokers').insert(sleutel);
        if (error) throw new Error(uitleg(error));
      }
      S.jokers = ligt
        ? S.jokers.filter(j => !(zelfde(j.race_id, r.id) && zelfde(j.member_id, ik)))
        : [...S.jokers, { race_id: r.id, member_id: ik }];
      S.melding = ligt
        ? T('Je joker ligt niet meer op {race}.', { race: r.name })
        : T('Je joker ligt op {race}. Dit weekend telt dubbel.', { race: r.name });
    } catch (e) { S.melding = e.message; }
    render();
  };
}

function vulPaneel() {
  const r = S.race, nu = Date.now();
  const dicht = dichteSessies(r, nu);
  const paneel = app.querySelector('#paneel');
  if (!paneel) return;
  const lijstKlaar = r[SESSIES[S.tab].uitslag];
  // Andermans inzending inkijken mag alleen als deze tab gesloten is. De knop
  // ernaartoe staat al alleen op de gesloten schermen, maar dit is de plek
  // waar het ook echt afgedwongen wordt: sta je bij iemands kwalificatie en
  // klik je naar de race die nog openstaat, dan val je hier vanzelf terug.
  const gesloten = !!lijstKlaar || afgelastEnLeeg(r) || dicht[S.tab];
  if (S.bekijk && !gesloten) S.bekijk = null;
  if (S.bekijk) { bekijkWeergave(paneel, r); return; }
  if (lijstKlaar) {
    paneel.innerHTML = uitslagWeergave(r, lijstKlaar);
    knoopKopieer(paneel);
    knoopBekijk(paneel);
  }
  // Een afgelaste race is dicht, wat de klok ook zegt. Een race kan afgelast
  // worden terwijl zijn deadline nog loopt — dan blijven mensen anders een
  // top 10 invullen voor iets wat nooit gereden wordt.
  else if (afgelastEnLeeg(r) || dicht[S.tab]) geslotenWeergave(paneel, r);
  else invulWeergave(paneel, r, dicht);
}

// Afgelast én zonder uitslag. Die tweede voorwaarde staat er zodat een
// uitslag altijd wint van de vlag: is hij tóch verreden en ingevuld, dan
// telt hij gewoon mee.
const afgelastEnLeeg = (r) => !!r.afgelast && !heeftUitslag(r);

function geslotenWeergave(paneel, r) {
  // Een afgelaste race blijft in de kalender staan — er kunnen voorspellingen
  // aan hangen — maar hij levert niets op, en dat hoort hier te staan in
  // plaats van "de uitslag volgt".
  // Wat jij had ingevuld hoort altijd zichtbaar te blijven. Dat was het niet:
  // zodra de kwalificatie begon zag je alleen nog "gesloten" en kon je
  // nergens meer nakijken wat je gekozen had — terwijl dat juist het moment
  // is waarop je het wilt weten.
  const mijnBlok = `
    <span class="label">${T('jouw inzending · alleen om terug te kijken')}</span>
    ${keuzeOverzicht(r, vindPred(r.id, S.ik.id), S.tab)}`;

  paneel.innerHTML = afgelastEnLeeg(r) ? `
    <div class="leeg"><span class="label">${T('afgelast')}</span>
      <p class="zacht" style="margin:0">${T('Deze race is niet doorgegaan, dus hij telt voor '
        + 'niemand mee. Wat je had ingevuld blijft staan.')}</p></div>
    ${mijnBlok}
    ${andermans(r)}
  ` : `
    <div class="leeg"><span class="label">${T('gesloten')}</span>
      <p class="zacht" style="margin:0">${T('Inzendingen zijn gesloten. De uitslag volgt zodra '
        + 'de sync hem bij OpenF1 heeft opgehaald; die draait elk uur.')}</p></div>
    ${mijnBlok}
    ${andermans(r)}`;

  knoopBekijk(paneel);
}

function invulWeergave(paneel, r, dicht) {
  // Zonder deelnemerslijst is er niets om aan te klikken en blijft de
  // opslaanknop hangen op "nog 10 te kiezen" zonder uit te leggen waarom.
  if (!(r.drivers ?? []).length) {
    paneel.innerHTML = `
      <div class="leeg">
        <span class="label">${T('nog niets te kiezen')}</span>
        <h2 class="middel">${T('Deelnemerslijst<br>volgt nog')}</h2>
        <p class="zacht" style="margin:0">${T('De deelnemerslijst voor deze race staat '
          + 'nog niet in de database. Hij wordt automatisch opgehaald zodra OpenF1 hem '
          + 'publiceert; de sync draait elk uur.')}</p>
      </div>`;
    return;
  }
  const lijst = S.keuze[S.tab];
  const klaar = gevuld(lijst);
  const kanKopieren = S.tab === 'race' && !gevuld(S.keuze.race) && gevuld(S.keuze.quali);
  // Een halve top 10 zegt niets, dus die gaat er niet in. Maar wie alleen de
  // pole of een paar duels invult heeft wel degelijk iets in te leveren.
  const losGekozen = coureurVragen(S.tab).some(id => !!S.keuze[id])
    || extraVragen(S.tab).some(id => !leegAntwoord(S.keuze[id]))
    || (S.tab === 'race' && vraagActief('teamgenoot_duels') && S.keuze.duels.length > 0);
  // Doet de top 10 niet mee, dan valt er ook niets af te maken.
  const magOpslaan = !top10Actief(S.tab)
    ? losGekozen
    : compleet(lijst) || (klaar === 0 && losGekozen);
  const deadline = r[SESSIES[S.tab].deadline];

  // Alles op één scherm. Dat kan doordat er nergens meer een lijst van twaalf
  // coureurs openstaat: je tikt de plek of de vraag aan die je bedoelt, en
  // pas dan gaat het keuzeblad open. Zie OVERDRACHT.md.
  paneel.innerHTML = `
    ${kanKopieren ? `<button class="knop klein" id="kopieer">${
      T('Neem de kwalificatie over')}</button>` : ''}
    ${top10Actief(S.tab) ? `
      <div class="topkop">
        <span class="label">${T('jouw top 10')}</span>
        <span class="mono ${compleet(lijst) ? 'groen' : 'amber'}">${klaar}/10</span>
      </div>
      <ol class="grid10">
        ${lijst.map((nr, i) => {
          const d = nr ? drv(r, nr) : null;
          const kant = i % 2 === 0 ? 'links' : 'rechts';
          return `<li class="slotrij ${kant}">
            <button class="slot ${d ? 'vol' : 'leegplek'}" data-plek="${i}"
              style="border-left-color:${d ? esc(d.kleur) : 'var(--stippel)'}"
              aria-label="P${i+1}${d
                ? T(', nu {wie}', { wie: esc(d.naam) }) : T(', nog leeg')}">
              <span class="pos">P${i+1}</span>
              ${d
                ? `<span class="who"><b class="code">${esc(d.code)}</b><small>${esc(d.naam)}</small></span>`
                : `<span class="who">${T('tik om te kiezen')}</span>`}
            </button></li>`;
        }).join('')}
      </ol>` : ''}
    ${coureurVragen(S.tab).length ? `<span class="label">${T('losse vragen')}</span>
      <div class="kiesregels">${coureurVragen(S.tab).map(id => coureurKiezer(r, id)).join('')}</div>` : ''}
    ${extraVragen(S.tab).map(id => extraKiezer(r, id)).join('')}
    ${S.tab === 'race' ? duelKiezer(r) : ''}
    <p class="label" style="margin:0">${T('sluit {wanneer}', {
      wanneer: esc(sluitTekst(deadline)) })}</p>
    <div class="opslaanbalk">
      <button class="knop primair" id="opslaan" ${magOpslaan ? '' : 'disabled'}>${
        magOpslaan ? T('Opslaan')
          : top10Actief(S.tab) && klaar
            ? T('Maak de top 10 af · nog {n}', { n: 10 - klaar })
          : T('Nog niets gekozen')}</button>
      ${klaar || losGekozen
        ? `<button class="knop klein wisknop" id="wisalles">${T('Wis alles')}</button>` : ''}
      <p class="err">${esc(S.fout)}</p>
    </div>
    ${kiesblad(r)}`;

  const sluitBlad = () => { S.kiesplek = null; invulWeergave(paneel, r, dicht); };
  paneel.querySelectorAll('[data-plek]').forEach(b => b.onclick = () => {
    S.kiesplek = { soort: 'top10', index: Number(b.dataset.plek) };
    invulWeergave(paneel, r, dicht);
  });
  paneel.querySelectorAll('[data-vraagplek]').forEach(b => b.onclick = () => {
    S.kiesplek = { soort: 'vraag', id: b.dataset.vraagplek };
    invulWeergave(paneel, r, dicht);
  });
  paneel.querySelectorAll('[data-kiesdrv]').forEach(b => b.onclick = () => {
    const k = S.kiesplek;
    if (k.soort === 'top10') S.keuze[S.tab][k.index] = b.dataset.kiesdrv;
    else S.keuze[k.id] = b.dataset.kiesdrv;
    sluitBlad();
  });
  const dicht2 = paneel.querySelector('#kiesdicht');
  if (dicht2) dicht2.onclick = sluitBlad;
  const leegKnop = paneel.querySelector('#kiesleeg');
  if (leegKnop) leegKnop.onclick = () => {
    const k = S.kiesplek;
    if (k.soort === 'top10') S.keuze[S.tab][k.index] = null;
    else S.keuze[k.id] = '';
    sluitBlad();
  };
  // Naast het blad tikken sluit het ook; anders zit je vast als je van
  // gedachten verandert en het kruisje niet ziet.
  const blad = paneel.querySelector('#kiesblad');
  if (blad) blad.onclick = (ev) => { if (ev.target === blad) sluitBlad(); };
  paneel.querySelectorAll('[data-kies]').forEach(b => b.onclick = () => {
    // Nog een keer op dezelfde tikken haalt de keuze weg; zonder dat zit je
    // eraan vast zodra je een keer misklikt.
    const veld = b.dataset.vraag;
    S.keuze[veld] = zelfde(b.dataset.kies, S.keuze[veld]) ? '' : b.dataset.kies;
    invulWeergave(paneel, r, dicht);
  });
  paneel.querySelectorAll('[data-extra]').forEach(b => b.onclick = () => {
    const id = b.dataset.extra;
    const waarde = EXTRAVRAAG[id].soort === 'getal'
      ? Number(b.dataset.waarde) : b.dataset.waarde === 'true';
    // Nog een keer op hetzelfde tikken haalt de keuze weg, net als bij de
    // coureurvragen. Zonder dat kun je een misklik niet meer terugnemen.
    S.keuze[id] = S.keuze[id] === waarde ? null : waarde;
    invulWeergave(paneel, r, dicht);
  });
  paneel.querySelectorAll('[data-duel]').forEach(b => b.onclick = () => {
    const { duel, tegen } = b.dataset;
    const alGekozen = S.keuze.duels.some(g => zelfde(g, duel));
    // Binnen één team kan er maar één de teamgenoot verslaan, dus de ander
    // gaat er hoe dan ook uit.
    S.keuze.duels = S.keuze.duels.filter(g => !zelfde(g, duel) && !zelfde(g, tegen));
    if (!alGekozen) S.keuze.duels.push(duel);
    invulWeergave(paneel, r, dicht);
  });
  const kop = paneel.querySelector('#kopieer');
  if (kop) kop.onclick = () => { S.keuze.race = [...S.keuze.quali]; invulWeergave(paneel, r, dicht); };
  // Opnieuw beginnen zonder tien keer een kruisje te zoeken. Wist alleen dit
  // tabblad: de kwalificatie en de race zijn twee losse inzendingen, en wie
  // zijn race overdoet wil zijn kwalificatie niet kwijt.
  //
  // Twee tikken in plaats van een confirm(). Die popup is op een telefoon
  // lelijk, hij wordt in sommige browsers geblokkeerd, en hij ziet er precies
  // zo uit als de meldingen die mensen geleerd hebben blind weg te klikken.
  // De knop stelt de vraag gewoon zelf, en vergeet hem na een paar seconden
  // weer — dan is een losse misklik nooit gevaarlijk.
  const wis = paneel.querySelector('#wisalles');
  if (wis) wis.onclick = () => {
    if (wis.dataset.zeker !== 'ja') {
      wis.dataset.zeker = 'ja';
      wis.textContent = T('Alles wissen? Tik nog een keer');
      wis.classList.add('zeker');
      setTimeout(() => {
        // Het scherm kan intussen hertekend zijn; dan is deze knop weg en is
        // er niets meer terug te zetten.
        if (!wis.isConnected) return;
        wis.dataset.zeker = '';
        wis.textContent = T('Wis alles');
        wis.classList.remove('zeker');
      }, 5000);
      return;
    }
    S.keuze[S.tab] = naarPlekken([]);
    for (const id of coureurVragen(S.tab)) S.keuze[id] = '';
    for (const id of extraVragen(S.tab)) S.keuze[id] = null;
    if (S.tab === 'race') S.keuze.duels = [];
    S.fout = '';
    invulWeergave(paneel, r, dicht);
  };
  paneel.querySelector('#opslaan').onclick = async (ev) => {
    const knop = ev.currentTarget;
    knop.disabled = true;                       // dubbeltikken op mobiel
    knop.textContent = T('Bezig met opslaan...');
    S.fout = '';
    try {
      await bewaar();
      // De eigenlijke fix voor "mijn voorspelling is weg": bewaar() schrijft
      // naar de database maar raakt S.preds niet aan. Zonder herladen toont
      // het scherm daarna nog de oude, lege stand.
      await laad();
      S.melding = T('Voorspelling voor {race} opgeslagen.', { race: r.name });
      S.race = null; S.weergave = 'races';
      render();
    } catch (e) {
      S.fout = e.message;
      invulWeergave(paneel, r, dicht);
    }
  };
}

// De grootste losse keuze van het weekend, dus die staat bovenaan en niet
// verstopt onder de top 10. Bewust niet verplicht: niemand hoort te blijven
// hangen op een knop die niet werkt.
// Een vraag waarbij je één coureur aanwijst, als één regel. Twaalf knoppen
// per vraag maakte het scherm onbruikbaar lang; het kiezen gebeurt nu in het
// keuzeblad, dat pas opengaat als je de regel aantikt.
function coureurKiezer(r, id) {
  if (!vraagActief(id)) return '';
  const v = COUREURVRAAG[id];
  const gekozen = S.keuze[id];
  const d = gekozen ? drv(r, gekozen) : null;
  return `
    <button class="kiesregel ${d ? 'vol' : ''}" data-vraagplek="${esc(id)}"
      style="border-left-color:${d ? esc(d.kleur) : 'var(--lijn)'}">
      <span class="nm">${esc(T(v.label))}</span>
      ${d ? `<span class="code">${esc(d.code)}</span>`
          : `<span class="nogleeg">${T('kies')}</span>`}
      <span class="ptn">${puntenVoor(id)}</span>
    </button>`;
}

// Het keuzeblad: één plek of één vraag, en de coureurs om uit te kiezen.
// Doordat je eerst de plek aantikt weet je waar je keuze landt — dat was het
// probleem met een losse lijst onderaan het scherm.
function kiesblad(r) {
  const k = S.kiesplek;
  if (!k) return '';
  const lijst = S.keuze[S.tab];
  const top10 = k.soort === 'top10';
  const huidig = top10 ? lijst[k.index] : S.keuze[k.id];
  // Binnen een top 10 kan dezelfde coureur maar op één plek staan.
  const bezet = (nr) => top10 && lijst.some((x, i) => i !== k.index && zelfde(x, nr));
  const kop = top10
    ? T('wie wordt P{n}?', { n: k.index + 1 })
    : T(COUREURVRAAG[k.id].kop);
  return `
    <div class="kiesblad" id="kiesblad" role="dialog" aria-modal="true" aria-label="${esc(kop)}">
      <div class="kiesblad-in">
        <div class="kiesblad-kop">
          <span class="label">${esc(kop)}</span>
          <button class="x" id="kiesdicht" aria-label="${T('Sluiten')}">×</button>
        </div>
        <div class="kieslijst">
          ${(r.drivers ?? []).map(d => `
            <button class="kiesknop ${zelfde(d.nr, huidig) ? 'gekozen' : ''}"
              data-kiesdrv="${esc(d.nr)}" style="border-left-color:${esc(d.kleur)}"
              ${bezet(d.nr) ? 'disabled' : ''}>
              <span class="code">${esc(d.code)}</span>
              <span class="tm">${esc(stal(d.team))}</span>
            </button>`).join('')}
        </div>
        ${huidig ? `<button class="knop klein" id="kiesleeg">${T('Maak leeg')}</button>` : ''}
      </div>
    </div>`;
}

// De knoppen voor een getal en voor ja/nee. Ze worden twee keer gebruikt: om
// te voorspellen, en om de uitslag met de hand in te vullen. Alleen het
// data-attribuut verschilt, want de twee hangen aan een andere klik.
const AANTALLEN = [0, 1, 2, 3, 4, 5, 6];

function extraKnoppen(id, gekozen, attribuut) {
  const knop = (waarde, tekst) => `
    <button class="wknop extraknop ${waarde === gekozen ? 'gekozen' : ''}"
      data-${attribuut}="${id}" data-waarde="${waarde}"
      aria-pressed="${waarde === gekozen}">
      <span class="code">${tekst}</span>
    </button>`;
  return EXTRAVRAAG[id].soort === 'getal'
    ? `<div class="getallen">${AANTALLEN.map(n => knop(n, n === 6 ? '6+' : n)).join('')}</div>`
    : `<div class="coureurs">${knop(true, 'ja') + knop(false, 'nee')}</div>`;
}

// Een getal of een ja-of-nee is met een paar knoppen klaar; die passen gewoon
// op het scherm en gaan dus niet achter het keuzeblad.
function extraKiezer(r, id) {
  if (!vraagActief(id)) return '';
  const v = EXTRAVRAAG[id];
  const punten = puntenVoor(id);
  const gekozen = S.keuze[id];
  return `
    <div class="winnaarblok">
      <div class="winnaarkop">
        <span class="label">${esc(T(v.kop))}</span>
        <span class="mono" style="color:var(--ink3)">${T('{n} punten', { n: punten })}</span>
      </div>
      ${v.uitleg ? `<p class="zacht" style="margin:0 0 8px">${esc(T(v.uitleg))}</p>` : ''}
      ${extraKnoppen(id, gekozen, 'extra')}
      ${leegAntwoord(gekozen)
        ? `<p class="mono amber" style="margin:0">${
            T('nog niets gekozen · hier liggen {n} punten', { n: punten })}</p>`
        : `<p class="mono groen" style="margin:0">${
            T('jouw antwoord: {wat}', { wat: esc(String(v.toon(gekozen))) })}${
            v.soort === 'getal' ? T(' · eentje ernaast levert nog de helft op') : ''}</p>`}
    </div>`;
}

// Teamgenoot-duels: per team wie van de twee voor de ander eindigt. Je hoeft
// ze niet allemaal in te vullen — alleen wat je kiest telt mee, en de punten
// gaan naar rato. Een duel waar je niets van weet laat je dus gewoon staan.
function duelKiezer(r) {
  if (!vraagActief('teamgenoot_duels')) return '';
  const paren = teamParen(r.drivers);
  if (!paren.length) return '';
  const punten = puntenVoor('teamgenoot_duels');
  const gekozen = S.keuze.duels;
  const isGekozen = (nr) => gekozen.some(g => zelfde(g, nr));
  const klaar = paren.filter(p => isGekozen(p.a.nr) || isGekozen(p.b.nr)).length;
  return `
    <div class="winnaarblok">
      <div class="winnaarkop">
        <span class="label">${T('wie verslaat zijn teamgenoot?')}</span>
        <span class="mono" style="color:var(--ink3)">${T('{n} punten', { n: punten })}</span>
      </div>
      <div class="duels">
        ${paren.map(p => `
          <div class="duel" style="border-left-color:${esc(p.a.kleur)}">
            <span class="tm">${esc(stal(p.team))}</span>
            ${[[p.a, p.b], [p.b, p.a]].map(([c, tegen]) => `
              <button class="wknop duelknop ${isGekozen(c.nr) ? 'gekozen' : ''}"
                data-duel="${esc(c.nr)}" data-tegen="${esc(tegen.nr)}"
                aria-pressed="${isGekozen(c.nr)}">
                <span class="code">${esc(c.code)}</span>
              </button>`).join('')}
          </div>`).join('')}
      </div>
      <p class="duelteller mono ${klaar ? 'groen' : 'amber'}" style="margin:0">${
        T('{n} van de {totaal} duels gekozen · alleen wat je kiest telt mee',
          { n: klaar, totaal: paren.length })}</p>
    </div>`;
}

function uitslagWeergave(r, werkelijk) {
  const mijn = vindPred(r.id, S.ik.id);
  const lijst = mijn?.[SESSIES[S.tab].vraag];
  // Deze uitslag komt niet van OpenF1 en wordt door de sync ook niet meer
  // bijgewerkt, dus dat hoort er gewoon bij te staan.
  const noot = (r[HANDVLAG[S.tab]]
    ? `<p class="label amber" style="margin:0">${
        T('handmatig ingevuld · niet van openf1')}</p>` : '')
    + autoNoot(mijn, S.tab, T('je had hier zelf niets ingeleverd'));
  // De losse vragen hangen aan dezelfde deadline als de top 10 van deze tab.
  const losse = coureurVragen(S.tab).map(id => coureurUitslag(r, mijn, id)).join('')
    + extraVragen(S.tab).map(id => extraUitslag(r, mijn, id)).join('')
    + (S.tab === 'race' ? duelUitslag(r, mijn, werkelijk) : '');
  // Wie alleen de losse vragen invulde heeft wél iets ingeleverd; die mag
  // hier niet "je hebt hier niks ingevuld" te zien krijgen.
  const losIngevuld = coureurVragen(S.tab).some(id => !!antwoordVan(mijn, id))
    || extraVragen(S.tab).some(id => !leegAntwoord(mijn?.[id]))
    || (S.tab === 'race' && !!mijn?.teamgenoot_duels?.length);
  if (!lijst?.length && !losIngevuld) return `
    ${noot}
    <div class="leeg"><span class="label">${T('niets ingevuld')}</span>
      <p class="zacht" style="margin:0">${T('Je hebt hier niks ingevuld.')}</p></div>
    ${andermans(r)}${weekendVoet(r)}`;
  const { regels } = scoreLijst(lijst ?? [], werkelijk);
  const exact = regels.filter(x => x.punten === 5).length;
  return `
    ${noot}
    ${losse}
    <div class="score">
      <span style="display:flex;flex-direction:column;gap:4px">
        <span class="label">${T('jouw punten')}</span>
        <span class="zacht">${regels.length
          ? T('{n} van {totaal} exact voorspeld', { n: exact, totaal: regels.length })
          : T('geen top 10 ingevuld')}</span>
      </span>
      <b class="getal">${scoreTab(mijn, r, S.tab)}</b>
    </div>
    <ul class="strip">
      ${regels.map(x => {
        const d = drv(r, x.nr);
        const raak = x.werkelijk === x.voorspeld;
        const verschil = x.werkelijk === null ? 'dnf'
          : raak ? 'exact'
          : `${x.werkelijk > x.voorspeld ? '↓' : '↑'} ${Math.abs(x.werkelijk - x.voorspeld)}`;
        return `<li class="sr" style="border-left-color:${esc(d.kleur)}">
          <span class="pos">P${x.voorspeld}</span>
          <span class="code">${esc(d.code)}</span>
          <span class="werd">${x.werkelijk
            ? T('werd P{n}', { n: x.werkelijk }) : 'DNF'}</span>
          <span class="delta ${puntKlasse(x.punten)}">${verschil}</span>
          <span class="pts ${puntKlasse(x.punten)}">${x.punten}</span>
        </li>`;
      }).join('')}
    </ul>
    ${bijnaGoedBlok(r, regels)}
    ${andermans(r)}
    ${weekendVoet(r)}`;
}

// Waar zat het 'm in. Dit is de vraag die na afloop in de groepsapp gesteld
// wordt, en de app had het antwoord al staan zonder het te tonen: de lijst
// hierboven zegt per coureur "werd P4", maar niemand telt zelf op waar de
// punten bleven.
//
// Alleen tonen als er iets te zeggen valt. Wie geen enkele coureur binnen twee
// plekken had, heeft niets "zo dichtbij" gehad, en dat dan toch zo noemen leest
// als spot.
function bijnaGoedBlok(r, regels) {
  const { dichtst, scheelde } = bijnaGoed(regels);
  if (!dichtst.length) return '';
  const plekken = (n) => n === 1 ? T('één plek') : T('{n} plekken', { n });
  return `
    <div class="bijna">
      <span class="label">${T('zo dichtbij')}</span>
      <ul class="bijnalijst">
        ${dichtst.slice(0, 3).map(x => {
          const d = drv(r, x.nr);
          return `<li>${T('<b>{code}</b> stond bij jou op P{voorspeld} en werd P{werkelijk} '
            + '— {afstand}, en dat scheelde {scheelde}.',
            { code: esc(d.code), voorspeld: x.voorspeld, werkelijk: x.werkelijk,
              afstand: plekken(x.afstand), scheelde: puntenTekst(x.scheelde) })}</li>`;
        }).join('')}
      </ul>
      ${dichtst.length > 1 ? `<p class="zacht" style="margin:0;font-size:13px">${
        T('Bij elkaar scheelden die net-niets {scheelde}.',
          { scheelde: puntenTekst(scheelde) })}</p>` : ''}
    </div>`;
}

// Onder de uitslag: wie pakte dit weekend de meeste punten, en een knop die
// het geheel als tekst klaarzet voor de groepsapp.
// "Casper & Danny & Davy" is geen Nederlands. Bij twee namen hoort "en", bij
// meer een opsomming met komma's en "en" voor de laatste. Staat hier apart
// omdat weekendWinstTekst() hierboven vanaf drie namen juist géén namen meer
// noemt -- daar past het niet op één regel, hier wel.
function opsomming(namen) {
  if (namen.length <= 1) return namen[0] ?? '';
  return `${namen.slice(0, -1).join(', ')} en ${namen[namen.length - 1]}`;
}

function weekendVoet(r) {
  const winnaars = S.leden.length > 1 ? weekendWinnaars(r) : [];
  const ik = winnaars.some(w => w.mij);
  return `
    ${winnaars.length ? `<span class="label">${T('weekendwinnaar · kwalificatie + race')}</span>
      <div class="rest winnaar">
        <span class="nm">${esc(opsomming(winnaars.map(w => w.naam)))}${
          ik ? ` <span class="jij">${T('jij')}</span>` : ''}</span>
        <span class="t">${winnaars[0].punten}</span>
      </div>` : ''}
    <button class="knop klein" data-kopieer="${esc(r.id)}">${T('Kopieer voor de groepsapp')}</button>
    <textarea class="veld tekstblok hide" readonly rows="9"
      aria-label="${T('Uitslag om zelf te kopiëren')}"></textarea>`;
}

// Lukt het klembord niet — een oude browser, of een pagina die niet over
// https loopt — dan komt de tekst gewoon in beeld om zelf te selecteren.
function knoopKopieer(paneel) {
  paneel.querySelectorAll('[data-kopieer]').forEach(knop => knop.onclick = async () => {
    const race = S.races.find(x => zelfde(x.id, knop.dataset.kopieer));
    const tekst = race ? groepsappTekst(race) : '';
    if (!tekst) return;
    const veld = paneel.querySelector('.tekstblok');
    const gelukt = await naarKlembord(tekst);
    if (gelukt) {
      knop.textContent = T('Gekopieerd');
      setTimeout(() => { knop.textContent = T('Kopieer voor de groepsapp'); }, 2400);
    } else {
      knop.textContent = T('Kopiëren lukt niet, selecteer hem zelf');
      veld.value = tekst;
      veld.classList.remove('hide');
      veld.select();
    }
  });
}

function coureurUitslag(r, mijn, id) {
  if (!vraagActief(id)) return '';
  const v = COUREURVRAAG[id];
  const punten = puntenVoor(id);
  const werkelijk = v.uitslag(r);
  const gekozen = antwoordVan(mijn, id);
  // Een losse uitslag die nog niet binnen is: dan valt er ook nog niets over
  // te zeggen, ook niet dat je hem hebt laten liggen.
  if (!werkelijk.length) return v.kolom ? wachtOpUitslag(T(v.label)) : '';
  if (!gekozen) {
    return `<p class="label amber" style="margin:0">${
      T('{wat} · {n} punten laten liggen', { wat: esc(T(v.mis)), n: punten })}</p>`;
  }
  const d = drv(r, gekozen);
  const gescoord = Math.round(scoreEerste(gekozen, werkelijk, punten)
    * contrairVoor(r, id, gekozen));
  const plek = werkelijk.findIndex(x => zelfde(x, gekozen));
  // Bij een uitslag die maar één naam lang is zegt "werd P4" niets; dan is
  // het nuttiger om te zien wie het wél werd.
  const mis = v.kolom
    ? T('het werd {wie}', { wie: esc(drv(r, werkelijk[0]).code) })
    : plek === -1 ? T('niet gefinisht') : T('werd P{n}', { n: plek + 1 });
  return `
    <span class="label">${T('{wat} · {n} punten', { wat: esc(T(v.label)), n: punten })}${
      esc(contrairNoot(r, id, gekozen))}${
      r[v.vlag] ? ` · ${T('handmatig ingevuld')}` : ''}</span>
    <div class="sr" style="border-left-color:${esc(d.kleur)}">
      <span class="pos">${v.letter}</span>
      <span class="code">${esc(d.code)}</span>
      <span class="werd">${gescoord ? esc(T(v.goed)) : mis}</span>
      <span class="pts ${gescoord ? 'v5' : 'v0'}">${gescoord}</span>
    </div>`;
}

function extraUitslag(r, mijn, id) {
  if (!vraagActief(id)) return '';
  const v = EXTRAVRAAG[id];
  const punten = puntenVoor(id);
  const werkelijk = r[v.kolom] ?? null;
  const gekozen = mijn?.[id] ?? null;
  if (leegAntwoord(werkelijk)) return wachtOpUitslag(T(v.label));
  if (leegAntwoord(gekozen)) {
    return `<p class="label amber" style="margin:0">${
      T('{wat} · {n} punten laten liggen', { wat: esc(T(v.mis)), n: punten })}</p>`;
  }
  const gescoord = Math.round(v.score(gekozen, werkelijk, punten)
    * contrairVoor(r, id, gekozen));
  return `
    <span class="label">${T('{wat} · {n} punten', { wat: esc(T(v.label)), n: punten })}${
      esc(contrairNoot(r, id, gekozen))}${
      r[v.vlag] ? ` · ${T('handmatig ingevuld')}` : ''}</span>
    <div class="sr">
      <span class="pos">${v.letter}</span>
      <span class="code">${esc(String(v.soort === 'getal' ? gekozen
        : (gekozen ? T('ja') : T('nee'))))}</span>
      <span class="werd">${zelfde(gekozen, werkelijk)
        ? T('precies goed')
        : T('het werd {wat}', { wat: esc(String(v.toon(werkelijk))) })}</span>
      <span class="pts ${zelfde(gekozen, werkelijk) ? 'v5' : gescoord ? 'v3' : 'v0'}">${gescoord}</span>
    </div>`;
}

// Een uitslag die er nog niet is. Zelf invullen kan niet meer: races is één
// tabel voor alle poules, dus wie hier iets intypte veranderde de uitslag voor
// iedereen die dit seizoen volgt. Onder vrienden was dat een waarschuwing
// waard, publiek is het een knop waarmee één iemand elke poule sloopt. De sync
// draait elk uur, dus wachten is het antwoord.
const wachtOpUitslag = (label) =>
  `<p class="label" style="margin:0">${label} · ${T('uitslag volgt nog')}</p>`;

// De duels na afloop: per team wie het werd, en of jouw keuze klopte. Alleen
// de duels waar je een keuze in maakte staan erbij; de rest heb je niet
// gespeeld en telt ook niet mee.
function duelUitslag(r, mijn, werkelijk) {
  if (!vraagActief('teamgenoot_duels')) return '';
  const paren = teamParen(r.drivers);
  const gekozen = mijn?.teamgenoot_duels ?? [];
  const punten = puntenVoor('teamgenoot_duels');
  if (!paren.length || !werkelijk?.length) return '';
  if (!gekozen.length) {
    return `<p class="label amber" style="margin:0">${T('geen duels gekozen · {n} punten laten liggen',
      { n: punten })}</p>`;
  }
  const plek = (nr) => {
    const i = werkelijk.findIndex(x => zelfde(x, nr));
    return i === -1 ? Infinity : i;
  };
  const gespeeld = paren
    .map(p => ({ p, keuze: gekozen.find(g => zelfde(g, p.a.nr) || zelfde(g, p.b.nr)) }))
    .filter(x => x.keuze && !(plek(x.p.a.nr) === Infinity && plek(x.p.b.nr) === Infinity));
  const totaal = scoreDuels(gekozen, werkelijk, paren, punten);
  return `
    <span class="label">${T('teamgenoot-duels · {behaald} van {punten} punten',
      { behaald: totaal, punten })}</span>
    <ul class="strip">
      ${gespeeld.map(({ p, keuze }) => {
        const won = plek(p.a.nr) < plek(p.b.nr) ? p.a : p.b;
        const mijnD = drv(r, keuze);
        const raak = zelfde(keuze, won.nr);
        return `<li class="sr" style="border-left-color:${esc(p.a.kleur)}">
          <span class="pos">${esc(stal(p.team)).slice(0, 3)}</span>
          <span class="code">${esc(mijnD.code)}</span>
          <span class="werd">${raak ? T('won het duel')
            : T('verloor van {wie}', { wie: esc(won.code) })}</span>
          <span class="pts ${raak ? 'v5' : 'v0'}">${raak ? '✓' : '✗'}</span>
        </li>`;
      }).join('')}
    </ul>`;
}

function andermans(r) {
  const anderen = S.leden.filter(l => !zelfde(l.member_id, S.ik.id));
  if (!anderen.length) return '';
  const werkelijk = r[SESSIES[S.tab].uitslag];
  const rijen = anderen.map(l => {
    const p = vindPred(r.id, l.member_id);
    // Eerder hing dit aan een ingevulde top 10. Wie alleen de pole of een
    // paar duels invulde stond dan op "—" terwijl hij gewoon punten had.
    const deed = heeftVoorspeld(r, l.member_id);
    // En wie niets inleverde maar wel automatisch is aangevuld heeft ook
    // punten; die horen hier te staan, met erbij hoe ze eraan komen.
    const auto = isAuto(p, S.tab);
    return { id: l.member_id, naam: l.display_name, deed, auto,
             punten: werkelijk && (deed || auto) ? scoreTab(p, r, S.tab) : null };
  }).sort((a,b) => (b.punten ?? -1) - (a.punten ?? -1));
  // De rijen zijn knoppen: hierachter zit de hele inzending van die speler.
  // Dat kan pas nu — deze functie wordt alleen op een gesloten scherm
  // getekend, en vulPaneel() controleert het nog een keer.
  return `<span class="label">${
      T('de rest · tik op een naam om hun voorspelling te zien')}</span>
    ${rijen.map(x => `<button class="rest inkijk" data-bekijk="${esc(x.id)}">
      <span class="nm">${esc(x.naam)}</span>
      <span class="zacht">${x.deed ? T('bekijken')
        : x.auto ? T('automatisch ingevuld') : T('niets ingevuld')}</span>
      <span class="t">${x.punten ?? '—'}</span>
    </button>`).join('')}`;
}

function knoopBekijk(paneel) {
  paneel.querySelectorAll('[data-bekijk]').forEach(b => b.onclick = () => {
    S.bekijk = b.dataset.bekijk;
    vulPaneel();
  });
}

// Het scherm achter een naam: wat die speler heeft ingeleverd, en wat het
// opleverde. Precies hetzelfde overzicht als van jezelf — daarom staat het
// maar één keer in keuzeOverzicht().
function bekijkWeergave(paneel, r) {
  const lid = S.leden.find(l => zelfde(l.member_id, S.bekijk));
  if (!lid) { S.bekijk = null; vulPaneel(); return; }
  const pred = vindPred(r.id, lid.member_id);
  const werkelijk = r[SESSIES[S.tab].uitslag];
  paneel.innerHTML = `
    <div class="inkijkkop">
      <button class="knop klein" id="inkijkterug">← ${T('terug')}</button>
      <span class="nm">${esc(lid.display_name)}</span>
      ${werkelijk ? `<span class="t">${scoreTab(pred, r, S.tab)}</span>` : ''}
    </div>
    ${keuzeOverzicht(r, pred, S.tab)}`;
  paneel.querySelector('#inkijkterug').onclick = () => { S.bekijk = null; vulPaneel(); };
}

// ============================================================
//  Een inzending terugkijken, zonder eraan te kunnen zitten
// ============================================================

/**
 * Twee vragen die eigenlijk dezelfde zijn:
 *
 *   "Als de kwalificatie begint kan ik niet meer zien wat ik gekozen had."
 *   "Ik wil zien wat de andere spelers gekozen hebben."
 *
 * Allebei willen ze een ingeleverde voorspelling zien zonder eraan te kunnen
 * zitten. Dus staat dat hier één keer, met één verschil erin: is de uitslag
 * binnen, dan komt er per regel bij wat het werd en wat het opleverde. Is hij
 * er nog niet, dan is dit puur een spiegel van wat er ingeleverd is — dan
 * staat er geen puntenkolom, want die bestaat op dat moment nog niet.
 *
 * Bewust niet uitslagWeergave() hergebruikt: die is van jou, gaat over de
 * uitslag en heeft er de weekendwinnaar, de knop voor de groepsapp en de
 * losse invoervelden omheen. Dit is van iemand, gaat over de inzending, en
 * mag nergens een knop hebben.
 */
function keuzeOverzicht(r, pred, welk) {
  const werkelijk = r[SESSIES[welk].uitslag];
  const lijst = pred?.[SESSIES[welk].vraag];
  const wat = T(SESSIES[welk].wat);

  const iets = !!lijst?.length
    || coureurVragen(welk).some(id => !!antwoordVan(pred, id))
    || extraVragen(welk).some(id => !leegAntwoord(pred?.[id]))
    || (welk === 'race' && !!pred?.teamgenoot_duels?.length);
  const auto = autoNoot(pred, welk, T('deze speler leverde zelf niets in'));
  if (!iets) return `<div class="leeg"><span class="label">${T('niets ingevuld')}</span>
    <p class="zacht" style="margin:0">${
      T('Voor {wat} is hier niets ingeleverd.', { wat })}</p></div>`;


  const { regels } = scoreLijst(lijst ?? [], werkelijk ?? []);
  // Geen top 10 ingevuld is net zo goed een antwoord als "niets gekozen" bij
  // een losse vraag, en verdient dezelfde regel. Zonder dit stond er hier
  // simpelweg niets — geen top 10, maar ook geen woord over waarom niet, dus
  // leek het alsof het scherm iets kwijt was in plaats van dat er niets was
  // ingeleverd.
  const top10 = !top10Actief(welk) ? '' : regels.length ? `
    <span class="label">${T('top 10')}</span>
    <ul class="strip">
      ${regels.filter(x => x.nr).map(x => {
        const d = drv(r, x.nr);
        return `<li class="sr" style="border-left-color:${esc(d.kleur)}">
          <span class="pos">P${x.voorspeld}</span>
          <span class="code">${esc(d.code)}</span>
          <span class="werd">${werkelijk
            ? (x.werkelijk ? T('werd P{n}', { n: x.werkelijk }) : 'DNF')
            : esc(d.naam)}</span>
          ${werkelijk ? `<span class="pts ${puntKlasse(x.punten)}">${x.punten}</span>` : ''}
        </li>`;
      }).join('')}
    </ul>` : `<p class="label" style="margin:0">${T('top 10 · niets ingevuld')}</p>`;

  const los = coureurVragen(welk).map(id => {
    const v = COUREURVRAAG[id];
    const gekozen = antwoordVan(pred, id);
    if (!gekozen) {
      return `<p class="label" style="margin:0">${
        T('{wat} · niets gekozen', { wat: esc(T(v.label)) })}</p>`;
    }
    const d = drv(r, gekozen);
    const uit = v.uitslag(r);
    // null betekent "daar valt nog niets over te zeggen" en is iets anders
    // dan nul punten. Zonder dat onderscheid staat er een dikke 0 bij een
    // vraag waarvan de uitslag simpelweg nog niet binnen is.
    const gescoord = uit.length ? scoreEerste(gekozen, uit, puntenVoor(id)) : null;
    return `
      <span class="label">${esc(T(v.label))}</span>
      <div class="sr" style="border-left-color:${esc(d.kleur)}">
        <span class="pos">${v.letter}</span>
        <span class="code">${esc(d.code)}</span>
        <span class="werd">${gescoord === null ? esc(d.naam)
          : gescoord ? esc(T(v.goed))
            : T('het werd {wie}', { wie: esc(drv(r, uit[0]).code) })}</span>
        ${gescoord === null ? '' : `<span class="pts ${gescoord ? 'v5' : 'v0'}">${gescoord}</span>`}
      </div>`;
  }).join('');

  const extra = extraVragen(welk).map(id => {
    const v = EXTRAVRAAG[id];
    const punten = puntenVoor(id);
    const gekozen = pred?.[id] ?? null;
    if (leegAntwoord(gekozen)) {
      return `<p class="label" style="margin:0">${
        T('{wat} · niets gekozen', { wat: esc(T(v.label)) })}</p>`;
    }
    const echt = r[v.kolom] ?? null;
    const gescoord = leegAntwoord(echt) ? null : v.score(gekozen, echt, punten);
    return `
      <span class="label">${esc(T(v.label))}</span>
      <div class="sr">
        <span class="pos">${v.letter}</span>
        <span class="code">${esc(String(v.toon(gekozen)))}</span>
        <span class="werd">${gescoord === null ? T('uitslag volgt nog')
          : gescoord === punten ? T('precies goed')
          : T('het werd {wat}', { wat: esc(String(v.toon(echt))) })}</span>
        ${gescoord === null ? ''
          : `<span class="pts ${gescoord === punten ? 'v5' : gescoord ? 'v3' : 'v0'}">${gescoord}</span>`}
      </div>`;
  }).join('');

  const duelblok = welk !== 'race' || !vraagActief('teamgenoot_duels') ? '' : (() => {
    const gekozen = pred?.teamgenoot_duels ?? [];
    if (!gekozen.length) {
      return `<p class="label" style="margin:0">${T('teamgenoot-duels · niets gekozen')}</p>`;
    }
    const paren = teamParen(r.drivers)
      .filter(p => gekozen.some(g => zelfde(g, p.a.nr) || zelfde(g, p.b.nr)));
    if (!paren.length) return '';
    const plek = (nr) => {
      const i = (werkelijk ?? []).findIndex(x => zelfde(x, nr));
      return i === -1 ? Infinity : i;
    };
    return `
      <span class="label">${T('teamgenoot-duels · {n} gekozen', { n: paren.length })}</span>
      <ul class="strip">
        ${paren.map(p => {
          const keuze = gekozen.find(g => zelfde(g, p.a.nr) || zelfde(g, p.b.nr));
          const d = drv(r, keuze);
          const tegen = zelfde(keuze, p.a.nr) ? p.b : p.a;
          // Twee coureurs die allebei uitvielen leveren geen winnaar op.
          const beslist = !!werkelijk && !(plek(p.a.nr) === Infinity && plek(p.b.nr) === Infinity);
          const won = beslist ? (plek(p.a.nr) < plek(p.b.nr) ? p.a : p.b) : null;
          const raak = !!won && zelfde(keuze, won.nr);
          return `<li class="sr" style="border-left-color:${esc(p.a.kleur)}">
            <span class="pos">${esc(stal(p.team)).slice(0, 3)}</span>
            <span class="code">${esc(d.code)}</span>
            <span class="werd">${!beslist
              ? T('tegen {wie}', { wie: esc(tegen.code) })
              : raak ? T('won het duel')
                : T('verloor van {wie}', { wie: esc(won.code) })}</span>
            ${beslist ? `<span class="pts ${raak ? 'v5' : 'v0'}">${raak ? '✓' : '✗'}</span>` : ''}
          </li>`;
        }).join('')}
      </ul>`;
  })();

  return `${auto}${top10}${los}${extra}${duelblok}`;
}

// ============================================================
//  Eén keer gevraagd: wil je koppelen?
//
//  "Ik denk wel dat als mensen de app openen voor de 1e keer, dat moeten ze
//  de keuze krijgen of ze willen inloggen of niet." Tot nu toe stond die
//  keuze verstopt op het Poule-tabblad — precies het scherm dat iemand die
//  net drie tikken verder is (poulecode, naam, klaar) nog nooit gezien
//  heeft. Zonder dit ontdekt iemand het bestaan van een reservesleutel pas
//  nadat hij hem nodig had, en dat is precies andersom.
//
//  Verschijnt daarom precies één keer: direct nadat iemand voor het eerst
//  een speler claimt, vóór het eerste scherm van de poule. Nooit meer
//  daarna, ook niet in een tweede poule op hetzelfde toestel —
//  magKoppelVraagTonen() hieronder onthoudt dat met dezelfde localStorage-
//  aanpak als de rest van dit bestand. En nadrukkelijk geen verplichting:
//  "nu niet" is een net zo grote knop als koppelen, en komt op precies
//  hetzelfde scherm uit als koppelen zou hebben gedaan.
// ============================================================

const KOPPELGEVRAAGD = 'poule:koppelgevraagd';

// Heeft het nog zin om dit te vragen? Al gekoppeld, of al eens gevraagd (wat
// er ook uit kwam): dan is er niets meer te winnen, en nog een keer vragen
// is geen hulp meer maar nagging.
function magKoppelVraagTonen() {
  return !DEMO && !!mijnUid && !kanTerugkomen() && !lees(KOPPELGEVRAAGD);
}

// Is déze speler, ná de claimpoging, echt van dit account? Niet vanzelfsprekend:
// één account mag maar één speler per poule hebben, dus wie zijn telefoon
// doorgeeft aan een tweede speler ziet die speler wél aangemaakt worden, maar
// zonder dat hij aan mijnUid komt te hangen (claimSpeler() raakt dan niets).
// Zonder deze controle zou de koppel-vraag na zo'n aanmelding "Welkom Joey"
// zeggen en vervolgens Google aan Danny's account hangen — het account van
// wie toevallig het toestel vasthield, niet van wie er net bij kwam.
function isNuVanMij(memberId) {
  const lid = S.leden.find(l => zelfde(l.member_id, memberId));
  return !!lid?.user_id && zelfde(lid.user_id, mijnUid);
}

function koppelVraagScherm() {
  schrijf(KOPPELGEVRAAGD, '1');
  app.innerHTML = `
    <div class="toegang"><div class="kaart"><div class="baan"></div>
      <div class="kaart-in">
        <div class="merk">
          <span class="blok"></span>
          <span class="naam">RacePicks</span>
          <span class="code">${esc(S.poule.join_code ?? S.poule.name)}</span>
        </div>
        <div>
          <h1 class="middel">${T('Welkom,')}<br>${esc(S.ik.naam)}</h1>
          <p class="zacht" style="margin:12px 0 0">${T('Je speelt al mee — dit is '
            + 'de enige keer dat we dit vragen.')}</p>
        </div>
        ${S.melding ? `<div class="meldingbalk"><div class="melding">${esc(S.melding)}</div></div>` : ''}
        ${mailBlok()}
        <div class="scheiding"></div>
        <button class="knop spook" id="koppelnunniet" style="min-height:56px">
          Nu niet, ik speel liever anoniem</button>
      </div>
    </div></div>`;
  S.melding = '';
  knoopMail();
  app.querySelector('#koppelnunniet').onclick = () => render();
}

// ============================================================
//  Wie ben je? — vervangt de login
// ============================================================

function puntenVan(memberId) {
  let punten = 0;
  for (const r of S.races) {
    if (!heeftUitslag(r)) continue;
    punten += scoreWeekend(vindPred(r.id, memberId), r);
  }
  return punten;
}

function kiesSpeler() {
  app.innerHTML = `
    <div class="toegang"><div class="kaart"><div class="baan"></div>
      <div class="kaart-in">
        <div class="merk">
          <span class="blok"></span>
          <span class="naam">RacePicks</span>
          <span class="code">${esc(S.poule.join_code ?? S.poule.name)}</span>
        </div>
        <div>
          <h1 class="middel">${T('Wie ben jij?')}</h1>
          <p class="zacht" style="margin:8px 0 0">${T('Tik op je naam. '
            + 'De app onthoudt je op dit toestel.')}</p>
        </div>
        <div class="veldblok" id="lijst"></div>
        <div class="scheiding"></div>
        <div class="veldblok">
          <span class="label">${T('nieuwe speler')}</span>
          <input class="veld" id="naam" placeholder="${T('Jouw naam')}" autocomplete="name">
          <button class="knop spook" id="maak">${T('Meedoen')}</button>
          <p class="err" id="f"></p>
        </div>
      </div>
    </div></div>`;

  const gesorteerd = [...S.leden]
    .map(l => ({ ...l, punten: puntenVan(l.member_id) }))
    .sort((a, b) => b.punten - a.punten || String(a.display_name).localeCompare(String(b.display_name)));

  app.querySelector('#lijst').innerHTML = gesorteerd.map((l, i) => `
    <button class="speler ${i === 0 ? 'zelf' : ''}" data-lid="${esc(l.member_id)}"
      style="animation-delay:${(i * .06).toFixed(2)}s">
      <span class="nr">${String(i + 1).padStart(2,'0')}</span>
      <span class="nm">${esc(l.display_name)}</span>
      <span class="ptn">${T('{n} ptn', { n: l.punten })}</span>
    </button>`).join('')
    || `<p class="zacht" style="margin:0">${
         T('Nog geen spelers, maak de eerste aan.')}</p>`;

  app.querySelectorAll('[data-lid]').forEach(b => b.onclick = async () => {
    const lid = S.leden.find(l => zelfde(l.member_id, b.dataset.lid));
    S.ik = { id: lid.member_id, naam: lid.display_name };
    onthoud(S.poule.id, S.ik.id);
    // Alleen een verse claim is een moment om over koppelen te beginnen. Was
    // deze speler al van iemand — ikzelf op een ouder toestel, of iemand
    // anders — dan is er niets "voor het eerst" aan, en zou de vraag hier
    // misplaatst zijn.
    const eersteKeer = !lid.user_id;
    if (eersteKeer) await claimSpeler(lid.member_id);
    // Hangt deze speler aan een ander account, dan kun je hier wel meekijken
    // maar niets opslaan. Dat nú zeggen is stukken beter dan het te laten
    // merken bij de eerste voorspelling die niet bewaard wordt.
    if (nietVanMij()) {
      S.melding = T('{wie} hoort bij een ander toestel. Je kunt hier meekijken, '
        + 'maar niets opslaan. Log in met je mailadres om hier ook {wie} te zijn.',
        { wie: lid.display_name });
    }
    try {
      await laad();
      // isNuVanMij() en niet eersteKeer: een gedeeld toestel kan deze speler
      // aanmaken zonder hem te claimen (één account, één speler per poule),
      // en dan is er niets om over te koppelen.
      if (eersteKeer && isNuVanMij(lid.member_id) && magKoppelVraagTonen()) {
        koppelVraagScherm(); return;
      }
      render();
    } catch (e) { toonFout(e.message); }
  });

  app.querySelector('#maak').onclick = async () => {
    const naam = app.querySelector('#naam').value.trim();
    if (!naam) { app.querySelector('#f').textContent = T('Vul een naam in'); return; }

    // Bestaat die naam al in deze poule, dan is dit dezelfde persoon op een
    // ander toestel. Een tweede speler aanmaken zou hem zijn voorspellingen
    // kosten: die hangen aan het oude member_id en horen dan bij niemand meer.
    const bestaand = S.leden.find(l =>
      (l.display_name ?? '').trim().toLowerCase() === naam.toLowerCase());
    if (bestaand) {
      S.ik = { id: bestaand.member_id, naam: bestaand.display_name };
      onthoud(S.poule.id, S.ik.id);
      const eersteKeer = !bestaand.user_id;
      if (eersteKeer) await claimSpeler(bestaand.member_id);
      S.melding = T('Welkom terug, {naam}.', { naam: bestaand.display_name });
      try {
        await laad();
        if (eersteKeer && isNuVanMij(bestaand.member_id) && magKoppelVraagTonen()) {
          koppelVraagScherm(); return;
        }
        render();
      }
      catch (e) { app.querySelector('#f').textContent = e.message; }
      return;
    }

    if (DEMO) {
      const id = 'm' + (S.leden.length + 1);
      S.leden.push({ member_id:id, display_name:naam });
      S.ik = { id, naam }; onthoud(S.poule.id, id); render(); return;
    }
    const { data, error } = await maakSpeler(S.poule.id, naam);
    if (error) { app.querySelector('#f').textContent = uitleg(error); return; }
    S.ik = { id: data.member_id, naam };
    onthoud(S.poule.id, data.member_id);
    try {
      await laad();
      // Ook hier: pas de vraag stellen als deze gloednieuwe speler ook echt
      // van dit account is. Op een gedeeld toestel waar al iemand anders
      // speelt lukt claimSpeler() niet — één account, één speler per poule
      // — en dan zou "wil je koppelen" Google aan de verkeerde persoon
      // hangen.
      if (isNuVanMij(data.member_id) && magKoppelVraagTonen()) {
        koppelVraagScherm(); return;
      }
      render();
    }
    catch (e) { app.querySelector('#f').textContent = e.message; }
  };
}

// ============================================================
//  Poule aanmaken in vier stappen
//  Eén vraag per scherm. Werkt op een telefoon beter dan één lang
//  formulier, en de vragenset krijgt zo de aandacht die hij nodig heeft:
//  hij ligt vast zodra de eerste race gescoord is.
// ============================================================

const MAAKSTAPPEN = ['Hoe heet de poule?', 'Hoe heet jij?',
                     'Wat gaan jullie voorspellen?', 'Klaar'];

function startAanmaken() {
  S.maak = { stap: 1, naam: '', beschrijving: '', speler: '',
             vragen: [...PRESETS.klassiek.vragen],
             eigen: false, bezig: false, fout: '', poule: null, ik: null };
  laadVragen()
    .then(render)
    .catch(e => { S.maak.fout = e.message; render(); });
  render();
}

function maakPagina() {
  const m = S.maak;
  const preset = welkPreset(m.vragen);
  app.innerHTML = `
    <div class="toegang"><div class="kaart"><div class="baan"></div>
      <div class="kaart-in">
        <div class="merk">
          <span class="blok"></span>
          <span class="naam">RacePicks</span>
          <span class="code">${T('stap {n} van 4', { n: m.stap })}</span>
        </div>
        <div class="stappen">
          ${MAAKSTAPPEN.map((_, i) => `<span class="stap ${i + 1 <= m.stap ? 'aan' : ''}"></span>`).join('')}
        </div>
        <h1 class="groot">${esc(T(MAAKSTAPPEN[m.stap - 1]))}</h1>
        ${maakStap(m, preset)}
        <p class="err" id="f">${esc(m.fout)}</p>
      </div>
    </div></div>`;
  maakKnoppen(m);
}

function maakStap(m, preset) {
  if (m.stap === 1) return `
    <div class="veldblok">
      <input class="veld" id="pnaam" placeholder="${T('Vrijdagmiddagpoule')}"
        value="${esc(m.naam)}" autocomplete="off">
      <p class="zacht" style="margin:0">${
        T('Zo heet hij in de app en in de uitnodiging.')}</p>
      <span class="label">${T('waar gaat het over? (mag leeg)')}</span>
      <input class="veld" id="pomschrijving" placeholder="${T("Met de collega's, om de eer")}"
        value="${esc(m.beschrijving)}" autocomplete="off" maxlength="120">
      <p class="zacht" style="margin:0">${T('Handig als je in meer dan één poule zit: '
        + 'dit staat erbij als je wisselt.')}</p>
      <button class="knop primair" id="verder">${T('Volgende')}</button>
      <button class="knop spook" id="terugstap">${T('Terug')}</button>
    </div>`;

  if (m.stap === 2) return `
    <div class="veldblok">
      <input class="veld" id="snaam" placeholder="${T('Jouw naam')}"
        value="${esc(m.speler)}" autocomplete="name">
      <p class="zacht" style="margin:0">${T('Je wordt meteen het eerste lid, en de '
        + 'poulebaas — die kan later de vragenset aanpassen.')}</p>
      <button class="knop primair" id="verder">${T('Volgende')}</button>
      <button class="knop spook" id="terugstap">${T('Terug')}</button>
    </div>`;

  if (m.stap === 3) return `
    <div class="veldblok">
      <div class="presets">
        ${Object.entries(PRESETS).map(([sleutel, p]) => `
          <button class="preset ${preset === sleutel ? 'aan' : ''}" data-preset="${sleutel}"
            aria-pressed="${preset === sleutel}">
            <span class="nm">${esc(T(p.naam))}</span>
            <span class="zacht">${esc(T(p.uitleg))}</span>
            <span class="ptn">${weekendSom(p.vragen)}</span>
          </button>`).join('')}
      </div>
      <button class="knop spook" id="eigen">${m.eigen
        ? T('Verberg de losse vragen') : T('Zelf samenstellen')}</button>
      <div class="vragenlijst ${m.eigen ? '' : 'hide'}">${vragenLijst(m.vragen)}</div>
      ${vragenVoet(m.vragen)}
      <button class="knop primair" id="verder" ${m.vragen.length && !m.bezig ? '' : 'disabled'}>${
        m.bezig ? T('Bezig met aanmaken...') : T('Poule aanmaken')}</button>
      <button class="knop spook" id="terugstap" ${m.bezig ? 'disabled' : ''}>${
        T('Terug')}</button>
    </div>`;

  return `
    <div class="veldblok">
      <span class="label">${T('poulecode')}</span>
      <div class="veld code" style="display:grid;place-items:center">${esc(m.poule.join_code)}</div>
      <p class="zacht" style="margin:0">${T('Deel deze code, of stuur de link — dan '
        + 'hoeft niemand hem over te tikken.')}</p>
      <div class="scheiding"></div>
      <button class="knop spook" id="uitnodiging">${T('Kopieer uitnodigingslink')}</button>
      <textarea class="veld tekstblok hide" id="uitnodigingveld" readonly rows="3"
        aria-label="${T('Uitnodiging om zelf te kopiëren')}"></textarea>
      <button class="knop primair" id="klaar">${T('Naar de poule')}</button>
    </div>`;
}

function maakKnoppen(m) {
  const fout = (t) => { S.maak.fout = t; app.querySelector('#f').textContent = t; };
  const terug = app.querySelector('#terugstap');
  if (terug) terug.onclick = () => {
    // Vanaf de eerste stap terug is: toch maar meedoen met een bestaande poule.
    if (m.stap === 1) { S.maak = null; render(); return; }
    m.stap -= 1; m.fout = ''; render();
  };

  const naamveld = app.querySelector('#pnaam') ?? app.querySelector('#snaam');
  if (naamveld) {
    naamveld.focus();
    naamveld.oninput = () => {
      if (m.stap === 1) m.naam = naamveld.value; else m.speler = naamveld.value;
    };
    naamveld.onkeydown = (ev) => { if (ev.key === 'Enter') app.querySelector('#verder').click(); };
  }
  const omschrijving = app.querySelector('#pomschrijving');
  if (omschrijving) {
    omschrijving.oninput = () => { m.beschrijving = omschrijving.value; };
    omschrijving.onkeydown = (ev) => {
      if (ev.key === 'Enter') app.querySelector('#verder').click();
    };
  }

  app.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    m.vragen = [...PRESETS[b.dataset.preset].vragen]; m.fout = ''; render();
  });
  const eigen = app.querySelector('#eigen');
  if (eigen) eigen.onclick = () => { m.eigen = !m.eigen; render(); };
  app.querySelectorAll('[data-vraag-aan]').forEach(b => b.onclick = () => {
    const id = b.dataset.vraagAan;
    m.vragen = m.vragen.includes(id) ? m.vragen.filter(x => x !== id) : [...m.vragen, id];
    m.fout = ''; render();
  });

  const verder = app.querySelector('#verder');
  if (verder) verder.onclick = async () => {
    if (m.stap === 1) {
      if (!m.naam.trim()) { fout(T('Vul een naam voor de poule in')); return; }
      m.stap = 2; m.fout = ''; render(); return;
    }
    if (m.stap === 2) {
      if (!m.speler.trim()) { fout(T('Vul je eigen naam in')); return; }
      m.stap = 3; m.fout = ''; render(); return;
    }
    if (!m.vragen.length) { fout(T('Kies minstens één vraag')); return; }
    m.bezig = true; m.fout = ''; render();
    try { await pouleAanmaken(m); }
    catch (e) { m.bezig = false; fout(e.message); return; }
    m.bezig = false; m.stap = 4; render();
  };

  knoopUitnodiging(app, m.poule);
  const klaar = app.querySelector('#klaar');
  if (klaar) klaar.onclick = async () => {
    S.poule = m.poule; S.ik = m.ik;
    onthoudPoule(S.poule.id); onthoudInLijst(S.poule); onthoud(S.poule.id, S.ik.id);
    S.maak = null; S.weergave = 'races'; S.race = null;
    try { await laad(); } catch (e) { toonFout(e.message); }
    render();
  };
}

// De vier schrijfacties achter stap 3. Wat al gelukt is blijft staan in m,
// zodat een tweede poging na een fout geen tweede poule aanmaakt.
async function pouleAanmaken(m) {
  if (DEMO) {
    m.poule = { id:'p-nieuw', name:m.naam.trim(), beschrijving:m.beschrijving.trim() || null,
                join_code:'DEMO01', season:SEIZOEN };
    m.ik = { id:'m-nieuw', naam:m.speler.trim() };
    return;
  }
  // Eén functie voor het hele aanmaken: de poule, jezelf, het baasschap en de
  // vragenset. Waren vier aanroepen, en dan bleef er bij een fout onderweg
  // een halve poule achter -- wel een poule maar geen speler, of wel een
  // speler en geen vragen. Nu is het één transactie die slaagt of niets doet.
  // Dat de aanmaker meteen poulebaas is dwingt de database nu zelf af.
  await zorgVoorAccount();
  const { data, error } = await db.rpc('poule_aanmaken', {
    p_naam: m.naam.trim(),
    p_beschrijving: m.beschrijving.trim() || null,
    p_speler: m.speler.trim(),
    p_vragen: m.vragen,
  });
  if (error) throw new Error(uitleg(error));
  m.poule = data.poule;
  m.ik = { id: data.ik.member_id, naam: data.ik.display_name };
}

// ---- wat is dit eigenlijk? ----------------------------------
// Wie een uitnodiging krijgt weet waar hij aan begint. Wie hier via een link

//
// En het staat onder het codeveld, niet erboven. Wie wél een code heeft moet
// die meteen kunnen intikken zonder eerst langs een uitleg te scrollen.
// ---- openbare poules: meedoen zonder code --------------------
// De voordeur blijft de code — dat is en blijft de snelste weg voor
// verreweg de meeste mensen. Dit is de uitzondering: wie geen code heeft
// maar wel mee wil doen met een poule die de poulebaas bewust vindbaar
// heeft gezet. Dichtgeklapt en onderaan, net als de andere blokken die niet
// voor iedereen zijn.
function openbarePoulesBlok() {
  if (DEMO) return '';
  const o = S.openbaar;
  if (!o.open) {
    return `<div class="scheiding"></div>

        <p class="zacht" style="margin:0">${T('Geen code? Blader door poules die '

}

// ---- op je beginscherm zetten --------------------------------
// De app was al installeerbaar — manifest.webmanifest staat er, met een eigen
// venster en maskable pictogrammen — maar nergens stond dát het kon. Op
// Android geeft de browser ons een echte prompt; op een iPhone of iPad bestaat
// die API niet en is de enige weg Deel → "Zet op beginscherm". Daar moet je
// mensen dus met zoveel woorden naartoe wijzen.
const INSTALLWEG = 'poule:installweg';

// De prompt van de browser, als hij hem aanbiedt. Hij komt één keer langs en
// is daarna op: bewaren is de enige manier om er een eigen knop van te maken.
let installPrompt = null;

const alGeinstalleerd = () =>
  matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

// Een iPad meldt zich sinds iPadOS 13 als een Mac; het aanraakscherm is wat
// hem verraadt.
const isApple = () => /iPhone|iPad|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// Het deel-teken van iOS, inline. Een instructie die naar een knop verwijst
// die je niet laat zien is een halve instructie.
const DEEL_ICOON = `<svg class="deelicoon" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round"
  stroke-linejoin="round" aria-hidden="true">
  <path d="M12 3v13"/><path d="M8 7l4-4 4 4"/>
  <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>
</svg>`;

function installBlok() {
  if (DEMO || alGeinstalleerd() || lees(INSTALLWEG)) return '';
  // Geen prompt en geen Apple: dan kan deze browser het niet, of hij heeft
  // nog niet laten weten dat het kan. Dan maar niets beloven.
  if (!installPrompt && !isApple()) return '';
  const kop = `<div class="scheiding"></div>
    <div class="veldblok">
      <span class="label">${T('op je beginscherm')}</span>
      <p class="zacht" style="margin:0">${T('Zet RacePicks op je beginscherm, dan '
        + 'opent hij als een app: eigen tegel, eigen venster, geen adresbalk.')}</p>`;
  if (installPrompt) {
    return `${kop}
      <button class="knop spook" id="installeer">${T('Zet op beginscherm')}</button>
      <button class="knop klein" id="installweg">${T('Nu niet')}</button>
    </div>`;
  }
  return `${kop}
      <p class="zacht" style="margin:0">${T('Tik onderin op {deel} <b>Deel</b> en kies '
        + '<b>Zet op beginscherm</b>.', { deel: DEEL_ICOON })}</p>
      <button class="knop klein" id="installweg">${T('Nu niet')}</button>
    </div>`;
}

addEventListener('beforeinstallprompt', (ev) => {
  // Zonder dit toont Chrome zijn eigen balk onderin. Liever onze eigen knop,
  // op het moment dat de speler er iets aan heeft.
  ev.preventDefault();
  installPrompt = ev;
  // Alleen opnieuw tekenen als het beginscherm nu openstaat. Dit kan ook
  // binnenkomen terwijl iemand een poule aan het aanmaken is, en dan zou een

  if (app.querySelector('#code')) toonStart();
