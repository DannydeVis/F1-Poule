}

async function pushAanzetten() {
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  // Pas vragen als er ook echt iets mee gedaan wordt. Een browser onthoudt een
  // weigering, dus een prompt op het verkeerde moment kost je die kans.
  const recht = await Notification.requestPermission();
  if (recht !== 'granted') {
    S.push = recht === 'denied' ? 'geweigerd' : 'uit';
    throw new Error(T('Zonder toestemming kan er geen melding komen.'));
  }
  const ab = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: sleutelBytes(VAPID_PUBLIEK),
  });
  const j = ab.toJSON();
  const { error } = await db.from('push_abonnementen').upsert({
    endpoint: j.endpoint, member_id: S.ik.id, pool_id: S.poule.id,
    p256dh: j.keys.p256dh, auth: j.keys.auth, laatst: null, taal: TAAL,
  }, { onConflict: 'endpoint' });
  if (error) throw new Error(uitleg(error));
  S.push = 'aan';
  S.melding = T('Meldingen staan aan op dit toestel.');
}

// Alleen als er op dit toestel ook echt een abonnement ligt. Zonder die
// controle zou elke taalwissel een update naar de database sturen die nul
// rijen raakt.
async function pushTaalBijwerken() {
  try {
    if (!pushKan() || !db || !S.ik) return;
    const reg = await navigator.serviceWorker.getRegistration();
    const ab = reg ? await reg.pushManager.getSubscription() : null;
    if (!ab) return;
    await db.from('push_abonnementen').update({ taal: TAAL }).eq('endpoint', ab.endpoint);
  } catch { /* een herinnering in de vorige taal is geen reden om iets te melden */ }
}

async function pushUitzetten() {
  const reg = await navigator.serviceWorker.getRegistration();
  const ab = reg ? await reg.pushManager.getSubscription() : null;
  if (ab) {
    // Eerst de rij weg en dan pas afmelden: andersom weet je het endpoint niet
    // meer als het afmelden lukt maar het verwijderen niet, en blijft er een
    // rij achter waar nooit meer iets aankomt.
    const { error } = await db.from('push_abonnementen').delete().eq('endpoint', ab.endpoint);
    if (error) throw new Error(uitleg(error));
    await ab.unsubscribe();
  }
  S.push = 'uit';
  S.melding = T('Meldingen staan uit op dit toestel.');
}

// Een speler in de lijst onder Poule. Voor de poulebaas staat er soms één
// knop bij, en die is er om een probleem op te lossen dat anders niet op te
// lossen is.
//
// Wie op het "Wie ben jij?"-scherm op een naam klikt, claimt die speler voor
// dat toestel. Dat is de bedoeling — zo hoort een speler bij een account —
// maar één misklik, of een telefoon die je uitleent, en iemands hele seizoen
// hangt aan het verkeerde account. De database laat dat daarna niet meer
// terugdraaien: precies wat je wilt tegen een vreemde, precies wat je niet
// wilt tegen een vergissing.
//
// Vandaar deze uitweg, en alleen deze: de poulebaas maakt de speler los, en
// de volgende die zichzelf aanwijst claimt hem opnieuw. Zie schema.sql,
// policy pool_members_bijwerken.
function spelerRij(r, i) {
  const lid = S.leden.find(l => zelfde(l.member_id, r.id));
  const bijEenAnder = lid?.user_id && !zelfde(lid.user_id, mijnUid);
  const los = S.ik && magBeheren() && bijEenAnder
    ? `<button class="losmaak" data-losmaken="${esc(r.id)}"

           { naam: esc(r.naam) })}">${T('losmaken')}</button>`
    : '';
  return `<div class="speler ${r.mij ? 'zelf' : ''}" style="animation:none">
    <span class="nr">${String(i + 1).padStart(2,'0')}</span>
    <span class="nm">${esc(r.naam)}</span>

// De knop stelt zijn eigen vraag, net als "Wis alles": een confirm() is lelijk,
// wordt geblokkeerd, en ziet eruit als de melding die iedereen blind wegklikt.
function knoopLosmaken() {
  app.querySelectorAll('[data-losmaken]').forEach(knop => knop.onclick = async () => {
    if (knop.dataset.zeker !== 'ja') {
      knop.dataset.zeker = 'ja';
      knop.textContent = T('zeker weten?');
      setTimeout(() => {
        if (!knop.isConnected) return;
        knop.dataset.zeker = ''; knop.textContent = 'losmaken';
      }, 5000);
      return;
    }
    knop.disabled = true;
    const id = knop.dataset.losmaken;
    // .select('member_id') en niet .select(): dat laatste vraagt om alle
    // kolommen, en op pool_members staat leesrecht per kolom (profiel_code
    // hoort niet bij wat je medespelers mogen zien). Eén kolom is genoeg om
    // te weten of de update een rij raakte.
    const { data, error } = await db.from('pool_members')
      .update({ user_id: null }).eq('member_id', id).select('member_id');
    if (error || !data?.length) {
      S.melding = error ? uitleg(error)
        : T('Losmaken lukte niet. Alleen de poulebaas mag dat, en de database '
          + 'controleert dat zelf ook.');
    } else {
      const naam = S.leden.find(l => zelfde(l.member_id, id))?.display_name ?? T('Die speler');
      S.melding = T('{naam} is losgemaakt. Wie zich nu als {naam} aanmeldt, is '
        + '{naam}.', { naam });
    }
    try { await laad(); } catch (e) { toonFout(e.message); return; }
    render();
  });
}

// ---- je seizoen delen buiten de poule -----------------------
//
// Dit stond op de lijst met "bewust niet gebouwd", en het bezwaar was dat het
// de deur weer openzet die fase 0 dichtdeed: een publiek profiel dat je poule
// uitleest is precies wat daar afgesloten is.
//
// Daarom werkt het andersom. Je eigen app rekent je cijfers uit -- met exact
// dezelfde functies die de stand tekenen -- en legt dat als één blokje jsonb
// op je eigen spelersrij. De publieke pagina leest alleen dat blokje, via een
// functie die niets anders kan teruggeven. Er gaat dus geen enkel leesrecht
// open, en er is nog steeds maar één plek waar de punten uitgerekend worden.
//
// Wat erin gaat is met opzet karig: jouw naam, jouw getallen, en "van 6
// spelers" zonder te zeggen wie die vijf anderen zijn of hoe de poule heet.
// Dat is van hen, niet van jou.
function maakSnapshot() {
  const rijen = standRijen();
  const i = rijen.findIndex(r => r.mij);
  if (i === -1) return null;
  const gescoord = S.races.filter(heeftUitslag);
  const beste = gescoord
    .map(r => ({ naam: r.name, punten: scoreWeekend(vindPred(r.id, S.ik.id), r) }))
    .sort((a, b) => b.punten - a.punten)[0] ?? null;
  // Hoeveel plekken je precies goed had, over het hele seizoen. Hetzelfde
  // getal dat op een uitslagscherm onder "x van de 10 exact voorspeld" staat.
  let exact = 0;
  for (const r of gescoord) {
    const p = vindPred(r.id, S.ik.id);
    if (!p) continue;
    for (const w of weekendSessies(r)) {
      exact += scoreLijst(p[SESSIES[w].vraag] ?? [], r[SESSIES[w].uitslag] ?? [])
        .regels.filter(x => x.punten === 5).length;
    }
  }
  return {
    naam: S.ik.naam,
    seizoen: seizoen(),
    punten: rijen[i].punten,
    plek: i + 1,
    spelers: rijen.length,
    gereden: gescoord.length,
    races: S.races.length,
    beste,
    exact,
    bijgewerkt: new Date().toISOString(),
  };
}

// Een code van acht tekens, en niet je member_id: dat id staat in je eigen
// link waarmee je jezelf meeneemt, en die hoort juist geheim te blijven.
const nieuweProfielCode = () => {
  const bytes = new Uint8Array(6);
  crypto.getRandomValues(bytes);
  return [...bytes].map(b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
};

async function deelAanzetten() {
  const snapshot = maakSnapshot();
  if (!snapshot) throw new Error(T('Er valt nog niets te delen.'));
  const code = nieuweProfielCode();
  const { error } = await db.from('pool_members')
    .update({ profiel_code: code, profiel: snapshot }).eq('member_id', S.ik.id);
  if (error) throw new Error(uitleg(error));
  const rij = S.leden.find(l => zelfde(l.member_id, S.ik.id));
  if (rij) { rij.profiel_code = code; rij.profiel = snapshot; }
  S.melding = T('Je pagina staat online.');
}

async function deelUitzetten() {
  const { error } = await db.from('pool_members')
    .update({ profiel_code: null, profiel: null }).eq('member_id', S.ik.id);
  if (error) throw new Error(uitleg(error));
  const rij = S.leden.find(l => zelfde(l.member_id, S.ik.id));
  if (rij) { rij.profiel_code = null; rij.profiel = null; }
  S.melding = T('Je pagina is weggehaald.');
}

// Eén keer per minuut mag hij kijken of er iets veranderd is, en dat is ruim
// genoeg: render() draait bij elke klik en dit hoeft niet per klik.
let laatsteSnapshot = 0;
function misschienSnapshot() {
  if (!S.ik || !S.poule || Date.now() - laatsteSnapshot < 60e3) return;
  laatsteSnapshot = Date.now();
  // Fire-and-forget: een mislukte bijwerking van je publieke pagina mag nooit
  // een scherm ophouden of een foutmelding opleveren. De pagina is dan gewoon
  // even niet bij.
  ververSnapshot().catch(() => {});
}

// Bijwerken zodra je de app opent, maar alleen als het echt anders is. Anders
// schrijft elke keer laden een rij weg voor een getal dat niet veranderd is.
async function ververSnapshot() {
  if (DEMO || !S.ik) return;
  const rij = ikRij();
  if (!rij?.profiel_code) return;
  const nieuw = maakSnapshot();
  if (!nieuw) return;
  const oud = rij.profiel ?? {};
  const zelfdeCijfers = ['punten', 'plek', 'spelers', 'gereden', 'exact', 'naam']
    .every(k => String(oud[k]) === String(nieuw[k]))
    && String(oud.beste?.punten) === String(nieuw.beste?.punten);
  if (zelfdeCijfers) return;
  rij.profiel = nieuw;
  await db.from('pool_members').update({ profiel: nieuw }).eq('member_id', S.ik.id);
}

// De publieke pagina. Eén kaart met cijfers, en verder niets: geen poule, geen
// medespelers, geen navigatie naar binnen. Wat hier staat is wat de speler
// zelf gepubliceerd heeft, en het komt uit één functie die niets anders kan
// teruggeven.
async function toonProfiel(code) {
  app.innerHTML = `<div class="toegang"><div class="kaart"><div class="kaart-in">
    <p class="zacht" style="margin:0">${T('Even kijken…')}</p></div></div></div>`;
  let p = null, stuk = false;
  try {
    const { data, error } = await db.rpc('publiek_profiel', { p_code: code });
    if (error) stuk = true; else p = data;
  } catch { stuk = true; }

  const omheen = (binnen) => `
    <div class="toegang"><div class="kaart"><div class="baan"></div>
      <div class="kaart-in">
        <div class="merk">
          <span class="blok"></span>
          <span class="naam">RacePicks</span>
          <span class="code">${esc(String(p?.seizoen ?? seizoen()))}</span>
        </div>
        ${binnen}
      </div>
    </div></div>`;

  const zonder = (tekst) => omheen(`
    <div>
      <h1 class="groot">${esc(tekst)}</h1>
      <p class="zacht" style="margin:12px 0 0">${T('Misschien is de pagina '
        + 'weggehaald, of klopt de link niet helemaal.')}</p>
    </div>
    <a class="knop" href="${esc(location.pathname)}">${T('Naar RacePicks')}</a>`);
  if (stuk) { app.innerHTML = zonder(T('Dat lukte even niet')); return; }
  if (!p) { app.innerHTML = zonder(T('Deze pagina bestaat niet')); return; }

  const getal = (label, waarde, klein = '') => `
    <div class="pgetal">
      <span class="label">${esc(label)}</span>
      <b>${esc(String(waarde))}</b>
      ${klein ? `<span class="zacht">${esc(klein)}</span>` : ''}
    </div>`;

  app.innerHTML = omheen(`
    <div>
      <h1 class="groot">${esc(p.naam ?? T('Speler'))}</h1>
      <p class="zacht" style="margin:12px 0 0">${T('Zo staat het ervoor in de poule.')}</p>
    </div>
    <div class="pgetallen">
      ${getal(T('punten'), p.punten ?? 0)}
      ${getal(T('plek'), p.plek ? rang(p.plek) : '—', T('van {n}', { n: p.spelers ?? '?' }))}
      ${getal(T('races'), p.gereden ?? 0, T('van {n}', { n: p.races ?? '?' }))}
    </div>
    <div class="veldblok">
      ${p.beste ? `<p class="zacht" style="margin:0">${T('Beste weekend: <b>{naam}</b> met {punten} punten.',
        { naam: esc(p.beste.naam), punten: esc(String(p.beste.punten)) })}</p>` : ''}
      ${p.exact ? `<p class="zacht" style="margin:0">${T('{n} keer een coureur precies op de goede plek gezet.',
        { n: esc(String(p.exact)) })}</p>` : ''}
      <p class="zacht" style="margin:0">${T('Dit is één speler uit een vriendenpoule. '
        + 'De poule zelf, de medespelers en wie wat voorspelde staan hier niet — '
        + 'die zie je alleen als je meedoet.')}</p>
    </div>
    <a class="knop primair" href="${esc(location.pathname)}">${T('Zelf een poule beginnen')}</a>
    ${p.bijgewerkt ? `<p class="label" style="margin:0">${T('bijgewerkt {wanneer}',
      { wanneer: esc(datumKort(p.bijgewerkt)) })}</p>` : ''}`);
}

// De twee manieren om weg te gaan. Het verschil is niet cosmetisch, dus het
// staat er ook zo: de eerste laat de poule van je medespelers heel, de tweede
// haalt je uit hun stand.
function weggaanBlok() {
  if (!mijnUid) return '';
  return `
    <p class="zacht" style="margin:14px 0 0">${T('<b>Weggaan</b><br>'
      + 'Je hebt twee keuzes, en ze verschillen echt van elkaar.')}</p>
    <button class="knop klein" id="wegaccount">${T('Mijn account verwijderen')}</button>
    <p class="zacht" style="margin:0;font-size:13px">${T('Je account en je mailadres '
      + 'gaan weg. Je spelers blijven in de poule staan met hun naam en punten, zodat '
      + 'de stand van de anderen blijft kloppen — ze horen alleen bij niemand '
      + 'meer.')}</p>
    <button class="knop klein" id="wegalles">${T('Alles verwijderen')}</button>
    <p class="zacht" style="margin:0;font-size:13px">${T('Ook je spelers en al je '
      + 'voorspellingen, in elke poule. Je verdwijnt daarmee ook uit de stand van je '
      + 'medespelers. Dit is niet terug te draaien.')}</p>
    <p class="err" id="wegfout">${esc(S.privacy.fout)}</p>`;
}

function knoopPrivacy() {
  const open = app.querySelector('#privacyopen');
  if (open) open.onclick = () => { S.privacy = { open: true, fout: '' }; render(); };

  const weg = async (knop, ookSpelers, vraag) => {
    if (knop.dataset.zeker !== 'ja') {
      const oorspronkelijk = knop.textContent;
      knop.dataset.zeker = 'ja';
      knop.textContent = vraag;
      setTimeout(() => {
        if (!knop.isConnected) return;
        knop.dataset.zeker = ''; knop.textContent = oorspronkelijk;
      }, 6000);
      return;
    }
    knop.disabled = true;
    const fout = (t) => { const e = app.querySelector('#wegfout'); if (e) e.textContent = t; };
    try {
      const { error } = await db.rpc('verwijder_mijn_account', { p_ook_spelers: ookSpelers });
      if (error) throw new Error(uitlegVerwijderen(error));
      await db.auth.signOut().catch(() => {});
      vergeetMijOpDitToestel();
      location.reload();
    } catch (e) {
      knop.disabled = false;
      fout(e.message);
    }
  };

  const a = app.querySelector('#wegaccount');
  if (a) a.onclick = () => weg(a, false, T('Account verwijderen? Tik nog een keer'));
  const b = app.querySelector('#wegalles');
  if (b) b.onclick = () => weg(b, true, T('Alles verwijderen? Tik nog een keer'));
}

// Na het verwijderen wijst dit toestel nog naar spelers die van niemand meer
// zijn, of die er helemaal niet meer zijn. Het lijstje met poules blijft wel
// staan: je kunt best weer meedoen, en de code opnieuw moeten opvragen is
// nergens voor nodig.
function vergeetMijOpDitToestel() {
  try {
    for (const k of Object.keys(localStorage)) {
      if (k.startsWith('poule:') && k !== POULES && k !== LAATSTE) localStorage.removeItem(k);
    }
  } catch { /* niets te doen */ }
}

// De functie draait als `security definer`; komt hij niet aan auth.users, dan
// is dat geen fout van de speler en heeft "probeer opnieuw" geen zin.
function uitlegVerwijderen(error) {
  const bericht = String(error?.message ?? '');
  if (/permission denied|must be owner|insufficient/i.test(bericht)) {
    return T('De database mag dit account niet verwijderen. Dat is iets om aan '
         + 'de beheerder te melden — zie BEDIENING.md §12.');
  }
  if (/function .*verwijder_mijn_account.* does not exist|PGRST202/i.test(bericht)
      || error?.code === 'PGRST202') {
    return T('Deze database kent het verwijderen nog niet. Draai schema.sql '
         + 'opnieuw in de Supabase SQL editor.');
  }
  return bericht || T('Het verwijderen is niet gelukt.');
}

function knoopMail() {
  const open = app.querySelector('#mailopen');
  if (open) open.onclick = () => { S.mail = { open: true, fout: '', gestuurd: '' }; render(); };

  const google = app.querySelector('#googlekoppel');
  if (google) google.onclick = async () => {
    google.disabled = true;
    const uit = await koppelGoogle();
    // Lukt het, dan is de browser inmiddels onderweg naar Google en zien we
    // dit scherm niet meer terug. Staat er wél een fout, dan is er niets
    // gebeurd en moet dat te lezen zijn.
    if (uit.fout) { google.disabled = false; S.mail = { ...S.mail, fout: uit.fout }; render(); }
  };

  const stuur = async (adres, knop) => {
    const mail = String(adres ?? '').trim();
    const fout = (t) => { const p = app.querySelector('#mailfout'); if (p) p.textContent = t; };
    if (!mail) { fout(T('Vul je mailadres in')); return; }
    knop.disabled = true;
    const uit = await koppelMail(mail);
    knop.disabled = false;
    // Ook bij een fout onthouden we het adres niet als "gestuurd": anders
    // blijft er een scherm staan dat op een mail wacht die nooit komt.
    S.mail = { open: !!uit.fout, fout: uit.fout, gestuurd: uit.fout ? '' : mail };
    render();
  };

  const knop = app.querySelector('#mailstuur');
  if (knop) knop.onclick = () => stuur(app.querySelector('#mailveld')?.value, knop);

  const opnieuw = app.querySelector('#mailopnieuw');
  if (opnieuw) opnieuw.onclick = () =>
    stuur(mijnWachtendeMail() || S.mail.gestuurd, opnieuw);
}

// ---- omschrijving -------------------------------------------
// Eén regel over waar de poule voor is. Wie in twee of drie poules zit heeft
// er iets aan: "Vrijdagmiddagpoule" en "Poule 2026" zijn allebei geen antwoord
// op de vraag welke van de twee die van het werk is. Hij staat onder de naam
// en bij het wisselen tussen poules.
//
// Alleen de poulebaas kan hem aanpassen, om dezelfde reden als bij de
// vragenset: de database controleert nog niet wie dat is, dus dit houdt de
// knop weg bij wie hem niet nodig heeft. Zie BEDIENING.md §7.
function omschrijvingBlok() {
  if (!magBeheren()) return '';
  const nu = S.omschrijving ?? S.poule.beschrijving ?? '';
  return `
    <div class="scheiding"></div>
    <label class="label" for="pouleomschrijving">${T('waar gaat het over?')}</label>
    <input class="veld" id="pouleomschrijving" maxlength="120" autocomplete="off"
      placeholder="${T("Met de collega's, om de eer")}" value="${esc(nu)}">
    <div style="display:flex;gap:8px">
      <button class="knop klein" id="omschrijvingBewaren"
        ${schoon(nu) === schoon(S.poule.beschrijving) ? 'disabled' : ''}>${
        T('Omschrijving opslaan')}</button>
    </div>
    <p class="err" id="omschrijvingfout">${esc(S.omschrijvingFout)}</p>`;
}

const schoon = (t) => String(t ?? '').trim();

function knoopOmschrijving() {
  const veld = app.querySelector('#pouleomschrijving');
  const bewaren = app.querySelector('#omschrijvingBewaren');
  if (!veld || !bewaren) return;

  // Bij elke toetsaanslag opnieuw tekenen zou de cursor uit het veld gooien,
  // dus de knop wordt hier met de hand aan- en uitgezet.
  veld.oninput = () => {
    S.omschrijving = veld.value;
    bewaren.disabled = schoon(veld.value) === schoon(S.poule.beschrijving);
  };
  veld.onkeydown = (ev) => { if (ev.key === 'Enter' && !bewaren.disabled) bewaren.click(); };

  bewaren.onclick = async () => {
    const tekst = schoon(veld.value);
    bewaren.disabled = true;
    bewaren.textContent = T('Bezig...');
    try {
      // Leeg opslaan is de omschrijving weghalen, niet een lege regel bewaren:
      // anders staat er straks een leeg zinnetje onder de naam.
      await omschrijvingBewaren(tekst || null);
      S.omschrijving = null; S.omschrijvingFout = '';
      S.melding = tekst ? T('De omschrijving is bijgewerkt.')
        : T('De omschrijving is weggehaald.');
    } catch (e) { S.omschrijvingFout = e.message; }
    render();
  };
}

async function omschrijvingBewaren(tekst) {
  if (!DEMO) {
    const { error } = await db.from('pools')
      .update({ beschrijving: tekst }).eq('id', S.poule.id);
    if (error) throw new Error(uitleg(error));
  }
  S.poule.beschrijving = tekst;
  // Ook in het lijstje op dit toestel, anders staat de oude tekst er nog bij
  // als je straks tussen je poules wisselt.
  onthoudInLijst(S.poule);
}

// Zolang er één seizoen is staat hier niets: een keuzelijst met één regel erin
// is geen keuze, en een lege balk boven elke kalender is alleen maar ruis.
//
// Hij staat boven de kalender en boven de stand, en niet in de kop bovenaan.
// Die kop bestaat op een telefoon namelijk niet -- daar staat `.kop` op
// display:none en heeft elke pagina zijn eigen titel. Iets wat je moet kunnen
// bedienen hoort dus in de pagina zelf.
function seizoenBalk() {
  const jaren = gespeeldeSeizoenen();
  if (jaren.length < 2) return '';
  return `
    <label class="seizoenbalk">
      <span class="label">${T('seizoen')}</span>
      <select id="seizoenkeuze" aria-label="${T('Welk seizoen wil je zien')}">
        ${jaren.map(j => `<option value="${j}" ${j === seizoen() ? 'selected' : ''}>${j}${
          j === pouleSeizoen() ? '' : ` · ${T('afgelopen')}`}</option>`).join('')}
      </select>
    </label>`;
}

function knoopSeizoen() {
  const keuze = app.querySelector('#seizoenkeuze');
  if (keuze) keuze.onchange = () => {
    kiesSeizoen(Number(keuze.value));
    // Een race van het oude seizoen blijft anders openstaan naast een
    // kalender die hem niet meer kent.
    S.race = null; S.bekijk = null;
    render();
  };
  const nieuw = app.querySelector('#nieuwSeizoenKnop');
  if (!nieuw) return;
  nieuw.onclick = async () => {
    nieuw.disabled = true;
    const volgend = pouleSeizoen() + 1;
    try {
      if (!DEMO) {
        const { error } = await db.from('pools')
          .update({ season: volgend }).eq('id', S.poule.id);
        if (error) throw new Error(uitleg(error));
      }
      S.poule.season = volgend;
      // Opnieuw laden, want de kalender van het nieuwe seizoen staat nog niet
      // in S.alleRaces -- die is opgehaald tot en met het oude.
      await laad();
      kiesSeizoen(volgend);
      S.race = null; S.bekijk = null;
      S.melding = T('Jullie spelen nu seizoen {jaar}. {vorig} blijft te bekijken '
        + 'via de keuzelijst boven de kalender.', { jaar: volgend, vorig: volgend - 1 });
    } catch (e) { S.melding = e.message; }
    render();
  };
}

// De poulebaas schuift het seizoen door. Alleen als dit seizoen echt klaar is:
// zolang er nog een race te rijden valt zou doorschuiven betekenen dat die
// nergens meer te zien is.
function nieuwSeizoenBlok() {
  if (!magBeheren()) return '';
  const vanDitJaar = S.alleRaces.filter(r => zelfde(r.season, pouleSeizoen()));
  const klaar = vanDitJaar.length > 0 && vanDitJaar.every(r => heeftUitslag(r) || r.afgelast);
  return `
    <div class="scheiding"></div>
    <span class="label">${T('seizoen {jaar}', { jaar: pouleSeizoen() })}</span>
    <p class="zacht" style="margin:0">${klaar
      ? T('Alle races van {jaar} zijn gereden. Doorschuiven naar {volgend} zet de '
        + 'kalender van volgend jaar klaar; dit jaar blijft gewoon te bekijken via de '
        + 'keuzelijst bovenaan, met de stand en alles wat erbij hoort. De vragenset '
        + 'en de spelers gaan mee.',
        { jaar: pouleSeizoen(), volgend: pouleSeizoen() + 1 })
      : T('Er moet nog gereden worden dit seizoen. Zodra de laatste race erop zit '
        + 'kun je hier doorschuiven naar {volgend}. Dit jaar blijft daarna te '
        + 'bekijken; er gaat niets weg.', { volgend: pouleSeizoen() + 1 })}</p>
    <button class="knop klein" id="nieuwSeizoenKnop" ${klaar ? '' : 'disabled'}>${
      T('Begin aan {jaar}', { jaar: pouleSeizoen() + 1 })}</button>`;
}
