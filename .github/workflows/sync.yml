name: Uitslagen synchroniseren

on:
  # Elk uur. Was eerst elke 3 uur, maar GitHub Actions garandeert een
  # geplande tijd niet — bij drukte (en dat is precies tijdens elke
  # kwalificatie en race) kan een run een paar uur later starten dan
  # gepland. Bij elke 3 uur duurde het dan soms 5 tot 6 uur voor een
  # uitslag binnenkwam. Elk uur maakt zo'n vertraging minder erg voelen,
  # zonder dat het iets extra's kost: bij niks nieuws doet de run toch
  # niets.
  schedule:
    - cron: '0 * * * *'

  # Knop in het Actions-tabblad om hem handmatig te starten.
  workflow_dispatch:
    inputs:
      kalender:
        description: 'Ook de kalender opnieuw ophalen'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Voor het vastleggen van kalender.ics hieronder. Verder schrijft deze
    # workflow niets in de repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Synchroniseren met OpenF1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEIZOEN: '2026'
          KALENDER: ${{ inputs.kalender }}
        run: node scripts/sync.mjs

      # De sync schrijft kalender.ics alleen als er echt iets veranderd is, dus
      # deze stap doet meestal niets. Wie zich op die agenda geabonneerd heeft
      # krijgt een verschoven sessie zo vanzelf binnen.
      #
      # De pull --rebase is er voor de zeldzame samenloop dat automerge net een
      # pull request in main zet terwijl deze run bezig is.
      - name: De agenda vastleggen als hij veranderd is
        run: |
          if git diff --quiet -- kalender.ics; then
            echo "Agenda ongewijzigd, niets vast te leggen"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kalender.ics
          git commit -m "Agenda bijgewerkt door de sync"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
