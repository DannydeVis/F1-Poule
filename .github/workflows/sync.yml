name: Uitslagen synchroniseren

on:
  # Vier keer per uur, elke dag. Niet omdat het vier keer per uur hoeft, maar
  # omdat GitHub een geplande tijd niet garandeert en er veel meer van wegvalt
  # dan je zou denken.
  #
  # Dit stond op '0 * * * *' met erboven de aanname dat het dan ook elk uur
  # draait. Nageteld over zes dagen klopte dat niet:
  #
  #     ingesteld        24 keer per dag
  #     werkelijk        5 a 7 keer per dag
  #     kortste gat      1u55
  #     langste gat      4u59
  #     gaten < 1 uur    geen enkele
  #
  # Er is dus niets veranderd toen dit van elke 3 uur naar elk uur ging:
  # het was elke 2 tot 5 uur, en het bleef elke 2 tot 5 uur. GitHub laat
  # geplande runs vallen bij drukte, en dat is precies tijdens een
  # raceweekend.
  #
  # Vier pogingen per uur maakt de kans dat er eentje doorkomt groter. Een
  # garantie is het niet — GitHub kan er net zo goed drie van de vier laten
  # vallen — en dit is de enige knop die we hebben zonder een server erbij.
  # Kosten zijn er niet: de repo is openbaar, dus Actions-minuten zijn
  # gratis, en een run zonder nieuws is in een seconde of tien klaar.
  #
  # BIJGEWERKT de dag na deze wijziging: controle-sync.mjs liet zien dat het
  # niet hielp. Van 19:44 tot 06:31 uur — bijna twaalf uur na het instellen
  # van deze cron — kwamen er precies vier runs door, met gaten tot 5u15. Dat
  # is niet beter dan de oude '0 * * * *'.
  #
  # De reden staat in GitHub's eigen community-discussies (community#201738,
  # community#185355): nieuwe accounts en repo's zonder opgebouwde
  # "trust score" komen in een laagprioritaire wachtrij terecht die een paar
  # keer per dag geleegd wordt, ongeacht welke cron er staat. Deze repo is
  # sinds 24 augustus 2026 in gebruik — precies het profiel waar dat op
  # slaat. Een fijnere cron kan dat plafond niet doorbreken; vaker vragen dan
  # dit heeft dus geen zin totdat GitHub deze repo anders indeelt.
  #
  # Wat wél helpt, en waar deze cron nu voor dient: elke keer dat GitHub een
  # run wél oppakt is de kans groot dat het toevallig in een van de
  # hercontrolevensters van opnieuwNakijken() valt (die zijn met opzet 6 tot
  # 12 uur breed). De vensters zijn dus niet naast dit probleem gebouwd — ze
  # zijn de manier waarop de sync dit probleem overleeft.
  #
  # Waarom hier geen raceweekend in staat, terwijl dat de vraag was: cron kent
  # de kalender niet. Het weekend zit daarom in sync.mjs, waar de kalender wél
  # bekend is — opnieuwNakijken() bepaalt wanneer er iets te doen valt, en
  # buiten het verversvenster haalt de sync niet eens de sessielijst op.
  #
  # En op de dagen filteren gaat mis. Uit kalender.ics van dit seizoen:
  #
  #     kwalificatie   23x zaterdag, 1x vrijdag  (Baku)
  #     race           23x zondag,   1x zaterdag (Baku)
  #     tijden         04:00 tot 21:00 UTC
  #
  # Baku schuift een hele dag op, en het tweede hercontrolevenster van een race
  # om 21:00 UTC valt op dinsdagochtend. Een cron van vrijdag tot en met zondag
  # mist die allebei, en dat is precies het weekend waarin het misgaat.
  schedule:
    - cron: '*/15 * * * *'
    # Eén keer per dag ook de kalender opnieuw ophalen, zoals de knop
    # hieronder. Rond de jaarwisseling haalt de sync de kalender van het
    # volgende seizoen al op zodra OpenF1 hem heeft (scripts/seizoenen.mjs),
    # en tot de eerste race kan daar nog van alles aan schuiven: een tijd, een
    # datum, een race die er later bij komt. Midden in het seizoen vangt dit
    # een verschoven of geschrapte race, waar eerst iemand voor op de knop
    # moest drukken. Valt deze run een dag weg (zie hierboven), dan is de
    # volgende dag er weer een.
    - cron: '23 4 * * *'

  # Knop in het Actions-tabblad om hem handmatig te starten.
  workflow_dispatch:
    inputs:
      kalender:
        description: 'Ook de kalender opnieuw ophalen'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Voor het vastleggen van kalender.ics hieronder. Verder schrijft deze
    # workflow niets in de repo.
    permissions:
      contents: write
      # Voor de wekker hieronder: een workflow starten.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Synchroniseren met OpenF1
        id: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Geen SEIZOEN meer: de sync kiest zelf welke seizoenen er lopen en
          # wanneer de kalender van volgend jaar opgehaald wordt. Stond hier
          # op '2026', en dan was 2027 nooit opgehaald. Zie
          # scripts/seizoenen.mjs. Wie met de hand één seizoen wil draaien
          # kan SEIZOEN nog steeds meegeven.
          KALENDER: ${{ inputs.kalender || github.event.schedule == '23 4 * * *' }}
          # Deadlineherinneringen. Niet ingesteld = geen meldingen, en de rest
          # van de sync merkt er niets van. Zie BEDIENING.md §11c voor hoe je
          # deze twee maakt.
          VAPID_PRIVE: ${{ secrets.VAPID_PRIVE }}
          PUSH_CONTACT: ${{ secrets.PUSH_CONTACT }}
        run: node scripts/sync.mjs

      # Gaat er binnen twaalf uur een herinneringsvenster open, of valt er een
      # uitslag op te halen (35 minuten na het einde van een sessie, daarna elke
      # 30 minuten tot de uitslag er is), dan zet de sync hier een wekker:
      # wekker.yml slaapt tot dat moment en start dan deze workflow. Nodig omdat GitHub de cron hierboven eens per vier uur
      # draait in plaats van elk kwartier, en een venster van drie uur daar
      # tussendoor valt. Een run die met GITHUB_TOKEN gestart wordt, telt bij
      # GitHub als handmatig en wacht niet in de trage rij. Zie
      # scripts/herinneringen.mjs bij volgendeWekker.
      - name: Wekker zetten voor de volgende herinnering
        if: steps.sync.outputs.wekker != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OM: ${{ steps.sync.outputs.wekker }}
        run: gh workflow run wekker.yml --ref "${GITHUB_REF_NAME}" -f om="$OM"

      # De sync schrijft kalender.ics alleen als er echt iets veranderd is, dus
      # deze stap doet meestal niets. Wie zich op die agenda geabonneerd heeft
      # krijgt een verschoven sessie zo vanzelf binnen.
      #
      # De pull --rebase is er voor de zeldzame samenloop dat automerge net een
      # pull request in main zet terwijl deze run bezig is.
      - name: De agenda vastleggen als hij veranderd is
        run: |
          if git diff --quiet -- kalender.ics; then
            echo "Agenda ongewijzigd, niets vast te leggen"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kalender.ics
          git commit -m "Agenda bijgewerkt door de sync"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # ---- bewaking (healthchecks.io), zie BEDIENING.md "Bewaking" ----------
      # Twee checks. "sync": na elke run een ping, bij een rode run /fail met
      # de link naar de run. "uitslagen": /fail als een gespeelde sessie meer
      # dan twee uur na het einde nog geen uitslag heeft (scripts/bewaking.mjs),
      # met de sessie erin; alleen na een geslaagde sync, zodat een stilgevallen
      # sync alleen via "sync" meldt. Een ping die mislukt laat de run nooit
      # falen (scripts/bewaking.sh). Zonder secret HC_PING_KEY gebeurt er niets.
      - name: Bewaking, uitslagen op tijd
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          TE_LAAT: ${{ steps.sync.outputs.uitslagen_te_laat }}
        run: |
          if [ -z "$TE_LAAT" ]; then bash scripts/bewaking.sh uitslagen ok
          else bash scripts/bewaking.sh uitslagen fail "Uitslag te laat: $TE_LAAT"; fi

      - name: Bewaking, sync gedraaid
        if: ${{ !cancelled() }}
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          STATUS: ${{ job.status }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = success ]; then bash scripts/bewaking.sh sync ok
          else bash scripts/bewaking.sh sync fail "Sync-run mislukt: $RUN"; fi
