name: Tests

# Draait bij elke pull request en bij elke push naar main. De poule zelf
# heeft geen build-stap en geen npm nodig; dit gebruikt Node alleen om
# index.html in een echte browser na te spelen.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    name: Browsertests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installeren
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Tests draaien
        run: node test/draai-alles.mjs

  schema:
    name: schema.sql tegen PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - name: psql beschikbaar maken
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Rollen aanmaken die Supabase standaard heeft
        run: psql -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated;"

      # Supabase levert het auth-schema mee; gewone PostgreSQL niet. Zonder
      # deze nabootsing draait schema.sql niet eens, want de policies en de
      # foreign key op pool_members verwijzen naar auth.
      - name: auth nabootsen zoals Supabase hem levert
        run: psql -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql

      - name: schema.sql draaien op een lege database
        run: psql -v ON_ERROR_STOP=1 -f schema.sql

      - name: Gedrag van de deadline-trigger en de unieke sleutel
        run: psql -v ON_ERROR_STOP=1 -f test/schema-gedrag.test.sql

      # races is de enige tabel die alle poules delen, dus wie daarin schrijft
      # raakt iedereen. Deze test draait als anon én als authenticated en
      # controleert dat lezen mag en schrijven niet.
      - name: races staat op alleen-lezen voor anon
        run: |
          createdb rls
          psql -d rls -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d rls -v ON_ERROR_STOP=1 -f schema.sql
          psql -d rls -v ON_ERROR_STOP=1 -f test/races-alleen-lezen.test.sql

      # is_member() is het fundament onder alle policies die nog komen, dus
      # dat moet los bewezen zijn voordat er iets op gebouwd wordt.
      - name: lidmaatschap en het claimen van een speler
        run: |
          createdb leden
          psql -d leden -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d leden -v ON_ERROR_STOP=1 -f schema.sql
          psql -d leden -v ON_ERROR_STOP=1 -f test/lidmaatschap.test.sql

      # De belofte waarvoor de hele login gebouwd is: jouw voorspelling is van
      # jou. Deze test draait als anon én als authenticated en meet `found`,
      # want RLS geeft geen fout op een geblokkeerde schrijfactie — hij raakt
      # gewoon nul rijen.
      - name: de policies — van wie is een inzending
        run: |
          createdb policies
          psql -d policies -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d policies -v ON_ERROR_STOP=1 -f schema.sql
          psql -d policies -v ON_ERROR_STOP=1 -f test/policies.test.sql

      # "Verwijder mijn account" moet precies doen wat het scherm belooft, en
      # het verschil tussen de twee smaken is niet cosmetisch: de ene laat de
      # stand van je medespelers heel, de andere niet.
      - name: je account verwijderen, in twee smaken
        run: |
          createdb verwijderen
          psql -d verwijderen -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d verwijderen -v ON_ERROR_STOP=1 -f schema.sql
          psql -d verwijderen -v ON_ERROR_STOP=1 -f test/verwijderen.test.sql

      # De vorige stap heeft de tabel opzettelijk beschadigd. schema.sql hoort
      # dat te herstellen zonder dat er data verloren gaat die de app gebruikt.
      - name: schema.sql opnieuw draaien op de beschadigde database
        run: psql -v ON_ERROR_STOP=1 -f schema.sql

      - name: Controleren of het herstel is gelukt
        run: psql -v ON_ERROR_STOP=1 -f test/schema-herstel.test.sql

      - name: reset.sql en daarna weer schema.sql
        run: |
          psql -v ON_ERROR_STOP=1 -f reset.sql
          psql -v ON_ERROR_STOP=1 -f schema.sql

      # De vragenlijst op een verse database, zodat de gedragstest hierboven
      # er niet doorheen loopt. Bewaakt vooral dat de puntentotalen blijven
      # kloppen met de presets die in BEDIENING.md beloofd worden.
      - name: De vragenlijst en de tabellen eromheen
        run: |
          createdb vragen
          psql -d vragen -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d vragen -v ON_ERROR_STOP=1 -f schema.sql
          psql -d vragen -v ON_ERROR_STOP=1 -f test/vragen.test.sql

      # De seizoensvragen: invullen mag zolang het seizoen loopt -- ook voor
      # wie halverwege instapt -- maar wat er staat ligt vast, tegen een
      # wijziging én tegen een delete. Dat laatste is het gat dat er was:
      # weghalen-en-opnieuw-invoeren werkte om de regel heen.
      - name: seizoensvragen — invullen mag later, veranderen niet
        run: |
          createdb seizoen
          psql -d seizoen -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d seizoen -v ON_ERROR_STOP=1 -f schema.sql
          psql -d seizoen -v ON_ERROR_STOP=1 -f test/seizoenslaag.test.sql

      # De controletabel onderaan schema.sql, die je zelf te zien krijgt als je
      # het schema draait. Hij was stilletjes verouderd -- negen vragen geteld
      # waar er veertien staan, twee handmatig-vlaggen waar er zeven zijn --
      # en een controle die het verkeerde meldt is erger dan geen controle.
      - name: de controletabel meldt wat hij hoort te melden
        run: |
          createdb controle
          psql -d controle -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d controle -v ON_ERROR_STOP=1 -f schema.sql
          psql -d controle -v ON_ERROR_STOP=1 -f test/controle.test.sql

      # De jaarwisseling: de controletabel schuift door naar het volgende
      # seizoen zodra het huidige erop zit, en een nieuwe poule begint in het
      # seizoen van de eerstvolgende race -- niet in het laatste jaar dat in de
      # tabel staat. Allebei stonden vast op 2026 of op max(season).
      - name: de jaarwisseling in de database
        run: |
          createdb wissel
          psql -d wissel -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d wissel -v ON_ERROR_STOP=1 -f schema.sql
          psql -d wissel -v ON_ERROR_STOP=1 -f test/seizoenswissel.test.sql

      # Jokers zijn de tweede regel die hard in de database staat, naast de
      # deadline. Een joker die je achteraf mag verzetten is geen keuze maar
      # een knop om de uitslag mee te herschrijven, dus dat moet hier bewezen
      # worden en niet alleen in de app.
      - name: jokers — vijf per seizoen, en vast zodra het weekend begint
        run: |
          createdb jokers
          psql -d jokers -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d jokers -v ON_ERROR_STOP=1 -f schema.sql
          psql -d jokers -v ON_ERROR_STOP=1 -f test/jokers.test.sql

      # De afscherming uit fase 0: met de publieke anon key mag je alleen zien
      # wat bij een poule hoort waar je zelf in zit. Deze test zet een tweede
      # poule neer waar de speler niets mee te maken heeft, en controleert
      # allebei de kanten -- dat die dicht is, en dat binnenkomen met een code
      # nog gewoon werkt.
      - name: een vreemde ziet niets van een andere poule
        run: |
          createdb afscherming
          psql -d afscherming -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d afscherming -v ON_ERROR_STOP=1 -f schema.sql
          psql -d afscherming -v ON_ERROR_STOP=1 -f test/afscherming.test.sql

      # leegmaken.sql gooit de poules weg en laat de kalender staan. Dat
      # tweede is wat stil kan breken: gaan de races per ongeluk mee, dan is
      # het verschil met reset.sql weg zonder dat iemand het merkt.
      - name: leegmaken.sql laat de kalender staan
        run: |
          createdb leegmaken
          psql -d leegmaken -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d leegmaken -v ON_ERROR_STOP=1 -f schema.sql
          psql -d leegmaken -v ON_ERROR_STOP=1 -f test/leegmaken.test.sql

      # Een tweede database met de tabelstructuur zoals die in productie
      # bleek te staan: member_id in een samengestelde primaire sleutel.
      # Daar gaf schema.sql eerst 42830 op.
      - name: schema.sql tegen een oudere tabelstructuur
        run: |
          createdb oud
          psql -d oud -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d oud -v ON_ERROR_STOP=1 -f test/oude-structuur.sql
          psql -d oud -v ON_ERROR_STOP=1 -f schema.sql
          psql -d oud -v ON_ERROR_STOP=1 -f test/oude-structuur-controle.sql

      - name: diagnose.sql leest zonder te wijzigen
        run: |
          psql -d oud -v ON_ERROR_STOP=1 -f diagnose.sql
          createdb leeg
          psql -d leeg -v ON_ERROR_STOP=1 -f test/auth-nabootsing.sql
          psql -d leeg -v ON_ERROR_STOP=1 -f diagnose.sql
