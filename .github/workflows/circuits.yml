name: Circuitcijfers

# Twee soorten eigen cijfers uit OpenF1, allebei voor de site:
#   - safety cars en rode vlaggen per circuit sinds 2023 (zoekplan GEO 3.2,
#     scripts/circuits.mjs, site/data/circuits.json);
#   - de tijden en uitslagen voor de racepagina's (zoekplan SEO fase 4,
#     scripts/racedata.mjs, site/data/races-<jaar>.json).
# api.openf1.org is niet vanaf elke plek bereikbaar, vanaf een GitHub-runner
# wel; daarom hier en niet op de laptop.
#
# Elke dag en met de hand vanuit het Actions-tabblad. Elke dag, omdat een
# racepagina de tijden van het weekend toont en de FIA die soms verschuift.
# Van vrijdag tot en met zondag ook elk uur, maar dan alleen de racepagina's:
# de top 10 van een vrije training staat er dan kort nadat hij gereden is. Elk
# uur en niet om de twee uur (9 oktober, Singapore): GitHub slaat geplande
# runs geregeld over, en tijdens een sessie geeft OpenF1 een gratis account
# niets (401). Tussen de eerste en de tweede training kwam er zo geen enkele
# run doorheen. De circuitcijfers veranderen pas na een race, dus die blijven
# een keer per dag.
#
# De racedata gaat vóór de circuitcijfers: die tellen acht minuten, en een run
# met de hand liep daardoor de volgende sessie in voordat hij aan de
# racepagina's toekwam.
# Schrijft de twee bestanden en legt ze vast als er iets veranderd is. Daarna
# ook de site opnieuw, zodat de nieuwe cijfers meteen op de pagina's staan en
# `maak-site --controle` in de tests groen blijft.
#
# Op een pull request die een van de scripts of deze workflow aanpast: alleen in
# de log (DROOG), niets vastgelegd. Zo is te zien wat er echt uitkomt voordat
# het ergens staat.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
    # Het weekend. Dezelfde tekst staat hieronder bij "Tellen": daar wordt
    # deze tijd overgeslagen.
    - cron: '23 */1 * * 5,6,0'
  pull_request:
    paths:
      - 'scripts/circuits.mjs'
      - 'scripts/racedata.mjs'
      - 'site/races.mjs'
      - '.github/workflows/circuits.yml'

permissions:
  contents: read

jobs:
  tellen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: De racepagina's, tijden en uitslagen
        env:
          DROOG: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: node scripts/racedata.mjs
      - name: Tellen met de regels van de app
        if: github.event.schedule != '23 */1 * * 5,6,0'
        env:
          DROOG: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: node scripts/circuits.mjs

      # De pull --rebase is er voor de samenloop dat automerge of de sync net
      # iets in main zet terwijl deze run bezig is.
      - name: Vastleggen als er iets veranderd is
        if: github.event_name != 'pull_request'
        run: |
          node scripts/maak-site.mjs
          if [ -z "$(git status --porcelain)" ]; then
            echo "Niets veranderd, niets vast te leggen"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Circuitcijfers bijgewerkt"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
