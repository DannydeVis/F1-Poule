name: Klopt de stand?

# Handmatig te starten vanuit het Actions-tabblad. Draait de echte
# scoreregels (letterlijk uit index.html geknipt) tegen een verse kopie van
# de echte database, en print elke tussenstap. Alleen lezen — er wordt niets
# weggeschreven, en er is geen geheime sleutel voor nodig: de anon key staat
# toch al open in index.html.
#
# Nodig omdat Supabase niet vanaf elke plek bereikbaar is; op een
# GitHub-runner wel.

on:
  workflow_dispatch:
    inputs:
      poule:
        description: 'Naam van de poule'
        default: 'Vrijdagmiddagpoule'
      ik:
        description: 'Stukje van jouw spelernaam'
        default: 'danny'
      coureurs:
        description: 'Ook de deelnemerslijsten nakijken tegen OpenF1'
        type: boolean
        default: true
      race:
        description: 'Alleen deze race nakijken (bv. Madrid; leeg = alle 24)'
        default: ''

jobs:
  controleren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: De stand herberekenen uit de ruwe data
        env:
          POULE: ${{ inputs.poule }}
          IK: ${{ inputs.ik }}
        run: node scripts/controle-stand.mjs

      # Staat er in de database nog dezelfde deelnemerslijst als die OpenF1
      # nu geeft? De sync haalt die lijst maar één keer op, dus een wissel
      # halverwege het seizoen zou er nooit in terechtkomen.
      - name: Wat staat er in de kalender
        run: node scripts/controle-kalender.mjs

      # Draait de sync echt zo vaak als de cron zegt? Nee, en dat is het
      # punt: ingesteld op vier keer per uur, geleverd een stuk minder.
      - name: Hoe vaak draait de sync echt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/controle-sync.mjs

      - name: Kloppen de deelnemerslijsten nog
        if: inputs.coureurs != false
        env:
          RACE: ${{ inputs.race }}
        run: node scripts/controle-coureurs.mjs
