name: OpenF1 verkennen

# Handmatig te starten vanuit het Actions-tabblad, en hij draait mee op een
# pull request die scripts/verkennen.mjs aanpast. Hij schrijft niets weg —
# alleen kijken wat OpenF1 voor een race heeft, en dat in de log zetten.
#
# Nodig omdat api.openf1.org niet vanaf elke plek bereikbaar is; op een
# GitHub-runner wel. Dit is de manier om te zien wat er echt terugkomt in
# plaats van te gokken wat er in staat.

on:
  workflow_dispatch:
    inputs:
      jaar:
        description: 'Welk seizoen'
        default: '2026'
      sessie:
        description: 'Eén session_key (leeg = de laatste gereden race)'
        default: ''
      alle:
        description: 'Het woordenboek over alle gereden races'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/verkennen.mjs'
      - '.github/workflows/verkennen.yml'

jobs:
  verkennen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Kijken wat OpenF1 heeft
        env:
          JAAR: ${{ inputs.jaar || '2026' }}
          SESSIE: ${{ inputs.sessie }}
        run: node scripts/verkennen.mjs

      # Op een pull request ook meteen het woordenboek: welke zinnen OpenF1
      # over safety cars en rode vlaggen gebruikt, over alle gereden races.
      # Op één race een filter bouwen gaat de eerste keer mis dat een andere
      # wedstrijdleiding andere woorden kiest.
      - name: Het woordenboek over alle races
        if: github.event_name == 'pull_request' || inputs.alle == true
        env:
          JAAR: ${{ inputs.jaar || '2026' }}
          ALLE: '1'
        run: node scripts/verkennen.mjs

      # De twee sleutels waarop de gewone sync een 404 kreeg.
      - name: De twee sessies die de sync oversloeg
        if: github.event_name == 'pull_request'
        run: |
          SESSIE=11257 node scripts/verkennen.mjs
          SESSIE=11265 node scripts/verkennen.mjs
