name: Wekker voor herinneringen en uitslagen

# Gestart door sync.yml, niet door een mens en niet door een cron. Slaapt tot
# het tijdstip dat de sync doorgaf en start dan de sync. Twee redenen voor zo'n
# tijdstip: tien minuten nadat het herinneringsvenster van drie uur opengaat
# (de sync stuurt dan de herinneringen), en 35 minuten na het einde van een
# sessie, en daarna elke 30 minuten tot de uitslag er is (hoogstens 8 uur; zie
# scripts/bewaking.mjs bij uitslagWekker). De sync kiest de vroegste.
#
# Waarom zo: GitHub draait de cron van sync.yml eens per vier uur, met gaten
# tot acht uur, en een venster van drie uur valt daar tussendoor. Een
# slapende job wordt niet overgeslagen. Zie scripts/herinneringen.mjs bij
# volgendeWekker en BEDIENING.md §11c.
#
# Hoogstens één wekker tegelijk: een nieuwe vervangt de vorige. Elke sync
# rekent het vroegste moment opnieuw uit uit alles wat er nog komt, dus de
# nieuwste weet het het best.
# Ligt het moment verder weg dan vijfenhalf uur (de job mag zes uur duren),
# dan slaapt hij vijfenhalf uur en start hij de sync eerder; die zet dan een
# nieuwe wekker.
on:
  workflow_dispatch:
    inputs:
      om:
        description: 'Wanneer de sync moet draaien (ISO-tijd, UTC)'
        type: string
        required: true

concurrency:
  group: wekker
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  wekker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Slapen tot het venster opengaat
        env:
          OM: ${{ inputs.om }}
        run: |
          doel=$(date -d "$OM" +%s) || { echo "Geen geldige tijd: $OM"; exit 1; }
          wacht=$(( doel - $(date +%s) ))
          if [ "$wacht" -gt 19800 ]; then wacht=19800; fi
          if [ "$wacht" -gt 0 ]; then
            echo "Slapen tot $(date -u -d "@$(( $(date +%s) + wacht ))" +%FT%TZ) ($wacht seconden)"
            sleep "$wacht"
          fi

      - name: De sync starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
